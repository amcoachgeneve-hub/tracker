function bindMain(name,start){
  // 🎭 Une seule fois : on présente le choix du superviseur aux clients
  // déjà lancés, qui n'ont jamais vu l'écran d'inscription.
  // 🎓 Le didacticiel s'ouvre tout seul UNE SEULE FOIS, et seulement pour
  // quelqu'un qui arrive : au-delà de la première semaine, on ne lui explique
  // pas une appli qu'il utilise déjà — le bouton en bas de l'accueil reste là
  // pour ceux qui veulent le revoir.
  if(state.tuto==null&&!tutoVu()&&!document.querySelector("#sa-ok")){
    var jTuto=0; try{jTuto=getToday90(lsGetStr("amcoach_start_"+CLIENT));}catch(e){}
    if(jTuto<=6){state.tuto=0;render();return;}
    tutoMarquer();
  }
  // 📅 Le tiroir du calendrier retient s'il est ouvert : cocher une habitude
  // redessine la page, et le refermer à chaque fois serait insupportable.
  var tirCal=document.querySelector(".cal-tiroir");
  if(tirCal)tirCal.addEventListener("toggle",function(){state.calOpen=this.open;});

  // ⚡ Le raccourci vers la journée du jour, en haut de l'accueil
  var gjt=document.getElementById("go-jour-top");
  if(gjt)gjt.addEventListener("click",function(){
    var st=lsGetStr("amcoach_start_"+CLIENT);
    state.selDay=Math.max(0,Math.min(getToday90(st),(progLen(st)||90)-1));
    render();
  });
  var revoir=document.getElementById("tuto-revoir");
  if(revoir)revoir.addEventListener("click",function(){state.tuto=0;render();});
  if(state.view==="calendar"&&!document.querySelector("#sa-ok")){
    try{
      if(supDoitAnnoncer(getAllData()))setTimeout(supAnnonce,450);
    }catch(e){}
  }
  if(state.view==="nutrition"){bindNutrition();bindNav();return;}
  if(state.view==="menus"){bindNav();return;}
  if(state.view==="stats"&&state.statsExo){
    var sxb=document.getElementById("stx-back");
    if(sxb)sxb.addEventListener("click",function(){state.statsExo=null;render();});
    bindNav();return;
  }
  if(state.view==="stats"&&!state.partage&&!state.pesees){
    try{bindStatsExtra();}catch(e){}
    // Chaque ligne de progression ouvre la courbe de son exercice.
    var exs=document.querySelectorAll("[data-st-exo]");
    for(var ex=0;ex<exs.length;ex++)exs[ex].addEventListener("click",function(){
      state.statsExo=this.getAttribute("data-st-exo");render();
    });
  }
  if(state.view==="stats"&&state.partage){try{bindPartage();}catch(e){}bindNav();return;}
  if(state.view==="stats"&&state.pesees){try{bindPesees();}catch(e){}bindNav();return;}
  if(state.view==="finance"){bindFinance();bindNav();return;}
  if(state.view==="sport"||state.view==="training"){try{if(state.progRun)bindProgRun();else bindSport();}catch(e){}bindNav();return;}
  var oc=document.getElementById("open-contract");
  if(oc)oc.addEventListener("click",function(){state.view="contract";render();});
  // 🔔 Rappel quotidien 20h30 : événement calendrier récurrent avec alerte native
  var ar=document.getElementById("add-reminder");
  if(ar)ar.addEventListener("click",function(){
    var d=new Date();d.setDate(d.getDate()+1); // à partir de demain
    var ymd=d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2);
    var appUrl=location.origin+location.pathname+(CLIENT?"?client="+CLIENT:"");
    var ics="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//AM Coach Geneve//Discipline90//FR\r\nBEGIN:VEVENT\r\n"+
      "UID:discipline90-"+(CLIENT||"moi")+"@amcoach\r\n"+
      "DTSTART:"+ymd+"T203000\r\nDTEND:"+ymd+"T204000\r\n"+
      "RRULE:FREQ=DAILY\r\n"+
      "SUMMARY:🧠 Discipline 90 — remplir mon tracker\r\n"+
      "DESCRIPTION:Habitudes + mindset du soir (3 min). "+appUrl+"\r\n"+
      "BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Tracker Discipline 90\r\nTRIGGER:PT0M\r\nEND:VALARM\r\n"+
      "END:VEVENT\r\nEND:VCALENDAR";
    var a=document.createElement("a");
    a.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(ics);
    a.download="rappel-discipline90.ics";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    saveDay(509,{rappel:1,d:isoLocal()}); // fait une fois → bannière retirée
    setTimeout(render,600);
  });
  // 🍗 Rappel protéines 20h30 (slot 511)
  var apr=document.getElementById("add-prot-reminder");
  if(apr)apr.addEventListener("click",function(){
    var cfg=nutCfg(getAllData());
    var d=new Date();d.setDate(d.getDate()+1);
    var ymd=d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2);
    var appUrl=location.origin+location.pathname+(CLIENT?"?client="+CLIENT:"");
    var ics="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//AM Coach Geneve//Discipline90//FR\r\nBEGIN:VEVENT\r\n"+
      "UID:discipline90-prot-"+(CLIENT||"moi")+"@amcoach\r\n"+
      "DTSTART:"+ymd+"T203000\r\nDTEND:"+ymd+"T203500\r\n"+
      "RRULE:FREQ=DAILY\r\n"+
      "SUMMARY:🍗 Discipline 90 — pèse tes protéines ("+(cfg.prot||"")+" g)\r\n"+
      "DESCRIPTION:Atteins ton quota de protéines du jour. "+appUrl+"\r\n"+
      "BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Quota protéines Discipline 90\r\nTRIGGER:PT0M\r\nEND:VALARM\r\n"+
      "END:VEVENT\r\nEND:VCALENDAR";
    var a=document.createElement("a");
    a.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(ics);
    a.download="rappel-proteines-discipline90.ics";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    saveDay(511,{rappel:1,d:isoLocal()});
    setTimeout(render,600);
  });
  var allData=getAllData();
  var today90=getToday90(start);
  var month=currentMonth(today90);
  // ▶️ Ouvrir la journée en cours
  var gj=document.getElementById("go-jour");
  if(gj)gj.addEventListener("click",function(){
    state.selDay=Math.max(0,Math.min(getToday90(start),(progLen(start)||90)-1));
    render();
  });

  // 🧠 Aller écrire son mindset
  var mgo=document.getElementById("mind-go");
  if(mgo)mgo.addEventListener("click",function(){
    state.selDay=getToday90(start);
    render();
    feedback("✍️ À toi de jouer","ok");
  });
  bindBlocsJour(name,start);

  // Dream autosave
  var dbS=document.getElementById("db-semaine"), dbV=document.getElementById("db-vie");
  if(dbS&&dbV){
    function saveDream(){
      saveDay(501,{semaine:dbS.value,vie:dbV.value});
      var sv=document.getElementById("db-saved");
      if(sv){sv.textContent="✓ Sauvegardé";setTimeout(function(){if(sv)sv.textContent="";},1500);}
    }
    dbS.addEventListener("input",saveDream);
    dbV.addEventListener("input",saveDream);
  }
  // Bloc suivant
  var nb=document.getElementById("next-bloc");
  if(nb)nb.addEventListener("click",function(){
    if(!confirm("Démarrer le Bloc "+(BLOC+1)+"/4 ? Nouveau cycle de 90 jours dès aujourd'hui."))return;
    var newBloc=BLOC+1;
    var eff=BASE_CLIENT+"-b"+newBloc;
    localStorage.setItem("amcoach_bloc_"+BASE_CLIENT,String(newBloc));
    var today=isoLocal();
    localStorage.setItem("amcoach_name_"+eff,name);
    localStorage.setItem("amcoach_start_"+eff,today);
    sbFetch("clients?on_conflict=slug",{method:"POST",prefer:"resolution=merge-duplicates",body:{slug:eff,name:name,start_date:today}}).catch(function(){});
    window.location.reload();
  });
  var dip=document.getElementById("diplome-btn");
  if(dip)dip.addEventListener("click",function(){
    var html=generateDiplome(name,start,getAllData());
    var win=window.open("","_blank");
    if(win){win.document.write(html);win.document.close();}
  });
  var bde=document.getElementById("bday-edit");
  if(bde)bde.addEventListener("click",function(){ouvrirAnniversaire();});
  var gs=document.getElementById("goal-set");
  if(gs)gs.addEventListener("click",function(){state.showGoalForm=true;render();});
  var ge=document.getElementById("goal-edit");
  if(ge)ge.addEventListener("click",function(){state.showGoalForm=true;render();});
  // 🎭 Changer de superviseur depuis l'appli, sans repasser par l'inscription
  var se=document.getElementById("sup-edit");
  if(se)se.addEventListener("click",function(){
    state.showSupForm=!state.showSupForm; render();
    setTimeout(function(){
      var el=document.getElementById("sup-form");
      if(el)el.scrollIntoView({behavior:"smooth",block:"center"});
    },60);
  });
  var supB=document.querySelectorAll(".sup-pick");
  for(var sp=0;sp<supB.length;sp++){
    supB[sp].addEventListener("click",function(){
      var cur=supGet(getAllData());
      var k=this.getAttribute("data-ton")||cur.ton;
      var g=this.getAttribute("data-g")||cur.genre;
      // On garde le prénom tant que le caractère ET le genre ne bougent pas :
      // changer juste de genre ne doit pas rebattre le personnage entier.
      var meme=(k===cur.ton&&g===cur.genre);
      var prenom=meme?cur.prenom:supTirage(k,g);
      saveDay(503,{ton:k,genre:g,prenom:prenom});
      feedback("🎭 "+prenom+" prend le relais","ok");
      render();
    });
  }
  var supClose=document.getElementById("sup-close");
  if(supClose)supClose.addEventListener("click",function(){state.showSupForm=false;render();});
  var gsave=document.getElementById("goal-save");
  if(gsave)gsave.addEventListener("click",function(){
    var t=parseFloat(document.getElementById("goal-target").value);
    var rw=document.getElementById("goal-reward").value.trim();
    if(!t)return;
    saveDay(100+month,{target:t,reward:rw});
    state.showGoalForm=false;
    render();
  });
  // 🎯 Validation du challenge
  var chv=document.getElementById("ch-valider");
  if(chv)chv.addEventListener("click",function(){
    var all=getAllData(), ch=all[515];
    if(!ch)return;
    var E=chEtat(ch);
    if(!E.ajd)return;
    ch.done=ch.done||{};
    if(ch.done[E.ajd]){delete ch.done[E.ajd];saveDay(515,ch);render();feedback("Journée retirée","undo");return;}
    ch.done[E.ajd]=true;
    saveDay(515,ch);
    var E2=chEtat(ch);
    if(E2.reussi){
      var bd=chBadges(getAllData()).slice();
      bd.unshift({e:ch.e,n:ch.n,jours:ch.jours,fin:isoLocal()});
      saveDay(516,bd);
      render();
      feedback("🏅 "+ch.n+" — challenge réussi !","win");
    }else if(E2.badgePerdu&&E2.valides===E2.seuilHonneur){
      // Le sans-faute est hors de portée, mais le seuil d'honneur vient de
      // tomber : on le dit, sinon la fin de challenge n'a plus aucun enjeu.
      render();
      feedback("🤝 "+E2.valides+"/"+ch.jours+" — l'honneur est sauf","win");
    }else{
      render();
      feedback("✓ Jour "+(E2.valides)+"/"+ch.jours,"ok");
    }
  });

  bindNav(); // un seul brancheur : celui qui gère aussi le double appui
  var months=document.querySelectorAll("[data-month]");
  for(var m=0;m<months.length;m++){
    months[m].addEventListener("click",function(){
      var mi=parseInt(this.getAttribute("data-month"));
      state.openMonth=state.openMonth===mi?-1:mi;
      render();
    });
  }
  var cells=document.querySelectorAll("[data-day]");
  for(var c=0;c<cells.length;c++){
    cells[c].addEventListener("click",function(){
      state.selDay=parseInt(this.getAttribute("data-day"));
      state.showBilan=false;
      render();
    });
  }
  var filters=document.querySelectorAll("[data-filter]");
  for(var f=0;f<filters.length;f++){
    filters[f].addEventListener("click",function(){state.filter=this.getAttribute("data-filter");render();});
  }
  var rapports=document.querySelectorAll("[data-rapport]");
  for(var r2=0;r2<rapports.length;r2++){
    rapports[r2].addEventListener("click",function(){
      if(this.classList.contains("disabled"))return;
      openRapport(name,start,parseInt(this.getAttribute("data-rapport")));
    });
  }

}

// ═══════════ BOOT ═══════════
(function(){
  render(); // instant render with local data
  if(typeof IS_COACH!=="undefined"&&IS_COACH&&state.coachAuthed){loadCoachDataFromCloud();}
  if(CLIENT){
    try{brancherRetourAppli();}catch(e){}
    loadFromCloud(function(){
      var start=lsGetStr("amcoach_start_"+CLIENT);
      if(start)state.openMonth=Math.floor(Math.min(getToday90(start),89)/28);
      render(); // re-render with cloud data
    });
  }
})();

// ═══════════ GESTES : SWIPE RETOUR + TIRER POUR RAFRAÎCHIR ═══════════
(function(){
  // Indicateur de rafraîchissement
  var ptr=document.createElement("div");
  ptr.style.cssText="position:fixed;top:-56px;left:50%;margin-left:-22px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:20px;z-index:9999;transition:none;pointer-events:none";
  ptr.textContent="⟳";
  document.body.appendChild(ptr);

  var sx=0,sy=0,dx=0,dy=0,pulling=false,swiping=false,active=false;

  function goBack(){
    if(state.selDay!==null&&state.selDay!==undefined){state.selDay=null;render();return true;}
    if(typeof IS_COACH!=="undefined"&&IS_COACH&&state.coachKPI){state.coachKPI=false;render();return true;}
    if(typeof IS_COACH!=="undefined"&&IS_COACH&&state.coachCalc){state.coachCalc=false;render();return true;}
    if(typeof IS_COACH!=="undefined"&&IS_COACH&&state.blLibre){state.blLibre=null;state.blForm=false;state.coachBilans=true;render();return true;}
    if(typeof IS_COACH!=="undefined"&&IS_COACH&&state.coachBilans){state.coachBilans=false;render();return true;}
    if(typeof IS_COACH!=="undefined"&&IS_COACH&&state.blProspect){state.blProspect=null;state.blForm=false;render();return true;}
    if(typeof IS_COACH!=="undefined"&&IS_COACH&&state.cdTab==="bilan"){state.cdTab=null;render();return true;}
    if(typeof IS_COACH!=="undefined"&&IS_COACH&&state.coachDetail){state.coachDetail=null;render();return true;}
    return false;
  }

  document.addEventListener("touchstart",function(e){
    if(e.touches.length!==1)return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;dy=0;active=true;
    swiping=sx<50; // swipe retour : départ depuis le bord gauche
    pulling=(window.scrollY<=0);
  },{passive:true});

  document.addEventListener("touchmove",function(e){
    if(!active)return;
    dx=e.touches[0].clientX-sx;dy=e.touches[0].clientY-sy;
    // Tirer vers le bas en haut de page → indicateur
    if(pulling&&dy>0&&Math.abs(dy)>Math.abs(dx)&&window.scrollY<=0){
      var pull=Math.min(dy*0.5,90);
      ptr.style.transition="none";
      ptr.style.transform="translateY("+(pull+56)+"px) rotate("+(pull*4)+"deg)";
      ptr.style.opacity=Math.min(pull/70,1);
      if(e.cancelable)e.preventDefault();
    }
  },{passive:false});

  document.addEventListener("touchend",function(){
    if(!active)return;active=false;
    // Swipe retour : bord gauche → droite, geste horizontal net
    if(swiping&&dx>70&&Math.abs(dy)<60){goBack();}
    // Rafraîchir : tiré assez loin
    if(pulling&&dy*0.5>=70&&Math.abs(dy)>Math.abs(dx)){
      ptr.style.transition="transform .2s";
      ptr.style.transform="translateY(126px) rotate(360deg)";
      setTimeout(function(){location.reload();},250);
    }else{
      ptr.style.transition="transform .25s,opacity .25s";
      ptr.style.transform="translateY(0)";
      ptr.style.opacity=0;
    }
  },{passive:true});
})();
</script>
