function bindContract(name,start){
  var sign=document.getElementById("ct-sign");
  if(sign)sign.addEventListener("click",function(){
    var why=document.getElementById("ct-why").value.trim();
    var e1=document.getElementById("ct-e1").value.trim();
    var e2=document.getElementById("ct-e2").value.trim();
    var e3=document.getElementById("ct-e3").value.trim();
    if(!why||!e1||!e2||!e3){buzz("err");alert("Remplis ton POURQUOI et tes 3 engagements — c'est ta fondation 🧱");return;}
    var today=new Date();
    var dstr=("0"+today.getDate()).slice(-2)+"/"+("0"+(today.getMonth()+1)).slice(-2)+"/"+today.getFullYear();
    saveDay(508,{why:why,e1:e1,e2:e2,e3:e3,date:dstr});
    feedback("✍️ Contrat signé — c'est parti","win");
    state.ctDraft=null;
    render();
  });
  var skip=document.getElementById("ct-skip");
  if(skip)skip.addEventListener("click",function(){
    state.ctSkip=true;state.view="calendar";render();
  });
  var back=document.getElementById("ct-back");
  if(back)back.addEventListener("click",function(){state.view="calendar";render();});
  var wa=document.getElementById("ct-wa");
  if(wa)wa.addEventListener("click",function(){
    var ct=getAllData()[508]||{};
    waSend("✍️ MON CONTRAT D'ENGAGEMENT — "+name+"\n\n"+
      "🎯 Mon pourquoi : "+ct.why+"\n\n"+
      "Je m'engage :\n1. "+ct.e1+"\n2. "+ct.e2+"\n3. "+ct.e3+"\n\n"+
      "Signé le "+ct.date+". Tu es témoin coach 🤝");
  });
  // Garder le brouillon en mémoire si l'écran se re-rend
  var map={"ct-why":"why","ct-e1":"e1","ct-e2":"e2","ct-e3":"e3"};
  for(var id in map){
    (function(id,key){
      var el=document.getElementById(id);
      if(el)el.addEventListener("input",function(){
        state.ctDraft=state.ctDraft||{};
        state.ctDraft[key]=el.value;
      });
    })(id,map[id]);
  }
}

      '<div style="font-weight:900;font-size:15px">'+goal.target+' kg — 🎁 '+esc(goal.reward||"—")+'</div></div>';

// Agrège tous les clients : rétention, abandons, résultats.
function coachAnalytics(){
  var tous=lsGet("amcoach_clients",[]);
  // Tests et clients non payants : exclus des KPI, mais leurs données restent
  var cl=tous.filter(function(c){return !c.horsStats;});
  var out={exclus:tous.length-cl.length,total:cl.length,objectifs:[],objAtteints:0,enAttente:0,clients:[],paliers:[],finis:0,actifs:0,abandons:0,
           kgTotal:0,pertes:[],remplissage:[],series:[],jourAbandon:[]};
  var auj=new Date();
  for(var i=0;i<cl.length;i++){
    var c=cl[i], d=lsGet("amcoach_"+c.slug,{});
    var dur=progLen(c.start_date)||90;
    var t90=getToday90(c.start_date);
    // Dernier jour renseigné + nombre de jours remplis
    var last=-1,remplis=0;
    for(var k=0;k<dur;k++){
      if(d[k]&&Object.keys(d[k]).length>0){remplis++;if(k>last)last=k;}
    }
    // Poids : premier et dernier renseignés
    var p1=null,p2=null;
    for(var w=0;w<dur;w++){if(d[w]&&d[w].poids){var v=parseFloat(d[w].poids);if(p1===null)p1=v;p2=v;}}
    var perte=(p1!=null&&p2!=null)?Math.round((p1-p2)*10)/10:null;
    // 🎯 Résultat : évalué UNIQUEMENT au bilan final, jamais sur une pesée du jour.
    // Un client au jour 20 n'a pas « raté » son objectif — il n'est pas encore évalué.
    var b6=d[600]||{}, cles=[];
    for(var bk in b6){if(b6.hasOwnProperty(bk)&&b6[bk])cles.push(bk);}
    cles.sort();
    var prem=null,dern=null;
    for(var ck=0;ck<cles.length;ck++){
      var bb=b6[cles[ck]];
      if(!prem&&bb.poids&&bb.poidsCible)prem={k:cles[ck],o:bb};
      if(bb.poids)dern={k:cles[ck],o:bb};
    }
    var obj=null, enAttente=false;
    if(prem){
      if(dern&&dern.k!==prem.k){
        var dep=parseFloat(prem.o.poids), cib=parseFloat(prem.o.poidsCible), fin=parseFloat(dern.o.poids);
        if(dep&&cib&&fin&&dep>cib){
          var vise=Math.round((dep-cib)*10)/10;
          var fait=Math.round((dep-fin)*10)/10;
          obj={depart:dep,cible:cib,vise:vise,fait:fait,final:fin,dateBilan:dern.k,
               pct:Math.min(200,Math.round(fait/vise*100)),
               atteint:fin<=cib, bonus:fin<cib?Math.round((cib-fin)*10)/10:0};
        }
      }else{
        enAttente=true; // objectif fixé, bilan final pas encore fait
      }
    }
    // Statut : fini / actif / décroché (rien depuis 10 jours et programme non terminé)
    var ecart=t90-last;
    var fini=last>=dur-1||t90>=dur-1&&remplis>=dur*0.6;
    var lache=!fini&&last>=0&&ecart>10;
    if(fini)out.finis++; else if(lache)out.abandons++; else out.actifs++;
    if(lache)out.jourAbandon.push(last+1);
    // Seuls les résultats validés au bilan alimentent les KPI de résultat
    if(obj){out.pertes.push(obj.fait);out.kgTotal+=obj.fait;}
    out.remplissage.push(dur>0?Math.round(remplis/Math.min(t90+1,dur)*100):0);
    out.series.push(bestStreak(d,Math.min(dur-1,Math.max(0,t90))));
    if(obj){out.objectifs.push(obj);if(obj.atteint)out.objAtteints++;}
    if(enAttente)out.enAttente++;
    out.clients.push({nom:c.name,slug:c.slug,jour:Math.min(t90+1,dur),dernier:last+1,
                      remplis:remplis,duree:dur,perte:perte,obj:obj,enAttente:enAttente,
                      statut:fini?"fini":lache?"lache":"actif",inactifDepuis:ecart});
  }
  // Courbe de rétention : combien ont atteint chaque palier
  var seuils=[7,14,30,60,90];
  for(var s2=0;s2<seuils.length;s2++){
    var n=0,elig=0;
    for(var j=0;j<out.clients.length;j++){
      var cc=out.clients[j];
      if(cc.jour>=seuils[s2]){elig++;if(cc.dernier>=seuils[s2])n++;}
    }
    out.paliers.push({j:seuils[s2],atteint:n,eligibles:elig,
                      pct:elig?Math.round(n/elig*100):null});
  }
  function moy(a){if(!a.length)return null;var t=0;for(var x=0;x<a.length;x++)t+=a[x];return Math.round(t/a.length*10)/10;}
  out.perteMoy=moy(out.pertes);
  out.remplMoy=moy(out.remplissage);
  out.serieMoy=moy(out.series);
  out.serieMax=out.series.length?Math.max.apply(null,out.series):null;
  out.abandonMed=out.jourAbandon.length?out.jourAbandon.slice().sort(function(a,b){return a-b;})[Math.floor(out.jourAbandon.length/2)]:null;
  out.meilleurePerte=out.pertes.length?Math.max.apply(null,out.pertes):null;
  out.tauxFin=out.total?Math.round(out.finis/out.total*100):0;
  // Taux d'objectifs atteints, calculé uniquement sur les clients qui en ont un
  out.objTotal=out.objectifs.length;
  out.tauxObj=out.objTotal?Math.round(out.objAtteints/out.objTotal*100):null;
  var sp=0,sb=0;
  for(var oi=0;oi<out.objectifs.length;oi++){sp+=out.objectifs[oi].pct;sb+=out.objectifs[oi].bonus;}
  out.objPctMoy=out.objTotal?Math.round(sp/out.objTotal):null;
  out.bonusTotal=Math.round(sb*10)/10;
  return out;
}

// Point 5 du rapport : donner au coach un résumé immédiat de qui va bien
// et de qui décroche, sans ouvrir cinq fiches.
function coachPouls(){
  var cl=lsGet("amcoach_clients",[]);
  var out={vert:[],orange:[],rouge:[],fini:[],tous:[]};
  for(var i=0;i<cl.length;i++){
    var c=cl[i], d=lsGet("amcoach_"+c.slug,{});
    var dur=progLen(c.start_date)||90;
    var t90=getToday90(c.start_date);
    var remplis=0,last=-1;
    for(var k=0;k<dur&&k<=t90;k++){
      if(d[k]&&Object.keys(d[k]).length>0){remplis++;if(k>last)last=k;}
    }
    var jours=Math.min(t90+1,dur);
    var assidu=jours>0?Math.round(remplis/jours*100):0;
    // Silence : d'abord la dernière ouverture réelle, sinon le dernier jour rempli
    var la=d[505]&&d[505].d;
    var sil=la?Math.floor((new Date(isoLocal())-new Date(la))/86400000):(last>=0?t90-last:jours);
    var fini=t90>=dur-1;
    var etat,motif;
    if(fini){etat="fini";motif="Programme terminé";}
    else if(sil>=7){etat="rouge";motif="Silence depuis "+sil+" jours";}
    else if(assidu<40&&jours>=5){etat="rouge";motif="Assiduité "+assidu+" %";}
    else if(sil>=3){etat="orange";motif="Rien depuis "+sil+" jours";}
    else if(assidu<70&&jours>=5){etat="orange";motif="Assiduité "+assidu+" %";}
    else {etat="vert";motif=sil<=1?"À jour":"Rien depuis "+sil+" j";}
    var o={nom:c.name,slug:c.slug,jour:jours,duree:dur,assidu:assidu,silence:sil,
           etat:etat,motif:motif,horsStats:!!c.horsStats};
    out[etat].push(o); out.tous.push(o);
  }
  // Les plus urgents d'abord
  var ordre={rouge:0,orange:1,vert:2,fini:3};
  out.tous.sort(function(a,b){
    if(ordre[a.etat]!==ordre[b.etat])return ordre[a.etat]-ordre[b.etat];
    return b.silence-a.silence;
  });
  return out;
}

        // 📊 Indicateurs 7 derniers jours : briques identité · missions du jour · journal
        (function(){

            return '<span style="display:inline-flex;align-items:center;gap:3px;background:#F7F7F7;border-radius:9px;padding:4px 8px;font-size:11px;font-weight:800;color:'+col+'" title="'+lbl+'">'+ico+' '+val+'/'+max+'</span>';
          }
          // 🍗 chip protéines (seulement si suivi activé)
          var protChip="";
          var ncf=cd[510];
          if(ncf&&ncf.on&&ncf.prot){
            var pOk=0;
            for(var pz=from;pz<=Math.min(t90,89);pz++){
              var pdt=new Date();pdt.setDate(pdt.getDate()-(t90-pz));
              var pk=isoLocal(pdt);
              var pe=(ncf.daily&&ncf.daily[pk])||null;
              if(pe&&pe.tot>=ncf.prot*0.8)pOk++;
            }
            protChip=chip("🍗",pOk,nd,"🍗 "+pOk+"/"+nd+" jours à l'objectif (≥80%)");
          }
          // 💰 chip finance : mois à l'objectif d'épargne sur les 6 derniers mois
          var finChip="";
          var fcf=cd[512];
          if(fcf&&fcf.on){
            var fObj=parseFloat(fcf.objEpargne)||finPlan(fcf).capacite,fOk=0,fTot=0;
            for(var fm=5;fm>=0;fm--){
              var fdt=new Date();fdt.setMonth(fdt.getMonth()-fm);

            finChip=chip("💰",fOk,Math.max(fTot,1),"💰 "+fOk+" mois à l'objectif d'épargne (6 derniers mois)");
          }
          return '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px">'+
            chip("🧱",briq,nd*2,"Briques identité posées (2/jour) — 7 derniers jours")+

            chip("🏋️",spo,nd,"Sport coché — 7 derniers jours")+
            chip("🥗",nut,nd,"Nutrition cochée — 7 derniers jours")+
            chip("😴",som,nd,"Sommeil coché — 7 derniers jours")+
            protChip+finChip+
            '</div>';
        })()+
        '<button class="copy-link big-btn" data-slug="'+esc(c.slug)+'" style="padding:12px 0;font-size:13px;background:'+K+';box-shadow:none;margin-bottom:8px">📋 Copier lien TRACKER</button>'+

    }
  }
  return h+'</div></div>';
}

function loadCoachDataFromCloud(){
  Promise.all([
    sbFetch("clients?select=*&order=created_at.desc").then(function(r){return r.json();}),
    sbFetch("tracking?select=client_slug,day_index,data").then(function(r){return r.json();})
  ]).then(function(results){
    var clients=results[0]||[], rows=results[1]||[];
    if(clients.length){
      // On FUSIONNE : le nuage remplace la liste, mais on retraduit hors_stats
      // et on conserve les champs locaux que Supabase ne connaît pas.
      var avant={},ancien=lsGet("amcoach_clients",[]);
      for(var a0=0;a0<ancien.length;a0++)avant[ancien[a0].slug]=ancien[a0];
      for(var c0=0;c0<clients.length;c0++){
        var cc=clients[c0], old=avant[cc.slug]||{};
        for(var k0 in old){if(old.hasOwnProperty(k0)&&!(k0 in cc))cc[k0]=old[k0];}
        cc.horsStats=(cc.hors_stats===true)||(cc.hors_stats===undefined&&!!old.horsStats);
      }
      lsSet("amcoach_clients",clients);
    }
    var bySlug={};
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      if(!bySlug[r.client_slug])bySlug[r.client_slug]={};
      bySlug[r.client_slug][r.day_index]=r.data;
    }
    for(var slug in bySlug){lsSet("amcoach_"+slug,bySlug[slug]);}
    render();
  }).catch(function(){});
}

     rythmes:{seul:[0.3,0.5],encadre:[0.8,1.2],bonus:[1.2,1.6]}}
};
function calcPlanV2(sexe,p0,mga,mgc,taille,age){
  var isF=sexe==="F",S=CALC_SEUILS[isF?"F":"H"];
  var h2=(taille/100)*(taille/100);
  var f=mga/100,t=mgc/100;
  var imc0=p0/h2,obese=imc0>=30;
  var res={isF:isF,S:S,imc0:imc0,obese:obese,kcal:Math.round(p0*S.kcalX),warnings:[],scenarios:[]};
  // ─── Formule V2 (méthode AM Coach) : perte totale = poids × (MG% − cible%) ───
  res.L=p0*(f-t);
  res.pF=p0-res.L;
  res.imcF=res.pF/h2;
  // 🛡️ Protection IMC plancher : blocage + proposition ajustée
  res.blocked=res.imcF<S.imcMin;
  if(res.blocked){
    var Lmax=p0-S.imcMin*h2;
    if(Lmax>0.5){
      res.adjL=Lmax;
      res.adjP=S.imcMin*h2;
      res.adjMgc=Math.round((f-Lmax/p0)*1000)/10;
    }else{res.lockedFull=true;res.adjL=0;}
  }
  var Leff=res.blocked?(res.adjL||0):res.L;
  var pEff=p0-Leff;
  res.Leff=Leff;res.pEff=pEff;
  res.prot=Math.round(S.protX*pEff);
  res.protMax=Math.round((S.protMax||S.protX)*pEff);
  res.protRef=pEff;
  // ─── Avertissements ───
  if(mgc<S.mgReco){
    res.warnings.push({lvl:"comp",txt:"Cible "+mgc+" % = zone COMPÉTITION ("+(isF?"< 15 % femme":"< 10 % homme")+"). Non durable, réservé à une préparation encadrée de courte durée."});
  }
  if(mgc<S.mgSante){
    res.warnings.push({lvl:"med",txt:"Cible sous le seuil santé ("+S.mgSante+" % "+(isF?"femme":"homme")+") : risques hormonaux et immunitaires"+(isF?", aménorrhée possible":"")+". Avis médical recommandé avant d'engager ce plan."});
  }
  if(age&&age>=40){
    res.warnings.push({lvl:"age",txt:"Client 40+ : la sarcopénie accélère la fonte musculaire en déficit. La musculation devient le levier prioritaire, avec des protéines entre "+S.protX+" et "+(S.protMax||S.protX)+" g/kg de poids cible ("+res.prot+" à "+res.protMax+" g/jour ici). En dessous, la perte se fera davantage sur le muscle."});
  }
  if(obese){
    res.warnings.push({lvl:"info",txt:"IMC de départ "+imc0.toFixed(1)+" (≥ 30) : rythmes maximum majorés de 50 % — les premières semaines perdent naturellement plus vite."});
  }
  // ─── 3 scénarios : même perte, composition et durée différentes ───
  var defs=[
    ["seul","🚶 Seul(e)",S.ratios.seul,S.rythmes.seul],
    ["encadre","🔥 Encadré AM Coach",S.ratios.encadre,S.rythmes.encadre],
    ["bonus","🎁 Bonus — protocole pro",S.ratios.bonus,S.rythmes.bonus]
  ];
  for(var i=0;i<defs.length;i++){
    var key=defs[i][0],label=defs[i][1],r=defs[i][2],ry=defs[i][3];
    var rMax=Math.round(ry[1]*(obese?1.5:1)*10)/10;
    res.scenarios.push({
      key:key,label:label,ratio:r,
      gras:r*Leff,maigre:(1-r)*Leff,
      rMin:ry[0],rMax:rMax,
      wMin:Leff>0?Math.max(1,Math.round(Leff/rMax)):0,
      wMax:Leff>0?Math.max(1,Math.round(Leff/ry[0])):0,
      in12:Leff>0&&ry[0]*12>=Leff
    });
  }
  return res;
}

// ═══════════ COMPARAISON DE BILANS — RAPPORT DE PROGRESSION ═══════════
function compareBilans(A,B){
  function nf(x){var v=parseFloat(x);return isNaN(v)?null:v;}
  var C={A:A,B:B};
  C.poidsA=nf(A.poids);C.poidsB=nf(B.poids);
  C.dPoids=(C.poidsA!=null&&C.poidsB!=null)?Math.round((C.poidsB-C.poidsA)*10)/10:null;
  C.mgA=nf(A.mg);C.mgB=nf(B.mg);
  C.dMg=(C.mgA!=null&&C.mgB!=null)?Math.round((C.mgB-C.mgA)*10)/10:null;
  // kg de gras et de muscle (mm = % masse musculaire)
  C.grasA=(C.poidsA!=null&&C.mgA!=null)?C.poidsA*C.mgA/100:null;
  C.grasB=(C.poidsB!=null&&C.mgB!=null)?C.poidsB*C.mgB/100:null;
  C.dGras=(C.grasA!=null&&C.grasB!=null)?Math.round((C.grasB-C.grasA)*10)/10:null;
  var mmA=nf(A.mm),mmB=nf(B.mm);
  C.musA=(C.poidsA!=null&&mmA!=null)?C.poidsA*mmA/100:null;
  C.musB=(C.poidsB!=null&&mmB!=null)?C.poidsB*mmB/100:null;
  C.dMus=(C.musA!=null&&C.musB!=null)?Math.round((C.musB-C.musA)*10)/10:null;
  C.gvA=nf(A.gv);C.gvB=nf(B.gv);
  C.dGv=(C.gvA!=null&&C.gvB!=null)?Math.round((C.gvB-C.gvA)*10)/10:null;
  var tll=nf(B.taille)||nf(A.taille);
  C.imcA=(C.poidsA!=null&&tll)?Math.round(C.poidsA/Math.pow(tll/100,2)*10)/10:null;
  C.imcB=(C.poidsB!=null&&tll)?Math.round(C.poidsB/Math.pow(tll/100,2)*10)/10:null;
  // Jours entre les deux (dates JJ/MM/AAAA)
  function pd(s){var p=String(s||"").split("/");return p.length===3?new Date(p[2],p[1]-1,p[0]):null;}
  var da=pd(A.date),db=pd(B.date);
  C.jours=(da&&db)?Math.round((db-da)/86400000):null;
  // ─── Qualité de la perte : d'où vient chaque kilo ? ───
  C.qualite=null;
  if(C.dPoids!=null&&C.dPoids<0&&C.dGras!=null){
    var partGras=Math.min(100,Math.max(0,Math.round(C.dGras/C.dPoids*100)));
    C.qualite={partGras:partGras,
      verdict:(C.dMus!=null&&C.dMus>=0)?"recomp":partGras>=75?"excellent":partGras>=60?"bon":"alerte"};
  }else if(C.dPoids!=null&&C.dPoids>=0&&C.dGras!=null&&C.dGras<0&&C.dMus!=null&&C.dMus>0){
    C.qualite={partGras:100,verdict:"recomp"};
  }
  // ─── Mesures : où le corps a puisé ───
  C.zones=[];C.totalCm=0;
  for(var m=0;m<BILAN_MESURES.length;m++){
    var k=BILAN_MESURES[m][0],lbl=BILAN_MESURES[m][1];
    var va=nf(A.mesures&&A.mesures[k]),vb=nf(B.mesures&&B.mesures[k]);
    if(va==null||vb==null)continue;
    var dz=Math.round((vb-va)*10)/10;
    C.zones.push({k:k,label:lbl,a:va,b:vb,d:dz});
    if(dz<0)C.totalCm+=-dz;
  }
  C.totalCm=Math.round(C.totalCm*10)/10;
  var losses=C.zones.filter(function(z){return z.d<0;}).sort(function(x,y){return x.d-y.d;});
  C.topZones=losses.slice(0,3);
  C.resistantes=C.zones.filter(function(z){return z.d>=0;});
  if(!C.resistantes.length&&losses.length>3)C.resistantes=[losses[losses.length-1]];
  return C;
}
function progressReport(slug,iA,iB){

  if(!A||!B)return;
  var C=compareBilans(A,B);
  function sgn(d,goodDown){
    if(d==null)return"";

    var good=goodDown?d<0:d>0;

    'h1{font-size:17px;font-weight:900;text-align:center;margin-bottom:4px}'+
    'h2{font-size:13px;font-weight:900;margin:16px 0 6px;color:var(--violet);letter-spacing:.5px;text-transform:uppercase}'+
    '.big{text-align:center;margin:10px 0 4px}.big .n{font-size:34px;font-weight:900;color:var(--ok-d)}.big .l{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:1px}'+
    '.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--soft2);font-size:12.5px}.kv strong{font-weight:900}'+
    'table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;font-size:10px;color:var(--mute);text-transform:uppercase;padding:4px 6px;border-bottom:2px solid #EEE}td{padding:5px 6px;border-bottom:1px solid var(--soft2)}'+
    '.blk{border-radius:12px;padding:12px 14px;margin:8px 0;font-size:12.5px;line-height:1.7}'+
    'p{font-size:12px;color:#444}'+
    '.pdfbar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(255,255,255,.95);border-top:1px solid #E5E5E5}'+
    '.pdfbar button{width:100%;padding:12px 0;border-radius:10px;border:0;background:var(--ink);color:#fff;font-weight:900;font-size:13px}'+
    '@media print{.pdfbar{display:none}}';
  var html='<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progression '+esc(cName)+'</title><style>'+themeCSS()+css+'</style></head><body>'+
    '<div class="brand"><span class="bar br"></span>AM COACH GENÈVE<span class="bar bb"></span></div>'+
    '<div class="sub">Rapport de progression · Méthode AM Transfo Physique</div>'+
    '<h1>'+esc(cName)+' — Analyse '+(iA+1)+' → Analyse '+(iB+1)+'</h1>'+
    '<div style="text-align:center;font-size:11.5px;color:var(--mute)">'+esc(A.date||"?")+' → '+esc(B.date||"?")+(C.jours?' · '+C.jours+' jours':'')+'</div>';
  // ─── En un coup d'œil ───
  if(C.totalCm>0){
    html+='<div class="big"><div class="n">−'+C.totalCm+' cm</div><div class="l">perdus au total sur tes mensurations</div></div>';
  }
  html+='<h2>⚖️ Composition corporelle</h2>'+
    (C.dPoids!=null?'<div class="kv"><span>Poids</span><strong>'+C.poidsA+' → '+C.poidsB+' kg'+sgn(C.dPoids,true)+'</strong></div>':'')+
    (C.dMg!=null?'<div class="kv"><span>Masse grasse</span><strong>'+C.mgA+' → '+C.mgB+' %'+sgn(C.dMg,true)+'</strong></div>':'')+
    (C.dGras!=null?'<div class="kv"><span>Gras (kg)</span><strong>'+C.grasA.toFixed(1)+' → '+C.grasB.toFixed(1)+' kg'+sgn(C.dGras,true)+'</strong></div>':'')+
    (C.dMus!=null?'<div class="kv"><span>Muscle (kg)</span><strong>'+C.musA.toFixed(1)+' → '+C.musB.toFixed(1)+' kg'+sgn(C.dMus,false)+'</strong></div>':'')+
    (C.dGv!=null?'<div class="kv"><span>Graisse viscérale</span><strong>'+C.gvA+' → '+C.gvB+sgn(C.dGv,true)+'</strong></div>':'')+
    (C.imcA!=null&&C.imcB!=null?'<div class="kv"><span>IMC</span><strong>'+C.imcA+' → '+C.imcB+'</strong></div>':'');
  // ─── Qualité de la perte ───
  if(C.qualite){

    }else{
      html+='<div class="blk" style="background:#FFF8F5;border:2px solid var(--bad)"><strong style="color:var(--brand)">⚠️ ATTENTION :</strong> seulement '+q.partGras+' % de la perte vient du gras — le reste part en muscle. Priorité immédiate : remonter les protéines et la musculation, sinon le métabolisme ralentit et la reprise se prépare.</div>';
    }
  }
  // ─── Mensurations zone par zone ───
  if(C.zones.length){
    html+='<h2>📏 Mensurations — zone par zone</h2><table><tr><th>Zone</th><th>Avant</th><th>Après</th><th>Évolution</th></tr>';

      html+='<tr><td><strong>'+Z.label+'</strong></td><td>'+Z.a+' cm</td><td>'+Z.b+' cm</td><td style="font-weight:900;color:'+(Z.d<0?"var(--ok-d)":Z.d>0?"var(--brand)":"var(--mute)")+'">'+(Z.d>0?"+":"")+Z.d+' cm</td></tr>';

        '</div>';
    }
  }
  html+='<div style="text-align:center;font-size:10px;color:var(--mute);margin-top:18px;letter-spacing:1px">AM COACH GENÈVE · MÉTHODE BALANCE-360 · @AMCOACHSPORTIF</div>'+

  var win=window.open("","_blank");

function successCard(slug,iA,iB){
  var clients=lsGet("amcoach_clients",[]),cName=slug;
  for(var i=0;i<clients.length;i++){if(clients[i].slug===slug){cName=clients[i].name;break;}}
  var prenom=String(cName).split(" ")[0];
  var bl=(lsGet("amcoach_"+slug,{})[600]||{}).list||[];
  var A=bl[iA],B=bl[iB];
  if(!A||!B)return;
  var C=compareBilans(A,B);
  // ─── Les 4 meilleurs résultats à afficher (toujours 4 cases) ───
  var stats=[];
  if(C.dPoids!=null&&C.dPoids<0)stats.push({n:C.dPoids+" kg",l:"sur la balance",c:"var(--ok)"});
  if(C.totalCm>0)stats.push({n:"−"+C.totalCm+" cm",l:"de mensurations",c:"var(--gold)"});
  if(C.dMg!=null&&C.dMg<0)stats.push({n:C.dMg+" %",l:"de masse grasse",c:"var(--ok)"});
  if(C.dMus!=null&&C.dMus>0)stats.push({n:"+"+C.dMus+" kg",l:"de muscle",c:"var(--brand2)"});
  if(C.dGras!=null&&C.dGras<0)stats.push({n:C.dGras+" kg",l:"de gras",c:"var(--ok)"});
  if(C.dGv!=null&&C.dGv<0)stats.push({n:""+C.dGv,l:"graisse viscérale",c:"var(--ok)"});
  if(C.topZones&&C.topZones[0])stats.push({n:C.topZones[0].d+" cm",l:C.topZones[0].label.toLowerCase(),c:"var(--gold)"});
  if(C.topZones&&C.topZones[1])stats.push({n:C.topZones[1].d+" cm",l:C.topZones[1].label.toLowerCase(),c:"var(--gold)"});
  if(C.dMus!=null&&C.dMus<0&&Math.abs(C.dMus)<=0.5)stats.push({n:"💪",l:"muscle protégé",c:"var(--brand2)"});
  if(C.jours)stats.push({n:C.jours+" j",l:"de discipline",c:"var(--gold)"});
  // dédoublonnage par libellé, puis on garde les 4 premiers
  var seen={},uniq=[];
  for(var u=0;u<stats.length;u++){if(!seen[stats[u].l]){seen[stats[u].l]=1;uniq.push(stats[u]);}}
  stats=uniq.slice(0,4);
  if(!stats.length){alert("Pas encore assez de données comparables entre ces deux analyses.");return;}
  var cells='';
  for(var s=0;s<stats.length;s++){
    cells+='<div class="cell"><div class="cn" style="color:'+stats[s].c+'">'+esc(stats[s].n)+'</div><div class="cl">'+esc(stats[s].l)+'</div></div>';
  }
  var html='<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Réussite '+esc(prenom)+'</title><style>'+themeCSS()+
    'body{margin:0;font-family:-apple-system,sans-serif;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;box-sizing:border-box}'+
    '.card{width:100%;max-width:380px;aspect-ratio:4/5;background:linear-gradient(160deg,var(--ink) 0%,#0d2513 100%);border-radius:24px;padding:32px 26px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;border:1px solid #333}'+
    '.brand{display:flex;align-items:center;gap:8px;justify-content:center}'+
    '.b{width:4px;height:20px;border-radius:2px}'+
    '.bn{color:#fff;font-weight:900;font-size:13px;letter-spacing:2px}'+
    '.ti{text-align:center;margin-top:6px}'+
    '.t1{color:var(--gold);font-weight:900;font-size:12px;letter-spacing:3px;text-transform:uppercase}'+
    '.t2{color:#fff;font-weight:900;font-size:24px;margin-top:4px}'+
    '.t3{color:var(--ok);font-weight:800;font-size:13px;margin-top:4px;letter-spacing:1px}'+
    '.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}'+
    '.cell{background:rgba(255,255,255,.05);border:1px solid #333;border-radius:16px;padding:16px 8px;text-align:center}'+
    '.cn{font-weight:900;font-size:24px;letter-spacing:.5px}'+
    '.cl{color:#8A8A8A;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-top:5px}'+
    '.bot{text-align:center}'+
    '.tag{color:#fff;font-weight:900;font-size:13px;letter-spacing:1px}'+
    '.sub2{color:#666;font-size:11px;margin-top:4px;letter-spacing:1px;text-transform:uppercase}'+
    '.hint{color:#666;font-size:12px;text-align:center;margin-top:16px;line-height:1.6}'+
    '.ig{display:block;width:100%;max-width:380px;margin-top:12px;padding:14px 0;border-radius:12px;background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF);color:#fff;font-weight:900;font-size:14px;text-align:center;text-decoration:none}'+
    '</style></head><body><button onclick=\'window.close();setTimeout(function(){if(history.length>1)history.back();},250)\' style=\'position:fixed;top:12px;right:12px;z-index:999;background:var(--ink);color:#fff;border:0;border-radius:20px;padding:9px 16px;font-weight:800;font-size:13px\'>✕ Fermer</button>'+
    '<div class="card">'+
    '<div><div class="brand"><div class="b" style="background:var(--brand)"></div><span class="bn">AM COACH GENÈVE</span><div class="b" style="background:var(--brand2)"></div></div>'+
    '<div class="ti"><div class="t1">🏆 Réussite Challenge</div><div class="t2">'+esc(prenom)+'</div>'+
    (C.jours?'<div class="t3">en '+C.jours+' jours</div>':'')+'</div></div>'+
    '<div class="grid">'+cells+'</div>'+
    '<div class="bot"><div class="tag">TRANSFO\'PHYSIQUE</div><div class="sub2">@amcoachsportif · Méthode AM Transfo Physique</div></div>'+
    '</div>'+
    '<a class="ig" href="instagram://story-camera">📸 Ouvrir Instagram Story</a>'+
    '<div class="hint">1. Fais une capture d\'écran de la carte<br>2. Ouvre Instagram Story et poste-la 🔥</div>'+
    '</body></html>';
  var win=window.open("","_blank");
  if(win){win.document.write(html);win.document.close();}
}

function bilanReport(slug,idx,mode){
  mode=mode||"full";
  var isClient=(mode==="client");
  var clients=lsGet("amcoach_clients",[]),cName=slug;
  for(var i=0;i<clients.length;i++){if(clients[i].slug===slug){cName=clients[i].name;break;}}
  var bl=(lsGet("amcoach_"+slug,{})[600]||{}).list||[];
  var a=bl[idx];if(!a)return;
  var prev=idx>0?bl[idx-1]:null;
  function dv(cur,old){
    var c2=parseFloat(cur),o=parseFloat(old);
    if(isNaN(c2)||isNaN(o))return"";
    var d=Math.round((c2-o)*10)/10;if(d===0)return' <span style="color:var(--mute)">(=)</span>';
    return' <span style="color:'+(d<0?"var(--ok-d)":"var(--brand)")+'">('+(d>0?"+":"")+d+')</span>';
  }
  var imc=(a.poids&&a.taille)?Math.round(a.poids/Math.pow(a.taille/100,2)*10)/10:null;
  var css='*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:var(--ink);padding:22px 18px 70px;line-height:1.55;font-size:13px}'+
    '.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:12px;letter-spacing:3px;text-transform:uppercase}'+
    '.bar{width:5px;height:18px;border-radius:3px;display:inline-block}.br{background:var(--brand)}.bb{background:var(--brand2)}'+
    '.sub{text-align:center;font-size:11px;color:var(--mute);letter-spacing:2px;text-transform:uppercase;margin:2px 0 16px}'+
    'h2{font-size:13px;font-weight:900;margin:14px 0 6px;color:var(--violet);letter-spacing:.5px;text-transform:uppercase}'+
    '.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--soft2);font-size:12.5px}.kv strong{font-weight:900}'+
    '.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}'+
    'p{font-size:12px;color:#444;white-space:pre-wrap}'+
    '.pdfbar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(255,255,255,.95);border-top:1px solid #E5E5E5}'+
    '.pdfbar button{width:100%;padding:13px;border:0;border-radius:12px;font-weight:900;font-size:14px;background:var(--ink);color:#fff}'+
    '@media print{.pdfbar,body>button{display:none!important}}';
  var kh='<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Analyse '+(idx+1)+' — '+esc(cName)+'</title><style>'+themeCSS()+css+'</style></head><body>'+
    '<button onclick="window.close();setTimeout(function(){if(history.length>1)history.back();},250)" style="position:fixed;top:10px;right:10px;z-index:999;background:var(--ink);color:#fff;border:0;border-radius:18px;padding:8px 14px;font-weight:800;font-size:12px">✕</button>'+
    '<div class="brand"><span class="bar br"></span><span>AM Coach Genève</span><span class="bar bb"></span></div>'+
    '<div class="sub">Analyse '+(idx+1)+' · '+esc(a.date||"")+' · '+esc(cName)+(prev?' · évolution vs analyse '+idx:'')+(isClient?'':' · version complète')+'</div>'+
    '<h2>Composition corporelle</h2><div class="grid2">'+
    '<div class="kv"><span>Âge</span><strong>'+(a.age||"—")+'</strong></div>'+
    '<div class="kv"><span>Poids</span><strong>'+(a.poids||"—")+' kg'+(prev?dv(a.poids,prev.poids):'')+'</strong></div>'+
    '<div class="kv"><span>IMC</span><strong>'+(imc||"—")+'</strong></div>'+
    '<div class="kv"><span>% Masse grasse</span><strong>'+(a.mg||"—")+' %'+(prev?dv(a.mg,prev.mg):'')+'</strong></div>'+
    '<div class="kv"><span>% Masse musculaire</span><strong>'+(a.mm||"—")+' %'+(prev?dv(a.mm,prev.mm):'')+'</strong></div>'+
    '<div class="kv"><span>Graisse viscérale</span><strong>'+(a.gv||"—")+(prev?dv(a.gv,prev.gv):'')+'</strong></div>'+
    '<div class="kv"><span>Métabolisme</span><strong>'+(a.kcal||"—")+' kcal</strong></div>'+
    '</div>'+
    (function(){
      var p0=parseFloat(a.poids),mga=parseFloat(a.mg),mgcV=parseFloat(a.mgc);
      var tll=parseFloat(a.taille),ag=parseFloat(a.age);
      if(!(p0>0&&mga>0&&mgcV>0&&mgcV<mga&&tll>0))return"";
      var pl=calcPlanV2(a.sexe||"F",p0,mga,mgcV,tll,ag||null);
      var enc2=pl.scenarios[1];
      var ws="";for(var w2=0;w2<pl.warnings.length;w2++){ws+='<div class="warn">⚠️ '+pl.warnings[w2].txt+'</div>';}
      return '<h2>🎯 Plan & objectifs</h2>'+
        '<div class="kv"><span>Objectif</span><strong>'+mgcV.toFixed(0)+' % de masse grasse'+(!pl.blocked?' — poids final '+pl.pF.toFixed(1)+' kg · IMC '+pl.imcF.toFixed(1):'')+'</strong></div>'+
        (!pl.blocked?'<div class="kv"><span>À perdre</span><strong style="color:var(--brand)">'+pl.L.toFixed(1)+' kg (encadré : '+enc2.gras.toFixed(1)+' kg de gras)</strong></div>':'')+
        '<div class="kv"><span>Barre calorique</span><strong>'+pl.kcal+' kcal / jour</strong></div>'+
        '<div class="kv"><span>Protéines</span><strong>'+pl.prot+' g / jour</strong></div>'+
        planRowsHTMLV2(pl)+ws+
        (function(){
          var vN=parseFloat(a.mesures&&a.mesures.nombril)||0;
          var Am=morphoAnalyse(a.sexe||"F",a.profil||"mixte",vN,mgcV);
          var ic={androide:"🍎",gynoide:"🍐",mixte:"🔄"}[Am.profil];
          var vw="";
          if(Am.visceral===2)vw='<div class="warn">🚨 Tour de taille '+Am.ventre+' cm (seuil '+Am.w2+' cm) : graisse viscérale probable — la plus dangereuse, mais la première à partir en déficit. Suivi médical recommandé en parallèle.</div>';
          else if(Am.visceral===1)vw='<div class="warn">⚠️ Tour de taille '+Am.ventre+' cm (vigilance dès '+Am.w1+' cm) : chaque centimètre perdu compte plus que chaque kilo.</div>';
          return '<h2>'+ic+' Profil de stockage</h2>'+
            '<div class="kv" style="border:0"><span style="line-height:1.7">'+Am.ordre+'</span></div>'+
            '<div class="kv" style="border:0"><span style="line-height:1.7">'+Am.leviers+'</span></div>'+
            '<div class="kv" style="border:0"><span style="line-height:1.7"><strong>🎯 Ventre plat :</strong> pour ce profil, il se dessine généralement autour de <strong>'+Am.ventrePlatCible+'</strong> de masse grasse. La perte localisée n\'existe pas — on baisse le global, la génétique décide de l\'ordre.</span></div>'+
            '<div class="kv" style="border:0"><span style="line-height:1.7">'+Am.kpi+'</span></div>'+vw;
        })();
    })()+
    '<h2>Objectifs</h2>'+
    '<div class="kv"><span>1. '+esc(a.obj1||"—")+'</span></div>'+
    (a.obj2?'<div class="kv"><span>2. '+esc(a.obj2)+'</span></div>':'')+
    (a.obj3?'<div class="kv"><span>3. '+esc(a.obj3)+'</span></div>':'')+
    ((!isClient&&a.pb)?'<h2>Problèmes physiques</h2><p>'+esc(a.pb)+'</p>':'')+
    '<h2>Mesures corporelles (cm)</h2><div class="grid2">';
  for(var mm2=0;mm2<BILAN_MESURES.length;mm2++){
    var k2=BILAN_MESURES[mm2][0],val=(a.mesures||{})[k2],dst=(a.mdist||{})[k2];
    kh+='<div class="kv"><span>'+BILAN_MESURES[mm2][1]+(dst?' <span style="color:var(--mute);font-size:11px">(à '+esc(dst)+' cm)</span>':'')+'</span><strong>'+(val||"—")+(prev&&val?dv(val,(prev.mesures||{})[k2]):'')+'</strong></div>';
  }
  kh+='</div><h2>Barème AM Transfo (/10)</h2><div class="grid2">';
  for(var ss=0;ss<BILAN_SCORES.length;ss++){
    var ks=BILAN_SCORES[ss][0],vs=(a.scores||{})[ks];
    kh+='<div class="kv"><span>'+BILAN_SCORES[ss][1]+'</span><strong>'+(vs||"—")+'/10'+(prev&&vs?dv(vs,(prev.scores||{})[ks]):'')+'</strong></div>';
  }
  kh+='</div>';
  function qa(list,title){
    var block='',any=false;
    for(var z=0;z<list.length;z++){
      var qid=list[z][0],ans=(a.q||{})[qid];
      if(ans){any=true;block+='<div style="margin-bottom:7px"><div style="font-size:11px;font-weight:800;color:#555">'+list[z][1]+'</div><p>'+esc(ans)+'</p></div>';}
    }
    return any?'<h2>'+title+'</h2>'+block:'';
  }
  if(!isClient){
    kh+=qa(BILAN_CONTEXTE,'Pourquoi & contexte');
    kh+=qa([BILAN_SEMAINE],'Bilan semaine');
    kh+=qa(BILAN_HAB,'Habitudes alimentaires');
    if(a.dec)kh+='<h2>Découverte</h2><p>'+esc(a.dec)+'</p>';
    if(a.hab)kh+='<h2>Habitudes (notes)</h2><p>'+esc(a.hab)+'</p>';
  }
  kh+='<div class="pdfbar"><button onclick="window.print()">'+(isClient?'📤 Enregistrer en PDF — à envoyer au client':'📤 Enregistrer en PDF — version complète (Goodnotes / archives)')+'</button></div>'+
    '</body></html>';
  var win=window.open("","_blank");
  if(win){win.document.write(kh);win.document.close();}
}

// ═══════════ NAV BINDING (réutilisable) ═══════════
// 📱 Barre du bas toujours visible, même en zoomant.
// iOS positionne les éléments fixes par rapport à la page, pas à ce qu'on voit :
// dès qu'on pince pour zoomer, la barre part hors de l'écran. On la recale.
function ancrerNav(){
  var vv=window.visualViewport;
  if(!vv)return;
  var nav=document.querySelector(".nav");
  if(!nav)return;
  var ech=vv.scale||1;
  if(ech<=1.02){
    nav.style.transform="translateX(-50%)";
    nav.style.width="";
    return;
  }
  // Zoomé : on replace la barre dans la zone réellement visible et on la remet à l'échelle
  var dy=(vv.height+vv.offsetTop)-window.innerHeight;
  nav.style.transformOrigin="bottom center";
  nav.style.transform="translateX(-50%) translateY("+dy.toFixed(0)+"px) scale("+(1/ech).toFixed(3)+")";
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",ancrerNav);
  window.visualViewport.addEventListener("scroll",ancrerNav);
}
// Remise à l'échelle : on rejoue la balise viewport, seule méthode qui marche sur iOS
function dezoomer(){
  var m=document.querySelector('meta[name="viewport"]');
  if(!m)return false;
  var av=m.getAttribute("content");
  m.setAttribute("content","width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no");
  setTimeout(function(){m.setAttribute("content",av);ancrerNav();},320);
  return true;
}
function estZoome(){
  var vv=window.visualViewport;
  return !!(vv&&vv.scale>1.05);
}
function bindNav(){
  var navs=document.querySelectorAll("[data-nav]");
  for(var i=0;i<navs.length;i++){
    navs[i].addEventListener("click",function(){
      var v=this.getAttribute("data-nav");
      // Déjà sur l'onglet : le second appui descend au calendrier,
      // le troisième ramène en haut. Comme sur iOS.
      if(state.view===v&&v==="calendar"){
        buzz("tap");
        // 1er appui zoomé : on dézoome · 2e : on remonte en haut · 3e : on descend au calendrier
        if(estZoome()){dezoomer();return;}
        var a=document.getElementById("cal-anchor");
        var haut=(window.scrollY||document.documentElement.scrollTop)<40;
        if(haut&&a){a.scrollIntoView({behavior:"smooth",block:"start"});}
        else{window.scrollTo({top:0,behavior:"smooth"});}
        return;
      }
      state.view=v;render();
    });
  }
}

function nutSaveDay(newDay){
  var all=getAllData();
  var cfg=all[510]||{};
  cfg.daily=cfg.daily||{};
  var target=cfg.prot||0;
  newDay.tot=Math.round((newDay.foods||[]).reduce(function(s,f){return s+(f.prot||0);},0)*10)/10;
  newDay.ok=target>0&&newDay.tot>=target*0.8;
  cfg.daily[nutDayKey()]=newDay;
  saveDay(510,cfg); // sync Supabase via le même mécanisme (slot 510)
}
// 🕘 Historique réutilisable : chaque aliment validé revient en un tap
function nutPushRecent(name,qty,prot){
  var all=getAllData();
  var cfg=all[510]||{};
  var r=(cfg.recents||[]).slice();
  var key=nutNorm(name)+"|"+qty;
  r=r.filter(function(x){return nutNorm(x.name)+"|"+x.qty!==key;});
  r.unshift({name:name,qty:qty,prot:prot});
  cfg.recents=r.slice(0,15);
  saveDay(510,cfg);
}
function nutAddFood(name,qty){
  var prot=nutProtFor(name,qty);
  if(prot===null){
    alert("Aliment non reconnu 🤔\nEssaie un nom simple : poulet, œufs, riz, saumon, yaourt grec, whey...\nOu cherche la marque avec le bouton 🔍");
    return false;
  }
  var day=nutToday(nutCfg(getAllData()));
  var foods=(day.foods||[]).slice();
  // Nom propre : première lettre en majuscule
  var disp=name.trim().charAt(0).toUpperCase()+name.trim().slice(1);
  foods.push({name:disp,qty:qty,prot:prot});
  nutSaveDay({foods:foods});
  nutPushRecent(disp,qty,prot);
  return true;
}
// Ajout direct d'un produit trouvé en ligne (protéines pour 100 g déjà connues)

  var day=nutToday(nutCfg(getAllData()));
  var foods=(day.foods||[]).slice();

// 📷 Scan du code-barres à la caméra — ZXing (marche sur Safari iOS, contrairement à BarcodeDetector)
var ZXING_URL="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
var _zxLoad=null;
function nutLoadZXing(){
  if(window.ZXing)return Promise.resolve(window.ZXing);
  if(_zxLoad)return _zxLoad;
  _zxLoad=new Promise(function(res,rej){
    var s=document.createElement("script");
    s.src=ZXING_URL;
    s.onload=function(){window.ZXing?res(window.ZXing):rej(new Error("lib"));};
    s.onerror=function(){rej(new Error("réseau"));};
    document.head.appendChild(s);
  });
  return _zxLoad;
}
function nutCloseScan(){
  var ov=document.getElementById("scan-overlay");
  if(window._zxReader){try{window._zxReader.reset();}catch(e){}window._zxReader=null;}
  if(window._zxStream){try{window._zxStream.getTracks().forEach(function(t){t.stop();});}catch(e){}window._zxStream=null;}
  if(ov&&ov.parentNode)ov.parentNode.removeChild(ov);
}
function nutScanBarcode(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){

  var ov=document.createElement("div");

  ov.innerHTML=
    '<div style="padding:14px 16px;color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;gap:10px;background:#111">'+

    '<video id="scan-vid" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover"></video>'+
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">'+
    '<div style="width:78%;max-width:330px;height:150px;border:3px solid var(--ok);border-radius:14px;box-shadow:0 0 0 3000px rgba(0,0,0,.45)"></div></div>'+

    '</div>'+
    '<button id="scan-man" style="margin:12px 16px 20px;padding:13px;border-radius:11px;border:1.5px solid #444;background:var(--ink);color:#fff;font-weight:800;font-size:13px">⌨️ Saisir le code à la main</button>';
  document.body.appendChild(ov);
  document.getElementById("scan-x").addEventListener("click",nutCloseScan);
  document.getElementById("scan-man").addEventListener("click",function(){
    nutCloseScan();
    var cm=prompt("Tape les chiffres sous le code-barres :");

    msg.textContent="Cadre le code-barres du produit";

    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[
      Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,
      Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128]);

function nutLookupBarcode(code){
  if(!code||code.length<6){alert("Code-barres invalide 🤔");return;}
  state.nutSearchBusy=true;render();
  fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+
        ".json?fields=product_name,brands,nutriments,serving_quantity")
  .then(function(r){return r.json();}).then(function(res){
    state.nutSearchBusy=false;
    var pr=res&&res.product;
    var p100=pr&&pr.nutriments?parseFloat(pr.nutriments.proteins_100g):NaN;
    if(!pr||!pr.product_name||isNaN(p100)){
      state.nutResults=[];render();
      alert("Produit introuvable dans la base, ou protéines non renseignées.\nSaisis-le à la main 🙂");
      return;
    }
    state.nutResults=[{name:pr.product_name.trim(),marque:(pr.brands||"").split(",")[0].trim(),
      p100:Math.round(p100*10)/10,portion:parseFloat(pr.serving_quantity)||null}];
    render();
    // Produit unique identifié : on enchaîne directement sur la quantité, sans étape inutile
    var it=state.nutResults[0];
    var def=it.portion||100;
    var q=prompt("✅ "+it.name+(it.marque?"\n"+it.marque:"")+"\n"+it.p100+" g de protéines pour 100 g\n\nQuelle quantité (en grammes) ?",def);
    if(q===null){state.nutResults=null;render();return;}
    q=parseFloat(q)||0;
    if(q<=0){state.nutResults=null;render();return;}
    nutAddDirect((it.marque?it.marque+" "+it.name:it.name),q,Math.round(q*it.p100/100*10)/10);
    state.nutResults=null;
    render();
    feedback("+"+(Math.round(q*it.p100/100*10)/10)+" g \u00b7 "+it.name,"ok");
  }).catch(function(){
    state.nutSearchBusy=false;state.nutResults=[];render();
    alert("Lecture impossible pour le moment. Saisis le produit à la main 🙂");
  });
}
function bindNutrition(){
  var addBtn=document.getElementById("nut-add");

  function doAdd(){
    var n=(nameI.value||"").trim(),q=parseInt(qtyI.value,10)||0;
    if(!n){feedback("Indique un aliment","err");nameI.focus();return;}
    if(q<=0){feedback("Indique la quantité","err");qtyI.focus();return;}
    var av=nutToday(nutCfg(getAllData())).tot||0;
    if(nutAddFood(n,q)){
      var ap=nutToday(nutCfg(getAllData())).tot||0;
      render();
      feedback("+"+(Math.round((ap-av)*10)/10)+" g de protéines","ok");
    }
  }

  if(qtyI)qtyI.addEventListener("keypress",function(e){if(e.key==="Enter")doAdd();});
  // 🔍 Recherche de marque
  var srch=document.getElementById("nut-search");

    var q=(nameI&&nameI.value||"").trim();

  // ▮▯ Code-barres
  var scn=document.getElementById("nut-scan");
  if(scn)scn.addEventListener("click",function(){nutScanBarcode();});
  // Ajout depuis un résultat de recherche
  var res=document.querySelectorAll(".nut-res");
  for(var r0=0;r0<res.length;r0++){
    res[r0].addEventListener("click",function(){
      var ix=parseInt(this.getAttribute("data-i"),10);
      var it=(state.nutResults||[])[ix];
      if(!it)return;
      var def=it.portion||100;
      var q=prompt("Quelle quantité de « "+it.name+" » ?\n("+it.p100+" g de protéines pour 100 g)\n\nEn grammes :",def);
      if(q===null)return;
      q=parseFloat(q)||0;
      if(q<=0)return;
      var nom=(it.marque?it.marque+" "+it.name:it.name);
      nutAddDirect(nom,q,Math.round(q*it.p100/100*10)/10);
      state.nutResults=null;
      render();
    });
  }
  var clr=document.getElementById("nut-res-clear");
  if(clr)clr.addEventListener("click",function(){state.nutResults=null;render();});
  // 🕘 Réutiliser un aliment récent
  var recs=document.querySelectorAll(".nut-rec");
  for(var r1=0;r1<recs.length;r1++){
    recs[r1].addEventListener("click",function(){
      var ix=parseInt(this.getAttribute("data-i"),10);
      var it=(nutCfg(getAllData()).recents||[])[ix];
      if(!it)return;
      nutAddDirect(it.name,it.qty,it.prot);
      render();
      feedback("+"+it.prot+" g \u00b7 "+it.name,"ok");
    });
  }
  var dels=document.querySelectorAll(".nut-del");
  for(var i=0;i<dels.length;i++){
    dels[i].addEventListener("click",function(){
      var ix=parseInt(this.getAttribute("data-i"),10);
      var day=nutToday(nutCfg(getAllData()));
      var foods=(day.foods||[]).slice();
      var sup=foods[ix];
      foods.splice(ix,1);
      nutSaveDay({foods:foods});render();
      feedback((sup?"\u2212"+sup.prot+" g \u00b7 ":"")+"retiré","undo");
    });
  }
}

function finPatch(patch){
  var cfg=getAllData()[512]||{};
  for(var k in patch){if(patch.hasOwnProperty(k))cfg[k]=patch[k];}
  finSaveCfg(cfg);
}
function bindFinance(){
  // Choix du statut
  var stabs=document.querySelectorAll(".fin-statut");
  for(var s=0;s<stabs.length;s++){
    stabs[s].addEventListener("click",function(){
      var st=this.getAttribute("data-st");
      var cfg=finCfg(getAllData());
      var ancien=cfg.statut;
      cfg.statut=st;
      cfg.devise=cfg.devise||"CHF";
      // On ne régénère la liste que si la famille de charges change
      var listeAvant=ancien==="salarie"?"S":ancien?"I":null;
      var listeApres=st==="salarie"?"S":"I";
      if(!cfg.charges||!cfg.charges.length||listeAvant!==listeApres){
        var lst=st==="salarie"?FIN_CHARGES_SALARIE:FIN_CHARGES_INDEP;
        var anciennes={};
        (cfg.charges||[]).forEach(function(c){anciennes[c.n]=parseFloat(c.m)||0;});
        cfg.charges=[];
        for(var i=0;i<lst.length;i++){
          cfg.charges.push({n:lst[i].n,c:lst[i].c,m:anciennes[lst[i].n]||0});
        }
      }
      finSaveCfg(cfg);
      render();
    });
  }
  // Bouton "changer de statut"
  var chgSt=document.getElementById("fin-statut-chg");
  if(chgSt)chgSt.addEventListener("click",function(){
    var cfg=finCfg(getAllData());
    cfg.statut=null;
    finSaveCfg(cfg);
    render();
  });
  // Revenus du mois en cours (salarié / indépendant)
  function setRev(champ,val){
    var cfg=finCfg(getAllData());
    var k=finMonthKey();
    var actuel=finRevMois(cfg,k);
    cfg.revMois=cfg.revMois||{};
    cfg.revMois[k]={sal:actuel.sal,ind:actuel.ind};
    cfg.revMois[k][champ]=val;
    finSaveCfg(cfg);
    // Mise à jour du total sans reconstruire la vue (le champ garde le focus)
    var tot=document.getElementById("fin-rev-tot");
    if(tot)tot.textContent=finFmt(cfg.revMois[k].sal+cfg.revMois[k].ind,cfg.devise||"CHF");
    var rep=document.getElementById("fin-rev-report");
    if(rep)rep.style.display="none";
  }
  var rSal=document.getElementById("fin-rev-sal");
  if(rSal)rSal.addEventListener("change",function(){setRev("sal",parseFloat(this.value)||0);});
  var rInd=document.getElementById("fin-rev-ind");
  if(rInd)rInd.addEventListener("change",function(){setRev("ind",parseFloat(this.value)||0);});

  // ⚙️ Type d'activité et taux
  var actB=document.getElementById("fin-act-chg");
  if(actB)actB.addEventListener("click",function(){
    var cfg=finCfg(getAllData());
    var ks=Object.keys(FIN_ACTIVITES),menu="Ton type d'activité :\n\n";
    for(var i=0;i<ks.length;i++)menu+=(i+1)+" — "+FIN_ACTIVITES[ks[i]].lbl+" ("+FIN_ACTIVITES[ks[i]].taux+" %)\n";
    var c=prompt(menu+"\nNuméro :",String(ks.indexOf(cfg.activite||"bnc")+1));
    if(c===null)return;
    var idx=parseInt(c,10)-1;
    if(idx>=0&&idx<ks.length)cfg.activite=ks[idx];
    var A=FIN_ACTIVITES[cfg.activite||"bnc"];
    var t=prompt("Taux de cotisations (%) :\nOfficiel 2026 pour "+A.lbl+" = "+(A.taux+A.cfp)+" %",
      (cfg.tauxUrssaf!=null&&cfg.tauxUrssaf!=="")?cfg.tauxUrssaf:(A.taux+A.cfp));
    if(t!==null)cfg.tauxUrssaf=(t===""?"":Math.max(0,Math.min(60,parseFloat(t)||0)));
    var im=prompt("Impôt sur le revenu :\n\n1 — Versement libératoire ("+A.lib+" % du CA)\n2 — Provision libre (%)",
      cfg.impotMode==="provision"?"2":"1");
    if(im==="2"){
      cfg.impotMode="provision";
      var ti=prompt("Pourcentage à provisionner pour l'impôt :",(cfg.tauxImpot!=null&&cfg.tauxImpot!=="")?cfg.tauxImpot:10);
      if(ti!==null)cfg.tauxImpot=Math.max(0,Math.min(50,parseFloat(ti)||0));
    }else if(im==="1")cfg.impotMode="liberatoire";
    finSaveCfg(cfg);render();
  });

  // 🌍 Pays et type de salaire
  var paysB=document.getElementById("fin-pays-chg");
  if(paysB)paysB.addEventListener("click",function(){
    var cfg=finCfg(getAllData());
    var ks=Object.keys(FIN_PAYS),menu="Où travailles-tu ?\n\n";
    for(var i=0;i<ks.length;i++)menu+=(i+1)+" — "+FIN_PAYS[ks[i]].lbl+"\n";
    var c=prompt(menu+"\nNuméro :",String(ks.indexOf(cfg.pays||"FRONT")+1));
    if(c===null)return;
    var idx=parseInt(c,10)-1;
    if(idx>=0&&idx<ks.length)cfg.pays=ks[idx];
    var P=FIN_PAYS[cfg.pays];
    var ty=prompt("Le salaire que tu saisis est :\n\n1 — NET (ce qui arrive sur ton compte)\n2 — BRUT (avant retenues)\n\n"+P.note,
      cfg.salType==="brut"?"2":"1");
    if(ty===null){finSaveCfg(cfg);render();return;}
    cfg.salType=(ty==="2")?"brut":"net";
    if(cfg.salType==="brut"){
      var ts=prompt("Taux de retenues sociales (%) :\n"+P.socLbl,
        (cfg.tauxSocSal!=null&&cfg.tauxSocSal!=="")?cfg.tauxSocSal:P.soc);
      if(ts!==null)cfg.tauxSocSal=Math.max(0,Math.min(50,parseFloat(ts)||0));
      var tp=prompt("Taux d'impôt prélevé à la source (%) :\n0 si tu es imposé ailleurs",
        (cfg.tauxImpSal!=null&&cfg.tauxImpSal!=="")?cfg.tauxImpSal:P.imp);
      if(tp!==null)cfg.tauxImpSal=Math.max(0,Math.min(50,parseFloat(tp)||0));
    }
    finSaveCfg(cfg);render();
  });

  // ⚙️ Répartition du palier 2
  var repB=document.getElementById("fin-rep-chg");
  if(repB)repB.addEventListener("click",function(){
    var cfg=finCfg(getAllData());
    var cur=(cfg.repInvest!=null&&cfg.repInvest!=="")?cfg.repInvest:50;
    var r=prompt("Quelle part vers l'INVESTISSEMENT long terme ?\n(le reste va à ton épargne disponible)\n\nEn pourcentage :",cur);
    if(r===null)return;
    cfg.repInvest=Math.max(0,Math.min(100,parseFloat(r)||0));
    finSaveCfg(cfg);render();
  });

  // 🐷 Tirelire
  function versement(montant){
    var cfg=finCfg(getAllData());
    var T=finCalc(cfg);
    cfg.tirelire=cfg.tirelire||{};
    cfg.tirelire.versements=cfg.tirelire.versements||{};
    cfg.tirelire.versements[finMonthKey()]={m:montant,obj:T.capa,d:isoLocal()};
    finSaveCfg(cfg);render();
    feedback("🐷 "+finFmt(montant,cfg.devise||"CHF")+" dans la tirelire","win");
  }
  var tlOk=document.getElementById("fin-tl-ok");
  if(tlOk)tlOk.addEventListener("click",function(){versement(finCalc(finCfg(getAllData())).capa);});
  var tlGo=document.getElementById("fin-tl-go");
  if(tlGo)tlGo.addEventListener("click",function(){
    var inp=document.getElementById("fin-tl-autre");
    var v=parseFloat(inp&&inp.value)||0;
    if(v<=0){alert("Indique le montant que tu as réellement mis de côté");if(inp)inp.focus();return;}
    versement(v);
  });
  var tlUndo=document.getElementById("fin-tl-undo");
  if(tlUndo)tlUndo.addEventListener("click",function(){
    var cfg=finCfg(getAllData());
    if(cfg.tirelire&&cfg.tirelire.versements)delete cfg.tirelire.versements[finMonthKey()];
    finSaveCfg(cfg);render();
  });
  // Inputs charges
  var chInputs=document.querySelectorAll("[data-charge-idx]");
  for(var c=0;c<chInputs.length;c++){
    chInputs[c].addEventListener("change",function(){
      var idx=parseInt(this.getAttribute("data-charge-idx"),10);
      var cfg=finCfg(getAllData());
      if(cfg.charges&&cfg.charges[idx]){
        cfg.charges[idx].m=parseFloat(this.value)||0;
      }
      finSaveCfg(cfg);
    });
  }
  // Bouton Calculer
  var btnCalc=document.getElementById("fin-calcul");
  if(btnCalc){
    btnCalc.addEventListener("click",function(){
      var cfg=finCfg(getAllData());
      if(!cfg.statut||!cfg.charges||cfg.charges.length===0){
        alert("Choisis ton statut d'abord");
        return;
      }
      var Rv=finRevMois(cfg);
      if((Rv.sal+Rv.ind)<=0){
        alert("Renseigne tes revenus du mois");
        return;
      }
      // On fige les revenus du mois au moment du calcul
      var kM=finMonthKey();
      cfg.revMois=cfg.revMois||{};
      cfg.revMois[kM]={sal:Rv.sal,ind:Rv.ind};
      var T=finCalc(cfg);
      if(T.capa<=0){
        alert("Tes charges dépassent tes revenus — impossible de mettre de côté");
        return;
      }
      cfg.lastCalc=T;
      finSaveCfg(cfg);
      render();
      feedback("🧮 Ton plan est calculé","win");
    });
  }
}

    }else{
      render();
      feedback("✓ Jour "+(E2.valides)+"/"+ch.jours,"ok");
    }
  });

  bindNav(); // un seul brancheur : celui qui gère aussi le double appui
  var months=document.querySelectorAll("[data-month]");
  for(var m=0;m<months.length;m++){
    months[m].addEventListener("click",function(){
      var mi=parseInt(this.getAttribute("data-month"));
      state.openMonth=state.openMonth===mi?-1:mi;
      render();
    });
  }
  var cells=document.querySelectorAll("[data-day]");
  for(var c=0;c<cells.length;c++){
    cells[c].addEventListener("click",function(){
      state.selDay=parseInt(this.getAttribute("data-day"));
      state.showBilan=false;
      render();
    });
  }
  var filters=document.querySelectorAll("[data-filter]");
  for(var f=0;f<filters.length;f++){
    filters[f].addEventListener("click",function(){state.filter=this.getAttribute("data-filter");render();});
  }
  var rapports=document.querySelectorAll("[data-rapport]");
  for(var r2=0;r2<rapports.length;r2++){
    rapports[r2].addEventListener("click",function(){
      if(this.classList.contains("disabled"))return;
      openRapport(name,start,parseInt(this.getAttribute("data-rapport")));
    });
  }

  // ⏱️ MINUTEUR ENTRAÎNEMENT (bip léger toutes les 30 s)
  if(window.__tmIv){clearInterval(window.__tmIv);window.__tmIv=null;state.tmRun=false;}
  var tmStart=document.getElementById("tm-start");
  if(tmStart){
    var tmDurBtns=document.querySelectorAll("[data-tmdur]");
    for(var td=0;td<tmDurBtns.length;td++){
      tmDurBtns[td].addEventListener("click",function(){
        if(state.tmRun)return; // pas de changement en cours de route
        state.tmDur=parseInt(this.getAttribute("data-tmdur"),10);
        render();
      });
    }
    var tmCycle=document.getElementById("tm-cycle"), tmTotal=document.getElementById("tm-total");
    var tmLeft=0, tmIv=null, tmCtx=null;
    function tmCtxGet(){
      // 🎧 Mode "transient" : le bip se mixe PAR-DESSUS Deezer/YouTube/podcast sans les couper
      // (la musique baisse une demi-seconde pendant le bip puis reprend)
      try{if(navigator.audioSession)navigator.audioSession.type="transient";}catch(e){}
      if(!tmCtx)tmCtx=new (window.AudioContext||window.webkitAudioContext)();
      if(tmCtx.state==="suspended")tmCtx.resume();
      return tmCtx;
    }
    function tmBeep(n){
      // petit bip (départ)
      try{
        var ctx=tmCtxGet(), t=ctx.currentTime;
        for(var b=0;b<n;b++){
          var o=ctx.createOscillator(),g=ctx.createGain();
          o.connect(g);g.connect(ctx.destination);
          o.frequency.value=880;o.type="sine";
          g.gain.setValueAtTime(0.0001,t+b*0.28);
          g.gain.exponentialRampToValueAtTime(0.35,t+b*0.28+0.02);
          g.gain.exponentialRampToValueAtTime(0.0001,t+b*0.28+0.2);
          o.start(t+b*0.28);o.stop(t+b*0.28+0.22);
        }
      }catch(e){}
    }
    function tmAlarm(){
      // 🔊 alarme forte : 3 secondes de bips (6 pulsations), impossible à louper
      try{
        var ctx=tmCtxGet(), t=ctx.currentTime;
        for(var b=0;b<6;b++){
          var o=ctx.createOscillator(),g=ctx.createGain();
          o.connect(g);g.connect(ctx.destination);
          o.frequency.value=b%2===0?950:1150; // alternance de tons, plus perçant
          o.type="square";
          g.gain.setValueAtTime(0.0001,t+b*0.5);
          g.gain.exponentialRampToValueAtTime(0.6,t+b*0.5+0.02);
          g.gain.setValueAtTime(0.6,t+b*0.5+0.3);
          g.gain.exponentialRampToValueAtTime(0.0001,t+b*0.5+0.42);
          o.start(t+b*0.5);o.stop(t+b*0.5+0.45);
        }
        if(navigator.vibrate)navigator.vibrate([300,150,300,150,300]); // vibration en bonus sur Android
      }catch(e){}
    }
    function tmFmt(s){return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);}
    function tmStop(done){
      if(tmIv){clearInterval(tmIv);tmIv=null;window.__tmIv=null;}
      state.tmRun=false;
      tmStart.textContent=done?"💪 TERMINÉ — Recommencer":"▶️ START";
      tmStart.style.background=done?"var(--ok)":R;
      if(!done){tmCycle.textContent="30";tmTotal.textContent=tmFmt(state.tmDur||300)+" au total";}
    }
    tmStart.addEventListener("click",function(){
      if(state.tmRun){tmStop(false);return;}
      state.tmRun=true;
      tmLeft=state.tmDur||300;
      tmStart.textContent="⏹️ STOP";
      tmStart.style.background="var(--ink2)";
      tmBeep(1); // bip de départ
      tmCycle.textContent="30";
      tmTotal.textContent=tmFmt(tmLeft)+" restantes";
      tmIv=window.__tmIv=setInterval(function(){
        tmLeft--;
        if(tmLeft<=0){
          tmCycle.textContent="0";
          tmTotal.textContent="0:00";
          tmAlarm(); // alarme de fin — 3 secondes
          tmStop(true);
          return;
        }
        var cyc=tmLeft%30===0?30:tmLeft%30;
        if(tmLeft%30===0)tmAlarm(); // alarme forte 3 s toutes les 30 s
        tmCycle.textContent=String(cyc);
        tmTotal.textContent=tmFmt(tmLeft)+" restantes";
      },1000);
    });
  }
}

// ═══════════ GESTES : SWIPE RETOUR + TIRER POUR RAFRAÎCHIR ═══════════
(function(){
  // Indicateur de rafraîchissement
  var ptr=document.createElement("div");
  ptr.style.cssText="position:fixed;top:-56px;left:50%;margin-left:-22px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:20px;z-index:9999;transition:none;pointer-events:none";
  ptr.textContent="⟳";
  document.body.appendChild(ptr);

  var sx=0,sy=0,dx=0,dy=0,pulling=false,swiping=false,active=false;

  function goBack(){
    if(state.selDay!==null&&state.selDay!==undefined){state.selDay=null;render();return true;}
    if(typeof IS_COACH!=="undefined"&&IS_COACH&&state.coachCalc){state.coachCalc=false;render();return true;}
    if(typeof IS_COACH!=="undefined"&&IS_COACH&&state.cdTab==="bilan"){state.cdTab=null;render();return true;}
    if(typeof IS_COACH!=="undefined"&&IS_COACH&&state.coachDetail){state.coachDetail=null;render();return true;}
    return false;
  }

  document.addEventListener("touchstart",function(e){
    if(e.touches.length!==1)return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;dy=0;active=true;
    swiping=sx<50; // swipe retour : départ depuis le bord gauche
    pulling=(window.scrollY<=0);
  },{passive:true});

  document.addEventListener("touchmove",function(e){
    if(!active)return;
    dx=e.touches[0].clientX-sx;dy=e.touches[0].clientY-sy;
    // Tirer vers le bas en haut de page → indicateur
    if(pulling&&dy>0&&Math.abs(dy)>Math.abs(dx)&&window.scrollY<=0){
      var pull=Math.min(dy*0.5,90);
      ptr.style.transition="none";
      ptr.style.transform="translateY("+(pull+56)+"px) rotate("+(pull*4)+"deg)";
      ptr.style.opacity=Math.min(pull/70,1);
      if(e.cancelable)e.preventDefault();
    }
  },{passive:false});

  document.addEventListener("touchend",function(){
    if(!active)return;active=false;
    // Swipe retour : bord gauche → droite, geste horizontal net
    if(swiping&&dx>70&&Math.abs(dy)<60){goBack();}
    // Rafraîchir : tiré assez loin
    if(pulling&&dy*0.5>=70&&Math.abs(dy)>Math.abs(dx)){
      ptr.style.transition="transform .2s";
      ptr.style.transform="translateY(126px) rotate(360deg)";
      setTimeout(function(){location.reload();},250);
    }else{
      ptr.style.transition="transform .25s,opacity .25s";
      ptr.style.transform="translateY(0)";
      ptr.style.opacity=0;
    }
  },{passive:true});
})();
</script>
