<script>
"use strict";

// ═══════════ RENDER ROOT ═══════════
// ═══════════ SCROLL AUTO EN HAUT AU CHANGEMENT DE PAGE ═══════════
// render() est appelé à chaque micro-changement d'état (cocher une habitude,
// saisir un poids...). On ne remonte en haut QUE si la destination a changé.
var _lastRoute=null;
function routeSig(){
  return [
    IS_COACH?"coach":"client",
    state.coachAuthed?1:0,
    state.coachCalc?1:0, state.coachStats?1:0,
    state.coachDetail||"",
    state.cdTab||"",
    state.selDay===null||state.selDay===undefined?"":("day"+state.selDay),
    state.view||""
  ].join("|");
}
function scrollTopIfRouteChanged(){
  var sig=routeSig();
  if(sig===_lastRoute)return;
  _lastRoute=sig;
  try{window.scrollTo(0,0);}catch(e){}
  try{
    if(document.documentElement)document.documentElement.scrollTop=0;
    if(document.body)document.body.scrollTop=0;
  }catch(e){}
}
function render(){
  renderView();
  scrollTopIfRouteChanged();
  // Le geste de retour s'installe une seule fois, ici : bindNav ne tourne que
  // sur les vues client, et le coach a autant besoin du geste que le client.
  try{bindSwipeRetour();}catch(e){}
}
function renderView(){
  setTimeout(function(){try{applyTheme(getAllData());ancrerNav();}catch(e){}},0);
  var root=document.getElementById("root");
  if(IS_COACH){root.innerHTML=state.coachAuthed?((state.blProspect||state.blLibre)?viewCoachBilan():state.coachBilans?viewCoachBilans():state.coachKPI?viewCoachKPI():state.coachStats?viewCoachStats():state.coachCalc?viewCoachCalc():(state.prog3?viewProg3():state.cdAssign?viewProgAssign():state.cdProg?viewProgBuilder():(state.coachDetail?(state.cdTab==="bilan"?viewCoachBilan():viewCoachDetail()):viewCoachDash()))):viewCoachLogin();bindCoach();return;}
  if(!CLIENT){root.innerHTML=viewNoClient();return;}
  var name=lsGetStr("amcoach_name_"+CLIENT);
  var start=lsGetStr("amcoach_start_"+CLIENT);
  if(!name||!start){root.innerHTML=viewOnboarding();bindOnboarding();return;}
  // 🔑 Contrôle d'accès (slot 504)
  var lastAct=getAllData()[505];
  var todayIso=isoLocal();
  var acc0=getAllData()[504]||{};
  // 🔒 Verrou de silence : plus de N jours sans ouvrir l'app.
  // Le seuil est réglable par le coach (0 = désactivé), 3 jours par défaut.
  // Akli : « sept jours c'est trop long, c'est déjà trop tard ». À 3 jours,
  // le verrou tombe le 4ᵉ jour de silence — assez tôt pour rattraper
  // quelqu'un qui décroche, pas assez pour punir un week-end chargé.
  var seuilSil=(acc0.silence===undefined?SIL_DEFAUT:acc0.silence);
  var joursSil=0;
  if(lastAct&&lastAct.d)joursSil=Math.floor((new Date(todayIso)-new Date(lastAct.d))/86400000);
  var verrouSil=!!(CLIENT&&seuilSil>0&&lastAct&&lastAct.d&&joursSil>seuilSil);
  // On n'enregistre la visite QUE si l'accès n'est pas verrouillé :
  // sinon le simple fait d'ouvrir l'app lèverait le verrou tout seul.
  if(CLIENT&&!verrouSil&&(!lastAct||lastAct.d!==todayIso)){saveDay(505,{d:todayIso});}
  if(verrouSil){
    var vD=getAllData(),vT=getToday90(start);
    var vRem=0;for(var vi=0;vi<=vT&&vi<90;vi++){if(vD[vi]&&Object.keys(vD[vi]).length>0)vRem++;}
    root.innerHTML='<div class="dark-screen">'+
      '<div class="dark-brand"><div class="bar bar-r"></div><span>AM Coach</span><div class="bar bar-b"></div></div>'+
      '<div style="font-size:46px;margin:22px 0 10px">🔒</div>'+
      '<div style="color:#fff;font-weight:900;font-size:20px;margin-bottom:12px;text-align:center">Ton accès est en pause</div>'+
      '<div style="color:#8A8A8A;font-size:13.5px;line-height:1.8;max-width:310px;text-align:center;margin-bottom:22px">'+
      'Tu es resté'+(joursSil>1?'':'')+' silencieux pendant <strong style="color:#fff">'+joursSil+' jours</strong>.<br>'+
      'Ton suivi ne fonctionne que si tu le remplis — c\'est pour ça qu\'il se met en pause.<br>'+
      '<span style="color:#fff;font-weight:800">Un message à ton coach suffit à le rouvrir.</span></div>'+
      '<div style="background:rgba(255,255,255,.07);border-radius:16px;padding:15px 18px;text-align:center;margin-bottom:22px">'+
      '<div style="color:#fff;font-weight:900;font-size:22px">'+vRem+' jour'+(vRem>1?'s':'')+'</div>'+
      '<div style="color:#7A7A7A;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-top:3px">déjà construits</div></div>'+
      '<div style="color:#fff;font-size:14.5px;font-weight:800;text-align:center;line-height:1.6">Contacte ton coach<br>pour réactiver ton accès 💪</div>'+
      '<a href="https://wa.me/41779075273?text='+encodeURIComponent("Bonjour Akli, mon accès est en pause, je souhaite reprendre 💪")+'" '+
      'style="margin-top:20px;display:inline-block;background:#25D366;color:#fff;text-decoration:none;padding:15px 26px;border-radius:100px;font-weight:900;font-size:14px">💬 Écrire à mon coach</a>'+
      '</div>';
    return;
  }
  var acc=getAllData()[504];
  if(acc&&(acc.off||(acc.end&&isoLocal()>acc.end))){
    var aD=getAllData(),aT=getToday90(start);
    var aPv=[];for(var ai=0;ai<=aT;ai++){if(aD[ai]&&aD[ai].poids)aPv.push(parseFloat(aD[ai].poids));}
    var aDp=aPv.length>=2?Math.round((aPv[aPv.length-1]-aPv[0])*10)/10:null;
    root.innerHTML='<div class="dark-screen">'+
      '<div class="dark-brand"><div class="bar bar-r"></div><span>AM Coach</span><div class="bar bar-b"></div></div>'+
      '<div style="font-size:44px;margin:20px 0 8px">⏸️</div>'+
      '<div style="color:#fff;font-weight:900;font-size:19px;margin-bottom:10px">Ton accès est terminé</div>'+
      '<div style="color:var(--mute);font-size:13px;line-height:1.8;max-width:300px;text-align:center;margin-bottom:20px">Regarde ce que tu as construit'+(aDp!=null?' : <strong style=\'color:var(--ok)\'>'+aDp+' kg</strong>':'')+' en '+(aT+1)+' jours.<br>Imagine 90 jours.</div>'+
      '<div style="color:#fff;font-size:14px;font-weight:800;text-align:center">Contacte ton coach pour continuer<br>ta transformation 💪</div></div>';
    return;
  }
  if(state.selDay!==null){root.innerHTML=viewDay(name,start);bindDay(name,start);return;}
  // #13 Contrat : proposé une fois au premier lancement (tant que non signé, non passé)
  if(!getAllData()[508]&&!state.ctSkip&&state.view!=="contract")state.view="contract";
  // Le didacticiel occupe tout l'écran : ni bandeau, ni navigation.
  if(state.tuto!=null){
    var htuto='<div class="app">'+viewTuto()+'</div>';
    document.getElementById("root").innerHTML=htuto;
    try{bindTuto();}catch(e){}
    return;
  }
  var html='<div class="app'+(state.view==="sport"||state.view==="training"?" sport-mode":"")+
    (state.view==="stats"&&state.selDay==null?" stats-mode":"")+'">';
  if(state.view==="contract"){root.innerHTML='<div class="app">'+viewContract(name,start)+'</div>';bindContract(name,start);return;}
  if(state.view==="calendar")html+=viewCalendar(name,start);
  else if(state.view==="nutrition")html+=viewNutrition(name,start);
  else if(state.view==="menus")html+=viewMenus(name,start);
  else if(state.view==="finance")html+=viewFinance(name,start);
  else if(state.view==="stats")html+=(state.partage?viewPartage():state.pesees?viewPesees(name):state.statsExo?viewStatsExo(name):viewStats(name));
  else if(state.view==="dream")html+=viewDream(name);
  else if(state.view==="sport"||state.view==="training"){
    try{html+=(state.progRun?viewProgRun():viewSport(name,start));}
    catch(e){html+='<div class="hdr"><div class="hdr-brand"><div class="bar bar-r"></div>'+
      '<span class="hdr-title">Sport</span><div class="bar bar-b"></div></div></div>'+
      '<div style="padding:20px 16px"><div class="spt-card"><div class="spt-lab">⏱️ Minuteurs</div>'+
      '<div class="spt-txt">Les minuteurs n\'ont pas pu s\'afficher. Ferme et rouvre l\'appli — '+
      'le reste de ton suivi est intact.</div></div></div>';}
  }
  else html+=viewRapport(name,start);
  html+=navBar();
  html+='</div>';
  root.innerHTML=html;
  bindMain(name,start);
}

function bindOnboarding(){
  var n=document.getElementById("ob-name"), d=document.getElementById("ob-date"), g=document.getElementById("ob-go");
  var choisi="normal", genre="h", prenom=supTirage("normal","h");
  var carte=document.getElementById("ob-carte");
  // On présente le superviseur AVANT de valider : nom, prénom, et une vraie
  // phrase de sa bouche. On entend la voix avant de la choisir.
  function montrer(){
    var T=TONS[choisi], L=T.bas;
    carte.innerHTML='<div style="background:#141414;border:2px solid var(--brand);border-radius:14px;padding:13px 14px;margin-bottom:14px">'+
      '<div style="font-size:11px;color:rgba(255,255,255,.5);font-weight:800;letter-spacing:.6px;text-transform:uppercase">Ton superviseur</div>'+
      '<div style="font-size:17px;font-weight:900;color:#fff;margin-top:3px">'+T.emoji+' '+prenom+'</div>'+
      '<div style="font-size:11.5px;color:rgba(255,255,255,.55);margin-top:3px;line-height:1.4">'+T.nom+' — '+T.desc+'</div>'+
      '<div style="font-size:12px;color:rgba(255,255,255,.75);font-style:italic;margin-top:9px;line-height:1.5">« '+L[Math.floor(Math.random()*L.length)]+' »</div></div>';
  }
  montrer();
  var btns=document.querySelectorAll(".ob-ton");
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click",function(){
      choisi=this.getAttribute("data-ton");
      for(var j=0;j<btns.length;j++)btns[j].classList.remove("sel");
      this.classList.add("sel");
      prenom=supTirage(choisi,genre); montrer();
    });
  }
  var cap="perte";
  var caps=document.querySelectorAll(".ob-cap");
  for(var c2=0;c2<caps.length;c2++){
    caps[c2].addEventListener("click",function(){
      cap=this.getAttribute("data-cap");
      for(var j2=0;j2<caps.length;j2++)caps[j2].classList.remove("sel");
      this.classList.add("sel");
    });
  }
  var gs=document.querySelectorAll(".ob-g");
  for(var k=0;k<gs.length;k++){
    gs[k].addEventListener("click",function(){
      genre=this.getAttribute("data-g");
      for(var m=0;m<gs.length;m++)gs[m].classList.remove("sel");
      this.classList.add("sel");
      prenom=supTirage(choisi,genre); montrer();
    });
  }
  n.addEventListener("input",function(){g.disabled=!n.value.trim();});
  g.addEventListener("click",function(){
    if(!n.value.trim())return;
    lsSetStr("amcoach_name_"+CLIENT,n.value.trim());
    lsSetStr("amcoach_start_"+CLIENT,d.value);
    saveDay(503,{ton:choisi,genre:genre,prenom:prenom,cap:cap});
    ensureClientInCloud(n.value.trim(),d.value);
    alert("Bravo ! C'est "+prenom+" qui va te superviser pendant 90 jours.\n\nSi tu en as marre de "+prenom+", tu peux changer de superviseur quand tu veux.");
    render();
  });
}

// ═══════════ NAV ═══════════
function progLen(start){
  // Durée du programme selon la date de fin d'accès (slot 504) : 14, 30 jours... sinon 90
  var acc=getAllData()[504]||{};
  var pd=90;
  if(acc.end&&start){var d=Math.floor((new Date(acc.end)-new Date(start))/86400000)+1;if(d>0&&d<90)pd=d;}
  return pd;
}
function navBar(){
  var start=lsGetStr("amcoach_start_"+CLIENT);
  var is14=progLen(start)<=14;
  var tabs=[["calendar","📅","Agenda"],["stats","📈","Stats"],["dream","🌟","Dream"],
    ];
  // 🏋️ Sport : visible pour tous — c'est là que vivent les deux minuteurs.
  // En DEUXIÈME position, juste après l'accueil : c'est l'onglet qu'on ouvre
  // en salle, il doit tomber sous le pouce. Les onglets optionnels ajoutés
  // plus bas s'insèrent donc à partir de la troisième place.
  tabs.splice(1,0,["sport","🏋️","Sport"]);
  // 🍗 Onglet Nutrition : visible seulement si le coach l'a activé (slot 510.on)
  if(nutCfg(getAllData()).on){
    tabs.splice(2,0,["nutrition","🍗","Prot"]); // après Agenda et Sport
  }
  // 🍽️ Onglet Menus : visible si le coach l'a activé (slot 517.on)
  if(menuActif(getAllData())){
    tabs.splice(nutCfg(getAllData()).on?3:2,0,["menus","🍽️","Menus"]);
  }
  // 💰 Onglet Finance : visible seulement si le coach l'a activé (slot 512.on)
  if(finCfg(getAllData()).on){
    tabs.splice(nutCfg(getAllData()).on?3:2,0,["finance","💰","Argent"]);
  }
  // La liste des onglets sert aussi au glissement latéral.
  window.__tabs=tabs.map(function(t){return t[0];});
  var h='<div class="nav">';
  for(var i=0;i<tabs.length;i++){
    var t=tabs[i];
    h+='<button class="nav-btn'+(state.view===t[0]?" active":"")+'" data-nav="'+t[0]+'">'+
      '<span class="nav-ico">'+t[1]+'</span><span class="nav-lbl">'+t[2]+'</span></button>';
  }
  return h+'</div>';
}

// ═══════════ CALENDAR ═══════════
function viewCalendar(name,start){

  if(acc0.end){var pdd=Math.floor((new Date(acc0.end)-new Date(start))/86400000)+1;if(pdd>0&&pdd<90)progDays=pdd;}

    '<div style="padding:16px 14px 0">';

  var etat=__msg.texte;
  // La jauge parle désormais de LA SEMAINE EN COURS : longueur = avancement

        '<button class="sup-pick" data-g="h" style="flex:1;padding:8px 4px;border-radius:10px;border:2px solid '+(S.genre==="h"?"var(--brand)":"var(--line)")+';background:'+(S.genre==="h"?"var(--soft)":"#fff")+';font-weight:800;font-size:11.5px;color:'+(S.genre==="h"?"var(--ink)":"var(--mute)")+'">👨 Homme</button>'+

      '<button id="add-reminder" class="big-btn" style="background:var(--violet);box-shadow:0 4px 14px var(--violet)44;margin-bottom:0;padding:13px 0;font-size:14px">Ajouter à mon calendrier →</button></div>';

  if(nutCfg(allData).on&&!(allData[511]&&allData[511].rappel)){

  // 🗄️ ARCHIVAGE AUTOMATIQUE. Masquer à l'affichage ne suffisait pas : le

  (function(){

    if(warns.length){

        '<div style="font-weight:800;font-size:11px;color:var(--warn-d);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">⚠️ Priorités semaine prochaine</div>'+

      if(wP.length)h+='<div style="font-size:12px;line-height:1.7;margin-bottom:6px"><strong style="color:var(--ok-d)">🌟 Tes gratitudes :</strong> '+wP.map(esc).join(" · ")+'</div>';
      if(wN.length)h+='<div style="font-size:12px;line-height:1.7;margin-bottom:8px"><strong style="color:var(--brand)">🌧️ Ce qui a pesé :</strong> '+wN.map(esc).join(" · ")+'</div>';
      h+='<div style="background:#F4FAF2;border-radius:10px;padding:10px 12px;font-size:11px;color:#4A7A3A;line-height:1.7;font-weight:600">💡 Relis la ligne rouge : ce qui revient 2 fois ou plus est un pattern, pas un hasard. Choisis-en UN et fais-en ta mission One Thing de la semaine prochaine. On ne corrige pas tout — on corrige le levier.</div></div>';
    }
    // 🔁 Boucles de la semaine (vertueuse = socle · échec = ce qui revient)
    var wLoops=loopsHTML(computeLoops(allData,7,wStart),true);
    if(wLoops)h+='<div style="margin-top:12px">'+wLoops+'</div>';
    h+='</div>';
  }

  // ⚠️ Message du coach → déplacé dans la vue jour (épuration accueil)

  // 3 months (mois 2 et 3 verrouillés tant que le précédent n'est pas terminé)
  // Ancre : le second appui sur Agenda amène ici
  h+='<div id="cal-anchor" style="scroll-margin-top:8px"></div>';
  // 📅 Le calendrier dans un tiroir : trois mois de grille déroulés d'office,
  // c'était le plus gros pavé de la page. Il s'ouvre d'un tap, et il s'ouvre
  // tout seul quand on arrive par le second appui sur l'onglet Agenda.
  h+='<details class="cal-tiroir"'+(state.calOpen?' open':'')+'>'+
    '<summary><span class="cal-sum-t">📅 Mon calendrier</span>'+
    '<span class="cal-sum-n">jour '+Math.min(today90+1,progDays)+' sur '+progDays+'</span>'+
    '<span class="cal-sum-c">⌄</span></summary><div class="cal-corps">'+
    '<div class="legend" style="justify-content:center;margin:2px 0 12px">'+
    '<span><i style="background:var(--ok)"></i>Complet</span>'+
    '<span><i style="background:#FFD0B0"></i>Partiel</span>'+
    '<span><i style="background:var(--bad)"></i>Manqué</span>'+
    '<span><i style="background:var(--soft2)"></i>À venir</span></div>';
  // Programme court (Reset 14 j...) : les 14 jours visibles, le reste cadenassé
  var nbMonths=3;
  for(var mi=0;mi<nbMonths;mi++){
    var beyondProg=shortProg&&mi*28>=progDays;
    var locked=beyondProg||mi*28>today90;
    if(locked){
      h+='<div style="margin-bottom:10px"><div class="month-hdr" style="opacity:.55;cursor:default">'+
        '<div class="mh-left"><div class="bar" style="background:#DDD"></div>'+
        '<span class="mh-name" style="color:var(--mute)">🔒 Mois '+(mi+1)+'</span></div>'+
        '<span style="font-size:11px;color:var(--mute);font-weight:700">'+(beyondProg?'Programme 90 jours':'Se débloque au jour '+(mi*28+1))+'</span></div></div>';
      continue;
    }
    var pastDays=[],fd=0;
    for(var x=mi*28;x<Math.min((mi+1)*28,progDays);x++){
      if(x<=today90){pastDays.push(x);if(allData[x])fd++;}
    }
    var mPct=pastDays.length?Math.round(fd/pastDays.length*100):0;
    var isOpen=state.openMonth===mi;
    var isCurrent=mi===Math.floor(Math.min(today90,89)/28);
    var mColor=gaugeCol(mPct);

    h+='<div style="margin-bottom:10px">'+
      '<button class="month-hdr'+(isOpen?" open":"")+'" data-month="'+mi+'">'+
      '<div class="mh-left"><div class="bar" style="background:'+(isOpen?R:"#DDD")+'"></div>'+
      '<span class="mh-name">'+(shortProg?'Mes '+progDays+' jours':'Mois '+(mi+1))+'</span>'+
      (isCurrent?'<span class="mh-badge">EN COURS</span>':"")+'</div>'+
      '<div class="mh-right"><div class="mh-track"><div class="mh-fill" style="width:'+mPct+'%;background:'+mColor+'"></div></div>'+
      '<span class="mh-pct">'+mPct+'%</span></div></button>';

    if(isOpen){
      h+='<div class="cal-grid"><div class="cal-days">';
      for(var dn=0;dn<7;dn++)h+='<div class="cal-dayname">'+DAY_SHORT[dn]+'</div>';
      h+='</div>';
      var nRows=Math.ceil((28+wkOff)/7);
      for(var w=0;w<nRows;w++){
        h+='<div class="cal-week">';
        for(var dd=0;dd<7;dd++){
          var slot=w*7+dd-wkOff;
          if(slot<0||slot>=28){h+='<div style="aspect-ratio:1;border-radius:8px;background:var(--soft)"></div>';continue;}
          var idx=mi*28+slot;
          if(idx>=progDays){h+='<div style="aspect-ratio:1;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:11px;opacity:.55">🔒</div>';continue;}
          if(idx>=90){h+='<div></div>';continue;}
          var cellBg="#EEF4FF", cls="";
          if(idx<=today90){
            var dObj=allData[idx];
            var vide=!dObj||!dObj.habits;
            if(vide)cellBg=(idx===today90?"#EEF4FF":"var(--bad)");
            else{
              var sc=dayScore(dObj);
              cellBg=sc===100?"var(--ok)":sc>=50?"var(--ok-l)":sc>0?"#FFD0B0":(idx===today90?"#EEF4FF":"var(--bad)");
            }
          }else cls=" future";
          if(idx===today90)cls+=" today";
          var hasBilan=allData[idx]&&allData[idx].bilan;
          // ⚡ L'éclair signale les TROIS QUESTIONS remplies, pas la mission :
          // la couleur de la case dit déjà si la journée a été faite, l'éclair
          // dit si la personne est allée jusqu'au mindset.
          var msnDot=mindsetFull(allData,idx)?'<span style="position:absolute;top:-7px;right:-5px;width:26px;height:26px;border-radius:50%;background:#2FBF71;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1">⚡</span>':"";
          h+='<button class="cal-cell'+cls+'" data-day="'+idx+'" style="background:'+cellBg+'">'+(idx+1)+
            (hasBilan?'<span class="bilan-dot">📋</span>':"")+msnDot+'</button>';
        }
        h+='</div>';
      }
      h+='</div>';
    }
    h+='</div>';
  }
  h+='</div></details>';

  // ⚙️ Les réglages laissés de côté plus haut, regroupés ici.
  if(nRegl){
    h+='<details class="cal-tiroir" style="margin-top:12px">'+
      '<summary><span class="cal-sum-t">⚙️ À activer</span>'+
      '<span class="cal-sum-n">'+nRegl+' rappel'+(nRegl>1?'s':'')+'</span>'+
      '<span class="cal-sum-c">⌄</span></summary><div class="cal-corps">'+hRegl+'</div></details>';
  }

  // Pied de page de l'accueil : le mode d'emploi rappelable, puis la version.
  h+='<button id="tuto-revoir" style="display:block;margin:8px auto 0;padding:10px 18px;border-radius:12px;background:var(--soft2);font-size:12px;font-weight:800;color:var(--mute)">🎓 Revoir le mode d\'emploi</button>'+
    '<div style="text-align:center;font-size:10px;color:var(--mute);opacity:.55;padding:14px 0 4px">v'+APP_VERSION+'</div>';
  return h+'</div>';
}
</script>
<script>
"use strict";

// ═══════════ DAY VIEW ═══════════
function viewDay(name,start){
  var idx=state.selDay;
  var allData=getAllData();
  var d=allData[idx]||{};
  var habits=d.habits||{};
  var today90=getToday90(start);
  var isSunday=(idx+1)%7===0;
  var weekNum=Math.floor(idx/7)+1;
  var dow=idx%7;
  var done=0;
  for(var i=0;i<HABITS.length;i++){if(habits[HABITS[i].id])done++;}

  var h='<div class="app"><div class="hdr"><div style="display:flex;align-items:center;gap:12px">'+
    '<button id="day-back" class="day-back">←</button>'+
    '<div style="flex:1"><div style="color:var(--ink);font-weight:900;font-size:15px">Jour '+(idx+1)+' · '+DAY_FULL[dow]+'</div>'+
    '<div style="color:var(--mute);font-size:12px">Semaine '+weekNum+' · '+esc(name)+'</div></div>'+
    '<span id="sync-badge" style="font-size:11px"></span><span id="saved-badge" class="saved-badge" style="display:none">✓ Sauvé</span>'+
    '<div class="ring-wrap" id="day-ring">'+svgRing(done/HABITS.length,done===HABITS.length?"var(--ok)":R,48)+
    '<div class="ring-txt" style="font-size:11px;color:var(--ink)" id="day-ring-txt">'+done+'/'+HABITS.length+'</div></div>'+
    '</div></div><div style="padding:16px 14px 0">';

  if(idx>today90)h+='<div class="info-banner"><span style="font-size:16px">📅</span><span>Jour futur — tu peux anticiper</span></div>';

  // 🌙 Pensée du jour + message du coach (déplacés ici pour épurer l'accueil)
  var penseeJ=pickPensee(allData,idx);
  h+='<div class="card" style="padding:17px 16px;border:0;background:linear-gradient(150deg,#12B5EA 0%,#8A3FFF 100%);box-shadow:0 8px 22px rgba(96,120,255,.26)">'+
    '<div style="color:rgba(255,255,255,.85);font-weight:800;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">🌙 La pensée du jour '+(idx+1)+'</div>'+
    '<div style="color:#fff;font-size:14px;line-height:1.75;font-weight:600;font-style:italic">'+esc(penseeJ)+'</div>'+
    '<button id="pensee-share" style="margin-top:10px;font-size:11px;font-weight:800;color:#fff;padding:7px 13px;border:1.5px solid rgba(255,255,255,.55);border-radius:16px;background:rgba(255,255,255,.14)">📤 Partager</button></div>';
  if(idx===today90){
    var alertD=computeAlert(allData,today90,true);
    if(alertD){
      h+='<div class="card" style="background:#FFF8F0;border:2px solid #FFE0B2;padding:13px 15px">'+
        '<div style="font-weight:900;font-size:11px;color:var(--warn-d);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">⚠️ Message de ton coach</div>'+
        '<div style="font-size:13px;color:#7A4A00;line-height:1.7;font-weight:600">'+alertD.msg+'</div></div>';
    }
  }

  // poids
  h+='<div class="card" style="display:flex;align-items:center;gap:14px"><span style="font-size:24px">⚖️</span>'+
    '<div style="flex:1"><div class="card-label">POIDS (KG)</div>'+
    '<input id="in-poids" class="num-input" type="number" step="0.1" placeholder="ex: 78.5" value="'+esc(d.poids||"")+'"/></div></div>';

  // 😴 SOMMEIL — la nuit du jour et la semaine dans UNE seule carte :
  // c'est la meme information a deux echelles, les separer forcait
  // l'aller-retour entre deux blocs pour comprendre ou on en est.
  h+='<div class="card" style="border-left:4px solid var(--brand2)">'+
    '<div style="display:flex;align-items:center;gap:14px"><span style="font-size:24px">⏱️</span>'+
    '<div style="flex:1"><div class="card-label">HEURES DE SOMMEIL</div>'+
    '<input id="in-sommeil" class="num-input" type="number" step="0.5" min="0" max="24" placeholder="ex: 7.5" value="'+esc(d.sommeilH||"")+'"/></div></div>'+
    '<div id="cycle-viz">'+cycleVizHTML(d.sommeilH)+'</div>'+
    '<div id="sleep-week">'+sleepWeekHTML(allData,idx,today90)+'</div>'+
    '</div>';

  // mental
  // 🔁 AFFICHÉ À L'ENVERS, volontairement. MENTAL est stocké du meilleur (0)
  // au pire (4), ÉNERGIE du pire (0) au meilleur (4) : à l'écran, les deux
  // échelles allaient donc en sens opposé, ce qui fait hésiter à chaque
  // saisie. On les aligne sur le sens de lecture — gauche = bas, droite =
  // haut — en inversant seulement l'AFFICHAGE. Les valeurs enregistrées ne
  // bougent pas : inverser le stockage retournerait tout l'historique et
  // fausserait les courbes déjà tracées.
  h+='<div class="card"><div class="card-label">🧠 RESSENTI MENTAL</div><div class="mood-row">';
  for(var m=MENTAL.length-1;m>=0;m--){
    var act=d.mental===m;
    h+='<button class="mood-btn'+(act?" active":"")+'" data-mental="'+m+'" style="'+(act?"background:"+MENTAL[m][1]:"")+'">'+MENTAL[m][0]+'</button>';
  }
  h+='</div></div>';

  // energie
  h+='<div class="card"><div class="card-label">⚡ ÉNERGIE PHYSIQUE</div><div class="mood-row">';
  for(var e=0;e<ENERGIE.length;e++){
    var act2=d.energie===e;
    h+='<button class="mood-btn'+(act2?" active":"")+'" data-energie="'+e+'" style="'+(act2?"background:"+ENERGIE[e][1]:"")+'">'+ENERGIE[e][0]+'</button>';
  }
  h+='</div></div>';

  // 🧠 MINDSET DU JOUR — remonté juste après l'énergie physique :
  // en bas de page les clients ne le remplissaient pas.
  var ms=d.mindset||{};
  h+='<div style="margin-top:16px"><div class="card-label">🧠 MINDSET DU JOUR — 3 questions, 3 minutes</div>'+
    '<details style="margin-bottom:10px"><summary style="cursor:pointer;list-style:none;font-size:12px;font-weight:800;color:var(--violet);padding:9px 13px;background:var(--soft2);border-radius:12px">💡 Pourquoi ces 3 questions ?</summary>'+
    '<div class="card" style="padding:13px 15px;margin-top:7px;border-left:4px solid var(--violet)"><div style="font-size:12px;color:var(--mute);line-height:1.75">Ton cerveau est programmé pour retenir le négatif — c\'est un réflexe de survie. Ces 3 questions le rééquilibrent chaque soir : la <strong>fierté</strong> ancre tes victoires, la <strong>gratitude</strong> entraîne ton cerveau à voir ce qui va bien, et nommer le <strong>négatif</strong> le sort de ta tête — un problème écrit pèse deux fois moins lourd qu\'un problème ruminé. En 90 jours, ce rituel de 3 minutes reprogramme ta façon de voir tes journées. Sois honnête, sois précis : c\'est ce qui revient chaque semaine qui révèle ce qu\'il faut corriger.</div></div></details>'+
    (function(){var ms2=comboStreak(allData,idx,mindsetFull);return ms2>0?'<div style="font-size:12px;font-weight:900;margin:-6px 0 8px;padding:0 2px;color:'+streakBadge(ms2).c+'">COMBO '+streakBadge(ms2).e+' '+ms2+' jour'+(ms2>1?'s':'')+' de mindset complet</div>':'';})()+''+
    (idx===today90?
      '<div class="card" style="padding:16px">'+
      '<div class="txt-label">🥇 Une chose dont tu es fier(ère) aujourd\'hui</div>'+
      '<textarea id="ms-fier" class="txt-area" placeholder="J\'ai tenu ma séance malgré la fatigue...">'+esc(ms.fier||"")+'</textarea>'+
      '<div class="txt-label">🌟 Une chose positive — la chance que tu as d\'avoir ça</div>'+
      '<textarea id="ms-positif" class="txt-area" placeholder="Ma santé, ma famille, ce repas...">'+esc(ms.positif||"")+'</textarea>'+
      '<div class="txt-label">🌧️ Une chose négative — ce que tu n\'as pas aimé aujourd\'hui</div>'+
      '<textarea id="ms-negatif" class="txt-area" style="margin-bottom:0" placeholder="Le stress du bureau, le grignotage de 16h...">'+esc(ms.negatif||"")+'</textarea>'+
      '</div>'
    :(ms.fier||ms.positif||ms.negatif)?
      '<div class="card" style="padding:16px">'+
      (ms.fier?'<div style="font-size:13px;line-height:1.7;margin-bottom:8px">🥇 '+esc(ms.fier)+'</div>':'')+
      (ms.positif?'<div style="font-size:13px;line-height:1.7;margin-bottom:8px">🌟 '+esc(ms.positif)+'</div>':'')+
      (ms.negatif?'<div style="font-size:13px;line-height:1.7;color:var(--brand)">🌧️ '+esc(ms.negatif)+'</div>':'')+
      '<div style="font-size:11px;color:var(--mute);margin-top:10px">🔒 Mindset du jour '+(idx+1)+' — verrouillé</div></div>'
    :
      '<div class="card" style="padding:16px;text-align:center">'+
      '<div style="font-size:26px;margin-bottom:8px">🔒</div>'+
      '<div style="font-size:13px;font-weight:800;margin-bottom:6px">Ce mindset est resté vide</div>'+
      '<div style="font-size:12px;color:var(--mute);line-height:1.7">Les 3 questions se remplissent <strong>le jour même</strong> — c\'est un rituel du soir, pas un devoir à rattraper. Ce qui compte, c\'est ce soir : rendez-vous sur la page du jour 🌙</div></div>'
    )+
    '</div>';

  // habits
  h+='<div style="margin-top:16px"><div class="card-label">HABITUDES DU JOUR</div>';
  for(var hb=0;hb<HABITS.length;hb++){
    var hab=HABITS[hb];
    var checked=!!habits[hab.id];
    h+='<div class="habit'+(checked?" checked":"")+'" data-habit="'+hab.id+'" style="'+(checked?"background:"+hab.color+";border-color:"+hab.color+";box-shadow:0 3px 12px "+hab.color+"33":"")+'">'+
      '<div class="habit-left"><span class="habit-icon">'+hab.icon+'</span><span class="habit-name">'+hab.label+'</span></div>'+
      '<div class="habit-check">'+(checked?"✓":"")+'</div></div>';
  }
  // ⭐ Habitude perso (slot 506) — choisie par le client : lecture, méditation, étirements...
  var persoHab=allData[506];
  if(persoHab&&persoHab.name){
    var pChecked=!!habits.perso,pColor="#F9A825";
    h+='<div class="habit'+(pChecked?" checked":"")+'" data-habit="perso" style="'+(pChecked?"background:"+pColor+";border-color:"+pColor+";box-shadow:0 3px 12px "+pColor+"33":"")+'">'+
      '<div class="habit-left"><span class="habit-icon">⭐</span><span class="habit-name">'+esc(persoHab.name)+'</span></div>'+
      '<div style="display:flex;align-items:center;gap:10px"><span id="perso-edit" style="font-size:13px;opacity:.55;padding:4px">✏️</span><div class="habit-check">'+(pChecked?"✓":"")+'</div></div></div>';
  }else{
    h+='<div id="perso-add" class="habit" style="border:2px dashed #CCC;background:transparent;color:var(--mute)">'+
      '<div class="habit-left"><span class="habit-icon">➕</span><span class="habit-name" style="color:var(--mute);font-size:13px">Ajoute TON habitude perso<br><span style="font-size:11px;font-weight:600">lecture, méditation, étirements... à toi de choisir</span></span></div></div>';
  }
  h+='</div>';

  // ⚡ MISSION + 🏰 IDENTITÉ — sur la journée active uniquement.
  // On borne au dernier jour du programme : sans ça, un client au-delà de la fin
  // (ou sur un programme court de 14 jours) ne les verrait JAMAIS, puisque
  // son today90 dépasserait tous les jours affichables dans le calendrier.
  var dernierJour=Math.max(0,Math.min(today90,(progLen(start)||90)-1));
  if(idx===dernierJour){
    h+=blocMission(allData,dernierJour,start);
    h+=blocForteresse(allData,dernierJour,start);
  }

  // 🧠 Rappel mindset — discret, dans la journée
  if(idx===dernierJour){
    (function(){
      var fin=Math.min(today90,89), deb=Math.max(0,fin-13), jours=0, faits=0;
      for(var i=deb;i<=fin;i++){
        jours++;
        var mm=(allData[i]&&allData[i].mindset)||null;
        if(mm&&mm.fier&&mm.positif&&mm.negatif)faits++;
      }
      if(jours<5)return;
      if(Math.round(faits/jours*100)>=50)return;
      h+='<div style="display:flex;align-items:flex-start;gap:9px;background:var(--soft2);border-radius:14px;padding:12px 13px;margin-bottom:11px">'+
        '<span style="font-size:15px;line-height:1.3">🧠</span>'+
        '<div style="flex:1;font-size:12px;color:var(--mute);font-weight:700;line-height:1.5">'+
        (faits===0?'Tes 3 phrases n\'ont pas été écrites ces '+jours+' derniers jours.':'Tes 3 phrases : '+faits+' fois sur '+jours+' jours.')+
        ' C\'est là que tu vois ce qui te tire vers le haut et ce qui te freine.</div></div>';
    })();
  }


  // bilan dimanche
  if(isSunday){
    var b=d.bilan||{};
    h+='<button id="bilan-toggle" class="big-btn'+(state.showBilan?" gray":"")+'" style="margin-top:8px">'+
      (state.showBilan?"▲ Fermer":(d.bilan?"✏️ Modifier mon bilan":"📋 Bilan de semaine →"))+'</button>';
    if(d.bilan&&!state.showBilan){
      h+='<button id="wa-bilan" class="big-btn" style="background:#25D366;box-shadow:0 4px 14px #25D36644">📱 Envoyer mon bilan à Akli — 1 clic</button>';
    }
    // 🍗 Résumé nutrition semaine (D)
    var nutCfg2=nutCfg(allData);
    if(nutCfg2.on){
      var totWeek=0,okWeek=0;
      for(var nwd=0;nwd<7;nwd++){
        var nwdt=new Date();nwdt.setDate(nwdt.getDate()-nwd);
        var nwk=isoLocal(nwdt);
        var nwe=(nutCfg2.daily&&nutCfg2.daily[nwk])||null;
        if(nwe){totWeek+=nwe.tot;if(nwe.tot>=nutCfg2.prot*0.8)okWeek++;}
      }
      var avgWeek=Math.round(totWeek/7);
      h+='<button id="nut-recap" class="big-btn" style="background:var(--ok-d);margin-top:8px">📊 Résumé nutrition de la semaine</button>';
    }
    if(state.showBilan){
      h+='<div class="card" style="padding:18px 16px"><div style="font-weight:900;font-size:14px;margin-bottom:16px;display:flex;align-items:center;gap:8px">'+
        '<div class="bar bar-r"></div>Difficulté ressentie — Semaine '+weekNum+'</div>';
      var scales=[["sportDiff","🏋️ SPORT"],["nutritionDiff","🥗 NUTRITION"],["sommeilDiff","😴 SOMMEIL"],["stress","🧠 STRESS"]];
      for(var s=0;s<scales.length;s++){
        var key=scales[s][0], val=b[key]||null;
        h+='<div style="font-weight:800;font-size:12px;margin-bottom:9px">'+scales[s][1]+'</div><div class="scale-row">';
        for(var n2=1;n2<=10;n2++){

  var hbtns=document.querySelectorAll("[data-habit]");
  for(var k2=0;k2<hbtns.length;k2++){
    hbtns[k2].addEventListener("click",function(){
      var id=this.getAttribute("data-habit");
      var d=cur();
      var habits=d.habits||{};
      habits[id]=!habits[id];
      persist({habits:habits});
      // #11 Retour haptique : micro-vibration au check, triple si toutes les habitudes cochées
      if(habits[id]){
        var allChecked=true;
        for(var hc=0;hc<HABITS.length;hc++){if(!habits[HABITS[hc].id]){allChecked=false;break;}}
        feedback(allChecked?"🔥 Toutes tes habitudes sont faites !":"✅ Coché",allChecked?"win":"ok");
      }else{
        feedback("Décoché","undo");
      }
      render();
    });
  }
  // ⭐ Habitude perso : ajout / modification
  var pAdd=document.getElementById("perso-add");
  if(pAdd)pAdd.addEventListener("click",function(){
    var n=prompt("Ton habitude perso — celle que TU choisis (ex : Lecture 10 min, Méditation 5 min, Étirements) :");
    if(n&&n.trim()){saveDay(506,{name:n.trim().slice(0,40)});render();}
  });
  var pEdit=document.getElementById("perso-edit");
  if(pEdit)pEdit.addEventListener("click",function(e){
    e.stopPropagation();
    var pn=(getAllData()[506]||{}).name||"";
    var n=prompt("Modifier ton habitude perso (laisse vide pour la retirer) :",pn);
    if(n===null)return;
    saveDay(506,n.trim()?{name:n.trim().slice(0,40)}:{});
    render();
  });
  function saveMindset(){
    var d=cur();
    var m=d.mindset||{};
    var f1=document.getElementById("ms-fier");if(!f1)return;
    m.fier=f1.value;
    m.positif=document.getElementById("ms-positif").value;
    m.negatif=document.getElementById("ms-negatif").value;
    persist({mindset:m});
  }
  ["ms-fier","ms-positif","ms-negatif"].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.addEventListener("input",saveMindset);
  });
  var bt=document.getElementById("bilan-toggle");
  if(bt)bt.addEventListener("click",function(){state.showBilan=!state.showBilan;render();});

  var sbtns=document.querySelectorAll("[data-scale]");
  for(var s=0;s<sbtns.length;s++){
    sbtns[s].addEventListener("click",function(){
      var key=this.getAttribute("data-scale"), val=parseInt(this.getAttribute("data-val"));
      var d=cur();
      var b=d.bilan||{};
      b[key]=b[key]===val?null:val;
      persist({bilan:b});
      render();
    });
  }
  var bs=document.getElementById("bilan-save");
  if(bs)bs.addEventListener("click",function(){
    var d=cur();
    var b=d.bilan||{};
    b.victoire=document.getElementById("b-victoire").value;
    b.blocage=document.getElementById("b-blocage").value;
    b.ressenti=document.getElementById("b-ressenti").value;
    b.question=document.getElementById("b-question").value;
    persist({bilan:b});
    state.showBilan=false;
    render();
  });

  // 📱 WhatsApp : bilan de la semaine en 1 clic (dimanche uniquement)
  var waBl=document.getElementById("wa-bilan");
  if(waBl)waBl.addEventListener("click",function(){
    var d=cur(),b=d.bilan||{},m=d.mindset||{};
    var allData=getAllData();
    var wStart=Math.max(0,idx-6),sc=[],briq=0,mw=0;
    for(var z=wStart;z<=idx;z++){
      var dz=allData[z];if(dz){var s=dayScore(dz);if(s!=null)sc.push(s);}
      var qz=allData[400+z]||{};if(qz.p)briq++;if(qz.e)briq++;
      if(missionWon(allData,z))mw++;
    }
    var avg=sc.length?Math.round(sc.reduce(function(a,c){return a+c;},0)/sc.length):null;
    var wk=Math.floor(idx/7)+1;
    var t="📋 Mon bilan — Semaine "+wk+"\n"+
      (avg!=null?"📊 Score moyen : "+avg+"%\n":"")+
      "🧱 Briques : "+briq+"/14 · ⚡ Missions : "+mw+"/7\n"+
      (b.sportDiff?"🏋️ Sport "+b.sportDiff+"/10 · ":"")+(b.nutritionDiff?"🥗 Nutrition "+b.nutritionDiff+"/10 · ":"")+(b.sommeilDiff?"😴 Sommeil "+b.sommeilDiff+"/10 · ":"")+(b.stress?"🧠 Stress "+b.stress+"/10":"")+"\n"+
      (b.victoire?"🏆 Victoire : "+b.victoire+"\n":"")+
      (b.blocage?"🤛 Difficulté : "+b.blocage+"\n":"")+
      (b.ressenti?"💬 Ressenti : "+b.ressenti+"\n":"")+
      ((m.fier||m.positif||m.negatif)?"\n🌙 Ce soir :\n"+(m.fier?"🥇 "+m.fier+"\n":"")+(m.positif?"🌟 "+m.positif+"\n":"")+(m.negatif?"🌧️ "+m.negatif+"\n":""):"")+
      (b.question?"\n❓ Ma question : "+b.question:"");
    waSend(t.trim());
  });
  // 📊 Résumé nutrition semaine en WhatsApp (D)
  var nutRec=document.getElementById("nut-recap");
  if(nutRec)nutRec.addEventListener("click",function(){
    var allData=getAllData();
    var cfg=nutCfg(allData);
    if(!cfg.on)return;
    var wStart=Math.max(0,idx-6),totW=0,okW=0,items={};
    for(var nwd=0;nwd<7;nwd++){
      var nwdt=new Date();nwdt.setDate(nwdt.getDate()-nwd);
      var nwk=isoLocal(nwdt);
      var nwe=(cfg.daily&&cfg.daily[nwk])||null;
      if(nwe){
        totW+=nwe.tot;
        if(nwe.tot>=cfg.prot*0.8)okW++;
        for(var nfi=0;nfi<(nwe.foods||[]).length;nfi++){
          var nf=nwe.foods[nfi];
          items[nf.name]=(items[nf.name]||0)+1;
        }
      }
    }
    var avgW=Math.round(totW/7);
    var top2=Object.keys(items).sort(function(a,b){return items[b]-items[a];}).slice(0,2);
    var t="🍗 Résumé nutrition — Semaine "+Math.floor(idx/7)+1+"\n\n"+
      "💪 Protéines moyennes : "+avgW+" g/jour\n"+
      "Quota cible : "+cfg.prot+" g/jour\n"+
      "✅ Jours réussis : "+okW+"/7 (≥80%)\n\n"+
      "🥘 Aliments favoris :\n"+
      (top2[0]?"#1 "+top2[0]+" ("+items[top2[0]]+"×)\n":"")+
      (top2[1]?"#2 "+top2[1]+" ("+items[top2[1]]+"×)\n":"")+
      "\n→ Continue comme ça ! 💪";
    waSend(t.trim());
  });
}
</script>
<script>
"use strict";

// ═══════════ STATS ═══════════
// Échelle de couleur du verdict : du rouge quand le poids remonte au vert
// fluo quand l'objectif est atteint. L'indice 0 est le gris « on ne sait pas
// encore » — il n'affiche pas de jauge, parce qu'il n'y a rien à situer.
var ST_ECHELLE=[
  {c:"linear-gradient(140deg,#475569,#64748B)",t:"#fff"},
  {c:"linear-gradient(140deg,#C81E1E,#E5484D)",t:"#fff"},
  {c:"linear-gradient(140deg,#E2553C,#F2795E)",t:"#fff"},
  {c:"linear-gradient(140deg,#E08A0B,#F5B742)",t:"#3A2A05"},
  {c:"linear-gradient(140deg,#15A05C,#34D07E)",t:"#fff"},
  {c:"linear-gradient(140deg,#00D97E,#5CFFB0)",t:"#053B27"}
];

// ═══════════ 📈 LA COURBE D'UN EXERCICE ═══════════
// Une séance donne plusieurs séries : la courbe suit LA MEILLEURE de chaque
// séance (charge d'abord, répétitions pour départager). C'est le seul chiffre
// qui se compare honnêtement d'une fois à l'autre.
function statsExoSerie(allData, ref) {
  var PG = progGet(allData);
  var J = (PG.journal || []).slice().reverse(), pts = [], nom = "", muscle = "complet";
  for (var j = 0; j < J.length; j++) {
    for (var e = 0; e < J[j].exos.length; e++) {
      var X = J[j].exos[e];
      if (X.ref !== ref) continue;
      nom = X.n || nom; muscle = X.m || muscle;
      var best = null;
      for (var s = 0; s < X.series.length; s++) {
        var SR = X.series[s];
        if (!SR.ok) continue;
        // Les kilos notés à part (cible en %) priment sur la valeur de cible.
        var ch = parseFloat(SR.kg) || parseFloat(SR.c) || 0, rp = parseFloat(SR.v) || 0;
        if (!ch && !rp) continue;
        if (!best || ch > best.ch || (ch === best.ch && rp > best.rp)) best = { ch: ch, rp: rp, t: SR.t || "reps" };
      }
      if (best) pts.push({ d: J[j].d, ch: best.ch, rp: best.rp, t: best.t, vol: volSeance(X) });
    }
  }
  return { nom: nom, muscle: muscle, pts: pts };
}
function volSeance(X) {
  var v = 0;
  for (var s = 0; s < X.series.length; s++) {
    var SR = X.series[s];
    if (!SR.ok) continue;
    v += (parseFloat(SR.kg) || parseFloat(SR.c) || 0) * (parseFloat(SR.v) || 0);
  }
  return Math.round(v);
}
function viewStatsExo(name) {
  var allData = getAllData(), E = statsExoSerie(allData, state.statsExo);
  var M = progMuscle(E.muscle);
  var h = '<div class="prg-top"><button id="stx-back" class="prg-back">‹</button>' +
    '<div style="flex:1;min-width:0"><div class="prg-titre">' + esc(E.nom || "Exercice") + '</div>' +
    '<div class="prg-sous"><span style="color:' + M[2] + '">●</span> ' + M[1] + ' · ' + E.pts.length + ' séance' + (E.pts.length > 1 ? 's' : '') + '</div></div></div>' +
    '<div style="padding:12px 13px 26px">';
  if (E.pts.length < 2) {
    h += '<div class="st-ins"><span class="st-ins-i">📈</span><div>Il faut au moins deux séances avec cet exercice pour tracer une courbe. Continue, elle apparaîtra toute seule.</div></div></div>';
    return h;
  }
  var p0 = E.pts[0], p1 = E.pts[E.pts.length - 1];
  var avecCharge = E.pts.some(function (p) { return p.ch > 0; });
  var vals = E.pts.map(function (p) { return avecCharge ? p.ch : p.rp; });
  var dCh = Math.round((p1.ch - p0.ch) * 10) / 10, dRp = p1.rp - p0.rp;
  var coul = (avecCharge ? dCh : dRp) > 0 ? "var(--st-ok)" : (avecCharge ? dCh : dRp) < 0 ? "var(--st-bad)" : "var(--st-dim)";
  h += '<div class="chart-card">' +
    '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px">' +
    '<div class="chart-dot" style="background:' + M[2] + '"></div>' +
    '<div style="font-weight:900;font-size:15px;flex:1">' + (avecCharge ? "Charge de ma meilleure série" : "Répétitions de ma meilleure série") + '</div>' +
    '<div style="font-weight:900;font-size:15px;color:' + coul + '">' + (avecCharge ? p1.ch + " kg" : p1.rp + " reps") + '</div></div>' +
    '<div class="st-note" style="margin:0 0 8px">' +
    (avecCharge
      ? (dCh > 0 ? "+" + dCh + " kg depuis ta première séance" : dCh < 0 ? dCh + " kg depuis ta première séance" : "même charge qu'au début")
      : (dRp > 0 ? "+" + dRp + " répétitions depuis ta première séance" : dRp < 0 ? dRp + " répétitions depuis ta première séance" : "même nombre qu'au début")) + '</div>' +
    svgLineChart(vals, M[2], { txt: "#8A8FA3" }) + '</div>';
  // Le détail séance par séance, du plus récent au plus ancien
  h += '<div class="st-h3"><div class="st-h3-bar" style="background:' + M[2] + '"></div><span>🗓️ Séance par séance</span></div>';
  for (var i = E.pts.length - 1; i >= 0; i--) {
    var p = E.pts[i], prec = i > 0 ? E.pts[i - 1] : null;
    var ec = prec ? Math.round((p.ch - prec.ch) * 10) / 10 : null;
    h += '<div class="st-exo" style="display:flex;align-items:center;gap:10px">' +
      '<div style="flex:1"><div class="st-exo-n">' + frDate(p.d) + '</div>' +
      '<div class="st-exo-l">' + (p.ch ? p.ch + ' kg × ' + p.rp : p.rp + ' ' + progTypeCourt(p.t)) +
      (p.vol ? ' · ' + p.vol + ' kg soulevés' : '') + '</div></div>' +
      (ec != null && ec !== 0
        ? '<div class="st-exo-d" style="color:' + (ec > 0 ? "var(--st-ok)" : "var(--st-bad)") + '">' + (ec > 0 ? "+" : "") + ec + ' kg</div>'
        : '') + '</div>';
  }
  h += '</div>';
  return h;
}

function viewStats(name){
  var allData=getAllData();
  var start=lsGetStr("amcoach_start_"+CLIENT);
  var today90=start?getToday90(start):89;
  var series=computeSeries(allData,90);
  var lastIdx=-1;
  for(var i=89;i>=0;i--){if(series[i].score!=null){lastIdx=i;break;}}
  if(lastIdx<0)lastIdx=Math.max(0,Math.min(89,today90));

  function vals(key){return series.map(function(d){return d[key];});}
  var poidsV=vals("poids");
  var nCfg=nutCfg(allData);
  var cible=parseFloat(nCfg.pCible)||null;
  // Même horizon que l'accueil : la dernière pesée jusqu'à AUJOURD'HUI.
  // Sans ça, l'accueil affichait 80,7 et les stats 80,8 le même jour.
  var idxPoids=Math.max(lastIdx,Math.min(89,today90));
  var PJ=statProjection(poidsV,cible,idxPoids,Math.max(0,90-(today90+1)));
  var rempli=0;for(var f=0;f<=Math.min(89,lastIdx);f++){if(allData[f]&&Object.keys(allData[f]).length>0)rempli++;}

  // Titre de section : barre colorée + libellé, réutilisé partout dans la vue.
  function titreSection(txt,coul){
    return '<div class="st-h3"><div class="st-h3-bar" style="background:'+coul+'"></div><span>'+txt+'</span></div>';
  }

  var h='<div class="hdr"><div class="hdr-brand"><div class="bar bar-r"></div>'+
    '<span class="hdr-title">Ma progression</span><div class="bar bar-b"></div></div>'+
    (function(){var __d=progLen(lsGetStr("amcoach_start_"+CLIENT))||90;
      return '<div class="hdr-sub">'+esc(name)+' · jour '+(Math.min(__d,today90+1))+' sur '+__d+'</div></div>';})()+
    '<div style="padding:14px 14px 0">';

  // ═══ 1. LE VERDICT ═══
  // Akli : « orangé quand c'est pas top, jusqu'au vert fluo quand tout est
  // ok ». La couleur devient donc une ÉCHELLE, pas une décoration : elle dit
  // où il en est avant même qu'il ait lu la phrase. Cinq crans, plus un gris
  // quand il n'y a pas encore assez de données pour juger.
  (function(){
    var titre,sous,niv,ico;
    if(rempli<4){
      ico="🌱";titre="Ta courbe se construit";
      sous="Remplis encore "+(4-rempli)+" jour"+((4-rempli)>1?"s":"")+" et je pourrai te dire où tu vas.";
      niv=0;
    }else if(!PJ){
      ico="⚖️";titre="Pèse-toi pour voir ta tendance";
      sous="Une pesée régulière, même approximative, suffit à faire apparaître la direction.";
      niv=0;
    }else if(PJ.atteint){
      ico="🎉";titre=supVerdictTitre(allData,"atteint");
      sous="Tu es à "+PJ.act+" kg. "+supVerdictSous(allData,"atteint");
      niv=5;
    }else if(!PJ.assez){
      ico="⏳";titre="Encore un peu de patience";
      sous="Il me faut environ 8 pesées pour distinguer une vraie tendance du bruit quotidien. Tu en as "+((PJ.tendance&&PJ.tendance.n)||0)+".";
      niv=0;
    }else if(PJ.monte){
      ico="📈";titre=supVerdictTitre(allData,"monte");
      sous=supVerdictSous(allData,"monte");
      niv=1;
    }else if(PJ.stagne){
      ico="➖";titre=supVerdictTitre(allData,"stagne");
      sous=supVerdictSous(allData,"stagne");
      niv=2;
    }else if(PJ.recentMonte){
      // La pente globale descend encore, mais les dernières pesées remontent.
      // Le dire maintenant vaut mieux que de féliciter quelqu'un qui repart
      // dans l'autre sens : c'est là que ça se rattrape facilement.
      ico="⚠️";titre=supVerdictTitre(allData,"repart");
      sous=supVerdictSous(allData,"repart");
      niv=2;
    }else if(PJ.retard!=null&&PJ.retard>0){
      // Il maigrit, mais trop lentement pour tenir la date. Annoncer une date
      // au-delà de l'échéance sans la nommer, c'était mentir par omission.
      var sem=Math.ceil(PJ.retard/7);
      ico="⏳";titre=supVerdictTitre(allData,"lent");
      sous="Tu perds "+PJ.parSem+" kg par semaine. À ce rythme tu atteins "+PJ.cible+" kg le "+PJ.dateCible+
        ", soit "+sem+" semaine"+(sem>1?"s":"")+" APRÈS la fin de tes 90 jours ("+PJ.dateFin+")."+
        " Il faudrait "+(Math.round((PJ.reste/(PJ.joursRestants/7))*100)/100)+" kg par semaine pour y être à temps. "+supVerdictSous(allData,"finLent");
      niv=3;
    }else if(PJ.recentMou){
      ico="🐢";titre=supVerdictTitre(allData,"ralentit");
      sous="Sur l'ensemble tu perds "+PJ.parSem+" kg par semaine, mais ces derniers jours le rythme a nettement baissé ("+PJ.parSemRecent+" kg/sem). "+supVerdictSous(allData,"finRalentit");
      niv=3;
    }else{
      ico="🔥";titre=supVerdictTitre(allData,"progresse");
      sous="Rythme actuel : "+PJ.parSem+" kg par semaine."+(PJ.dateCible?" À ce rythme, "+PJ.cible+" kg le "+PJ.dateCible:"")+
        (PJ.retard!=null&&PJ.retard<=0?" — soit "+Math.abs(Math.floor(PJ.retard/7))+" semaine(s) avant l'échéance.":".")+" "+supVerdictSous(allData,"finProgresse");
      niv=4;
    }
    var E=ST_ECHELLE[niv];
    var jauge="";
    if(niv>0){
      for(var q=1;q<=5;q++)jauge+='<i class="'+(q<=niv?"on":"")+'"></i>';
      jauge='<div class="st-echelle">'+jauge+'</div>';
    }
    // Signée comme à l'accueil : sans le nom, le verdict ressemble à un
    // bandeau système et le client ne reconnaît pas son superviseur.
    var __S=supGet(allData),__T=TONS[__S.ton];
    h+='<div class="st-verdict" style="background:'+E.c+';color:'+E.t+'">'+
      '<div class="st-verdict-sig"><span style="font-size:15px;line-height:1">'+__T.emoji+'</span>'+
      '<span>'+esc(__S.prenom)+'</span><span class="st-verdict-ico">'+ico+'</span></div>'+
      '<div class="st-verdict-t">'+titre+'</div>'+
      '<div class="st-verdict-s">'+sous+'</div>'+jauge+'</div>';
  })();

  // ═══ 2. LA COURBE DE POIDS ═══
  h+='<div class="chart-card">'+
    '<div class="chart-hdr"><div class="chart-dot" style="background:var(--st-cy)"></div>'+
    '<span class="chart-title">Mon poids</span>'+
    (PJ&&PJ.act?'<span class="chart-avg">'+PJ.act+' kg</span>':'')+'</div>'+
    svgPoidsChart(poidsV,cible,{trait:"#0EA5C6"})+
    '<div class="st-leg">'+
    '<span><i style="background:var(--st-cy)"></i> tes pesées</span>'+
    '<span><i style="background:var(--gold-d)"></i> ta tendance</span>'+
    (cible?'<span><i style="background:var(--st-ok)"></i> objectif</span>':'')+
    '</div>';
  // L'historique détaillé et la carte à partager, à portée de la courbe.
  h+='<div style="display:flex;gap:9px;margin-top:12px">'+
    '<button id="st-pes" class="prg-mini" style="flex:1;padding:12px 0">⚖️ Mes pesées</button>'+
    '<button id="st-part" class="prg-mini" style="flex:1;padding:12px 0">📤 Partager</button></div>';
  h+='</div>';

  // ═══ 3. CETTE SEMAINE VS LA PRÉCÉDENTE ═══
  // Deux blocs au lieu d'un seul de quatre cases : les MESURES (ce que dit la
  // balance et le lit) d'un côté, le RESSENTI (ce que dit le corps et la tête)
  // de l'autre. Ce sont deux natures d'information, on ne les lit pas pareil.
  (function(){
    function carte(D,grand){
      var S=statSemaine(vals(D.k),lastIdx);
      if(!S)return '<div class="st-w vide"><div class="st-w-lbl">'+D.ico+' '+D.lbl+'</div>'+
        '<div class="st-w-val">—</div><div class="st-w-sub">pas de donnée</div></div>';
      var col="var(--st-dim)",fl="",txt="stable vs semaine dernière";
      if(S.delta!=null&&Math.abs(S.delta)>=(D.k==="poids"?0.2:2)){
        var bon=D.mieux==="bas"?S.delta<0:S.delta>0;
        col=bon?"var(--st-ok)":"var(--st-bad)";
        fl=(S.delta<0?"▼":"▲");
        txt=(S.delta>0?"+":"")+S.delta+D.u+" vs semaine dernière";
      }else if(S.precedent==null){txt="1re semaine";}
      return '<div class="st-w'+(grand?" "+grand:"")+'">'+
        '<div class="st-w-lbl">'+D.ico+' '+D.lbl+'</div>'+
        '<div class="st-w-val">'+S.actuel+'<span>'+D.u+'</span></div>'+
        '<div class="st-w-sub" style="color:'+col+'">'+(fl?fl+" ":"")+txt+'</div></div>';
    }
    var mesures=[{k:"poids",lbl:"Poids",u:" kg",ico:"⚖️",mieux:"bas"},
                 {k:"sommeilH",lbl:"Sommeil",u:" h",ico:"😴",mieux:"haut"}];
    var ressenti=[{k:"energie",lbl:"Physique",u:" %",ico:"⚡",mieux:"haut"},
                  {k:"mental",lbl:"Mental",u:" %",ico:"🧠",mieux:"haut"}];
    var okM=false,okR=false,i;
    for(i=0;i<2;i++){if(statSemaine(vals(mesures[i].k),lastIdx))okM=true;
                     if(statSemaine(vals(ressenti[i].k),lastIdx))okR=true;}
    if(!okM&&!okR)return;
    if(okM){
      h+=titreSection("Ma semaine","var(--st-cy)")+
        '<div class="st-note">Moyenne des 7 derniers jours remplis, comparée aux 7 précédents.</div>'+
        '<div class="st-grid2">'+carte(mesures[0])+carte(mesures[1])+'</div>';
    }
    if(okR){
      h+=titreSection("Mon ressenti","var(--st-vi)")+
        '<div class="st-grid2">'+carte(ressenti[0],"cy")+carte(ressenti[1],"vi")+'</div>';
    }
  })();

  // ═══ 4. CE QUE DISENT TES DONNÉES ═══
  (function(){
    if(rempli<10)return;
    var msgs=[];
    function moyQuand(cleFiltre,seuil,cleMesure,haut){
      var a=[],b=[];
      for(var i=0;i<=lastIdx;i++){
        var vf=series[i][cleFiltre],vm=series[i][cleMesure];
        if(vf==null||vm==null)continue;
        if(haut?(vf>=seuil):(vf<seuil))a.push(vm);else b.push(vm);
      }
      if(a.length<3||b.length<3)return null;
      function m(l){var s=0;for(var k=0;k<l.length;k++)s+=l[k];return s/l.length;}
      return {avec:Math.round(m(a)),sans:Math.round(m(b)),nA:a.length,nB:b.length};
    }
    var som=moyQuand("sommeilH",7,"mental",true);
    if(som&&som.avec-som.sans>=8){
      msgs.push({ico:"😴",txt:"Les jours où tu dors 7 h ou plus, ton mental est à <strong>"+som.avec+" %</strong> — contre "+som.sans+" % les autres jours. Ton sommeil est ton levier le plus rentable."});
    }
    var en=moyQuand("sommeilH",7,"energie",true);
    if(en&&en.avec-en.sans>=8){
      msgs.push({ico:"⚡",txt:"Ton énergie physique passe de "+en.sans+" % à <strong>"+en.avec+" %</strong> quand tu as bien dormi."});
    }
    var sc=moyQuand("mental",60,"score",true);
    if(sc&&sc.avec-sc.sans>=10){
      msgs.push({ico:"🧠",txt:"Quand ton mental tient, ton score de la journée monte à <strong>"+sc.avec+" %</strong> au lieu de "+sc.sans+" %. Le moral tire le reste."});
    }
    var TP=statTendance(poidsV);
    if(TP&&TP.n>=8&&TP.pente<-0.005){
      msgs.push({ico:"📉",txt:"Tu perds en moyenne <strong>"+(Math.round(-TP.pente*7*100)/100)+" kg par semaine</strong> depuis le début du suivi."});
    }
    if(!msgs.length)return;
    h+=titreSection("Ce que disent tes données","var(--st-vi)");
    for(var m2=0;m2<msgs.length&&m2<3;m2++){
      h+='<div class="st-ins"><span class="st-ins-i">'+msgs[m2].ico+'</span>'+
        '<div>'+msgs[m2].txt+'</div></div>';
    }
  })();

  // ═══ 5. RÉGULARITÉ ═══
  (function(){
    var avgScore=avgOf(series,"score");
    var bs=bestStreak(allData,Math.min(89,lastIdx));
    h+=titreSection("Ma régularité","var(--st-cy)")+
      '<div class="st-grid2">'+
      '<div class="st-kpi"><div class="st-kpi-n" style="color:var(--st-cy)">'+rempli+'</div><div class="st-kpi-l">Jours remplis</div></div>'+
      '<div class="st-kpi"><div class="st-kpi-n" style="color:var(--st-vi)">'+bs+'</div><div class="st-kpi-l">Meilleure série</div></div></div>'+
      '<div class="chart-card"><div class="chart-hdr"><div class="chart-dot" style="background:var(--st-cy)"></div>'+
      '<span class="chart-title">Score global</span>'+
      (avgScore!=null?'<span class="chart-avg">moy. '+avgScore+'%</span>':'')+'</div>'+
      svgLineChart(vals("score"),"#0EA5C6",{min:0,max:100})+
      '<div class="st-note" style="margin:7px 0 0">Ce score résume ta journée : habitudes cochées, ressenti, sommeil.</div></div>';
  })();

  // ═══ 5 bis. LA PROGRESSION EN FORCE, EXERCICE PAR EXERCICE ═══
  // Akli : « il faudrait que nos stats de sport apparaissent dans stats,
  // exemple développé couché × progression ». On ne compare pas des séances
  // entre elles (elles n'ont pas la même longueur) mais la MEILLEURE SÉRIE de
  // chaque exercice : c'est le chiffre que le client retient et le seul qui
  // se compare honnêtement d'une fois à l'autre.
  (function(){
    var PG=progGet(allData);
    if(!PG.journal||PG.journal.length<2)return;
    // Le journal est rangé du plus récent au plus ancien : on le remet dans
    // l'ordre du temps pour lire une progression.
    var J=PG.journal.slice().reverse(), suivi={}, ordre=[];
    for(var j=0;j<J.length;j++){
      for(var e=0;e<J[j].exos.length;e++){
        var X=J[j].exos[e], best=null;
        for(var s2=0;s2<X.series.length;s2++){
          var SR=X.series[s2];
          if(!SR.ok)continue;
          var ch=parseFloat(SR.kg)||parseFloat(SR.c)||0, rp=parseFloat(SR.v)||0;
          if(!ch&&!rp)continue;
          // Meilleure série : la charge d'abord, les répétitions pour départager.
          if(!best||ch>best.ch||(ch===best.ch&&rp>best.rp))best={ch:ch,rp:rp,t:SR.t||"reps"};
        }
        if(!best)continue;
        if(!suivi[X.ref]){suivi[X.ref]={nom:X.n,m:X.m,pts:[]};ordre.push(X.ref);}
        suivi[X.ref].pts.push({d:J[j].d,ch:best.ch,rp:best.rp,t:best.t});
      }
    }
    var lignes="",n=0;
    for(var o=0;o<ordre.length;o++){
      var E=suivi[ordre[o]];
      if(E.pts.length<2)continue;
      var p0=E.pts[0], p1=E.pts[E.pts.length-1], M=progMuscle(E.m);
      var unite=(p1.t==="duree")?" s":(p1.t==="distm")?" m":"";
      var maintenant=p1.ch?(p1.ch+" kg × "+p1.rp):(p1.rp+unite);
      var dCh=Math.round((p1.ch-p0.ch)*10)/10, dRp=p1.rp-p0.rp;
      var txt,coul;
      if(p1.ch&&dCh>0){txt="+"+dCh+" kg depuis la 1re fois";coul="var(--st-ok)";}
      else if(p1.ch&&dCh<0){txt=dCh+" kg depuis la 1re fois";coul="var(--st-bad)";}
      else if(dRp>0){txt="+"+dRp+" répétition"+(dRp>1?"s":"")+" à charge égale";coul="var(--st-ok)";}
      else if(dRp<0){txt=dRp+" répétition"+(dRp<-1?"s":"")+" vs la 1re fois";coul="var(--st-bad)";}
      else {txt="stable depuis la 1re fois";coul="var(--st-dim)";}
      lignes+='<button class="st-exo" data-st-exo="'+esc(ordre[o])+'" style="width:100%;text-align:left;display:block">'+
        '<div class="st-exo-hd"><span style="color:'+M[2]+'">●</span>'+
        '<span class="st-exo-n">'+esc(E.nom)+'</span>'+
        '<span class="st-exo-d" style="color:'+coul+'">'+maintenant+'</span></div>'+
        '<div class="st-exo-l" style="color:'+coul+'">'+txt+' · '+E.pts.length+' séances · voir la courbe ›</div></button>';
      n++;
    }
    if(!n)return;
    h+=titreSection("💪 Ma progression en force","var(--st-vi)")+
      '<div class="st-note">La meilleure série de chaque exercice, comparée à ta toute première fois.</div>'+lignes;
  })();

  // ═══ 6. TROPHÉES ═══
  // Les dix trophées d'un bloc poussaient tout le reste vers le bas alors que
  // huit sont verrouillés au début. On montre ce qui est gagné, le reste se
  // déplie à la demande.
  (function(){
    var bs=bestStreak(allData,89);
    var res=qgRes(allData,89);
    var wins=0;for(var w2=0;w2<90;w2++){var m2=allData[200+w2];if(m2&&m2.status==="done")wins++;}
    var TROPHIES=[
      {icon:"🔥",name:"Semaine de Fer",cond:bs>=7,desc:"7 jours d'affilée"},
      {icon:"⚔️",name:"Régularité d'Acier",cond:bs>=21,desc:"21 jours d'affilée"},
      {icon:"🦾",name:"Machine de Guerre",cond:bs>=45,desc:"45 jours d'affilée"},
      {icon:"🧱",name:"Premier Mur",cond:res.total>=8,desc:"8 briques posées"},
      {icon:"🏗️",name:"Bâtisseur",cond:res.total>=40,desc:"40 briques posées"},
      {icon:"👑",name:"Citadelle",cond:res.total>=120,desc:"120 briques posées"},
      {icon:"🟢",name:"Conquérant",cond:wins>=10,desc:"10 zones sécurisées"},
      {icon:"🏴",name:"Seigneur de Guerre",cond:wins>=30,desc:"30 zones sécurisées"},
      {icon:"📅",name:"Premier Mois",cond:rempli>=28,desc:"28 jours remplis"},
      {icon:"🎓",name:"Transformation",cond:rempli>=84,desc:"84 jours remplis"}
    ];
    // 🏅 Badges de challenges décrochés
    (function(){
      var bd=chBadges(allData);
      if(!bd.length)return;
      var chips='';
      for(var q=0;q<bd.length&&q<9;q++){
        chips+='<div class="st-badge"><div style="font-size:22px">'+bd[q].e+'</div>'+
          '<div class="st-badge-n">'+esc(bd[q].n)+'</div>'+
          '<div class="st-badge-j">'+bd[q].jours+' j ✓</div></div>';
      }
      h+=titreSection("🏅 Challenges réussis","var(--gold)")+
        '<div class="st-grid3">'+chips+'</div>';
    })();
    function tro(T){
      return '<div class="st-tro'+(T.cond?" on":"")+'">'+
        '<div class="st-tro-i">'+T.icon+'</div>'+
        '<div class="st-tro-n">'+T.name+'</div>'+
        '<div class="st-tro-d">'+(T.cond?"✓ DÉBLOQUÉ":T.desc)+'</div></div>';
    }
    var gagnes="",restants="",nG=0,nR=0;
    for(var tr=0;tr<TROPHIES.length;tr++){
      if(TROPHIES[tr].cond){gagnes+=tro(TROPHIES[tr]);nG++;}
      else{restants+=tro(TROPHIES[tr]);nR++;}
    }
    h+=titreSection("🏆 Trophées"+(nG?" · "+nG+"/"+TROPHIES.length:""),"var(--gold)");
    if(nG)h+='<div class="st-grid2">'+gagnes+'</div>';
    else h+='<div class="st-note" style="margin-bottom:10px">Aucun trophée débloqué pour l\'instant — le premier tombe à 7 jours d\'affilée.</div>';
    if(nR)h+='<details class="st-det"><summary>Voir les '+nR+' trophées à débloquer</summary>'+
      '<div class="st-grid2" style="margin-top:10px">'+restants+'</div></details>';
    h+='<div style="height:14px"></div>';
  })();

  return h+'</div>';
}

// 📄 RAPPORT SIMPLE — UNE page, pour le client.
// Le rapport complet fait 3 pages : 4 KPI, 3 courbes, un tableau jour par
// jour, les bilans du dimanche. Une cliente l'a résumé ainsi : « c'est trop
// compliqué, c'est pas super clair pour moi ». Elle a raison — ce document
// était fait pour le coach, pas pour elle.
// Ici : un verdict en une phrase, trois chiffres, ce qui marche, ce qui
// coince, et UNE action pour la semaine. Rien d'autre.
function openRapportSimple(name,start,period,dataOverride){
  var allData=dataOverride||getAllData();
  var t90=start?getToday90(start):89;
  // FENÊTRE GLISSANTE : les `period` DERNIERS jours, pas les premiers.
  // Le rapport détaillé est cumulatif depuis le début du programme ; pour un
  // envoi hebdomadaire c'est trompeur — au jour 14, un « rapport 7 jours »
  // montrait la première semaine, celle que la cliente a déjà lue. Ici on
  // regarde la période écoulée, ce qui rend la comparaison possible.
  var fin=Math.min(t90,89);
  var deb=Math.max(0,fin-period+1);
  var jours=[],remplis=0,scores=[],poids=[],somm=[];
  for(var i=deb;i<=fin;i++){
    var d=allData[i]||{};
    var rempli=!!(d.habits&&Object.keys(d.habits).length);
    if(rempli)remplis++;
    jours.push(d);
    if(d.score!=null)scores.push(d.score);
    if(d.poids!=null&&d.poids!=="")poids.push(parseFloat(d.poids));
    if(d.sommeilH)somm.push(parseFloat(d.sommeilH));
  }
  var nbJours=fin-deb+1;
  var assidu=nbJours?Math.round(remplis/nbJours*100):0;

  // ⚖️ LE POIDS. « Depuis le départ » doit partir du VRAI départ — le premier
  // poids du programme — et non du premier poids de la fenêtre. Sinon le même
  // client lit « −2 kg » sur son rapport 7 jours et « −4 kg » sur son 30 jours
  // alors qu'il a perdu 3 kg : deux chiffres faux pour une seule réalité.
  var pDepart=null,pActuel=null;
  for(var pd=0;pd<=fin;pd++){
    var dv=allData[pd]||{};
    if(dv.poids!=null&&dv.poids!==""){
      var vv=parseFloat(dv.poids);
      if(!isNaN(vv)){ if(pDepart===null)pDepart=vv; pActuel=vv; }
    }
  }
  var dPoids=(pDepart!=null&&pActuel!=null&&pDepart!==pActuel)?Math.round((pActuel-pDepart)*10)/10:
             (pDepart!=null&&pActuel!=null?0:null);
  // Et séparément, ce qui a bougé SUR LA PÉRIODE : c'est l'information utile
  // pour un bilan hebdomadaire, mais elle ne doit pas usurper le mot « départ ».
  var dPeriode=(poids.length>=2)?Math.round((poids[poids.length-1]-poids[0])*10)/10:null;
  // Garde-fou : une nuit se situe entre 2 et 14 heures. Une saisie hors de
  // ces bornes est une faute de frappe (« 63 » pour 6,3) — l'inclure faussait
  // la moyenne et affichait « 63 heures de sommeil / nuit » sur le rapport.
  var sommOk=[];
  for(var sx=0;sx<somm.length;sx++){if(somm[sx]>=2&&somm[sx]<=14)sommOk.push(somm[sx]);}
  var moySom=sommOk.length?Math.round(sommOk.reduce(function(a,b){return a+b;},0)/sommOk.length*10)/10:null;

  // 📊 COMPARAISON AVEC LA PÉRIODE PRÉCÉDENTE.
  // Un rapport isolé ne dit pas si la personne a rectifié. Celui-ci compare
  // la même durée juste avant : c'est là qu'on voit si le conseil de la
  // dernière fois a été suivi.
  var prevA=deb-period, prevB=deb-1;
  var pRemplis=0,pNb=0,pSomm=[];
  if(prevA>=0){
    for(var q=prevA;q<=prevB;q++){
      var dq=allData[q]||{}; pNb++;
      if(dq.habits&&Object.keys(dq.habits).length)pRemplis++;
      if(dq.sommeilH){var v=parseFloat(dq.sommeilH);if(v>=2&&v<=14)pSomm.push(v);}
    }
  }
  var prevAssidu=pNb?Math.round(pRemplis/pNb*100):null;
  var deltaAssidu=(prevAssidu!=null)?assidu-prevAssidu:null;

  // Habitudes : la meilleure et la plus faible. Deux lignes suffisent —
  // dire à quelqu'un que sept choses vont mal ne l'aide pas à en corriger une.
  var comptes={};
  for(var h2=0;h2<HABITS.length;h2++)comptes[HABITS[h2].id]={n:0,lab:HABITS[h2].label||HABITS[h2].id,e:HABITS[h2].emoji||""};
  for(var j=0;j<jours.length;j++){
    var hb=(jours[j].habits)||{};
    for(var k in hb){if(comptes[k]&&hb[k])comptes[k].n++;}
  }
  var liste=[], piliers=[];
  for(var c in comptes){
    // Les compléments sont facultatifs : ne pas les prendre n'est pas un
    // manque de discipline. Les compter comme « ce qui traîne » désignait
    // un faux coupable et détournait l'attention du vrai sujet.
    if(HABITS_FACULT[c])continue;
    var it={id:c,n:comptes[c].n,lab:comptes[c].lab,e:comptes[c].e,
            pct:nbJours?Math.round(comptes[c].n/nbJours*100):0,
            pilier:!!HABITS_PILIERS[c], equilibre:!!HABITS_EQUILIBRE[c]};
    liste.push(it);
    if(it.pilier)piliers.push(it);
  }
  liste.sort(function(a,b){return b.n-a.n;});
  piliers.sort(function(a,b){return b.n-a.n;});
  var top=liste[0]||null, bas=liste[liste.length-1]||null;
  // Le SCORE DES PILIERS : c'est lui qui dit si la transformation est en route.
  var scorePil=null;
  if(piliers.length){
    var sp=0;
    for(var sp2=0;sp2<piliers.length;sp2++)sp+=piliers[sp2].pct;
    scorePil=Math.round(sp/piliers.length);
  }
  // Combien de piliers sont réellement décrochés
  var pilFaibles=[];
  for(var pf=0;pf<piliers.length;pf++){if(piliers[pf].pct<66)pilFaibles.push(piliers[pf]);}

  // 🔄 LES DEUX BOUCLES.
  // Vertueuse : ce qui lui fait gagner des points, tenu au moins 2 jours sur 3.
  // D'échec : ce qui la fait perdre, sous un jour sur deux. Nommer les deux
  // côte à côte montre que la solution est déjà dans sa journée — il s'agit
  // d'étendre ce qui marche, pas de tout reprendre à zéro.
  var vertu=[], echec=[];
  for(var b2=0;b2<liste.length;b2++){
    var it2=liste[b2];
    if(it2.pct>=66){vertu.push(it2);continue;}
    // Seuls les PILIERS entrent dans la boucle d'échec. Reprocher « travail
    // 29 % » à quelqu'un qui ne coche pas cette case le week-end noie le vrai
    // sujet — et le vrai sujet, c'est toujours le sport et la nutrition.
    // Pour un pilier, le seuil est celui de la boucle vertueuse : tenu moins
    // de deux jours sur trois, il ne construit rien. Sans ce réglage, un sport
    // à 50 % n'apparaissait NULLE PART — ni tenu, ni décroché.
    if(it2.pilier)echec.push(it2);
  }
  echec.sort(function(a,b){return a.pct-b.pct;});

  // Le verdict : une phrase, choisie sur l'assiduité, qui dit quoi penser.
  // 🎯 LE VERDICT croise DEUX choses : la présence (assiduité) et le CONTENU
  // (les piliers). Ouvrir l'appli tous les jours sans cocher sport ni
  // nutrition n'est pas « tenir son programme » — et le féliciter pour ça,
  // c'est le laisser continuer jusqu'à ce qu'il constate, trois semaines plus
  // tard, que rien n'a bougé. Un compliment donné trop tôt coûte cher.
  // 🎯 LE VERDICT se juge sur le NOMBRE de piliers décrochés, pas sur leur
  // moyenne. Leila avait 61 % de moyenne — donc « pas si mal » — alors que
  // trois piliers sur quatre étaient sous la barre : la moyenne était tirée
  // par l'hydratation à 86 % et masquait le reste. Compter les piliers KO
  // ne se laisse pas berner par une case facile qui compense les autres.
  var verdict,vcoul,vemo,salut;
  var nbPil=piliers.length, pilKO=pilFaibles.length;
  if(nbPil&&pilKO===0&&assidu>=85){
    verdict="Tu tiens ton programme, et tu coches les cases qui comptent. C'est exactement ce qui fait la différence sur la durée.";
    vcoul="#2FBF71";vemo="🔥";salut="Bravo";
  }else if(nbPil&&pilKO===0&&assidu>=65){
    verdict="Tous tes piliers sont tenus. Encore un cran de régularité dans le suivi et les résultats vont s'accélérer.";
    vcoul="#2FBF71";vemo="💪";salut="Bien joué";
  }else if(nbPil&&pilKO===1&&assidu>=65){
    // Un seul pilier qui traîne : on peut féliciter, mais on nomme la case.
    verdict="Tu tiens presque tout. Il reste « "+pilFaibles[0].lab+" » — c'est la seule case qui manque pour que ça avance vraiment.";
    vcoul="#5B8FC7";vemo="🎯";salut="Bien parti";
  }else if(pilKO>=2&&assidu>=80){
    // LE cas de Leila : présente tous les jours, piliers vides.
    verdict="Tu es là tous les jours, et ça compte vraiment. Mais "+pilKO+" piliers sur "+nbPil+" ne suivent pas — et sans eux, la transformation ne peut pas démarrer.";
    vcoul="#E0A03C";vemo="🎯";salut="On fait le point,";
  }else if(pilKO>=2&&assidu>=50){
    verdict=pilKO+" piliers sur "+nbPil+" décrochent. Ce n'est pas une question de volonté : c'est le programme qu'il faut réajuster ensemble.";
    vcoul="#E0A03C";vemo="⚠️";salut="On fait le point,";
  }else if(assidu>=50){
    verdict="La base est là, mais il manque de la régularité. C'est elle qui fait le résultat, pas l'intensité.";
    vcoul="#E0A03C";vemo="⚠️";salut="On fait le point,";
  }else{
    verdict="Le programme n'a pas encore trouvé sa place dans ton quotidien. On va simplifier ensemble — mieux vaut deux cases tenues que six abandonnées.";

function openRapport(name,start,period,dataOverride){
  var allData=dataOverride||getAllData();
  var series=computeSeries(allData,period);
  var d0=new Date(start), d1=new Date(d0);d1.setDate(d1.getDate()+period-1);

  var filled=series.filter(function(s){return s.score!=null;});
  var avgScore=avgOf(series,"score")||0, avgMental=avgOf(series,"mental")||0;

  var mc=avgMental>=75?"var(--ok)":avgMental>=50?"var(--warn)":R;

  function spark(key,color){
    var vals=series.map(function(s){return s[key];});
    return svgLineChart(vals,color,{width:300,height:70});
  }

  var habCounts=[];
  for(var hb=0;hb<HABITS.length;hb++){
    var hab=HABITS[hb], cnt=0;
    for(var i=0;i<period;i++){
      var dd=allData[i];
      if(dd&&dd.habits&&dd.habits[hab.id])cnt++;
    }
    habCounts.push({icon:hab.icon,label:hab.label,val:cnt,color:hab.color});

;text-transform:uppercase}.bi{margin-bottom:5px}.bk{font-size:11px;color:var(--mute);font-weight:700;text-transform:uppercase;margin-bottom:2px}.bt{font-size:12px;color:#333;line-height:1.5}.ftr{background:var(--ink);padding:20px;text-align:center;margin-top:14px}.fm{color:var(--mute);font-size:11px;line-height:1.8}.fs{color:#fff;font-weight:900;font-size:13px;margin-top:8px}@media print{body{background:#fff}}";

  var html="<!DOCTYPE html><html lang='fr'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Rapport J"+period+" — "+esc(name)+"</title><style>"+themeCSS()+css+"</style></head><body><div id='rapbar' style='position:sticky;top:0;z-index:999;background:var(--ink);padding:9px 10px;display:flex;gap:7px'><button onclick='rapShare()' style='flex:1;background:var(--brand2);color:#fff;border:0;border-radius:9px;padding:11px 6px;font-weight:800;font-size:13px'>📤 Partager</button><button onclick='rapPdf()' style='flex:1;background:var(--gold);color:#fff;border:0;border-radius:9px;padding:11px 6px;font-weight:800;font-size:13px'>🖨️ PDF</button><button onclick='window.close();setTimeout(function(){if(history.length>1)history.back();},250)' style='background:#333;color:#fff;border:0;border-radius:9px;padding:11px 13px;font-weight:800;font-size:13px'>✕</button></div><div class='pg'>";
  html+="<div class='hdr'><div class='brand'><div class='b' style='background:var(--brand)'></div>AM Coach Genève<div class='b' style='background:var(--brand2)'></div></div><div class='sub'>TransfoPhysique · Rapport J"+period+"</div></div>";
  html+="<div class='hero'><div class='hn'>"+esc(name)+"</div><div class='hs'>"+period+" jours de transformation</div><div class='hd'>"+fmt(d0)+" → "+fmt(d1)+"</div></div>";
  html+="<div class='kg'>";
  html+="<div class='kpi'><div class='kv' style='color:"+sc+"'>"+avgScore+"%</div><div class='kl'>Score moyen</div></div>";

  html+="<div class='kpi'><div class='kv' style='color:var(--brand)'>"+filled.length+"<span style='font-size:13px'>/"+period+"</span></div><div class='kl'>Jours remplis</div></div></div>";
  html+="<div class='sec'><div class='st'><div class='sb' style='background:var(--brand)'></div><span class='sl'>Courbes de progression</span></div>";
  html+="<div class='ch'><div class='ct'>Score global</div>"+spark("score","var(--brand)")+"</div>";
  html+="<div class='ch'><div class='ct'>Ressenti mental</div>"+spark("mental","var(--brand2)")+"</div>";
  if(pv.length>=2)html+="<div class='ch'><div class='ct'>Poids (kg)</div>"+spark("poids","#555")+"</div>";
  html+="</div><div class='sec'><div class='st'><div class='sb' style='background:var(--brand2)'></div><span class='sl'>Habitudes sur "+period+" jours</span></div><div class='hg'>";
  for(var hc=0;hc<habCounts.length;hc++){
    var hh=habCounts[hc];
    html+="<div class='hc'><div class='hi'>"+hh.icon+"</div><div><div class='hnm'>"+hh.label+"</div><div class='hv' style='color:"+hh.color+"'>"+hh.val+"/"+period+"j</div></div></div>";
  }
  html+="</div></div>";
  // 🔁 BOUCLES VERTUEUSES / D'ÉCHEC
  var loops=computeLoops(allData,period);
  var loopsBlock=loopsHTML(loops,false);

    html+="<div class='sec'><div class='st'><div class='sb' style='background:var(--ok-d)'></div><span class='sl'>\ud83d\udd01 Tes boucles \u2014 ce que tes "+period+" jours racontent</span></div>"+loopsBlock+"</div>";
  }
  // MINDSET RÉCAP
  var fiers=[],positifs=[],negatifs=[];
  for(var mi2=0;mi2<period;mi2++){
    var dm=allData[mi2];
    if(dm&&dm.mindset){
      if(dm.mindset.fier)fiers.push({d:mi2+1,t:dm.mindset.fier});
      if(dm.mindset.positif)positifs.push({d:mi2+1,t:dm.mindset.positif});
      if(dm.mindset.negatif)negatifs.push({d:mi2+1,t:dm.mindset.negatif});
    }
  }
  if(fiers.length||positifs.length||negatifs.length){
    html+="<div class='sec'><div class='st'><div class='sb' style='background:var(--violet)'></div><span class='sl'>🧠 Mindset — ce qui revient</span></div>";
    function msBlock(title,color,items){
      if(!items.length)return "";

    html+="<div class='ch' style='background:#FFF8F0'><div style='font-size:11px;color:#B45309;font-weight:700;line-height:1.7'>💡 Relis la colonne négative : ce qui revient 3 fois ou plus est un pattern. C\'est là qu\'on agit le mois prochain.</div></div>";
    html+="</div>";

  if(bilans.length){

      if(bb.bilan.blocage)html+="<div class='bi'><div class='bk'>🤛 Difficulté</div><div class='bt'>"+esc(bb.bilan.blocage)+"</div></div>";
      if(bb.bilan.ressenti)html+="<div class='bi'><div class='bk'>💬 Ressenti</div><div class='bt'>"+esc(bb.bilan.ressenti)+"</div></div>";

    (p1!=null?"Poids : "+p1+" kg"+(dp!=null?" ("+(dp>0?"+":"")+dp+" kg)":"")+"\n":"")+
    "— AM Coach Genève";
  html+="<script>"+
    "var RESUME="+JSON.stringify(resume)+";"+
