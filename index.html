// L'onglet Sport a remplacé l'ancien onglet Entraînements : on garde le nom
// d'origine comme alias, pour qu'un état enregistré « training » continue de
// tomber sur la bonne vue.
function viewTraining(name,start){return viewSport(name,start);}

// ═══════════ 🏋️ ONGLET SPORT — LES DEUX MINUTEURS ═══════════
// Deux problèmes très différents à régler, et une solution pour chacun.
//
// 1) LE TEMPS QUI DÉRIVE. Un setInterval qui décrémente une variable se fige
//    dès que le téléphone se verrouille ou qu'on passe sur une autre appli :
//    au retour, le minuteur a « perdu » les minutes écoulées. Ici RIEN ne se
//    décrémente. On note l'heure de départ une fois pour toutes et on
//    RECALCULE la position à chaque rafraîchissement. Écran éteint dix
//    minutes, appel entrant, changement d'onglet : au retour l'affichage est
//    juste à la seconde près.
//
// 2) LE SON QUI DOIT SONNER PENDANT QUE JAVASCRIPT DORT. C'est le vrai
//    verrou. On ne joue donc pas les bips « au moment venu » : toute la
//    séance est PROGRAMMÉE D'AVANCE sur l'horloge audio, qui continue de
//    tourner quand le navigateur gèle les minuteurs. Une boucle inaudible
//    garde la session audio ouverte, sinon iOS la ferme dès l'écran éteint.
//
// LE BASCULEMENT EST AUTOMATIQUE. Sur iPhone, garder la musique ET sonner
// écran verrouillé s'excluent : c'est la catégorie de session audio qui
// tranche. Plus de réglage à comprendre — tant que l'écran est allumé on
// reste en mode « mixé » (la musique continue, les bips passent par-dessus),
// et à la seconde où le client quitte l'appli ou verrouille, on bascule en
// mode arrière-plan pour que les bips continuent. Au retour, on remixe.

var SPT = { ctx: null, keep: null, wake: null, sources: [], iv: null, run: null, mode: "musique" };
var SPT_PRESETS = [
  { k: "tabata", nom: "Tabata", prep: 10, effort: 20, repos: 10, tours: 8, series: 1, rserie: 60 },
  { k: "3030", nom: "30 / 30", prep: 10, effort: 30, repos: 30, tours: 10, series: 1, rserie: 60 },
  { k: "4020", nom: "40 / 20", prep: 10, effort: 40, repos: 20, tours: 8, series: 1, rserie: 60 },
  { k: "4515", nom: "45 / 15", prep: 10, effort: 45, repos: 15, tours: 10, series: 1, rserie: 60 },
  { k: "emom", nom: "EMOM", prep: 10, effort: 60, repos: 0, tours: 10, series: 1, rserie: 60 }
];
// Couleurs néon : chaque phase se reconnaît à trois mètres, en sueur.
var SPT_PHASES = {
  prep: { nom: "Préparation", col: "#E9A23B" },
  effort: { nom: "EFFORT", col: "#12C98A" },
  repos: { nom: "Repos", col: "#12B5EA" },
  serie: { nom: "Repos de série", col: "#8A3FFF" },
  cycle: { nom: "En cours", col: "#12C98A" }
};

function sptCfg() {
  var d = { prep: 10, effort: 30, repos: 30, tours: 8, series: 1, rserie: 60, dur: 300, cycle: 30 };
  var c = lsGet("amcoach_sport_" + CLIENT, null) || {};
  for (var k in d) if (c[k] !== undefined && c[k] !== null) d[k] = c[k];
  return d;
}
function sptCfgSet(c) { lsSet("amcoach_sport_" + CLIENT, c); }

// ─── Audio : contexte, boucle de maintien, bips programmés ───
function sptCtx(mode) {
  SPT.mode = mode || SPT.mode;
  try {
    // "transient" = se mixe par-dessus la musique, qui baisse le temps du bip.
    // "playback"  = sonne écran verrouillé, mais prend la main sur la musique.
    if (navigator.audioSession) navigator.audioSession.type = (SPT.mode === "verrou" ? "playback" : "transient");
  } catch (e) { }
  if (!SPT.ctx) SPT.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (SPT.ctx.state === "suspended") SPT.ctx.resume();
  return SPT.ctx;
}
function sptKeepAlive(on) {
  try {
    if (!on) { if (SPT.keep) { try { SPT.keep.stop(); } catch (e) { } SPT.keep = null; } return; }
    if (SPT.keep) return;
    var ctx = sptCtx();
    var buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (i % 2 ? 1 : -1) * 0.00002; // très en dessous du seuil audible
    var s = ctx.createBufferSource(); s.buffer = buf; s.loop = true;
    s.connect(ctx.destination); s.start();
    SPT.keep = s;
  } catch (e) { }
}
function sptWake(on) {
  try {
    if (!on) { if (SPT.wake) { try { SPT.wake.release(); } catch (e) { } SPT.wake = null; } return; }
    if (!navigator.wakeLock || SPT.wake) return;
    navigator.wakeLock.request("screen").then(function (w) { SPT.wake = w; }).catch(function () { });
  } catch (e) { }
}
function sptBip(quand, freq, duree, vol, forme) {
  try {
    var ctx = SPT.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq; o.type = forme || "sine";
    g.gain.setValueAtTime(0.0001, quand);
    g.gain.exponentialRampToValueAtTime(vol, quand + 0.015);
    g.gain.setValueAtTime(vol, quand + duree * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, quand + duree);
    o.start(quand); o.stop(quand + duree + 0.03);
    SPT.sources.push(o);
  } catch (e) { }
}

function sptGong(quand, vol) {
  try {
    var ctx = SPT.ctx;
    var f0 = 1040, V = (vol == null ? 1 : vol);
    // [rapport de fréquence, niveau, durée de traîne]
    var modes = [[1, 1.00, 1.55], [1.52, 0.70, 1.25], [2.01, 0.55, 1.00],
                 [2.68, 0.42, 0.70], [3.42, 0.30, 0.50], [4.55, 0.20, 0.34],
                 [5.90, 0.13, 0.24], [0.50, 0.34, 1.70]];
    var bus = ctx.createGain();
    bus.gain.value = V * 0.9;
    bus.connect(ctx.destination);
    for (var i = 0; i < modes.length; i++) {
      var m = modes[i];
      // Deux oscillateurs par partiel, désaccordés de quelques hertz : c'est
      // ce battement lent qui distingue une cloche d'un simple sifflement.
      for (var j = 0; j < 2; j++) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine";
        var f = f0 * m[0] * (j ? 1.0035 : 1);
        o.frequency.setValueAtTime(f * 1.006, quand);
        o.frequency.exponentialRampToValueAtTime(f, quand + 0.05);
        g.gain.setValueAtTime(0.0001, quand);
        g.gain.exponentialRampToValueAtTime(m[1] * 0.30, quand + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, quand + m[2]);
        o.connect(g); g.connect(bus);
        o.start(quand); o.stop(quand + m[2] + 0.05);
        SPT.sources.push(o);
      }
    }
    // La frappe du marteau sur le laiton : bruit très court, filtré très haut.
    var n = ctx.createBufferSource(), buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.035), ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / d.length, 2);
    n.buffer = buf;
    var nf = ctx.createBiquadFilter(); nf.type = "bandpass"; nf.frequency.value = 4800; nf.Q.value = 0.9;
    var ng = ctx.createGain(); ng.gain.value = 0.45;
    n.connect(nf); nf.connect(ng); ng.connect(bus);
    n.start(quand); n.stop(quand + 0.05);
    SPT.sources.push(n);
  } catch (e) { }
}
// Trois coups de gong — le signal de fin de round.
function sptGong3(quand, vol) {
  for (var i = 0; i < 3; i++) sptGong(quand + i * 0.55, vol);
}
function sptVider() {
  for (var i = 0; i < SPT.sources.length; i++) { try { SPT.sources[i].stop(); } catch (e) { } }
  SPT.sources = [];
}
// Programme TOUTE la séance d'un coup, à partir de la seconde `depuis`.
function sptProgrammer(plan, depuis) {
  var ctx = sptCtx(), a0 = ctx.currentTime + 0.08, pos = 0, n = 0, i, c;
  sptVider();
  for (i = 0; i < plan.length; i++) {
    var seg = plan[i], fin = pos + seg.d, suiv = plan[i + 1];
    for (c = 3; c >= 1; c--) {                       // décompte des 3 dernières secondes
      var tc = fin - c;
      if (tc > depuis && seg.d > 4 && n < 700) { sptBip(a0 + (tc - depuis), 880, 0.08, 0.22, "sine"); n++; }
    }
    if (fin > depuis && n < 700) {
      if (suiv) {
        // 🥊 Comme sur un vrai ring : la cloche marque la FIN DU ROUND et le
        // DÉBUT du suivant. Donc elle sonne à chaque fois qu'un effort se
        // termine, et à chaque fois qu'un effort commence. Le bip ne reste
        // que pour les bascules qui ne concernent pas un round (repos entre
        // deux séries, par exemple).
        var cloche = (seg.t === "effort") || (suiv.t === "effort");
        if (cloche) sptGong(a0 + (fin - depuis), 1.1);
        else sptBip(a0 + (fin - depuis), 640, 0.32, 0.5, "square");
      }
      n++;
    }
    pos = fin;
  }
  if (pos > depuis) {
    // 🥊 Fin de séance : le gong de boxe, trois coups, fort. C'est le seul
    // son qu'on entend à l'autre bout d'une salle, casque sur les oreilles.
    sptGong3(a0 + (pos - depuis), 1.5);
  }
  return ctx;
}
// Bascule automatique quand le client quitte l'écran ou verrouille.
function sptModeAuto(cache) {
  if (!SPT.run || SPT.run.pause != null) return;
  var voulu = cache ? "verrou" : "musique";
  if (SPT.mode === voulu) return;
  sptCtx(voulu);
  if (cache) sptKeepAlive(true);   // la boucle inaudible tient la session ouverte
}

// ─── Construction des séances ───
function sptPlanIntervalles(c) {
  var plan = [], s, t;
  if (c.prep > 0) plan.push({ t: "prep", d: c.prep, tour: 0, serie: 1 });
  for (s = 1; s <= c.series; s++) {
    for (t = 1; t <= c.tours; t++) {
      plan.push({ t: "effort", d: c.effort, tour: t, serie: s });
      var dernier = (s === c.series && t === c.tours);
      if (!dernier && c.repos > 0) plan.push({ t: "repos", d: c.repos, tour: t, serie: s });
    }
    if (s < c.series && c.rserie > 0) plan.push({ t: "serie", d: c.rserie, tour: c.tours, serie: s });
  }
  return plan;
}
function sptPlanBips(total, cycle) {          // le minuteur du mode 14 jours
  var plan = [], reste = total, n = 1;
  while (reste > 0) { var d = Math.min(cycle, reste); plan.push({ t: "cycle", d: d, tour: n++, serie: 1 }); reste -= d; }
  return plan;
}
function sptTotal(plan) { var t = 0; for (var i = 0; i < plan.length; i++) t += plan[i].d; return t; }
function sptFmt(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }

// ─── Position : recalculée depuis l'heure de départ, jamais décrémentée ───
function sptPosition(run) {
  var e = run.pause != null ? run.pause : (Date.now() - run.t0) / 1000;
  if (e < 0) e = 0;
  var pos = 0;
  for (var i = 0; i < run.plan.length; i++) {
    var seg = run.plan[i];
    if (e < pos + seg.d) return { i: i, seg: seg, reste: Math.ceil(pos + seg.d - e), passe: e - pos, e: e, fini: false };
    pos += seg.d;
  }
  return { i: run.plan.length - 1, seg: run.plan[run.plan.length - 1] || { t: "cycle", d: 1 }, reste: 0, passe: 0, e: e, fini: true };
}

// ─── Démarrage / pause / arrêt ───
function sptDemarrer(plan, type) {
  sptArreter(true);
  SPT.run = { plan: plan, type: type, t0: Date.now(), pause: null, total: sptTotal(plan) };
  lsSet("amcoach_sptrun_" + CLIENT, SPT.run);
  sptModeAuto(document.visibilityState !== "visible");
  sptProgrammer(plan, 0);
  sptKeepAlive(true);
  sptWake(true);
  try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) { }
  sptBoucle();
}
function sptReprendre() {
  if (!SPT.run || SPT.run.pause == null) return;
  var depuis = SPT.run.pause;
  SPT.run.t0 = Date.now() - depuis * 1000;
  SPT.run.pause = null;
  lsSet("amcoach_sptrun_" + CLIENT, SPT.run);
  sptProgrammer(SPT.run.plan, depuis);
  sptKeepAlive(true);
  sptWake(true);
  sptBoucle();
}
function sptPause() {
  if (!SPT.run || SPT.run.pause != null) return;
  SPT.run.pause = (Date.now() - SPT.run.t0) / 1000;
  lsSet("amcoach_sptrun_" + CLIENT, SPT.run);
  sptVider(); sptWake(false);
  sptAfficher();
}
function sptArreter(silencieux) {
  sptVider(); sptKeepAlive(false); sptWake(false);
  if (SPT.iv) { clearInterval(SPT.iv); SPT.iv = null; }
  SPT.run = null;
  try { localStorage.removeItem("amcoach_sptrun_" + CLIENT); } catch (e) { }
  if (!silencieux) sptAfficher();
}
function sptBoucle() {
  if (SPT.iv) clearInterval(SPT.iv);
  SPT.iv = setInterval(sptAfficher, 240);
  sptAfficher();
}
// Reprise après un rechargement de page ou un retour d'arrière-plan
function sptRestaurer() {
  var r = lsGet("amcoach_sptrun_" + CLIENT, null);
  if (!r || !r.plan) return;
  SPT.run = r;
  if (r.pause != null) { sptAfficher(); return; }
  var p = sptPosition(r);
  if (p.fini) { sptArreter(true); return; }
  sptProgrammer(r.plan, p.e);   // on reprogramme ce qui reste à sonner
  sptKeepAlive(true);
  sptBoucle();
}

// ─── Affichage (mise à jour ciblée, jamais de re-render) ───
function sptAfficher() {
  var min = document.getElementById("spt-time");
  if (!min) { if (SPT.iv) { clearInterval(SPT.iv); SPT.iv = null; } return; }
  var run = SPT.run;
  var ph = document.getElementById("spt-phase"), tr = document.getElementById("spt-tour"),
    tt = document.getElementById("spt-reste"), ring = document.getElementById("spt-ring"),
    dot = document.getElementById("spt-dot"), go = document.getElementById("spt-go"),
    zone = document.getElementById("spt-zone");
  // Dans une séance, le minuteur est une simple barre en bas d'écran : elle
  // n'apparaît que pendant un repos et disparaît dès qu'il est fini.
  var mini = !!(zone && zone.className.indexOf("prg-rest") >= 0);
  function barre(on) { if (mini) zone.className = "prg-rest" + (on ? " on" : ""); }
  function peindre(col, pct) {
    if (ring) {
      ring.setAttribute("stroke-dasharray", pct + " 100");
      ring.setAttribute("stroke", col);
    }
    if (dot) {
      dot.setAttribute("stroke", col);
      dot.setAttribute("stroke-dashoffset", String(-pct));
      dot.style.opacity = pct > 0 ? "1" : "0";
    }
    if (min) min.style.filter = "";
    if (zone) {
      zone.style.borderColor = col;
      zone.style.boxShadow = "0 0 0 3px " + col + "1F, 0 3px 14px rgba(16,24,40,.06)";
    }
  }
  if (!run) {
    var c0 = sptCfg(), p0 = sptPlanIntervalles(c0);
    min.textContent = sptFmt(c0.prep > 0 ? c0.prep : c0.effort);
    ph.textContent = "Prêt"; ph.setAttribute("fill", "#E9A23B");
    tr.textContent = c0.tours + " tours" + (c0.series > 1 ? " × " + c0.series + " séries" : "");
    tt.textContent = "Séance de " + sptFmt(sptTotal(p0));
    peindre("#8A3FFF", 0);
    if (go) { go.textContent = "▶ DÉMARRER"; go.className = "spt-go"; }
    barre(false);
    return;
  }
  var p = sptPosition(run);
  if (p.fini) {
    min.textContent = "0:00";
    ph.textContent = "TERMINÉ 💪"; ph.setAttribute("fill", "#12C98A");
    tt.textContent = "Séance bouclée — " + sptFmt(run.total);
    peindre("#12C98A", 100);
    if (go) { go.textContent = "↻ RECOMMENCER"; go.className = "spt-go ok"; }
    barre(false);
    if (SPT.iv) { clearInterval(SPT.iv); SPT.iv = null; }
    sptKeepAlive(false); sptWake(false);
    try { localStorage.removeItem("amcoach_sptrun_" + CLIENT); } catch (e) { }
    SPT.run = null;
    return;
  }
  var inf = SPT_PHASES[p.seg.t] || SPT_PHASES.cycle, pause = run.pause != null;
  min.textContent = sptFmt(p.reste);
  ph.textContent = pause ? "EN PAUSE" : inf.nom;
  ph.setAttribute("fill", pause ? "#E9A23B" : inf.col);
  tr.textContent = run.type === "bips"
    ? "Bip " + p.seg.tour + " · toutes les " + p.seg.d + " s"
    : (p.seg.t === "prep" ? "Ça commence" : "Tour " + p.seg.tour + "/" + sptNbTours(run.plan) + (sptNbSeries(run.plan) > 1 ? " · série " + p.seg.serie + "/" + sptNbSeries(run.plan) : ""));
  tt.textContent = "Reste " + sptFmt(run.total - p.e) + " sur " + sptFmt(run.total);
  peindre(pause ? "#E9A23B" : inf.col, Math.round((p.passe / p.seg.d) * 100));
  if (go) { go.textContent = pause ? "▶" : "❙❙"; go.className = mini ? "prg-rest-b" : (pause ? "spt-go ok" : "spt-go pause"); }
  if (!mini && go) go.textContent = pause ? "▶ REPRENDRE" : "❙❙ PAUSE";
  barre(true);
}
function sptNbTours(plan) { var m = 0; for (var i = 0; i < plan.length; i++) if (plan[i].t === "effort" && plan[i].tour > m) m = plan[i].tour; return m || 1; }
function sptNbSeries(plan) { var m = 0; for (var i = 0; i < plan.length; i++) if (plan[i].serie > m) m = plan[i].serie; return m || 1; }

// ═══════════ VUE SPORT ═══════════
function viewSport(name, start) {
  var c = sptCfg();

function bindSport() {
  try { chrCharger(); bindChrono(); } catch (e) { }
  function maj(k, v) { var cc = sptCfg(); cc[k] = v; sptCfgSet(cc); }
  function lire() {
    var cc = sptCfg();
    [["spt-prep", "prep", 0, 120], ["spt-effort", "effort", 5, 600], ["spt-repos", "repos", 0, 600],
    ["spt-tours", "tours", 1, 60], ["spt-series", "series", 1, 20], ["spt-rserie", "rserie", 0, 900]].forEach(function (f) {
      var el = document.getElementById(f[0]);
      if (!el) return;
      var v = parseInt(el.value, 10);
      if (isNaN(v)) v = cc[f[1]];
      cc[f[1]] = Math.max(f[2], Math.min(f[3], v));
    });
    sptCfgSet(cc); return cc;
  }
  ["spt-prep", "spt-effort", "spt-repos", "spt-tours", "spt-series", "spt-rserie"].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener("change", function () { lire(); if (!SPT.run) sptAfficher(); });
  });
  var pres = document.querySelectorAll("[data-spt-preset]");
  for (var i = 0; i < pres.length; i++) pres[i].addEventListener("click", function () {
    var k = this.getAttribute("data-spt-preset"), cc = sptCfg();
    for (var j = 0; j < SPT_PRESETS.length; j++) {
      if (SPT_PRESETS[j].k === k) {
        var P = SPT_PRESETS[j];
        cc.prep = P.prep; cc.effort = P.effort; cc.repos = P.repos; cc.tours = P.tours; cc.series = P.series; cc.rserie = P.rserie;
      }
    }
    sptCfgSet(cc); sptArreter(true); render();
  });
  var durs = document.querySelectorAll("[data-spt-dur]");
  for (var d = 0; d < durs.length; d++) durs[d].addEventListener("click", function () {
    maj("dur", parseInt(this.getAttribute("data-spt-dur"), 10)); render();
  });
  var cyc = document.querySelectorAll("[data-spt-cycle]");
  for (var y = 0; y < cyc.length; y++) cyc[y].addEventListener("click", function () {
    maj("cycle", parseInt(this.getAttribute("data-spt-cycle"), 10)); render();
  });

  var mMoins = document.getElementById("p3-marche-moins"), mPlus = document.getElementById("p3-marche-plus");
  function majMarche(d) {
    var st = lsGetStr("amcoach_start_" + CLIENT);
    var jour = st ? getToday90(st) : 0;
    prog3MarcheAjout(d, jour);
    // ✅ Valider une marche coche l'habitude Sport du jour, comme le fait la
    // fin d'une séance : une heure de marche EST du sport, et le client n'a
    // pas à faire le travail deux fois. On ne décoche jamais l'inverse —
    // retirer une marche par erreur ne doit pas effacer sa journée.
    if (d > 0) {
      try {
        if (jour >= 0 && jour < 90) {
          var DJ = getAllData()[jour] || {};
          DJ.habits = DJ.habits || {};
          if (!DJ.habits.sport) { DJ.habits.sport = true; saveDay(jour, DJ); feedback("Marche validée · habitude Sport cochée", "ok"); }
        }
      } catch (e) { }
    }
    buzz(d > 0 ? "ok" : "tap");
    render();
  }
  if (mMoins) mMoins.addEventListener("click", function () { majMarche(-1); });
  if (mPlus) mPlus.addEventListener("click", function () { majMarche(1); });

  var runs = document.querySelectorAll("[data-prg-run]");
  for (var rr = 0; rr < runs.length; rr++) runs[rr].addEventListener("click", function () {
    state.progRun = this.getAttribute("data-prg-run");
    sptArreter(true);
    render();
  });

  var go = document.getElementById("spt-go");
  if (go) go.addEventListener("click", function () {
    var cc = lire();
    if (!SPT.run) { sptDemarrer(sptPlanIntervalles(cc), "intervalles"); return; }
    if (SPT.run.pause != null) sptReprendre(); else sptPause();
  });
  var stop = document.getElementById("spt-stop");
  if (stop) stop.addEventListener("click", function () { sptArreter(false); });
  var bips = document.getElementById("spt-bips");
  if (bips) bips.addEventListener("click", function () {
    var cc = sptCfg();
    sptDemarrer(sptPlanBips(cc.dur, cc.cycle), "bips");
    try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) { window.scrollTo(0, 0); }
  });

  // Sortie et retour d'écran : bascule audio automatique, puis recalage
  if (!window.__sptVis) {
    window.__sptVis = true;
    document.addEventListener("visibilitychange", function () {
      var cache = document.visibilityState !== "visible";
      sptModeAuto(cache);
      if (cache) return;
      if (SPT.run && SPT.run.pause == null) { sptWake(true); sptBoucle(); }
      else sptAfficher();
    });
  }
  sptRestaurer();
  sptAfficher();
}

function bibGet() {

    b = [];
    for (var i = 0; i < BIBLIO_BASE.length; i++) {

// Répercute une fiche d'exercice modifiée sur toutes les copies existantes.
// On ne touche QUE ce qui décrit l'exercice (nom, muscle, matériel, vidéo,
// image) — jamais les séries, le repos ou la note, qui appartiennent à la
// séance et non à l'exercice.
// Rapatrie les données de tous les clients depuis le serveur, puis exécute.
// Sans ça, toute propagation part d'un miroir local qui peut être vide.
function progClientsCharger(cb) {
  var cl = lsGet("amcoach_clients", []), reste = cl.length;
  if (!reste) { cb(); return; }
  var fini = false;
  // Filet de sécurité : si le réseau traîne, on applique quand même au bout
  // de 6 secondes sur ce qu'on a — mieux vaut une propagation partielle
  // qu'un bouton qui ne répond jamais.
  var minuteur = setTimeout(function () { if (!fini) { fini = true; cb(); } }, 6000);
  for (var i = 0; i < cl.length; i++) {
    coachLoadClient(cl[i].slug, true, function () {
      if (--reste <= 0 && !fini) { fini = true; clearTimeout(minuteur); cb(); }
    });
  }
}
// Réaligne la description des exercices d'une séance sur la bibliothèque.
// Ne touche ni les séries, ni le repos, ni la note : ils appartiennent à la
// séance. Renvoie true si quelque chose a bougé.
function seaRafraichir(S) {
  if (!S || !S.exos) return false;
  var b = bibGet(), chg = false;
  for (var i = 0; i < S.exos.length; i++) {
    var e = S.exos[i], X = null;
    for (var k = 0; k < b.length; k++) if (b[k].id === e.ref) X = b[k];
    if (!X) continue;
    if (e.n !== X.n || e.m !== X.m || e.mat !== X.mat || e.v !== X.v || e.g !== X.g) {
      e.n = X.n; e.m = X.m; e.mat = X.mat; e.v = X.v; e.g = X.g;
      chg = true;
    }
  }
  return chg;
}

function progResync() {
  var b = bibGet(), ids = {};
  for (var i = 0; i < b.length; i++) ids[b[i].id] = true;
  var nS = 0, nC = 0, orphelins = {}, l = seaGet();
  for (var k = 0; k < l.length; k++) {
    for (var e = 0; e < (l[k].exos || []).length; e++)
      if (!ids[l[k].exos[e].ref]) orphelins[l[k].exos[e].n || l[k].exos[e].ref] = true;
    if (seaRafraichir(l[k])) nS++;
  }
  seaSet(l);
  var cl = lsGet("amcoach_clients", []);
  for (var c = 0; c < cl.length; c++) {
    var brut = lsGet("amcoach_" + cl[c].slug, {});
    if (!brut || !Object.keys(brut).length) continue;
    var P = progGet(brut), chg = false;
    for (var z = 0; z < P.seances.length; z++) {
      // On repart de la séance type quand elle existe encore chez le coach :
      // c'est elle qui fait foi. Sinon on réaligne au moins les exercices.
      var T = seaTrouve(P.seances[z].id);
      if (T) {
        var copie = JSON.parse(JSON.stringify(T));
        seaRafraichir(copie);
        P.seances[z] = copie; chg = true;
      } else if (seaRafraichir(P.seances[z])) chg = true;
      for (var y = 0; y < (P.seances[z].exos || []).length; y++)
        if (!ids[P.seances[z].exos[y].ref]) orphelins[P.seances[z].exos[y].n || P.seances[z].exos[y].ref] = true;
    }
    if (chg) { progSetCoach(cl[c].slug, P); nC++; }
  }
  prog3Sync("h"); prog3Sync("f");
  return { seances: nS, clients: nC, orphelins: Object.keys(orphelins) };
}
function bibPropager(X) {
  if (!X || !X.id) return { seances: 0, clients: 0 };
  function majExo(e) {
    if (e.ref !== X.id) return false;
    e.n = X.n; e.m = X.m; e.mat = X.mat; e.v = X.v; e.g = X.g;
    return true;
  }
  var nS = 0, l = seaGet();
  for (var i = 0; i < l.length; i++) {
    var touche = false;
    for (var j = 0; j < (l[i].exos || []).length; j++) if (majExo(l[i].exos[j])) touche = true;
    if (touche) nS++;
  }
  if (nS) seaSet(l);
  var nC = 0, cl = lsGet("amcoach_clients", []);
  for (var c = 0; c < cl.length; c++) {
    var brut = lsGet("amcoach_" + cl[c].slug, {});
    // Dossier vide en local = données pas encore redescendues : on passe,
    // plutôt que d'écraser le vrai dossier par une version appauvrie.
    if (!brut || !Object.keys(brut).length) continue;
    var Pc = progGet(brut), chg = false;
    for (var k = 0; k < Pc.seances.length; k++)
      for (var z = 0; z < (Pc.seances[k].exos || []).length; z++)
        if (majExo(Pc.seances[k].exos[z])) chg = true;
    if (chg) { progSetCoach(cl[c].slug, Pc); nC++; }
  }
  return { seances: nS, clients: nC };
}

// ─── Le programme d'un client (slot 520) ───
function progGet(all) {
  var p = (all || {})[PROG_SLOT] || {};
  return {
    seances: p.seances || [], journal: p.journal || [], dernier: p.dernier || {},
    sexe: p.sexe || null,        // 'h' / 'f' — sert au programme fixe des 3 mois
    marches: p.marches || {},    // marches validées, par semaine de programme
    socle: p.socle || [],        // identifiants venus du programme fixe
    bonus: p.bonus || [],        // identifiants donnés en plus, client par client
    plan: p.plan || null         // le socle recopié chez le client (voyage avec lui)
  };
}
function progSetClient(p) { saveDay(PROG_SLOT, p); }
function progSetCoach(slug, p) { coachSaveSlot(slug, PROG_SLOT, p); }

function progSerieTexte(s) {
  var v = (s.v === "" || s.v == null) ? "?" : s.v;
  var t = progTypeCourt(s.t);
  var ch = (s.c === "" || s.c == null || s.c === 0) ? "" : " @ " + s.c + (s.u && s.u !== "—" ? " " + s.u : "");
  return v + " " + t + ch;
}
function progRepos(sec) {
  sec = parseInt(sec, 10) || 0;
  if (!sec) return "aucun";
  if (sec < 60) return sec + " s";
  var m = Math.floor(sec / 60), r = sec % 60;
  return m + " min" + (r ? " " + r : "");
}
// Volume soulevé d'une séance réalisée : sert au bilan de fin et à l'historique.
function progVolume(exos) {
  var v = 0;
  for (var i = 0; i < exos.length; i++) {
    for (var j = 0; j < exos[i].series.length; j++) {
      var s = exos[i].series[j];
      if (!s.ok) continue;
      var rep = parseFloat(s.v) || 0, ch = parseFloat(s.c) || 0;
      if (exos[i].series[j].t === "reps" || !exos[i].series[j].t) v += rep * ch;
    }
  }
  return Math.round(v);
}

  h += '<button id="prg-bib-new" class="prg-mini" style="width:100%;margin-top:14px;padding:13px 0">＋ Créer mon propre exercice</button>' +

function bindProgBuilder() {
  var l = seaGet(), S = null, idx = -1;
  for (var i = 0; i < l.length; i++) if (l[i].id === state.cdProg.id) { S = l[i]; idx = i; }
  if (!S) return;
  function sauver(rerender) {
    S.maj = isoLocal();
    // La séance en mémoire peut dater d'avant une modification d'exercice :
    // on la réaligne sur la bibliothèque avant d'écrire, sinon on écraserait
    // le lien vidéo ou le nom qu'on vient de corriger.
    seaRafraichir(S);
    l = seaGet();
    var pos = -1;
    for (var q = 0; q < l.length; q++) if (l[q].id === S.id) pos = q;
    if (pos >= 0) l[pos] = S; else l.push(S);
    idx = (pos >= 0 ? pos : l.length - 1);
    seaSet(l);
    if (rerender !== false) render();
  }
  var att = document.getElementById("prg-att");
  if (att) att.addEventListener("click", function () { state.cdAssign = S.id; state.cdAssignSel = null; render(); });
  function paire(attr, cb) {
    var els = document.querySelectorAll("[" + attr + "]");
    for (var k = 0; k < els.length; k++) els[k].addEventListener("click", function () {
      var p = String(this.getAttribute(attr)).split(".");
      cb(parseInt(p[0], 10), p.length > 1 ? parseInt(p[1], 10) : null, this);
    });
  }
  var bk = document.getElementById("prg-back");
  if (bk) bk.addEventListener("click", function () { state.cdProg = null; render(); });
  // Un modèle modifié après coup ne se propage pas tout seul : on le redit ici.
  var maj = document.getElementById("prg-maj");
  if (maj) maj.addEventListener("click", function () {
    var qui = seaClients(S.id).map(function (c) { return c.slug; });
    if (!qui.length) return;
    seaAttribuer(S.id, qui);
    feedback("Séance mise à jour chez " + qui.length + " client" + (qui.length > 1 ? "s" : ""), "ok");
  });

  // ── la bibliothèque
  if (state.cdProg.edit) { bindProgExoForm(); return; }
  if (state.cdProg.bib) {
    var st = state.cdProg;
    var cl = document.getElementById("prg-bib-close");
    if (cl) cl.addEventListener("click", function () { st.bib = false; st.sel = []; render(); });
    var tabs = document.querySelectorAll("[data-prg-tab]");
    for (var t = 0; t < tabs.length; t++) tabs[t].addEventListener("click", function () { st.tab = this.getAttribute("data-prg-tab"); render(); });
    var q = document.getElementById("prg-q");
    if (q) q.addEventListener("input", function () {
      // On ne redessine pas à chaque frappe : le champ perdrait le curseur.
      st.q = this.value;
      clearTimeout(window.__prgQ);
      var v = this.value, sel = this.selectionStart;
      window.__prgQ = setTimeout(function () {
        render();
        var e2 = document.getElementById("prg-q");
        if (e2) { e2.focus(); try { e2.setSelectionRange(sel, sel); } catch (x) { } }
      }, 350);
    });
    var picks = document.querySelectorAll("[data-prg-pick]");
    for (var p2 = 0; p2 < picks.length; p2++) picks[p2].addEventListener("click", function (ev) {
      if (ev.target && ev.target.getAttribute && (ev.target.getAttribute("data-prg-fav") || ev.target.getAttribute("data-prg-mod"))) return;
      var id = this.getAttribute("data-prg-pick"), k = st.sel.indexOf(id);
      if (k >= 0) st.sel.splice(k, 1); else st.sel.push(id);
      render();
    });
    var favs = document.querySelectorAll("[data-prg-fav]");
    for (var f2 = 0; f2 < favs.length; f2++) favs[f2].addEventListener("click", function (ev) {
      ev.stopPropagation();
      var id = this.getAttribute("data-prg-fav"), b = bibGet();
      for (var z = 0; z < b.length; z++) if (b[z].id === id) b[z].f = b[z].f ? 0 : 1;
      bibSet(b); render();
    });
    // Modifier un exercice existant — c'est par là qu'on lui colle un GIF.
    var mods = document.querySelectorAll("[data-prg-mod]");
    for (var m3 = 0; m3 < mods.length; m3++) mods[m3].addEventListener("click", function (ev) {
      ev.stopPropagation();
      state.cdProg.edit = this.getAttribute("data-prg-mod");
      render();
    });
    var nw = document.getElementById("prg-bib-new");
    if (nw) nw.addEventListener("click", function () { state.cdProg.edit = "new"; render(); });
    var ok = document.getElementById("prg-bib-ok");
    if (ok) ok.addEventListener("click", function () {
      if (!st.sel.length) return;
      var b = bibGet();
      for (var z = 0; z < st.sel.length; z++) {
        for (var y = 0; y < b.length; y++) {
          if (b[y].id !== st.sel[z]) continue;
          S.exos.push({
            ref: b[y].id, n: b[y].n, m: b[y].m, mat: b[y].mat, v: b[y].v, g: b[y].g || "", sup: 0, repos: 60, note: "",
            series: [{ t: b[y].m === "cardio" ? "duree" : "reps", v: b[y].m === "cardio" ? 600 : 10, c: "", u: b[y].m === "cardio" ? "—" : "kg" }]
          });
        }
      }
      st.sel = []; st.bib = false;
      state.cdProg.open = S.exos.length - 1;
      sauver();
    });
    return;

  // ── le constructeur
  var nom = document.getElementById("prg-nom");
  if (nom) nom.addEventListener("click", function () {

  });
  var add = document.getElementById("prg-add");
  if (add) add.addEventListener("click", function () { state.cdProg.bib = true; state.cdProg.sel = []; render(); });

  paire("data-prg-open", function (e) { state.cdProg.open = (state.cdProg.open === e ? -1 : e); render(); });
  paire("data-prg-addser", function (e) {
    var last = S.exos[e].series[S.exos[e].series.length - 1] || { t: "reps", v: 10, c: "", u: "kg" };
    S.exos[e].series.push({ t: last.t, v: last.v, c: last.c, u: last.u }); sauver();
  });
  paire("data-prg-dupser", function (e) {
    var last = S.exos[e].series[S.exos[e].series.length - 1];
    if (last) S.exos[e].series.push({ t: last.t, v: last.v, c: last.c, u: last.u });
    sauver();
  });
  paire("data-prg-delser", function (e, s) {
    if (S.exos[e].series.length <= 1) return;
    S.exos[e].series.splice(s, 1); sauver();
  });
  paire("data-prg-repos", function (e, v) { S.exos[e].repos = v; sauver(); });
  paire("data-prg-up", function (e) { if (e > 0) { var x = S.exos.splice(e, 1)[0]; S.exos.splice(e - 1, 0, x); state.cdProg.open = e - 1; sauver(); } });
  paire("data-prg-down", function (e) { if (e < S.exos.length - 1) { var x = S.exos.splice(e, 1)[0]; S.exos.splice(e + 1, 0, x); state.cdProg.open = e + 1; sauver(); } });
  paire("data-prg-sup", function (e) { S.exos[e].sup = S.exos[e].sup ? 0 : 1; sauver(); });
  paire("data-prg-delexo", function (e) {
    if (!confirm("Retirer « " + S.exos[e].n + " » de la séance ?")) return;
    S.exos.splice(e, 1); state.cdProg.open = -1; sauver();
  });
  // Champs de saisie : on enregistre sans redessiner, sinon le champ perd le focus
  function champ(attr, appliquer) {
    var els = document.querySelectorAll("[" + attr + "]");
    for (var k = 0; k < els.length; k++) {
      var maj = function () {
        var p = String(this.getAttribute(attr)).split(".");
        appliquer(parseInt(p[0], 10), parseInt(p[1], 10), this.value);
      };
      els[k].addEventListener("input", maj);
      els[k].addEventListener("change", function () { maj.call(this); sauver(false); });
    }
  }
  champ("data-prg-v", function (e, s, v) { S.exos[e].series[s].v = v === "" ? "" : (parseFloat(v) || 0); });
  champ("data-prg-c", function (e, s, v) { S.exos[e].series[s].c = v === "" ? "" : (parseFloat(v) || 0); });
  champ("data-prg-t", function (e, s, v) { S.exos[e].series[s].t = v; });
  champ("data-prg-u", function (e, s, v) { S.exos[e].series[s].u = v; });
  var notes = document.querySelectorAll("[data-prg-note]");
  for (var n2 = 0; n2 < notes.length; n2++) {
    notes[n2].addEventListener("input", function () { S.exos[parseInt(this.getAttribute("data-prg-note"), 10)].note = this.value; });
    notes[n2].addEventListener("change", function () { S.exos[parseInt(this.getAttribute("data-prg-note"), 10)].note = this.value; sauver(false); });
  }
}

// ═══════════ CÔTÉ CLIENT — MES SÉANCES ═══════════
// ═══════════ 🗓️ LE PROGRAMME FIXE EN TROIS MOIS ═══════════
// Akli : « il faudrait mois 1, mois 2 et mois 3, et les deux et trois se
// débloquent après. Je vais mettre le programme fixe homme et femme. Homme
// mois 1 : deux séances et deux marches d'une heure minimum. Filles idem sauf
// que les séances muscu seront différentes. Mois 2 : trois marches, mois 3 :
// quatre. Et il y aura des séances bonus que je pourrai ajouter. »
//
// Deux natures de contenu, donc deux mécaniques :
//   • LE SOCLE — le même pour tout le monde, à sexe égal. Il vit chez le
//     coach (`amcoach_prog3`), pas chez le client : Akli le règle une fois et
//     tous ses clients l'ont. Il désigne des SÉANCES TYPES déjà construites,
//     pour ne pas ressaisir les exercices deux fois.
//   • LES BONUS — attribués client par client, comme aujourd'hui. Ils
//     s'affichent à part, sous le socle du mois.
// Le déverrouillage suit les blocs de 28 jours de l'app (jour 29, jour 57),
// exactement comme le calendrier de l'accueil : deux règles différentes pour
// la même notion de « mois » finiraient par se contredire.
var PROG3_DEF = {
  m1: { sea: [], marches: 2, min: 60 },
  m2: { sea: [], marches: 3, min: 60 },
  m3: { sea: [], marches: 4, min: 60 }
};
function prog3Get() {
  var p = lsGet("amcoach_prog3", null) || {};
  var out = { h: {}, f: {} };
  ["h", "f"].forEach(function (sx) {
    ["m1", "m2", "m3"].forEach(function (m) {
      var src = (p[sx] && p[sx][m]) || {};
      out[sx][m] = {
        sea: src.sea || [],
        marches: src.marches != null ? src.marches : PROG3_DEF[m].marches,
        min: src.min != null ? src.min : PROG3_DEF[m].min
      };
    });
  });
  return out;
}
function prog3Set(p) { lsSet("amcoach_prog3", p); }
// Le sexe du client : celui du suivi protéines s'il est réglé, sinon le
// réglage posé dans la fiche (slot 520). Sans rien, on prend « homme » et on
// le dit au coach plutôt que d'afficher un programme au hasard.
// Recopie le socle d'un sexe chez tous les clients concernés. Appelé à chaque
// changement du socle et quand le coach fixe le sexe d'un client.
function prog3Sync(sx) {
  if (sx !== "h" && sx !== "f") return 0;
  var C = prog3Get()[sx], ids = [];
  ["m1", "m2", "m3"].forEach(function (m) {
    C[m].sea.forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); });
  });
  var cl = lsGet("amcoach_clients", []), touches = 0;
  for (var i = 0; i < cl.length; i++) {
    var slug = cl[i].slug, all = lsGet("amcoach_" + slug, {});
    if (!all || !Object.keys(all).length) continue;   // dossier pas encore chargé
    if (prog3Sexe(all) !== sx) continue;
    var P = progGet(all), anciens = P.socle || [];
    // Le plan part avec le client : mois par mois, les identifiants, le nombre
    // de marches et la durée minimale. Sans ça, son téléphone ne sait rien du
    // programme — il n'a pas le réglage du coach.
    P.plan = { m1: null, m2: null, m3: null };
    ["m1", "m2", "m3"].forEach(function (m) {
      P.plan[m] = { sea: C[m].sea.slice(), marches: C[m].marches, min: C[m].min };
    });
    // Les séances du socle sont déposées (ou rafraîchies) chez le client.
    for (var k = 0; k < ids.length; k++) {
      var S = seaTrouve(ids[k]);
      if (!S) continue;
      var dedans = -1;
      for (var j = 0; j < P.seances.length; j++) if (P.seances[j].id === ids[k]) dedans = j;
      var copie = JSON.parse(JSON.stringify(S));
      seaRafraichir(copie);
      if (dedans >= 0) P.seances[dedans] = copie; else P.seances.push(copie);
    }
    // Celles qui SORTENT du socle repartent — sauf si elles avaient été
    // attribuées en bonus à ce client, auquel cas elles lui restent.
    var bonus = P.bonus || [];
    for (var a = 0; a < anciens.length; a++) {
      if (ids.indexOf(anciens[a]) >= 0 || bonus.indexOf(anciens[a]) >= 0) continue;
      P.seances = P.seances.filter(function (z) { return z.id !== anciens[a]; });
    }
    P.socle = ids.slice();
    progSetCoach(slug, P);
    touches++;
  }
  return touches;
}
function prog3Sexe(all) {
  var P = progGet(all);
  if (P.sexe === "h" || P.sexe === "f") return P.sexe;
  try { var n = nutCfg(all); if (n && n.sexe) return String(n.sexe).toLowerCase() === "f" ? "f" : "h"; } catch (e) { }
  return null;
}
// Les marches se comptent PAR SEMAINE de programme : c'est l'unité qu'Akli
// donne à ses clients (« deux marches par semaine »), pas un total mensuel
// qui laisserait tout rattraper le dernier jour.
function prog3SemaineCle(today90) { return "S" + (Math.floor(today90 / 7) + 1); }
// Combien de séances du programme ont été TERMINÉES cette semaine ?
// On lit le journal : seule une séance conclue compte, comme pour le coach.
function prog3SeancesSemaine(all, today90) {
  var P = progGet(all), start = lsGetStr("amcoach_start_" + CLIENT);
  var deb = Math.max(0, today90 - (today90 % 7)), n = 0;
  for (var i = 0; i < (P.journal || []).length; i++) {
    var d = P.journal[i].d;
    if (!d || !start) continue;
    var idx = Math.round((new Date(d + "T12:00:00") - new Date(start + "T12:00:00")) / 86400000);
    if (idx >= deb && idx <= today90) n++;
  }
  return n;
}
function prog3Marches(all, today90) {
  var P = progGet(all), k = prog3SemaineCle(today90);
  return (P.marches && P.marches[k]) || 0;
}
function prog3MarcheAjout(delta, today90) {
  var all = getAllData(), P = progGet(all), k = prog3SemaineCle(today90);
  P.marches = P.marches || {};
  P.marches[k] = Math.max(0, (P.marches[k] || 0) + delta);
  progSetClient(P);
}

// ─── Côté client : les trois mois dans l'onglet Sport ───
function progCartesHTML(all) {
  var start = lsGetStr("amcoach_start_" + CLIENT);
  var today90 = start ? getToday90(start) : 0;
  var P = progGet(all), sexe = prog3Sexe(all);
  // On lit le plan DÉPOSÉ CHEZ LE CLIENT en priorité ; le réglage du coach ne
  // sert que sur son propre téléphone, quand il regarde sa propre fiche.
  var C = P.plan || (prog3Get()[sexe] || null);
  var moisEnCours = Math.min(3, Math.floor(today90 / 28) + 1);
  var h = "";
  // Sur un programme court (Reset 14 jours), le socle des trois mois est hors
  // sujet : on ne montre pas des portes verrouillées au jour 29 à quelqu'un
  // qui s'arrête au jour 14. Ses séances bonus, elles, restent affichées.
  var court = false;
  try { court = progLen(lsGetStr("amcoach_start_" + CLIENT)) <= 14; } catch (e) { }
  if (court) sexe = null;

  // Le socle, mois par mois
  if (sexe && C) {
    var socle = C;
    h += '<div class="spt-card"><div class="spt-lab cy">🗓️ Mon programme — ' + (sexe === "f" ? "femme" : "homme") + '</div>';
    for (var m = 1; m <= 3; m++) {
      var cfg = socle["m" + m], ouvert = (m <= moisEnCours);
      var jourDeb = (m - 1) * 28 + 1;
      h += '<div class="p3-mois' + (ouvert ? (m === moisEnCours ? " on" : " fait") : " lock") + '">' +
        '<div class="p3-tete"><span class="p3-n">' + (ouvert ? "Mois " + m : "🔒 Mois " + m) + '</span>' +
        (m === moisEnCours ? '<span class="p3-tag">en cours</span>' : '') +
        '<span class="p3-sub">' + (ouvert
          ? cfg.sea.length + ' séance' + (cfg.sea.length > 1 ? 's' : '') + ' · ' + cfg.marches + ' marche' + (cfg.marches > 1 ? 's' : '') + '/sem'
          : 'se débloque au jour ' + jourDeb) + '</span></div>';
      if (ouvert) {
        var vues = 0;
        for (var s2 = 0; s2 < cfg.sea.length; s2++) {
          var S = seaTrouve ? seaTrouve(cfg.sea[s2]) : null;
          // Le client n'a pas la bibliothèque du coach : la séance doit avoir
          // été déposée chez lui. On ne montre que ce qu'il peut vraiment ouvrir.
          var chezLui = null;
          for (var z = 0; z < P.seances.length; z++) if (P.seances[z].id === cfg.sea[s2]) chezLui = P.seances[z];
          if (!chezLui) continue;
          vues++;
          var nEx = (chezLui.exos || []).length, MU = progMuscle((chezLui.exos[0] || {}).m);
          h += '<button class="p3-sea" data-prg-run="' + chezLui.id + '" style="border-color:' + MU[2] + '66">' +
            '<span class="p3-pt" style="background:' + MU[2] + '"></span>' +
            '<span class="p3-sea-n">' + esc(chezLui.nom) + '</span>' +
            '<span class="p3-sea-s">' + nEx + ' exo' + (nEx > 1 ? 's' : '') + '</span>' +
            '<span class="p3-fl">›</span></button>';
        }
        if (!vues) h += '<div class="spt-txt" style="padding:2px 2px 8px">Les séances de ce mois arrivent — ton coach les met en place.</div>';
        // 🦾 Les séances de la semaine : un trou visible appelle à être
        // rempli, exactement comme pour les marches.
        if (m === moisEnCours && cfg.sea.length) {
          var faitesS = prog3SeancesSemaine(all, today90), pastS = "";
          for (var ws = 0; ws < cfg.sea.length; ws++)
            pastS += '<span class="p3-mar' + (ws < faitesS ? " on" : "") + '">🦾</span>';
          h += '<div class="p3-marches">' +
            '<div style="flex:1"><div class="p3-mar-t">' + faitesS + '/' + cfg.sea.length + ' séance' + (cfg.sea.length > 1 ? 's' : '') + ' cette semaine</div>' +
            '<div class="p3-mar-s">' + (faitesS >= cfg.sea.length ? 'Semaine bouclée 💪'
              : 'Ouvre ta séance et coche tes séries pour la valider') + '</div></div>' +
            '<div class="p3-mar-p">' + pastS + '</div></div>';
        }
        // Les marches de la semaine
        if (m === moisEnCours && cfg.marches > 0) {
          var faites = prog3Marches(all, today90), pastilles = "";
          for (var w = 0; w < cfg.marches; w++)
            pastilles += '<span class="p3-mar' + (w < faites ? " on" : "") + '">🚶</span>';
          h += '<div class="p3-marches">' +
            '<div style="flex:1"><div class="p3-mar-t">' + faites + '/' + cfg.marches + ' marches cette semaine</div>' +

// L'état de travail : ce que le client a déjà saisi aujourd'hui pour cette
// séance. Repris tel quel s'il revient dans la journée.
function progRunEtat(S, P) {
  var k = "amcoach_run_" + CLIENT;
  var W = lsGet(k, null);
  if (W && W.sid === S.id && W.d === isoLocal() && W.exos && W.exos.length === S.exos.length) {
    // La séance en cours garde ce que le client a saisi, mais reprend la
    // DESCRIPTION à jour des exercices : sans ça, un lien vidéo ajouté par le
    // coach pendant la journée n'apparaîtrait jamais dans la séance ouverte.
    for (var r = 0; r < W.exos.length; r++) {
      var src = S.exos[r];
      if (!src) continue;
      W.exos[r].n = src.n; W.exos[r].m = src.m; W.exos[r].mat = src.mat;
      W.exos[r].v = src.v; W.exos[r].g = src.g;
      W.exos[r].note = src.note; W.exos[r].repos = src.repos;
    }
    return W;
  }
  W = { sid: S.id, d: isoLocal(), nom: S.nom, exos: [] };
  for (var e = 0; e < S.exos.length; e++) {
    var X = S.exos[e], ex = { ref: X.ref, n: X.n, m: X.m, mat: X.mat, v: X.v, g: X.g, note: X.note, repos: X.repos, series: [] };
    for (var s = 0; s < X.series.length; s++) {
      var C = X.series[s];
      ex.series.push({ t: C.t, v: C.v, c: C.c, u: C.u, kg: "", ok: 0 });
    }
    W.exos.push(ex);
  }
  lsSet(k, W);
  return W;
}
function progRunSave(W) { lsSet("amcoach_run_" + CLIENT, W); }

function bindProgRun() {
  var all = getAllData(), P = progGet(all), S = null, i;
  for (i = 0; i < P.seances.length; i++) if (P.seances[i].id === state.progRun) S = P.seances[i];
  if (!S) return;
  var W = progRunEtat(S, P);
  function cle(el, attr) { var p = String(el.getAttribute(attr)).split("."); return [parseInt(p[0], 10), parseInt(p[1], 10)]; }

  var oks = document.querySelectorAll("[data-prg-ok]");
  for (i = 0; i < oks.length; i++) oks[i].addEventListener("click", function () {
    var k = cle(this, "data-prg-ok"), SR = W.exos[k[0]].series[k[1]];
    SR.ok = SR.ok ? 0 : 1;
    if (SR.ok) {
      // Ce qui n'a pas été saisi vaut la cible : personne ne retape 10 quand
      // il a fait 10. On ne demande la saisie que quand ça change.
      var C = S.exos[k[0]].series[k[1]] || {};
      if (SR.v === "" || SR.v == null) SR.v = C.v;
      if (SR.c === "" || SR.c == null) SR.c = C.c;
      progRunSave(W);
      buzz("ok");
      // Repos automatique, sauf sur un enchaînement (superset) ou la dernière
      // série de l'exercice quand il n'y a pas de repos réglé.
      var repos = parseInt(W.exos[k[0]].repos, 10) || 0;
      var enchaine = !!(S.exos[k[0]] && S.exos[k[0]].sup && k[1] === W.exos[k[0]].series.length - 1);
      if (repos > 0 && !enchaine) sptDemarrer([{ t: "repos", d: repos, tour: 1, serie: 1 }], "repos");
    } else { progRunSave(W); }
    render();
  });
  function champ(attr, appliquer) {
    var els = document.querySelectorAll("[" + attr + "]");
    for (var k = 0; k < els.length; k++) {
      var maj = function () { var p = cle(this, attr); appliquer(p[0], p[1], this.value); };
      els[k].addEventListener("input", maj);
      els[k].addEventListener("change", function () { maj.call(this); progRunSave(W); });
    }
  }
  champ("data-prg-rv", function (e, s, v) { W.exos[e].series[s].v = v === "" ? "" : (parseFloat(v) || 0); });
  champ("data-prg-rc", function (e, s, v) { W.exos[e].series[s].c = v === "" ? "" : (parseFloat(v) || 0); });
  champ("data-prg-rk", function (e, s, v) { W.exos[e].series[s].kg = v === "" ? "" : (parseFloat(v) || 0); });

  // Un tap sur la vignette ouvre le lecteur, un second le referme.
  var vids = document.querySelectorAll("[data-prg-vid]");
  for (i = 0; i < vids.length; i++) vids[i].addEventListener("click", function () {
    var k = parseInt(this.getAttribute("data-prg-vid"), 10);
    state.progVid = (state.progVid === k ? null : k);
    render();
  });
  var bk = document.getElementById("prg-run-back");
  if (bk) bk.addEventListener("click", function () { state.progRun = null; sptArreter(true); render(); });

  var fin = document.getElementById("prg-fin");
  if (fin) fin.addEventListener("click", function () {
    var faites = 0, tot = 0, e, s;
    for (e = 0; e < W.exos.length; e++) for (s = 0; s < W.exos[e].series.length; s++) { tot++; if (W.exos[e].series[s].ok) faites++; }
    if (!faites) { alert("Coche au moins une série avant de terminer."); return; }
    var vol = progVolume(W.exos);
    var A = getAllData(), PP = progGet(A);
    PP.journal.unshift({ d: isoLocal(), sid: S.id, nom: S.nom, vol: vol, exos: W.exos });
    PP.journal = PP.journal.slice(0, 40);
    // Mémoire par exercice : ce qu'il a fait la dernière fois, affiché au
    // prochain passage. C'est ça qui rend la progression visible.
    for (e = 0; e < W.exos.length; e++) {
      var X = W.exos[e], txt = [], nb = 0;
      for (s = 0; s < X.series.length; s++) {
        if (!X.series[s].ok) continue;
        txt.push(progSerieTexte(X.series[s])); nb++;
      }
      // Le détail série par série sert de repère au prochain passage : sans
      // lui, on ne peut afficher qu'un résumé, donc rien à battre.
      var det = [];
      for (var q = 0; q < X.series.length; q++) {
        var SQ = X.series[q];
        det.push(SQ.ok ? { v: SQ.v, c: (SQ.kg !== "" && SQ.kg != null ? SQ.kg : SQ.c), u: (SQ.kg !== "" && SQ.kg != null ? "kg" : SQ.u), t: SQ.t } : null);
      }
      if (nb) PP.dernier[X.ref] = { d: isoLocal(), txt: txt.join(" · "), det: det };
    }
    progSetClient(PP);
    // ✅ L'habitude Sport du jour se coche toute seule : la séance terminée
    // en est la preuve. On ne décoche jamais — ça, ça reste sa décision.
    var sportCoche = false;
    try {
      var jour = getToday90(lsGetStr("amcoach_start_" + CLIENT));
      if (jour >= 0 && jour < 90) {
        var DJ = getAllData()[jour] || {};
        DJ.habits = DJ.habits || {};
        if (!DJ.habits.sport) { DJ.habits.sport = true; saveDay(jour, DJ); sportCoche = true; }
      }
    } catch (x) { }
    try { localStorage.removeItem("amcoach_run_" + CLIENT); } catch (x) { }
    sptArreter(true);
    state.progRun = null;
    state.progBilan = { nom: S.nom, faites: faites, tot: tot, vol: vol, sport: sportCoche };
    buzz("win");
    render();
  });
  // La barre de repos partage les boutons du moteur de minuteurs
  var go = document.getElementById("spt-go");
  if (go) go.addEventListener("click", function () {
    if (!SPT.run) return;
    if (SPT.run.pause != null) sptReprendre(); else sptPause();
  });
  var stop = document.getElementById("spt-stop");
  if (stop) stop.addEventListener("click", function () { sptArreter(false); });
  if (!window.__sptVis) {
    window.__sptVis = true;
    document.addEventListener("visibilitychange", function () {
      var cache = document.visibilityState !== "visible";
      sptModeAuto(cache);
      if (!cache && SPT.run && SPT.run.pause == null) { sptWake(true); sptBoucle(); }
    });
  }
  sptRestaurer();
  sptAfficher();
}

function bindProgFiche(slug) {

    P.sexe = (P.sexe === v ? null : v);
    progSetCoach(slug, P);
    // Le socle correspondant part immédiatement chez lui : sans ça, le client
    // voyait ses mois vides jusqu'à la prochaine modification du programme.
    if (P.sexe) prog3Sync(P.sexe);
    render();
    if (P.sexe) feedback("Socle " + (P.sexe === "f" ? "femmes" : "hommes") + " envoyé", "ok");
  });
  var pk = document.getElementById("prg-pick");
  if (pk) pk.addEventListener("click", function () {
    var l = seaGet();
    if (!l.length) { alert("Crée d'abord une séance type en haut du tableau de bord."); return; }
    var noms = [];
    for (var i = 0; i < l.length; i++) noms.push((i + 1) + ". " + l[i].nom + " (" + seaResume(l[i]) + ")");
    var r = prompt("Quelle séance attribuer ?\n\n" + noms.join("\n"), "1");
    var k = parseInt(r, 10);
    if (!k || k < 1 || k > l.length) return;
    seaAttribuer(l[k - 1].id, seaClients(l[k - 1].id).map(function (c) { return c.slug; }).concat([slug]));
    render();
    feedback("« " + l[k - 1].nom + " » attribuée", "ok");
  });
  var eds = document.querySelectorAll("[data-prg-edit]");
  for (var i = 0; i < eds.length; i++) eds[i].addEventListener("click", function () {
    state.cdProg = { id: this.getAttribute("data-prg-edit"), open: 0 };
    if (!seaTrouve(state.cdProg.id)) { state.cdProg = null; alert("Cette séance a été construite avant les modèles : ouvre-la depuis le tableau de bord ou recrée-la."); return; }
    render();
  });
  var dels = document.querySelectorAll("[data-prg-del]");
  for (var x = 0; x < dels.length; x++) dels[x].addEventListener("click", function () {
    var id = this.getAttribute("data-prg-del"), nom = "";
    for (var k = 0; k < P.seances.length; k++) if (P.seances[k].id === id) nom = P.seances[k].nom;
    if (!confirm("Supprimer la séance « " + nom + " » ? Son historique est conservé.")) return;
    P.seances = P.seances.filter(function (z) { return z.id !== id; });
    progSetCoach(slug, P); render();
  });
}


// ═══════════ 📚 MODÈLES DE SÉANCE (côté coach) ═══════════
// Akli : « il faudrait que les séances soient en haut du dashboard et
// qu'ensuite je puisse l'attribuer à tel ou tel client, comme ça séance 1 est
// faite, je peux la mettre à X, Y, et au nouveau — pas besoin de refaire à
// chaque fois. » Le modèle vit donc chez le coach ; l'attribuer en dépose une
// COPIE dans le slot 520 du client. Copie et non référence : si Akli retouche
// le modèle plus tard, la séance déjà commencée par une cliente ne change pas
// sous ses pieds — c'est lui qui décide de la re-attribuer.
function seaGet() { return lsGet("amcoach_seances", []); }
function seaSet(l) { lsSet("amcoach_seances", l); }
function seaTrouve(id) { var l = seaGet(); for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i]; return null; }
function seaResume(S) {
  var nEx = (S.exos || []).length, nSer = 0;
  for (var e = 0; e < nEx; e++) nSer += (S.exos[e].series || []).length;
  return nEx + " exercice" + (nEx > 1 ? "s" : "") + " · " + nSer + " série" + (nSer > 1 ? "s" : "");
}
// À qui cette séance est-elle déjà attribuée ?
function seaClients(id) {
  var cl = lsGet("amcoach_clients", []), out = [];
  for (var i = 0; i < cl.length; i++) {
    var P = progGet(lsGet("amcoach_" + cl[i].slug, {}));
    for (var j = 0; j < P.seances.length; j++) if (P.seances[j].id === id) out.push(cl[i]);
  }
  return out;
}
function seaAttribuer(id, slugs) {
  var S = seaTrouve(id);
  if (!S) return;
  var cl = lsGet("amcoach_clients", []);
  for (var i = 0; i < cl.length; i++) {
    var slug = cl[i].slug, P = progGet(lsGet("amcoach_" + slug, {}));
    var veut = slugs.indexOf(slug) >= 0, dedans = -1;
    for (var j = 0; j < P.seances.length; j++) if (P.seances[j].id === id) dedans = j;
    // On note qui a reçu la séance EN BONUS : sans cette trace, retirer la
    // séance du socle la reprendrait aussi à ceux à qui elle a été donnée en
    // plus, ce qui n'est pas la même décision.
    P.bonus = P.bonus || [];
    var kb = P.bonus.indexOf(id);
    if (veut && kb < 0) P.bonus.push(id);
    if (!veut && kb >= 0) P.bonus.splice(kb, 1);
    var duSocle = (P.socle || []).indexOf(id) >= 0;
    if (veut) {
      var copie = JSON.parse(JSON.stringify(S));
      seaRafraichir(copie);
      if (dedans >= 0) P.seances[dedans] = copie; else P.seances.push(copie);
    } else if (dedans >= 0 && !duSocle) {
      // Une séance du socle ne se retire pas client par client : elle fait
      // partie du programme, on la laisse.
      P.seances.splice(dedans, 1);
    }
    progSetCoach(slug, P);
  }
}

// ═══════════ ⚖️ HISTORIQUE DES PESÉES ET CARTE À PARTAGER ═══════════
// Akli, après avoir vu tourner ce format sur les réseaux : « ça crée un
// historique, les gens partagent ça, c'est viral, on pourrait l'intégrer ? »
// Ce qui se partage, ce n'est pas le poids — c'est la PREUVE D'AVOIR TENU.
// La carte met donc la série en gros, et le poids reste masquable : la
// plupart des clientes ne publieront jamais leurs kilos, mais montreront
// volontiers 45 jours sans lâcher. Et la carte porte la marque : un partage
// qui ne ramène personne ne sert à rien.

// Toutes les pesées, de la plus récente à la plus ancienne, avec l'écart par
// rapport à la pesée PRÉCÉDENTE (pas la veille : on saute les jours sans
// pesée, sinon l'écart ne veut rien dire).
function peseesListe(allData, today90) {
  var out = [], prec = null;
  for (var i = 0; i <= today90 && i < 90; i++) {
    var d = allData[i];
    if (!d || d.poids == null || d.poids === "") continue;
    var v = parseFloat(d.poids);
    if (isNaN(v)) continue;
    out.push({ jour: i, v: Math.round(v * 10) / 10, delta: prec == null ? null : Math.round((v - prec) * 10) / 10 });
    prec = v;
  }
  return out.reverse();
}
// La semaine d'une pesée : combien de jours remplis sur les 7 qui la précèdent.
function peseeSemaine(allData, jour) {
  var n = 0;
  for (var i = jour; i > jour - 7 && i >= 0; i--) {
    var d = allData[i];
    if (d && Object.keys(d).length > 0) n++;
  }
  return n;
}
function peseeDate(start, jour) {
  if (!start) return "jour " + (jour + 1);
  var d = new Date(start + "T12:00:00");
  d.setDate(d.getDate() + jour);
  return d;
}

function viewPesees(name) {
  var allData = getAllData();
  var start = lsGetStr("amcoach_start_" + CLIENT);
  var today90 = start ? getToday90(start) : 89;
  var L = peseesListe(allData, today90);
  var JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
  var MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];

  var h = '<div class="prg-top"><button id="pes-back" class="prg-back">‹</button>' +
    '<div style="flex:1;min-width:0"><div class="prg-titre">Mes pesées</div>' +
    '<div class="prg-sous">' + L.length + ' pesée' + (L.length > 1 ? 's' : '') + ' enregistrée' + (L.length > 1 ? 's' : '') + '</div></div>' +
    '<button id="pes-share" class="pes-share">📤</button></div>' +
    '<div style="padding:10px 13px 24px">';

  if (!L.length) {
    h += '<div class="st-ins"><span class="st-ins-i">⚖️</span><div>Aucune pesée pour l\'instant. Note ton poids dans ta journée : c\'est ce qui fait apparaître ta courbe et ton historique.</div></div></div>';
    return h;
  }

  // Le résumé qui donne envie de continuer
  var premier = L[L.length - 1], dernier = L[0];
  var ecart = Math.round((dernier.v - premier.v) * 10) / 10;
  h += '<div class="pes-tete">' +
    '<div><div class="pes-tete-l">Depuis le début</div>' +
    '<div class="pes-tete-v" style="color:' + (ecart < 0 ? "var(--ok-d)" : ecart > 0 ? "var(--bad)" : "var(--mute)") + '">' +
    (ecart > 0 ? "+" : "") + ecart + ' kg</div></div>' +
    '<div style="text-align:right"><div class="pes-tete-l">Aujourd\'hui</div>' +
    '<div class="pes-tete-v">' + dernier.v + ' kg</div></div></div>';

  for (var i = 0; i < L.length; i++) {
    var P = L[i], dt = peseeDate(start, P.jour);
    var jourTxt, moisTxt, numTxt, anTxt;
    if (typeof dt === "string") { jourTxt = ""; moisTxt = ""; numTxt = dt; anTxt = ""; }
    else { jourTxt = JOURS[dt.getDay()]; moisTxt = MOIS[dt.getMonth()]; numTxt = dt.getDate(); anTxt = dt.getFullYear(); }
    var n7 = peseeSemaine(allData, P.jour), carres = "";
    for (var c = 0; c < 7; c++) carres += '<i class="' + (c < n7 ? (n7 >= 5 ? "on" : "mid") : "") + '"></i>';
    var dcol = P.delta == null ? "var(--mute)" : P.delta < 0 ? "var(--ok-d)" : P.delta > 0 ? "var(--bad)" : "var(--mute)";
    h += '<div class="pes-l" data-pes="' + P.jour + '">' +
      '<div style="flex:0 0 96px"><div class="pes-kg">' + P.v + '<span>kg</span></div>' +
      '<div class="pes-d" style="color:' + dcol + '">' + (P.delta == null ? "1re pesée" : (P.delta > 0 ? "+" : "") + P.delta + " kg") + '</div></div>' +
      '<div class="pes-carres">' + carres + '</div>' +
      '<div class="pes-date"><div class="pes-mois">' + moisTxt + '</div><div class="pes-num">' + numTxt + '</div>' +
      '<div class="pes-an">' + anTxt + '</div></div>' +
      '<div class="pes-jour">' + jourTxt + '</div></div>';
  }

// ─── La carte à partager ───
// Où en est le chemin, sur l'ensemble du programme ? Sert au diplôme et à la
// carte à partager — un seul calcul, deux affichages.
function montagne90(allData, today90) {
  var start = null, cible = null, act = null;
  try {
    var nc = nutCfg(allData);
    if (nc && nc.pDepart) start = parseFloat(nc.pDepart);
    if (nc && nc.pCible) cible = parseFloat(nc.pCible);
  } catch (e) { }
  for (var i = 0; i <= Math.min(89, today90); i++) {
    var d = allData[i];
    if (d && d.poids != null && d.poids !== "") {
      var v = parseFloat(d.poids);
      if (!isNaN(v)) { act = v; if (start == null) start = v; }
    }
  }
  var rempli = 0;
  for (var j = 0; j <= Math.min(89, today90); j++) if (allData[j] && Object.keys(allData[j]).length > 0) rempli++;
  if (start != null && cible != null && act != null && Math.abs(start - cible) > 0.05) {
    var pct = Math.round((start - act) / (start - cible) * 100);
    return { pct: Math.max(0, Math.min(100, pct)), depart: start, actuel: act, cible: cible,
             rempli: rempli, kg: Math.round((act - start) * 10) / 10, avecPoids: true };
  }
  return { pct: Math.round(rempli / Math.max(1, today90 + 1) * 100), depart: start, actuel: act,
           cible: cible, rempli: rempli, kg: null, avecPoids: false };
}

// La même montagne, dessinée sur une toile pour la carte à partager. On ne
// peut pas y coller le SVG : il faudrait le charger de façon asynchrone, et
// la carte se construit d'un bloc.
function cvMontagne(x, X, Y, W, H, pct) {
  var p = Math.max(0, Math.min(100, pct || 0));
  var solX = X + W, solY = Y + H;
  function pic(cx, largeur, hauteur, couleur) {
    x.fillStyle = couleur; x.beginPath();
    x.moveTo(cx - largeur / 2, solY); x.lineTo(cx, solY - hauteur); x.lineTo(cx + largeur / 2, solY);
    x.closePath(); x.fill();
  }
  pic(X + W * 0.30, W * 0.46, H * 0.62, "rgba(255,255,255,.16)");
  pic(X + W * 0.74, W * 0.44, H * 0.58, "rgba(255,255,255,.16)");
  var cx = X + W * 0.5, hh = H * 0.92;
  pic(cx, W * 0.62, hh, "rgba(255,255,255,.28)");
  // La neige du sommet
  x.fillStyle = "#FFFFFF"; x.beginPath();
  x.moveTo(cx, solY - hh);
  x.lineTo(cx + W * 0.10, solY - hh * 0.66);
  x.lineTo(cx + W * 0.04, solY - hh * 0.70);
  x.lineTo(cx - W * 0.02, solY - hh * 0.62);
  x.lineTo(cx - W * 0.08, solY - hh * 0.68);
  x.closePath(); x.fill();
  // Le sentier : on le trace deux fois, en clair pour le reste du chemin et
  // en vert pour la portion parcourue.
  var pts = [[cx - W * 0.16, solY - H * 0.04], [cx + W * 0.10, solY - H * 0.22],
             [cx - W * 0.12, solY - H * 0.40], [cx + W * 0.08, solY - H * 0.58],
             [cx - W * 0.04, solY - H * 0.74], [cx, solY - hh + H * 0.04]];
  function tracer(frac, couleur, epais) {
    x.strokeStyle = couleur; x.lineWidth = epais; x.lineCap = "round"; x.lineJoin = "round";
    var n = pts.length - 1, total = n * frac;
    x.beginPath(); x.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i <= n; i++) {
      var part = Math.max(0, Math.min(1, total - (i - 1)));
      if (part <= 0) break;
      x.lineTo(pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * part,
               pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * part);
      if (part < 1) break;
    }
    x.stroke();
  }
  tracer(1, "rgba(255,255,255,.35)", 12);
  if (p > 0) tracer(p / 100, "#5DF2A0", 12);
  // Le marcheur, posé au bout de la portion parcourue
  var n2 = pts.length - 1, t = n2 * (p / 100), seg = Math.min(n2 - 1, Math.floor(t)), part2 = t - seg;
  var mx = pts[seg][0] + (pts[seg + 1][0] - pts[seg][0]) * part2;
  var my = pts[seg][1] + (pts[seg + 1][1] - pts[seg][1]) * part2;
  x.fillStyle = "#FFFFFF"; x.beginPath(); x.arc(mx, my, 15, 0, Math.PI * 2); x.fill();
  // Le drapeau du sommet : rouge tant que ce n'est pas fini, vert au bout
  x.strokeStyle = "#FFFFFF"; x.lineWidth = 5; x.beginPath();
  x.moveTo(cx, solY - hh); x.lineTo(cx, solY - hh - 58); x.stroke();
  x.fillStyle = (p >= 100 ? "#5DF2A0" : "#FF6B5A"); x.beginPath();
  x.moveTo(cx, solY - hh - 58); x.lineTo(cx + 62, solY - hh - 40); x.lineTo(cx, solY - hh - 22);
  x.closePath(); x.fill();
  // Le sol
  x.fillStyle = "rgba(255,255,255,.35)"; x.fillRect(X, solY, W, 6);
}

// Dessinée sur une toile plutôt qu'en HTML : c'est une IMAGE qu'on partage,
// pas une page. Format 4:5, celui d'Instagram.
function partageCarte(masquerPoids) {
  var D = partageDonnees();
  var W = 1080, H = 1620, cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  var x = cv.getContext("2d");
  x.fillStyle = "#FFFFFF"; x.fillRect(0, 0, W, H);
  // Liseré de marque en haut
  var g = x.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, "#12B5EA"); g.addColorStop(1, "#8A3FFF");
  x.fillStyle = g; x.fillRect(0, 0, W, 16);
  x.textAlign = "left";
  x.fillStyle = "#101828";
  x.font = "900 40px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
  x.fillText("DISCIPLINE 90", 80, 130);
  x.fillStyle = "#8A8FA3";
  x.font = "700 30px system-ui,-apple-system,sans-serif";
  x.fillText(D.prenom + (D.prenom ? " · " : "") + "jour " + D.jour + " sur " + D.duree, 80, 178);

  // Le chiffre qui se partage. Jamais un zéro : si la série est cassée, c'est
  // le nombre de jours remplis qui passe en grand — on publie une fierté, pas
  // un constat d'échec.
  var heros, unite, sous;
  if (D.serie >= 2) { heros = D.serie; unite = "jours"; sous = "sans rien lâcher"; }
  else if (D.rempli >= 2) { heros = D.rempli; unite = "jours"; sous = "de travail au compteur"; }
  else { heros = D.jour; unite = "sur " + D.duree; sous = "c'est parti"; }
  x.fillStyle = "#101828";
  x.font = "900 250px system-ui,-apple-system,sans-serif";
  x.fillText(String(heros), 80, 470);
  var lg = x.measureText(String(heros)).width;
  x.fillStyle = "#12B5EA";
  x.font = "900 62px system-ui,-apple-system,sans-serif";
  x.fillText(unite, 96 + lg, 470);
  x.fillStyle = "#5A6072";
  x.font = "700 44px system-ui,-apple-system,sans-serif";
  x.fillText(sous, 80, 545);

  // 🏔️ La montagne du programme, au cœur de la carte : c'est elle qui
  // raconte le chemin parcouru, mieux qu'un chiffre.
  (function () {
    var M = montagne90(getAllData(), (D.jour - 1));
    var bx = 80, by = 585, bw = W - 160, bh = 330;
    var g2 = x.createLinearGradient(bx, by, bx + bw, by + bh);
    g2.addColorStop(0, "#12B5EA"); g2.addColorStop(1, "#8A3FFF");
    x.fillStyle = g2;
    if (x.roundRect) { x.beginPath(); x.roundRect(bx, by, bw, bh, 28); x.fill(); }
    else x.fillRect(bx, by, bw, bh);
    cvMontagne(x, bx + 40, by + 30, bw - 80, bh - 110, M.pct);
    x.fillStyle = "rgba(255,255,255,.92)";
    x.font = "900 34px system-ui,-apple-system,sans-serif";
    x.textAlign = "left";
    x.fillText(M.avecPoids ? M.depart + " kg" : "Jour 1", bx + 34, by + bh - 34);
    x.textAlign = "center";
    x.fillText(M.pct + " % du chemin", bx + bw / 2, by + bh - 34);
    x.textAlign = "right";
    x.fillText(M.avecPoids ? M.cible + " kg" : "Jour " + D.duree, bx + bw - 34, by + bh - 34);
    x.textAlign = "left";
  })();

  // Les sept derniers jours, en carrés
  var cx = 80, cy = 960, taille = 92, gap = 20;
  for (var i = 0; i < D.sept.length; i++) {
    x.fillStyle = D.sept[i] ? "#8BE229" : "#E7E9EE";
    var px = cx + i * (taille + gap);
    x.beginPath();
    if (x.roundRect) { x.roundRect(px, cy, taille, taille, 16); x.fill(); }
    else x.fillRect(px, cy, taille, taille);
  }
  x.fillStyle = "#8A8FA3";
  x.font = "700 28px system-ui,-apple-system,sans-serif";
  x.fillText("les 7 derniers jours", 80, cy + taille + 46);

  // Le résultat : en kilos, ou en pourcentage si le poids reste privé
  x.fillStyle = "#F2F4F8";
  if (x.roundRect) { x.beginPath(); x.roundRect(80, 1200, W - 160, 200, 28); x.fill(); }
  else x.fillRect(80, 1200, W - 160, 200);
  x.fillStyle = "#5A6072";
  x.font = "700 30px system-ui,-apple-system,sans-serif";
  x.fillText("Depuis le début", 124, 1270);
  x.fillStyle = "#101828";
  x.font = "900 82px system-ui,-apple-system,sans-serif";
  var res;
  if (D.ecart == null) res = D.rempli + " jours remplis";
  else if (masquerPoids) res = (D.pct > 0 ? "+" : "") + D.pct + " % de poids";
  else res = (D.ecart > 0 ? "+" : "") + D.ecart + " kg";
  x.fillText(res, 124, 1355);

  // La signature — sans elle, un partage ne ramène personne
  x.fillStyle = g; x.fillRect(0, H - 130, W, 130);
  x.fillStyle = "#FFFFFF";
  x.font = "900 40px system-ui,-apple-system,sans-serif";
  x.fillText("AM COACH GENÈVE", 80, H - 68);
  x.textAlign = "right";
  x.font = "700 34px system-ui,-apple-system,sans-serif";
  x.fillText("@amcoachsportif", W - 80, H - 68);
  return cv;
}
function partagerImage(masquerPoids) {
  var cv = partageCarte(masquerPoids);
  if (!cv.toBlob) { feedback("Ton navigateur ne sait pas créer l'image", "warn"); return; }
  cv.toBlob(function (blob) {
    if (!blob) { feedback("Image impossible à créer", "warn"); return; }
    var nom = "discipline90.png";
    try {
      var f = new File([blob], nom, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [f] }) && navigator.share) {
        navigator.share({ files: [f] }).catch(function () { });
        return;
      }
    } catch (e) { }
    // Sans partage natif : on télécharge, le client publiera depuis sa galerie.
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = nom;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    feedback("Image enregistrée", "ok");
  }, "image/png");
}

function chrFmt(ms) {
  var t = Math.max(0, Math.floor(ms / 10));           // centièmes
  var cs = t % 100, sec = Math.floor(t / 100) % 60, mn = Math.floor(t / 6000);
  return mn + ":" + (sec < 10 ? "0" : "") + sec + "." + (cs < 10 ? "0" : "") + cs;
}
function chrAfficher() {
  var e = document.getElementById("chr-time");
  if (!e) { if (CHR.tick) { clearInterval(CHR.tick); CHR.tick = null; } return; }
  e.textContent = chrFmt(chrEcoule());
}
function chrBoucle() {
  if (CHR.tick) clearInterval(CHR.tick);
  CHR.tick = setInterval(chrAfficher, 70);
}
function chrHTML() {
  var t = chrEcoule(), h = "";
  h += '<div class="spt-card"><div class="spt-lab">⏱️ Chronomètre</div>' +
    '<div class="chr-time" id="chr-time">' + chrFmt(t) + '</div>' +
    '<div class="chr-btns">' +
    '<button id="chr-go" class="spt-go' + (CHR.on ? ' pause' : '') + '">' + (CHR.on ? '❙❙ PAUSE' : (t > 0 ? '▶ REPRENDRE' : '▶ DÉMARRER')) + '</button>' +
    '<button id="chr-tour" class="spt-sq"' + (CHR.on ? '' : ' disabled style="opacity:.45"') + '>🏁</button>' +
    '<button id="chr-raz" class="spt-sq">↺</button></div>';
  if (CHR.tours.length) {
    h += '<div class="chr-tours">';
    for (var i = CHR.tours.length - 1; i >= 0; i--) {
      var prec = i > 0 ? CHR.tours[i - 1] : 0;
      h += '<div class="chr-t"><span class="chr-t-n">Tour ' + (i + 1) + '</span>' +
        '<span class="chr-t-d">' + chrFmt(CHR.tours[i] - prec) + '</span>' +
        '<span class="chr-t-c">' + chrFmt(CHR.tours[i]) + '</span></div>';
    }
    h += '</div>';
  } else {
    h += '<div class="spt-txt" style="margin-top:10px">🏁 marque un tour, ↺ remet à zéro. Le chrono continue écran éteint.</div>';
  }
  return h + '</div>';
}
function bindChrono() {
  var go = document.getElementById("chr-go");
  if (!go) return;
  go.addEventListener("click", function () {
    if (CHR.on) { CHR.arret = Date.now(); CHR.on = false; }
    else {
      // Reprise : on décale le point de départ du temps déjà passé en pause.
      if (CHR.t0 && CHR.arret) CHR.t0 += (Date.now() - CHR.arret);
      else CHR.t0 = Date.now();
      CHR.on = true;
    }
    chrSauver(); render();
    if (CHR.on) chrBoucle();
  });
  var tr = document.getElementById("chr-tour");
  if (tr) tr.addEventListener("click", function () {
    if (!CHR.on) return;
    CHR.tours.push(chrEcoule()); chrSauver(); buzz("ok"); render(); chrBoucle();
  });
  var rz = document.getElementById("chr-raz");
  if (rz) rz.addEventListener("click", function () {
    CHR.t0 = 0; CHR.arret = 0; CHR.tours = []; CHR.on = false;
    chrSauver(); render();
  });
  if (CHR.on) chrBoucle(); else chrAfficher();
}

<script>
"use strict";

// ═══════════ COACH LOGIN ═══════════
// 🔐 Le mot de passe n'est plus écrit en clair : seule son EMPREINTE figure
// ici. Une empreinte SHA-256 ne se lit pas à l'envers — ouvrir le code source
// ne donne plus le mot de passe. C'est une porte fermée, pas un coffre-fort :
// la vraie protection des données se joue côté serveur (voir la note plus bas
// sur Supabase), mais ça supprime le cas le plus bête, celui du curieux qui
// affiche la source et entre directement.
var COACH_PASS_HASH="96b4cc1ecb60f2f96a13a664e1aeb8ce680735b4220d48893253ece320bcd6ec";
var COACH_SEL="AMCoachGeneve-D90::";
function coachHash(txt){
  // Web Crypto est disponible partout depuis des années ; en son absence on
  // refuse la connexion plutôt que de retomber sur une comparaison en clair.
  try{
    if(!window.crypto||!crypto.subtle)return Promise.resolve(null);
    var d=new TextEncoder().encode(COACH_SEL+txt);
    return crypto.subtle.digest("SHA-256",d).then(function(buf){
      var b=new Uint8Array(buf),o="";
      for(var i=0;i<b.length;i++)o+=("0"+b[i].toString(16)).slice(-2);
      return o;
    });
  }catch(e){return Promise.resolve(null);}
}

  return null;

// un réglage il fallait faire défiler tout le reste. On garde en haut ce
// qu'on regarde à chaque visite (chiffres, courbes, calendrier) et on range
// le reste dans des tiroirs. L'état d'ouverture est mémorisé par section,
// donc celles qu'un coach ouvre souvent restent ouvertes chez lui.

}
function cdSecClose(){return '</div></details>';}

function viewCoachDetail(){
  var clients=lsGet("amcoach_clients",[]);
  if(state.coachDetail)coachLoadClient(state.coachDetail); // rafraîchit au premier affichage
  var c=null;
  for(var i=0;i<clients.length;i++){if(clients[i].slug===state.coachDetail){c=clients[i];break;}}
  if(!c){state.coachDetail=null;return viewCoachDash();}

  var t90=getToday90(c.start_date);
  var series=computeSeries(allData,90);
  var streak=computeStreak(allData,t90);
  var avgScore=avgOf(series,"score"), avgMental=avgOf(series,"mental");
  var pv=series.map(function(s){return s.poids;}).filter(function(v){return v!=null;});
  var dp=pv.length>=2?Math.round((pv[pv.length-1]-pv[0])*10)/10:null;
  var alert=computeAlert(allData,t90);
  var month=currentMonth(t90);
  var goal=getGoal(allData,month);

  var h='<div class="app" style="max-width:480px">'+
    '<div class="hdr"><div style="display:flex;align-items:center;gap:12px">'+
    '<button id="cd-back" class="day-back">←</button>'+
    '<div style="flex:1"><div style="color:#fff;font-weight:900;font-size:16px">'+esc(c.name)+'</div>'+
    '<div style="color:var(--mute);font-size:12px">Jour '+Math.min(t90+1,90)+'/90 · départ '+new Date(c.start_date).toLocaleDateString("fr-FR")+' · 🔥 '+streak+'j</div>'+
    (function(){var la=lastActLabel(allData);return '<div style="font-size:12px;font-weight:800;margin-top:3px;color:'+la.c+'">📱 Dernière activité : '+la.t+'</div>';})()+'</div></div></div>'+

    '<div class="kpi-card"><div class="kpi-val" style="color:'+B+'">'+(avgMental!=null?avgMental+"%":"—")+'</div><div class="kpi-lbl">Mental</div></div></div>'+
    '<div class="kpi-row" style="margin-bottom:14px">'+
    '<div class="kpi-card"><div class="kpi-val">'+(pv.length?pv[pv.length-1]:"—")+'<span style="font-size:14px"> kg</span></div><div class="kpi-lbl">Poids actuel</div></div>'+
    '<div class="kpi-card"><div class="kpi-val" style="color:'+(dp==null?"#CCC":dp<=0?"var(--ok)":R)+'">'+(dp!=null?(dp>0?"+"+dp:dp):"—")+'<span style="font-size:14px"> kg</span></div><div class="kpi-lbl">Évolution</div></div></div>';

  // Objectif du mois
  if(goal){
    h+='<div class="card" style="border-left:4px solid '+R+'"><div style="font-weight:800;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">🎯 Objectif mois '+month+'</div>'+
      '<div style="font-weight:900;font-size:15px">'+goal.target+' kg — 🎁 '+esc(goal.reward||"—")+'</div></div>';
  }

  // Alerte en cours
  if(alert){
    h+='<div class="card" style="background:#FFF8F0;border:2px solid #FFE0B2"><div style="font-weight:800;font-size:11px;color:var(--warn-d);text-transform:uppercase;margin-bottom:4px">⚠️ Alerte active</div>'+
      '<div style="font-size:12px;color:#7A4A00;line-height:1.6">'+alert.msg+'</div></div>';
  }

  // Courbes
  function chart(title,color,key,min,max){
    var vals=series.slice(0,Math.max(t90+1,7)).map(function(s){return s[key];});

  }
  h+=chart("Score global",R,"score",0,100);
  h+=chart("Poids (kg)","#555","poids",null,null);
  h+=chart("Mental",B,"mental",0,100);

  // Bilans dimanche avec questions
  var bilans=series.filter(function(s){return s.bilan&&(s.bilan.victoire||s.bilan.ressenti||s.bilan.blocage||s.bilan.question);});
  if(bilans.length){
    h+='<div style="display:flex;align-items:center;gap:8px;margin:16px 0 10px"><div class="bar bar-r"></div><span style="font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:1px">Bilans dimanche</span></div>';
    for(var b=bilans.length-1;b>=0;b--){

      h+='<div class="card" style="border-left:4px solid '+R+'">'+

      h+='</div>';
    }
  }

  // 📅 Calendrier 90 jours (couleurs client)
  h+='<div class="card"><div style="font-weight:900;font-size:13px;margin-bottom:10px">📅 Son calendrier</div>';
  (function(){
    var wkO=(new Date(c.start_date).getDay()+6)%7;
    for(var mi3=0;mi3<3;mi3++){
      if(mi3*28>t90)break;
      h+='<div style="font-size:11px;font-weight:800;color:var(--mute);letter-spacing:1px;margin:8px 0 4px">MOIS '+(mi3+1)+'</div>';
      var nR=Math.ceil((28+wkO)/7);
      for(var w3=0;w3<nR;w3++){
        h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:13px;margin-bottom:12px">';
        for(var dd3=0;dd3<7;dd3++){
          var sl=w3*7+dd3-wkO;
          if(sl<0||sl>=28){h+='<div style="aspect-ratio:1;border-radius:5px;background:#F6F6F6"></div>';continue;}
          var ix=mi3*28+sl;
          if(ix>=90){h+='<div></div>';continue;}
          var bg2="#EEF4FF";
          if(ix<=t90){
            var dO=allData[ix];
            if(!dO||!dO.habits)bg2="var(--bad)";
            else{var sc2=dayScore(dO);bg2=sc2===100?"var(--ok)":sc2>=50?"var(--ok-l)":sc2>0?"#FFD0B0":"var(--bad)";}
          }
          // Même règle que côté client : l'éclair = les 3 questions remplies.
          var mDot2=mindsetFull(allData,ix)?'<span style="position:absolute;top:-7px;right:-5px;width:26px;height:26px;border-radius:50%;background:#2FBF71;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1">⚡</span>':"";
          h+='<div style="aspect-ratio:1;border-radius:5px;background:'+bg2+';display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:'+(ix<=t90?"var(--ink)":"#A0B8D8")+';position:relative'+(ix===t90?';outline:2px solid var(--brand)':'')+'">'+(ix+1)+mDot2+'</div>';
        }
        h+='</div>';
      }
    }
  })();
  // La légende disait « ⚡ mission » sans préciser que la pastille ne
  // s'affiche QUE si une mission du jour a été définie — pas quand le client
  // remplit simplement ses habitudes. D'où l'impression que l'éclair manque.
  h+='<div style="font-size:11px;color:var(--mute);margin-top:6px;line-height:1.6">🟢 complet · 🟠 partiel · 🔴 manqué'+
    '<br><span style="opacity:.85">⚡ les 3 questions du mindset ont été remplies</span></div></div>';

  h+=cdSecOpen("reglages","⚙️","Réglages du client","Date de départ, accès à l&rsquo;appli");
  // 🚀 Date de départ (modifiable)
