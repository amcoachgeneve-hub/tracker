// Agrège tous les clients : rétention, abandons, résultats.
function coachAnalytics(){
  var tous=lsGet("amcoach_clients",[]);
  // Tests et clients non payants : exclus des KPI, mais leurs données restent
  var cl=tous.filter(function(c){return !c.horsStats;});
  var out={exclus:tous.length-cl.length,total:cl.length,objectifs:[],objAtteints:0,enAttente:0,clients:[],paliers:[],finis:0,actifs:0,abandons:0,
           kgTotal:0,pertes:[],remplissage:[],series:[],jourAbandon:[]};
  var auj=new Date();
  for(var i=0;i<cl.length;i++){
    var c=cl[i], d=lsGet("amcoach_"+c.slug,{});
    var dur=progLen(c.start_date)||90;
    var t90=getToday90(c.start_date);
    // Dernier jour renseigné + nombre de jours remplis
    var last=-1,remplis=0;
    for(var k=0;k<dur;k++){
      if(d[k]&&Object.keys(d[k]).length>0){remplis++;if(k>last)last=k;}
    }
    // Poids : premier et dernier renseignés
    var p1=null,p2=null;
    for(var w=0;w<dur;w++){if(d[w]&&d[w].poids){var v=parseFloat(d[w].poids);if(p1===null)p1=v;p2=v;}}
    var perte=(p1!=null&&p2!=null)?Math.round((p1-p2)*10)/10:null;
    // 🎯 Résultat : évalué UNIQUEMENT au bilan final, jamais sur une pesée du jour.
    // Un client au jour 20 n'a pas « raté » son objectif — il n'est pas encore évalué.
    var b6=d[600]||{}, cles=[];
    for(var bk in b6){if(b6.hasOwnProperty(bk)&&b6[bk])cles.push(bk);}
    cles.sort();
    var prem=null,dern=null;
    for(var ck=0;ck<cles.length;ck++){
      var bb=b6[cles[ck]];
      if(!prem&&bb.poids&&bb.poidsCible)prem={k:cles[ck],o:bb};
      if(bb.poids)dern={k:cles[ck],o:bb};
    }
    var obj=null, enAttente=false;
    if(prem){
      if(dern&&dern.k!==prem.k){
        var dep=parseFloat(prem.o.poids), cib=parseFloat(prem.o.poidsCible), fin=parseFloat(dern.o.poids);
        if(dep&&cib&&fin&&dep>cib){
          var vise=Math.round((dep-cib)*10)/10;
          var fait=Math.round((dep-fin)*10)/10;
          obj={depart:dep,cible:cib,vise:vise,fait:fait,final:fin,dateBilan:dern.k,
               pct:Math.min(200,Math.round(fait/vise*100)),
               atteint:fin<=cib, bonus:fin<cib?Math.round((cib-fin)*10)/10:0};
        }
      }else{
        enAttente=true; // objectif fixé, bilan final pas encore fait
      }
    }
    // Statut : fini / actif / décroché (rien depuis 10 jours et programme non terminé)
    var ecart=t90-last;
    var fini=last>=dur-1||t90>=dur-1&&remplis>=dur*0.6;
    var lache=!fini&&last>=0&&ecart>10;
    if(fini)out.finis++; else if(lache)out.abandons++; else out.actifs++;
    if(lache)out.jourAbandon.push(last+1);
    // Seuls les résultats validés au bilan alimentent les KPI de résultat
    if(obj){out.pertes.push(obj.fait);out.kgTotal+=obj.fait;}
    out.remplissage.push(dur>0?Math.round(remplis/Math.min(t90+1,dur)*100):0);
    out.series.push(bestStreak(d,Math.min(dur-1,Math.max(0,t90))));
    if(obj){out.objectifs.push(obj);if(obj.atteint)out.objAtteints++;}
    if(enAttente)out.enAttente++;
    out.clients.push({nom:c.name,slug:c.slug,jour:Math.min(t90+1,dur),dernier:last+1,
                      remplis:remplis,duree:dur,perte:perte,obj:obj,enAttente:enAttente,
                      statut:fini?"fini":lache?"lache":"actif",inactifDepuis:ecart});
  }
  // Courbe de rétention : combien ont atteint chaque palier
  var seuils=[7,14,30,60,90];
  for(var s2=0;s2<seuils.length;s2++){
    var n=0,elig=0;
    for(var j=0;j<out.clients.length;j++){
      var cc=out.clients[j];
      if(cc.jour>=seuils[s2]){elig++;if(cc.dernier>=seuils[s2])n++;}
    }
    out.paliers.push({j:seuils[s2],atteint:n,eligibles:elig,
                      pct:elig?Math.round(n/elig*100):null});
  }
  function moy(a){if(!a.length)return null;var t=0;for(var x=0;x<a.length;x++)t+=a[x];return Math.round(t/a.length*10)/10;}
  out.perteMoy=moy(out.pertes);
  out.remplMoy=moy(out.remplissage);
  out.serieMoy=moy(out.series);
  out.serieMax=out.series.length?Math.max.apply(null,out.series):null;
  out.abandonMed=out.jourAbandon.length?out.jourAbandon.slice().sort(function(a,b){return a-b;})[Math.floor(out.jourAbandon.length/2)]:null;
  out.meilleurePerte=out.pertes.length?Math.max.apply(null,out.pertes):null;
  out.tauxFin=out.total?Math.round(out.finis/out.total*100):0;
  // Taux d'objectifs atteints, calculé uniquement sur les clients qui en ont un
  out.objTotal=out.objectifs.length;
  out.tauxObj=out.objTotal?Math.round(out.objAtteints/out.objTotal*100):null;
  var sp=0,sb=0;
  for(var oi=0;oi<out.objectifs.length;oi++){sp+=out.objectifs[oi].pct;sb+=out.objectifs[oi].bonus;}
  out.objPctMoy=out.objTotal?Math.round(sp/out.objTotal):null;
  out.bonusTotal=Math.round(sb*10)/10;
  return out;
}

// Point 5 du rapport : donner au coach un résumé immédiat de qui va bien
// et de qui décroche, sans ouvrir cinq fiches.
function coachPouls(){
  var cl=lsGet("amcoach_clients",[]);
  var out={vert:[],orange:[],rouge:[],fini:[],tous:[]};
  for(var i=0;i<cl.length;i++){
    var c=cl[i], d=lsGet("amcoach_"+c.slug,{});
    var dur=progLen(c.start_date)||90;
    var t90=getToday90(c.start_date);
    var remplis=0,last=-1;
    for(var k=0;k<dur&&k<=t90;k++){
      if(d[k]&&Object.keys(d[k]).length>0){remplis++;if(k>last)last=k;}
    }
    var jours=Math.min(t90+1,dur);
    var assidu=jours>0?Math.round(remplis/jours*100):0;
    // Silence : d'abord la dernière ouverture réelle, sinon le dernier jour rempli
    var la=d[505]&&d[505].d;
    var sil=la?Math.floor((new Date(isoLocal())-new Date(la))/86400000):(last>=0?t90-last:jours);
    var fini=t90>=dur-1;
    var etat,motif;
    if(fini){etat="fini";motif="Programme terminé";}
    else if(sil>=7){etat="rouge";motif="Silence depuis "+sil+" jours";}
    else if(assidu<40&&jours>=5){etat="rouge";motif="Assiduité "+assidu+" %";}
    else if(sil>=3){etat="orange";motif="Rien depuis "+sil+" jours";}
    else if(assidu<70&&jours>=5){etat="orange";motif="Assiduité "+assidu+" %";}
    else {etat="vert";motif=sil<=1?"À jour":"Rien depuis "+sil+" j";}
    var o={nom:c.name,slug:c.slug,jour:jours,duree:dur,assidu:assidu,silence:sil,
           etat:etat,motif:motif,horsStats:!!c.horsStats};
    out[etat].push(o); out.tous.push(o);
  }
  // Les plus urgents d'abord
  var ordre={rouge:0,orange:1,vert:2,fini:3};
  out.tous.sort(function(a,b){
    if(ordre[a.etat]!==ordre[b.etat])return ordre[a.etat]-ordre[b.etat];
    return b.silence-a.silence;
  });
  return out;
}
// ═══════════════ 💸 MES DÉPENSES ═══════════════
// Saisie manuelle, volontairement. Aucune banque ne donne d'accès à un compte
// personnel sans agrément d'établissement financier — et les services qui
// promettent le contraire réclament les identifiants bancaires, ce qu'il ne
// faut jamais donner. Par ailleurs, noter une dépense est déjà la moitié du
// travail : un import automatique fait défiler des chiffres qu'on ne regarde
// plus. Deux tapes suffisent ici, comme pour le pipeline.
var DEP_CATS=[
  {k:"courses",  n:"Courses",     e:"🛒", c:"#5B8FC7"},
  {k:"resto",    n:"Restaurant",  e:"🍽️", c:"#E0A03C"},
  {k:"essence",  n:"Essence",     e:"⛽", c:"#7E6BB5"},
  {k:"salle",    n:"Salle",       e:"🏋️", c:"#2FBF71"},
  {k:"transport",n:"Transport",   e:"🚆", c:"#4AA3B8"},
  {k:"materiel", n:"Matériel pro",e:"🎥", c:"#8E9AAF"},
  {k:"maison",   n:"Maison",      e:"🏠", c:"#C77B5B"},
  {k:"extras",   n:"Extras",      e:"✨", c:"#C75B4A"}
];
function depCat(k){for(var i=0;i<DEP_CATS.length;i++){if(DEP_CATS[i].k===k)return DEP_CATS[i];}return DEP_CATS[DEP_CATS.length-1];}
function depLire(){var o=lsGet("amcoach_depenses",{});return (o&&typeof o==="object")?o:{};}
function depEcrire(o){lsSet("amcoach_depenses",o);}
// Les ABONNEMENTS sont à part : saisis UNE fois avec leur montant mensuel.
// C'est là que l'argent part sans qu'on le voie — un prélèvement ne se
// ressent pas, contrairement à un achat. Les compter à chaque mois
// automatiquement est le seul moyen de les rendre visibles.
function aboLire(){var l=lsGet("amcoach_abos",[]);return Array.isArray(l)?l:[];}
function aboEcrire(l){lsSet("amcoach_abos",l);}
function aboTotal(){var l=aboLire(),t=0;for(var i=0;i<l.length;i++){if(l[i].actif!==false)t+=(+l[i].montant||0);}return t;}

function moisCle(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2);}
function moisNom(cle){
  var p=cle.split("-");
  var M=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  return M[(+p[1])-1]+" "+p[0];
}
function moisPrecedent(cle){
  var p=cle.split("-"), d=new Date(+p[0],(+p[1])-1,1);
  d.setMonth(d.getMonth()-1);
  return moisCle(d);
}
function depAjouter(cat,montant,note){
  var o=depLire(), m=moisCle();
  if(!o[m])o[m]=[];
  o[m].push({id:"d"+Date.now().toString(36),cat:cat,montant:+montant||0,note:note||"",d:isoLocal()});
  depEcrire(o);
}
function depSupprimer(m,id){
  var o=depLire();
  if(!o[m])return;
  o[m]=o[m].filter(function(x){return x.id!==id;});
  depEcrire(o);
}
// Bilan d'un mois : par catégorie, avec les abonnements ajoutés d'office.
function depMois(cle){
  var o=depLire(), L=o[cle]||[], par={}, total=0;
  for(var i=0;i<DEP_CATS.length;i++)par[DEP_CATS[i].k]=0;
  for(var j=0;j<L.length;j++){par[L[j].cat]=(par[L[j].cat]||0)+(+L[j].montant||0);total+=(+L[j].montant||0);}
  var abo=aboTotal();
  return {liste:L, par:par, saisi:Math.round(total), abo:Math.round(abo), total:Math.round(total+abo)};
}
// Comparaison avec le mois précédent, catégorie par catégorie : c'est la
// variation qui informe, pas le montant absolu.
function depCompare(cle){
  var A=depMois(cle), B=depMois(moisPrecedent(cle));
  var lignes=[];
  for(var i=0;i<DEP_CATS.length;i++){
    var k=DEP_CATS[i].k, a=Math.round(A.par[k]||0), b=Math.round(B.par[k]||0);
    if(!a&&!b)continue;
    lignes.push({cat:DEP_CATS[i], now:a, prev:b, delta:a-b,
                 pct:A.saisi?Math.round(a/A.saisi*100):0});
  }
  lignes.sort(function(x,y){return y.now-x.now;});
  return {mois:A, prec:B, lignes:lignes, deltaTotal:A.total-B.total, precVide:!B.saisi};
}
// Conseils : uniquement ce qui est calculé depuis SES chiffres. Pas de
// leçon générale sur l'épargne — un conseil qui ne s'appuie pas sur un
// montant réel se lit comme un slogan et ne fait rien changer.
function depConseils(cle,prixClient){
  var C=depCompare(cle), out=[];
  var abos=aboLire().filter(function(a){return a.actif!==false;});
  // 1. Les abonnements, ramenés à ce qu'ils coûtent sur un an
  if(C.mois.abo>0){
    out.push({t:"Tes abonnements",
      m:C.mois.abo+" CHF par mois, soit "+(C.mois.abo*12)+" CHF sur l'année. "+
        (abos.length>1?"Passe-les en revue : lequel n'a pas servi ce mois-ci ?":"")});
  }
  // 2. La catégorie qui a le plus augmenté
  var pire=null;
  for(var i=0;i<C.lignes.length;i++){if(!pire||C.lignes[i].delta>pire.delta)pire=C.lignes[i];}
  if(pire&&pire.delta>0&&!C.precVide){
    out.push({t:pire.cat.n+" : +"+pire.delta+" CHF",
      m:"C'est le poste qui a le plus augmenté par rapport au mois dernier ("+pire.prev+" → "+pire.now+" CHF)."});
  }
  // 3. Le poste le plus lourd
  if(C.lignes.length&&C.lignes[0].now>0){
    out.push({t:C.lignes[0].cat.n+" pèse le plus",
      m:C.lignes[0].now+" CHF, soit "+C.lignes[0].pct+" % de ce que tu as saisi ce mois-ci."});
  }
  // 4. Le croisement avec le coaching : ce qui rend le chiffre concret
  if(prixClient>0&&C.mois.total>0){
    var mois=Math.round(C.mois.total/prixClient*10)/10;
    out.push({t:"En clients",
      m:"Ton mois représente "+mois+" client"+(mois>1?"s":"")+" à "+prixClient+" CHF. "+
        (C.mois.abo>0?"Tes seuls abonnements coûtent "+(Math.round(C.mois.abo*12/prixClient*10)/10)+" client par an.":"")});
  }
  return out;
}

// ═══════════════ 💰 CHIFFRE D'AFFAIRES ═══════════════
// Le CA se calcule depuis les prospects SIGNÉS : chacun porte son montant et
// sa date de signature. Pas de saisie en double — l'argent découle du
// pipeline, il ne se note pas à part.
var CA_PRIX_DEFAUT=1200;   // sert quand un client signé n'a pas de montant saisi
function caMoisCle(iso){return String(iso||"").slice(0,7);}
function caNomMois(m){
  var M=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  return M[(+m)-1]||"";
}
// Tous les mois où il y a eu au moins une signature, du plus ancien au plus récent
function caParMois(){
  var L=pipeLire(), par={};
  for(var i=0;i<L.length;i++){
    var p=L[i];
    if(p.etape!=="gagne")continue;
    var cle=caMoisCle(p.signe||p.maj||p.cree);
    if(!cle||cle.length<7)continue;
    if(!par[cle])par[cle]={cle:cle,n:0,ca:0,clients:[]};
    var m=(+p.montant>0)?+p.montant:CA_PRIX_DEFAUT;
    par[cle].n++; par[cle].ca+=m; par[cle].clients.push(p);
  }
  var out=[];
  for(var k in par)out.push(par[k]);
  out.sort(function(a,b){return a.cle<b.cle?-1:1;});
  return out;
}
// Comparaison ANNÉE SUR ANNÉE : le même mois, un an plus tôt. C'est la seule
// comparaison honnête pour une activité saisonnière — comparer août à juillet
// ne dit rien quand l'été est structurellement creux.
function caAnneeSurAnnee(cle){
  var L=caParMois(), map={};
  for(var i=0;i<L.length;i++)map[L[i].cle]=L[i];
  var p=cle.split("-");
  var precCle=(+p[0]-1)+"-"+p[1];
  var now=map[cle]?map[cle].ca:0, prev=map[precCle]?map[precCle].ca:null;
  return {now:now, prev:prev, cle:precCle,
          delta:(prev!=null)?now-prev:null,
          pct:(prev>0)?Math.round((now-prev)/prev*100):null};
}
// MOIS CREUX : moyenne par mois de l'année, tous exercices confondus.
// Un mois n'est déclaré creux que s'il a au moins 2 années d'historique OU
// s'il est nettement sous la moyenne générale — sinon on prendrait un mois
// simplement récent pour un mois faible.
function caSaisonnalite(){
  var L=caParMois();
  if(!L.length)return null;
  var parMois={}, total=0, nbMois=0;
  for(var i=0;i<L.length;i++){
    var m=L[i].cle.split("-")[1];
    if(!parMois[m])parMois[m]={m:m,ca:0,annees:0};
    parMois[m].ca+=L[i].ca; parMois[m].annees++;
    total+=L[i].ca; nbMois++;
  }
  var moy=nbMois?total/nbMois:0;
  var lignes=[];
  for(var k in parMois){
    var moyMois=parMois[k].ca/parMois[k].annees;
    lignes.push({m:k, nom:caNomMois(k), moy:Math.round(moyMois), annees:parMois[k].annees,
                 ecart:moy?Math.round((moyMois-moy)/moy*100):0});
  }
  lignes.sort(function(a,b){return a.m<b.m?-1:1;});
  var creux=[], forts=[];
  for(var j=0;j<lignes.length;j++){
    if(lignes[j].ecart<=-25)creux.push(lignes[j]);
    else if(lignes[j].ecart>=25)forts.push(lignes[j]);
  }
  return {lignes:lignes, moyenne:Math.round(moy), creux:creux, forts:forts,
          fiable:nbMois>=6};   // en dessous, la saisonnalité ne veut rien dire
}
// Quel mois arrive, et faut-il s'en méfier ?
function caMoisAVenir(){
  var S=caSaisonnalite();
  if(!S||!S.fiable)return null;
  var d=new Date(); d.setMonth(d.getMonth()+1);
  var m=("0"+(d.getMonth()+1)).slice(-2);
  for(var i=0;i<S.creux.length;i++){
    if(S.creux[i].m===m)return S.creux[i];
  }
  return null;
}
// 🎯 CALCULATEUR D'OBJECTIF INVERSÉ (Marvin) : combien de bilans faut-il
// caler pour atteindre un CA visé, compte tenu de MON taux de signature réel.
function caObjectif(cible){
  var K=pipeKPI(), L=pipeLire();
  var somme=0,n=0;
  for(var i=0;i<L.length;i++){
    if(L[i].etape==="gagne"){somme+=(+L[i].montant>0)?+L[i].montant:CA_PRIX_DEFAUT;n++;}
  }
  var panier=n?Math.round(somme/n):CA_PRIX_DEFAUT;
  var taux=(K.taux!=null&&K.taux>0)?K.taux:null;
  var clients=panier?Math.ceil(cible/panier):null;
  var bilans=(clients!=null&&taux)?Math.ceil(clients/(taux/100)):null;
  return {panier:panier, taux:taux, clients:clients, bilans:bilans,
          // Le nombre de contacts est un ordre de grandeur : il suppose que
          // le taux de passage contact → bilan reste celui du pipeline actuel.
          contacts:(bilans!=null&&K.total&&K.atteint&&K.atteint.bilan)?
                   Math.ceil(bilans*(K.total/Math.max(1,K.atteint.bilan))):null};
}

// ═══════════════ 📋 BILANS LIBRES ═══════════════
// Un bilan sans tracker. Akli reçoit des gens en rendez-vous : il prend les
// mesures, fait le questionnaire — et tous ne signent pas. Ceux-là ne doivent
// pas avoir de lien DISCIPLINE 90, mais leur bilan doit rester consultable.
// Stockage à part du pipeline : ces personnes ne sont pas des prospects en
// cours de closing, ce sont des bilans faits. Les compter dans le pipeline
// fausserait tous les taux de conversion.
function blvLire(){var l=lsGet("amcoach_bilans_libres",[]);return Array.isArray(l)?l:[];}
function blvEcrire(l){lsSet("amcoach_bilans_libres",l);}
function blvTrouver(id){var L=blvLire();for(var i=0;i<L.length;i++){if(L[i].id===id)return L[i];}return null;}
function blvNom(p){
  if(!p)return "";
  var n=((p.prenom||"")+" "+(p.nom||"")).trim();
  return n||p.nomComplet||"Sans nom";
}
function blvSauver(p){
  var L=blvLire(),trouve=false;
  for(var i=0;i<L.length;i++){if(L[i].id===p.id){L[i]=p;trouve=true;}}
  if(!trouve)L.unshift(p);
  blvEcrire(L);
}
function blvDate(p){
  var b=(p.bilans||[]);
  if(!b.length)return p.cree||"";
  return b[b.length-1].date||p.maj||p.cree||"";
}

// 📋 ÉCRAN « MES BILANS » — la liste de tous les gens vus en rendez-vous
function viewCoachBilans(){
  var L=blvLire();
  var q=(state.blvQ||"").toLowerCase();
  var vus=L.slice();
  if(q)vus=vus.filter(function(p){return blvNom(p).toLowerCase().indexOf(q)>-1;});
  // Un bilan libre peut avoir donné un client : on le signale.
  var clients=lsGet("amcoach_clients",[]);
  function estClient(p){
    if(p.clientSlug)return p.clientSlug;
    for(var i=0;i<clients.length;i++){if(clients[i].name===blvNom(p))return clients[i].slug;}
    return null;
  }
  var signes=0;
  for(var s=0;s<L.length;s++){if(estClient(L[s]))signes++;}

  var h='<div class="app" style="max-width:480px">'+
    '<div class="hdr"><div style="display:flex;align-items:center;gap:12px">'+
    '<button id="blv-back" class="day-back">←</button>'+
    '<div style="flex:1"><div style="color:#fff;font-weight:900;font-size:16px">📋 Mes bilans</div>'+
    '<div style="color:var(--mute);font-weight:400;font-size:12px">'+L.length+' personne'+(L.length>1?'s':'')+' reçue'+(L.length>1?'s':'')+
    (L.length?' · '+signes+' signé'+(signes>1?'s':''):'')+'</div></div></div></div>'+
    '<div style="padding:14px 14px 90px">'+
    '<button id="blv-new" class="big-btn" style="padding:15px 0;font-size:14.5px;margin-bottom:14px">+ Nouveau bilan</button>';

  if(!L.length){
    h+='<div class="card" style="padding:18px 16px;text-align:center">'+
      '<div style="font-size:30px">📋</div>'+
      '<div style="font-weight:800;font-size:14px;margin-top:6px">Aucun bilan pour l\'instant</div>'+
      '<div style="font-size:12px;color:var(--mute);line-height:1.5;margin-top:5px">Quand tu reçois quelqu\'un en rendez-vous, ouvre un bilan ici. Pas besoin de lui créer un lien tant qu\'il n\'a pas signé.</div></div>';
  }else{
    if(L.length>4){
      h+='<input id="blv-q" placeholder="🔍 Rechercher un nom..." value="'+esc(state.blvQ||"")+'" style="width:100%;padding:12px 15px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;font-weight:700;margin-bottom:12px"/>';
    }
    for(var i=0;i<vus.length;i++){
      var p=vus[i], nb=(p.bilans||[]).length, slug=estClient(p);
      var d=blvDate(p);
      h+='<div class="card" style="padding:13px 15px;margin-bottom:9px">'+
        '<div style="display:flex;align-items:center;gap:10px">'+
        '<div style="flex:1;min-width:0">'+
        '<div style="font-weight:800;font-size:14px">'+esc(blvNom(p))+
        (slug?' <span style="font-size:10.5px;font-weight:800;color:var(--ok-d)">✅ client</span>':'')+'</div>'+
        '<div style="font-size:11.5px;color:var(--mute);margin-top:2px">'+
        // Une fiche sans analyse est une personne reçue dont le bilan reste
        // à remplir : le dire explicitement vaut mieux qu'un « 0 analyse »
        // qui se lit comme une erreur.
        (nb?nb+' analyse'+(nb>1?'s':'')+(d?' · '+esc(d):''):'<span style="color:var(--warn-d);font-weight:700">bilan à remplir</span>')+
        (p.tel?' · '+esc(p.tel):'')+'</div></div>'+
        '<button class="blv-open" data-id="'+p.id+'" style="flex:0 0 auto;padding:9px 13px;border-radius:11px;border:0;background:var(--brand);color:#fff;font-size:12px;font-weight:800">Ouvrir</button>'+
        // 🗑️ Retirer la personne de la liste — pour les essais, et pour les
        // fiches créées par erreur. Distinct du 🗑️ des analyses, qui ne
        // supprime qu'une analyse à l'intérieur d'un bilan.
        '<button class="blv-del" data-id="'+p.id+'" style="flex:0 0 auto;padding:9px 11px;border-radius:11px;border:1.5px solid var(--line);background:#fff;color:var(--bad);font-size:12px;font-weight:800">🗑️</button>'+
        '</div></div>';
    }
    if(!vus.length){
      h+='<div style="font-size:12px;color:var(--mute);font-style:italic;text-align:center;padding:14px 0">Aucun nom ne correspond.</div>';
    }
  }
  h+='</div></div>';
  return h;
}

// ═══════════════ 📈 KPI COMMERCIAL — PIPELINE ═══════════════
// Un prospect ne se perd presque jamais en rendez-vous. Il se perd ENTRE deux
// étapes, parce que personne ne savait qu'il était bloqué. Ce module sert à
// ça : voir d'un coup d'œil qui attend une réponse depuis trop longtemps.
// Stockage local (slot "amcoach_pipeline") — c'est l'outil du coach, il ne
// dépend d'aucun client et n'a pas besoin d'être synchronisé pour servir.
var PIPE_ETAPES=[
  {k:"contact", n:"Contact identifié", d:"Il t'a écrit, suivi, ou tu l'as abordé en salle", e:"👋", c:"#8E9AAF"},
  {k:"qualifie",n:"Besoin qualifié",   d:"Il a exprimé une vraie douleur : dos, fatigue, ventre", e:"🎯", c:"#5B8FC7"},
  {k:"propose", n:"Bilan proposé",     d:"Tu lui as proposé le bilan gratuit", e:"📩", c:"#7E6BB5"},
  {k:"bilan",   n:"Bilan fait",        d:"L'entretien a eu lieu, il réfléchit", e:"🤝", c:"#E0A03C"},
  {k:"gagne",   n:"Gagné",             d:"Il a signé", e:"✅", c:"#2FBF71"},
  {k:"perdu",   n:"Perdu",             d:"Documenter POURQUOI : c'est là qu'on apprend", e:"⚪", c:"#B9C4CE"}
];
// Les 4 premières étapes sont "actives" : c'est là qu'un prospect peut pourrir.
var PIPE_ACTIVES=["contact","qualifie","propose","bilan"];
// D'OÙ il vient. Une seule réponse — c'est ce qui rend le chiffre exploitable :
// si on autorise plusieurs sources, on ne sait plus laquelle a vraiment amené
// la personne, et le taux de conversion par canal ne veut plus rien dire.
var PIPE_SOURCES=[
  {k:"meyrin",  n:"Salle Meyrin",   e:"🏋️"},
  {k:"champel", n:"Salle Champel",  e:"🏋️"},
  {k:"versoix", n:"Salle Versoix",  e:"🏋️"},
  {k:"insta",   n:"Instagram",      e:"📸"},
  {k:"linkedin",n:"LinkedIn",       e:"💼"},
  {k:"google",  n:"Google",         e:"🔍"},
  {k:"whatsapp",n:"WhatsApp",       e:"💬"},
  {k:"calendly",n:"Lien Calendly",  e:"📅"},
  {k:"vsl",     n:"Page 14 jours",  e:"🎬"},
  {k:"bouche",  n:"Recommandation", e:"🗣️"},
  {k:"ancien",  n:"Ancien client",  e:"🔄"},
  {k:"autre",   n:"Autre",          e:"•"}
];
// Ce que devient un client APRÈS la signature. Convertir n'est pas réussir :
// c'est le résultat obtenu qui fait la recommandation et le renouvellement.
var PIPE_RESULTATS=[
  {k:"encours", n:"En cours",           e:"⏳", c:"#8E9AAF"},
  {k:"atteint", n:"Objectif atteint",   e:"🏆", c:"#2FBF71"},
  {k:"partiel", n:"Progrès partiels",   e:"📈", c:"#E0A03C"},
  {k:"abandon", n:"A abandonné",        e:"🚪", c:"#C96A5A"}
];
function pipeResultat(k){for(var i=0;i<PIPE_RESULTATS.length;i++){if(PIPE_RESULTATS[i].k===k)return PIPE_RESULTATS[i];}return PIPE_RESULTATS[0];}
// Nom affiché : prénom + nom, en tolérant les fiches d'avant la séparation
// des deux champs (où tout était dans `nom`).
function pipeNomComplet(p){
  var t=((p.prenom||"")+" "+(p.nom||"")).trim();
  return t||p.nom||"";
}
// CE QU'IL VIENT CHERCHER. Plusieurs réponses possibles : personne ne vient
// pour une seule raison, et c'est le croisement qui est intéressant.
var PIPE_DOULEURS=[
  {k:"poids",   n:"Perdre du poids", e:"⚖️"},
  {k:"dos",     n:"Mal de dos",      e:"🦴"},
  {k:"fatigue", n:"Fatigue",         e:"😴"},
  {k:"ventre",  n:"Ventre",          e:"🫃"},
  {k:"muscle",  n:"Se muscler",      e:"💪"},
  {k:"sante",   n:"Santé / bilan",   e:"❤️"},
  {k:"confiance",n:"Confiance en soi",e:"✨"},
  {k:"reprise", n:"Reprise du sport", e:"🔁"}
];
function pipeSource(k){for(var i=0;i<PIPE_SOURCES.length;i++){if(PIPE_SOURCES[i].k===k)return PIPE_SOURCES[i];}return null;}
function pipeDouleur(k){for(var i=0;i<PIPE_DOULEURS.length;i++){if(PIPE_DOULEURS[i].k===k)return PIPE_DOULEURS[i];}return null;}
// Règle des 3 relances (Marvin, partie 2) : J+3, J+7, J+15 après le dernier
// contact. La majorité des ventes se font après la 3ᵉ relance, pas la 1ʳᵉ.
var PIPE_RELANCES=[3,7,15];
// Règle du pipeline propre : un prospect doit changer d'étape ou être relancé
// sous 7 jours. Au-delà, il est considéré comme en train de refroidir.
var PIPE_SEUIL_BLOQUE=7;

// ═══ 📣 PROSPECTION QUOTIDIENNE (méthode 20/30 de Marvin, adaptée) ═══
// « Au début, le problème est souvent plus simple : ils ne parlent pas à
// assez de monde. » Le pipeline ne se remplit pas tout seul — ces trois
// compteurs mesurent l'ENTRÉE, là où les KPI plus bas mesurent la sortie.
var PROSP_ACTIONS=[
  {k:"salle",   n:"Conversations en salle", d:"Meyrin · Champel · Versoix", e:"🗣️", obj:6, c:"#5B8FC7"},
  {k:"dm",      n:"Messages / DM",          d:"Instagram, WhatsApp, LinkedIn", e:"📱", obj:5, c:"#7E6BB5"},
  {k:"relance", n:"Relances de contacts",   d:"Anciens leads, clients passés", e:"📞", obj:5, c:"#E0A03C"},
  {k:"porte",   n:"Porte-à-porte",           d:"Cabinets, commerces, entreprises", e:"🚪", obj:3, c:"#2FBF71"}
];
// CE QUI S'EST PASSÉ pendant l'interaction. C'est la vraie mesure : parler à
// dix personnes sans laisser une trace ne vaut pas parler à trois en donnant
// son numéro. On note l'ISSUE, pas seulement le contact.
var PROSP_ISSUES=[
  {k:"parle",  n:"Juste parlé",       e:"💬", poids:0},
  {k:"numero", n:"Numéro donné",      e:"📱", poids:1},
  {k:"carte",  n:"Carte de visite",   e:"🪪", poids:1},
  {k:"recu",   n:"J'ai eu son numéro",e:"✅", poids:2},
  {k:"rdv",    n:"Bilan calé",        e:"📅", poids:3}
];
function prospIssue(k){for(var i=0;i<PROSP_ISSUES.length;i++){if(PROSP_ISSUES[i].k===k)return PROSP_ISSUES[i];}return PROSP_ISSUES[0];}
function prospLire(){var o=lsGet("amcoach_prospection",{});return (o&&typeof o==="object")?o:{};}
function prospEcrire(o){lsSet("amcoach_prospection",o);}
function prospJour(iso){var o=prospLire();return o[iso||isoLocal()]||{};}
function prospAjouter(k,n){
  var o=prospLire(), j=isoLocal();
  if(!o[j])o[j]={};
  o[j][k]=Math.max(0,(o[j][k]||0)+n);
  // Retirer un contact retire aussi la dernière entrée détaillée du même type
  if(n<0&&o[j].detail){
    for(var i=o[j].detail.length-1;i>=0;i--){
      if(o[j].detail[i].type===k){o[j].detail.splice(i,1);break;}
    }
  }
  prospEcrire(o);
}
// Journal détaillé : type d'action, ce qu'on a laissé, et à qui.
// « Porte-à-porte cabinet du Dr X, 1201 » vaut mieux qu'un compteur muet :
// dans six mois c'est la seule trace qui permettra de repasser.
function prospJournal(type,issue,qui,cp){
  var o=prospLire(), j=isoLocal();
  if(!o[j])o[j]={};
  o[j][type]=(o[j][type]||0)+1;
  if(!o[j].detail)o[j].detail=[];
  o[j].detail.push({type:type, issue:issue||"parle", qui:qui||"", cp:cp||"", h:new Date().toTimeString().slice(0,5)});
  prospEcrire(o);
}
// Ce qui a été laissé cette semaine : numéros, cartes, bilans calés.
function prospIssuesSemaine(){
  var o=prospLire(), r={}, d=new Date();
  for(var i=0;i<PROSP_ISSUES.length;i++)r[PROSP_ISSUES[i].k]=0;
  for(var k=6;k>=0;k--){
    var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-k);
    var iso=x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2);
    var det=(o[iso]&&o[iso].detail)||[];
    for(var m=0;m<det.length;m++)r[det[m].issue]=(r[det[m].issue]||0)+1;
  }
  return r;
}
function prospObjectif(){var t=0;for(var i=0;i<PROSP_ACTIONS.length;i++)t+=PROSP_ACTIONS[i].obj;return t;}
function prospTotal(d){var t=0;for(var i=0;i<PROSP_ACTIONS.length;i++)t+=(d[PROSP_ACTIONS[i].k]||0);return t;}
// (la clé "detail" est un tableau : elle n'entre jamais dans les totaux)
// Bilan de la semaine : ce qui compte n'est pas le record d'un jour, c'est
// le nombre de JOURS TENUS. Marvin : la régularité avant l'intensité.
function prospSemaine(){
  var o=prospLire(), jours=[], total=0, tenus=0, obj=prospObjectif();
  var d=new Date();
  for(var i=6;i>=0;i--){
    var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-i);
    var iso=x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2);
    var j=o[iso]||{}, t=prospTotal(j);
    jours.push({iso:iso, n:t, jour:["D","L","M","M","J","V","S"][x.getDay()]});
    total+=t; if(t>=obj)tenus++;
  }
  return {jours:jours, total:total, tenus:tenus, moyenne:Math.round(total/7*10)/10, objSem:obj*7};
}

function pipeLire(){var l=lsGet("amcoach_pipeline",[]);return Array.isArray(l)?l:[];}
function pipeEcrire(l){lsSet("amcoach_pipeline",l);}
function pipeEtape(k){for(var i=0;i<PIPE_ETAPES.length;i++){if(PIPE_ETAPES[i].k===k)return PIPE_ETAPES[i];}return PIPE_ETAPES[0];}
function pipeJoursDepuis(iso){
  if(!iso)return 0;
  var a=new Date(iso+"T12:00:00"), b=new Date();
  return Math.max(0,Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/86400000));
}
// État d'un prospect : depuis combien de temps il n'a pas bougé, et quelle
// relance est due aujourd'hui selon la règle J+3 / J+7 / J+15.
function pipeEtat(p){
  var ref=p.maj||p.cree;
  var j=pipeJoursDepuis(ref);
  var actif=PIPE_ACTIVES.indexOf(p.etape)>-1;
  var faites=p.relances||0;
  var due=null;
  if(actif&&faites<PIPE_RELANCES.length&&j>=PIPE_RELANCES[faites])due=PIPE_RELANCES[faites];
  return {jours:j, actif:actif, bloque:actif&&j>=PIPE_SEUIL_BLOQUE, relanceDue:due,
          relancesFaites:faites, prochaine:actif&&faites<PIPE_RELANCES.length?PIPE_RELANCES[faites]:null};
}
// Chiffres du pipeline : ce qui compte, c'est ce qui est bloqué.
function pipeKPI(){
  var L=pipeLire(), par={}, bloques=[], relances=[];
  for(var i=0;i<PIPE_ETAPES.length;i++)par[PIPE_ETAPES[i].k]=0;
  for(var j=0;j<L.length;j++){
    var p=L[j]; par[p.etape]=(par[p.etape]||0)+1;
    var E=pipeEtat(p);
    if(E.bloque)bloques.push(p);
    if(E.relanceDue)relances.push(p);
  }
  var actifs=0;
  for(var a=0;a<PIPE_ACTIVES.length;a++)actifs+=par[PIPE_ACTIVES[a]]||0;
  var g=par.gagne||0, pe=par.perdu||0, decides=g+pe;
  // 🔎 TAUX DE PASSAGE, étape par étape. Un prospect qui a signé est
  // forcément passé par toutes les étapes avant : on compte donc, pour
  // chaque étape, tous ceux qui l'ont ATTEINTE — pas seulement ceux qui
  // y sont aujourd'hui. Sans ça, on ne voit pas OÙ on perd les gens.
  var ORD=PIPE_ACTIVES.concat(["gagne"]);
  var atteint={};
  for(var o=0;o<ORD.length;o++)atteint[ORD[o]]=0;
  for(var m=0;m<L.length;m++){
    var pos=ORD.indexOf(L[m].etape);
    // Un perdu a atteint l'étape où il s'est arrêté : on la retrouve dans
    // sa dernière position connue avant la sortie.
    if(L[m].etape==="perdu")pos=ORD.indexOf(L[m].avant||"contact");
    for(var w=0;w<=pos&&pos>=0;w++)atteint[ORD[w]]++;
  }
  // 📊 Par SOURCE et par MOTIF : entrés, signés, taux. C'est ce qui dit où
  // investir son temps de prospection — un canal qui amène beaucoup de
  // contacts mais aucun client coûte plus qu'il ne rapporte.
  function grouper(champ,multi){
    var g={};
    for(var x=0;x<L.length;x++){
      var v=L[x][champ];
      var cles=multi?(v||[]):(v?[v]:[]);
      for(var y=0;y<cles.length;y++){
        if(!g[cles[y]])g[cles[y]]={n:0,gagnes:0,perdus:0};
        g[cles[y]].n++;
        if(L[x].etape==="gagne")g[cles[y]].gagnes++;
        if(L[x].etape==="perdu")g[cles[y]].perdus++;
      }
    }
    for(var k in g){
      var d=g[k].gagnes+g[k].perdus;
      g[k].taux=d?Math.round(g[k].gagnes/d*100):null;
      g[k].transfo=g[k].n?Math.round(g[k].gagnes/g[k].n*100):0;
    }
    return g;
  }
  return {liste:L, par:par, actifs:actifs, bloques:bloques, relances:relances,
          parSource:grouper("source",false), parDouleur:grouper("douleurs",true),
          gagnes:g, perdus:pe, total:L.length, atteint:atteint, ordre:ORD,
          // Taux de transformation global : sur TOUT ce qui est entré dans le
          // pipeline, combien sont devenus clients. C'est le chiffre qui dit
          // si le système fonctionne, indépendamment des dossiers en cours.
          transfo:L.length?Math.round(g/L.length*100):null,
          // Taux de signature sur les dossiers TRANCHÉS seulement : inclure
          // les prospects encore en cours écraserait le taux vers le bas.
          taux:decides?Math.round(g/decides*100):null};
}
// Prochaine action concrète pour un prospect — jamais « je le tiens au courant ».
function pipeAction(p){
  var E=pipeEtat(p);
  if(!E.actif)return "";
  if(E.relanceDue)return "Relance "+(E.relancesFaites+1)+"/3 due (J+"+E.relanceDue+")";
  if(E.bloque)return "Bloqué depuis "+E.jours+" j — fais-le avancer ou sors-le";
  switch(p.etape){
    case "contact": return "Qualifier : quelle est sa vraie douleur ?";
    case "qualifie":return "Proposer le bilan gratuit";
    case "propose": return "Fixer la date du bilan";
    case "bilan":   return "Closer : une date, une action concrète";
  }
  return "";
}

// 🧭 LE CONSEIL DU JOUR — ton coach commercial.
// Une liste de noms ne fait pas agir : elle informe. Un conseil dit QUOI
// faire, sur QUI, et POURQUOI maintenant. On ne sort qu'UNE priorité à la
// fois — dix urgences, c'est aucune urgence.
function pipeConseil(K){
  // 1. Le plus urgent : quelqu'un que je n'ai jamais relancé et qui pourrit
  var jamais=null, pire=null;
  for(var i=0;i<K.liste.length;i++){
    var p=K.liste[i], E=pipeEtat(p);
    if(!E.actif)continue;
    if(!pire||E.jours>pipeEtat(pire).jours)pire=p;
    if(E.jours>=PIPE_SEUIL_BLOQUE&&!(p.relanceDates||[]).length){
      if(!jamais||E.jours>pipeEtat(jamais).jours)jamais=p;
    }
  }
  if(jamais){
    var Ej=pipeEtat(jamais);
    return {t:"Relance "+pipeNomComplet(jamais)+" aujourd'hui",
      m:"Il est à l'étape « "+pipeEtape(jamais.etape).n+" » depuis "+Ej.jours+" jours et tu ne l'as JAMAIS relancé. "+
        "La majorité des ventes se font après la 3ᵉ relance, pas la 1ʳᵉ. Un message court suffit : reprends ce qu'il t'a dit, et propose une date précise.",
      c:"var(--bad)"};
  }
  // 2. Des relances dues aujourd'hui
  if(K.relances.length){
    var n=K.relances.length;
    return {t:n+" relance"+(n>1?"s":"")+" à faire maintenant",
      m:(n>1
        ? "Commence par "+pipeNomComplet(K.relances[0])+" — bloque 15 minutes et enchaîne les "+n+". Groupées, elles te prennent moins de temps qu'étalées sur la semaine, et personne ne refroidit."
        : "Il s'agit de "+pipeNomComplet(K.relances[0])+" — deux minutes suffisent. Reprends ce qu'il t'a dit la dernière fois et propose une date précise, pas « je te tiens au courant »."),
      c:"var(--warn-d)"};
  }
  // 3. Des dossiers immobiles sans relance due : il faut trancher
  if(K.bloques.length){
    var b=K.bloques[0], Eb=pipeEtat(b);
    return {t:pipeNomComplet(b)+" ne bouge plus depuis "+Eb.jours+" jours",
      m:"Un prospect doit changer d'étape ou être relancé sous 7 jours. Au-delà, soit tu le fais avancer aujourd'hui, soit tu le sors du pipeline. "+
        "Un pipeline encombré de dossiers morts te cache les vrais.",
      c:"var(--warn-d)"};
  }
  // 4. Pipeline vide ou trop maigre : le problème est en amont
  if(K.actifs===0){
    return {t:"Ton pipeline est vide",
      m:"Aucun prospect en cours. Ce n'est pas un problème de closing, c'est un problème de volume. "+
        "Ton plan : 5 à 8 conversations en salle, 5 messages, 5 relances d'anciens contacts. Aujourd'hui, vise-en trois.",
      c:"var(--brand)"};
  }
  if(K.actifs<5){
    return {t:"Seulement "+K.actifs+" prospect"+(K.actifs>1?"s":"")+" en cours",
      m:"C'est trop peu pour que le taux de signature veuille dire quelque chose. Un « non » te rapproche du prochain « oui » — "+
        "mais encore faut-il parler à assez de monde. Ajoute-en deux ou trois cette semaine.",
      c:"var(--brand)"};
  }
  // 5. Là où ça coince dans l'entonnoir
  // On ne compte QUE les prospects sortis en « perdu » : quelqu'un encore
  // en cours à une étape n'est pas une perte, il y travaille. Sans ça, le
  // conseil accusait une étape où six personnes étaient simplement actives.
  var pireEtape=null, pirePerte=0, pertes={};
  for(var q=0;q<K.liste.length;q++){
    if(K.liste[q].etape!=="perdu")continue;
    var ou=K.liste[q].avant||"contact";
    pertes[ou]=(pertes[ou]||0)+1;
  }
  for(var o2 in pertes){
    if(pertes[o2]>pirePerte){pirePerte=pertes[o2];pireEtape=o2;}
  }
  if(pireEtape&&pirePerte>=2){
    var E2=pipeEtape(pireEtape);
    return {t:"Tu perds le plus à « "+E2.n+" »",
      m:pirePerte+" prospects se sont arrêtés là. C'est cette étape qu'il faut travailler, pas la prospection. "+
        "Regarde ce que tu dis à ce moment-là, et ce qui manque à la personne pour passer la suivante.",
      c:"var(--brand2)"};
  }
  return {t:"Pipeline propre",
    m:"Personne ne traîne, aucune relance en retard. C'est exactement l'état à tenir. Le seul risque maintenant : arrêter de prospecter parce que tout va bien.",
    c:"var(--ok-d)"};
}

      // 🪜 LE PARCOURS EN CASES À COCHER.

// ═══════════ CLIENTS SUPPRIMÉS ═══════════
// Le nuage fait autorité au rechargement : il réécrit la liste locale. Donc si
// le DELETE côté serveur n'a pas abouti (réseau coupé, ligne verrouillée), le
// client effacé réapparaissait au lancement suivant, comme si rien ne s'était
// passé. On garde donc la trace des slugs supprimés : ils sont filtrés à chaque
// chargement, et leur suppression est retentée en silence jusqu'à ce qu'elle passe.
function deletedSlugs(){return lsGet("amcoach_deleted",[]);}
function markDeleted(slug){
  var d=deletedSlugs();
  if(d.indexOf(slug)===-1){d.push(slug);lsSet("amcoach_deleted",d);}
}
function unmarkDeleted(slug){
  var d=deletedSlugs(),i=d.indexOf(slug);
  if(i>-1){d.splice(i,1);lsSet("amcoach_deleted",d);}
}
function isDeleted(slug){return deletedSlugs().indexOf(slug)>-1;}
// Nouvelle tentative de purge cloud pour tout ce qui traîne encore
function retryCloudPurge(slug){
  sbFetch("tracking?client_slug=eq."+encodeURIComponent(slug),{method:"DELETE"}).catch(function(){})
    .then(function(){return sbFetch("clients?slug=eq."+encodeURIComponent(slug),{method:"DELETE"});})
    .catch(function(){});
}

// 👤 Ouvrir la fiche d'un client. On affiche immédiatement ce qu'on a en
// mémoire — pas d'attente devant un écran vide — puis on redemande au nuage
// en arrière-plan. Sans ça, la fiche montrait l'état du dernier démarrage :
// un client qui remplissait sa journée restait invisible jusqu'au prochain
// rechargement complet de la page.
function ouvrirFiche(slug){
  if(!slug)return;
  state.coachDetail=slug;
  render();                       // on affiche tout de suite ce qu'on a
  coachLoadClient(slug,true);     // puis on redemande au nuage, sans attendre
}

// 📥 Supabase plafonne toute requête à 1000 lignes quand aucune limite n'est
// demandée. Avec une dizaine de clients qui remplissent chacun une centaine de
// journées, on dépassait ce plafond : des jours disparaissaient du tableau de
// bord — au hasard, puisque rien ne garantissait l'ordre. On récupère donc le
// suivi par tranches, jusqu'à ce que le nuage n'ait plus rien à donner.
function chargerTracking(page,acc){
  page=page||0; acc=acc||[];
  var TAILLE=1000;
  return sbFetch("tracking?select=client_slug,day_index,data&order=client_slug.asc,day_index.asc"+
                 "&limit="+TAILLE+"&offset="+(page*TAILLE))
    .then(function(r){return r.json();})
    .then(function(lot){
      if(!lot||!lot.length)return acc;
      acc=acc.concat(lot);
      if(lot.length<TAILLE||page>=40)return acc;   // garde-fou : 40 000 lignes max
      return chargerTracking(page+1,acc);
    })
    .catch(function(){return acc;});
}

function loadCoachDataFromCloud(){
  Promise.all([
    sbFetch("clients?select=*&order=created_at.desc").then(function(r){return r.json();}),
    chargerTracking()
  ]).then(function(results){
    var clients=results[0]||[], rows=results[1]||[];
    // Un client supprimé ne revient pas, quoi que dise le nuage.
    var revenus=[];
    clients=clients.filter(function(cc){
      if(isDeleted(cc.slug)){revenus.push(cc.slug);return false;}
      return true;
    });
    for(var rz=0;rz<revenus.length;rz++)retryCloudPurge(revenus[rz]);
    if(clients.length){
      // On FUSIONNE : le nuage remplace la liste, mais on retraduit hors_stats
      // et on conserve les champs locaux que Supabase ne connaît pas.
      var avant={},ancien=lsGet("amcoach_clients",[]);
      for(var a0=0;a0<ancien.length;a0++)avant[ancien[a0].slug]=ancien[a0];
      for(var c0=0;c0<clients.length;c0++){
        var cc=clients[c0], old=avant[cc.slug]||{};
        for(var k0 in old){if(old.hasOwnProperty(k0)&&!(k0 in cc))cc[k0]=old[k0];}
        cc.horsStats=(cc.hors_stats===true)||(cc.hors_stats===undefined&&!!old.horsStats);
      }
      lsSet("amcoach_clients",clients);
    }
    var bySlug={};
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      // Les lignes orphelines d'un client supprimé ne ressuscitent rien
      if(isDeleted(r.client_slug))continue;
      if(!bySlug[r.client_slug])bySlug[r.client_slug]={};
      bySlug[r.client_slug][r.day_index]=r.data;
    }
    for(var slug in bySlug){lsSet("amcoach_"+slug,bySlug[slug]);}
    render();
  }).catch(function(){});
}

function frNum(x){return String(Math.round(x*10)/10).replace(".",",");}
// ═══════════ CALCULATEUR V2 — protections IMC, ratios variables, sexe/taille/âge ═══════════
var CALC_SEUILS={
  H:{imcMin:20.0,mgSante:12,mgReco:10,kcalX:32,protX:1.8,protMax:2.0,
     ratios:{seul:0.60,encadre:0.75,bonus:0.85},
     rythmes:{seul:[0.5,0.8],encadre:[1.0,1.5],bonus:[1.5,2.0]}},
  F:{imcMin:19.0,mgSante:18,mgReco:15,kcalX:28,protX:1.6,protMax:1.8,
     ratios:{seul:0.55,encadre:0.70,bonus:0.80},
     rythmes:{seul:[0.3,0.5],encadre:[0.8,1.2],bonus:[1.2,1.6]}}
};
function calcPlanV2(sexe,p0,mga,mgc,taille,age){
  var isF=sexe==="F",S=CALC_SEUILS[isF?"F":"H"];
  var h2=(taille/100)*(taille/100);
  var f=mga/100,t=mgc/100;
  var imc0=p0/h2,obese=imc0>=30;
  var res={isF:isF,S:S,imc0:imc0,obese:obese,kcal:Math.round(p0*S.kcalX),warnings:[],scenarios:[]};
  // ─── Formule V2 (méthode AM Coach) : perte totale = poids × (MG% − cible%) ───
  res.L=p0*(f-t);
  res.pF=p0-res.L;
  res.imcF=res.pF/h2;
  // 🛡️ Protection IMC plancher : blocage + proposition ajustée
  res.blocked=res.imcF<S.imcMin;
  if(res.blocked){
    var Lmax=p0-S.imcMin*h2;
    if(Lmax>0.5){
      res.adjL=Lmax;
      res.adjP=S.imcMin*h2;
      res.adjMgc=Math.round((f-Lmax/p0)*1000)/10;
    }else{res.lockedFull=true;res.adjL=0;}
  }
  var Leff=res.blocked?(res.adjL||0):res.L;
  var pEff=p0-Leff;
  res.Leff=Leff;res.pEff=pEff;
  // Règle Akli : protéines sur le POIDS DE DÉPART.
  // Femme 1,6–1,8 g/kg · Homme 1,8–2,0 g/kg.
  res.prot=Math.round(S.protX*p0);
  res.protMax=Math.round((S.protMax||S.protX)*p0);
  res.protRef=p0; res.protBase="poids de départ";
  // ─── Avertissements ───
  if(mgc<S.mgReco){
    res.warnings.push({lvl:"comp",txt:"Cible "+mgc+" % = zone COMPÉTITION ("+(isF?"< 15 % femme":"< 10 % homme")+"). Non durable, réservé à une préparation encadrée de courte durée."});
  }
  if(mgc<S.mgSante){
    res.warnings.push({lvl:"med",txt:"Cible sous le seuil santé ("+S.mgSante+" % "+(isF?"femme":"homme")+") : risques hormonaux et immunitaires"+(isF?", aménorrhée possible":"")+". Avis médical recommandé avant d'engager ce plan."});
  }
  if(age&&age>=40){
    res.warnings.push({lvl:"age",txt:"Client 40+ : la sarcopénie accélère la fonte musculaire en déficit. La musculation devient le levier prioritaire, avec des protéines entre "+S.protX+" et "+(S.protMax||S.protX)+" g/kg de poids de départ ("+res.prot+" à "+res.protMax+" g/jour ici). En dessous, la perte se fera davantage sur le muscle."});
  }
  if(obese){
    res.warnings.push({lvl:"info",txt:"IMC de départ "+imc0.toFixed(1)+" (≥ 30) : rythmes maximum majorés de 50 % — les premières semaines perdent naturellement plus vite."});
  }
  // ─── 3 scénarios : même perte, composition et durée différentes ───
  var defs=[
    ["seul","🚶 Seul(e)",S.ratios.seul,S.rythmes.seul],
    ["encadre","🔥 Encadré AM Coach",S.ratios.encadre,S.rythmes.encadre],
    ["bonus","🎁 Bonus — protocole pro",S.ratios.bonus,S.rythmes.bonus]
  ];
  for(var i=0;i<defs.length;i++){
    var key=defs[i][0],label=defs[i][1],r=defs[i][2],ry=defs[i][3];
    var rMax=Math.round(ry[1]*(obese?1.5:1)*10)/10;
    res.scenarios.push({
      key:key,label:label,ratio:r,
      gras:r*Leff,maigre:(1-r)*Leff,
      rMin:ry[0],rMax:rMax,
      wMin:Leff>0?Math.max(1,Math.round(Leff/rMax)):0,
      wMax:Leff>0?Math.max(1,Math.round(Leff/ry[0])):0,
      in12:Leff>0&&ry[0]*12>=Leff
    });
  }
  return res;
}

function morphoAnalyse(sexe,profil,ventre,mgc){
  var isF=sexe==="F";

  // Seuils de tour de taille (IDF/OMS) : H 94/102 cm · F 80/88 cm
  var w1=isF?80:94,w2=isF?88:102;
  A.visceral=ventre>0?(ventre>=w2?2:ventre>=w1?1:0):null;
  A.w1=w1;A.w2=w2;A.ventre=ventre;

  if(profil==="androide"){
    A.ventrePlatCible=isF?"21-23 %":"13-15 %";
    A.ordre="Chez ce profil, le ventre est la zone dominante : il est souvent le DERNIER à finir complètement plat, mais la graisse viscérale répond très vite au déficit — le tour de taille descend dès les premières semaines.";

    A.ordre="Chez ce profil, le haut du corps et le ventre dégonflent en PREMIER — le ventre plat arrive relativement tôt. Hanches, fesses et cuisses sont la réserve préférée du corps : elles partent en DERNIER, c'est génétique et hormonal, pas un échec du programme.";

  }
  return A;
}

// Le coach n'a pas à trancher lui-même : l'appli lit les trois réponses et

// ce que la personne dit spontanément trahit son besoin dominant.

var BILAN_MARQUEURS={
  signification:{

    mots:["moi","mon corps","ma transfo","je veux le meilleur","le meilleur","passer un cap","niveau","me depasser","depasser","performance","exception","unique","sur-mesure","sur mesure","haut de gamme","excellence","fier","fierte","reussir","reussite","gagner","objectif","resultat","record","progresser","ambition","top","different","me demarquer","demarquer","challenge","competition","serieux","pro","optimiser","maximum"],

// On enlève les accents et la ponctuation pour que « dépassé » et « depasse »
// comptent pareil — sinon la détection dépend de l'orthographe du coach.
function blNorm(t){
  return String(t||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/['’]/g," ").replace(/[^a-z0-9 ]/g," ")
    .replace(/\s+/g," ").trim();
}
// Analyse les 3 réponses et renvoie un classement.
// La question 3 (« qui le remarquera en premier ? ») est la plus
// discriminante : elle force un choix entre soi et les autres. On la
// pondère double. La question 2 (l'échec passé) vient ensuite.
function bilanProfilAuto(rep){
  var poidsQ={pq1:1, pq2:1.2, pq3:2};
  var score={signification:0, acceptation:0, securite:0};
  var touches={signification:[], acceptation:[], securite:[]};
  var motsTotal=0;
  for(var q in poidsQ){
    var txt=blNorm(rep[q]);
    if(!txt)continue;
    motsTotal+=txt.split(" ").length;
    for(var k in BILAN_MARQUEURS){
      var M=BILAN_MARQUEURS[k];
      for(var i=0;i<M.mots.length;i++){
        var m=M.mots[i];
        // On cherche le mot entouré d'espaces pour éviter qu'« ose » morde
        // dans « chose » ou « seul » dans « seulement ».
        if((" "+txt+" ").indexOf(" "+m+" ")>-1||(m.indexOf(" ")>-1&&txt.indexOf(m)>-1)){
          var pts=(M.forts.indexOf(m)>-1)?2:1;
          score[k]+=pts*poidsQ[q];
          if(touches[k].indexOf(m)===-1)touches[k].push(m);
        }
      }
    }
  }
  var classe=[];
  for(var c in score)classe.push({k:c, s:Math.round(score[c]*10)/10, mots:touches[c]});
  classe.sort(function(a,b){return b.s-a.s;});
  var total=classe[0].s+classe[1].s+classe[2].s;
  var ecart=classe[0].s-classe[1].s;
  // Trois raisons de ne PAS trancher : rien trouvé, réponses trop courtes,
  // ou deux profils au coude à coude. Dans ces cas on le dit franchement
  // plutôt que d'afficher un profil que le coach croirait fiable.
  var etat="ok";
  if(!total)etat="rien";
  else if(motsTotal<12)etat="court";
  else if(ecart<2)etat="serre";
  return {classe:classe, top:classe[0], total:total, ecart:ecart, etat:etat, motsTotal:motsTotal,
          part:total?Math.round(classe[0].s/total*100):0};
}

// Tout ce qui est tapé est sauvegardé au fil de l'eau : fermer l'app ne perd rien.
// 🔑 IDENTIFIANT DU BILAN EN COURS, quelle que soit son origine.
// Le brouillon se repérait par `state.coachDetail` — vide pour un bilan de
// prospect ou un bilan libre. Résultat : rien n'était sauvegardé pour eux, et
// tout se perdait à la fermeture. Un seul point de vérité désormais.
function blSujet(){
  if(state.blLibre)return "libre-"+state.blLibre;
  if(state.blProspect)return "prosp-"+state.blProspect;
  return state.coachDetail||null;
}
function blDraftKey(slug){return "amcoach_bldraft_"+slug;}
function blDraftLire(slug){return lsGet(blDraftKey(slug),null);}
function blDraftEffacer(slug){try{localStorage.removeItem(blDraftKey(slug));}catch(e){}}
var __blTimer=null;
function blDraftSauver(){
  var slug=blSujet();
  if(!slug||state.blJusteEnregistre)return;
  var d={champs:{},maj:new Date().toISOString(),edit:state.blEdit||null};
  var n=document.querySelectorAll("#bl-form input,#bl-form textarea,#bl-form select");
  for(var i=0;i<n.length;i++){
    if(!n[i].id)continue;
    d.champs[n[i].id]=n[i].value;
  }
  // Boutons à état (sexe, profil de stockage)
  d.sexe=state.blSexe||null; d.profil=state.blProfil||null;
  lsSet(blDraftKey(slug),d);
  var ind=document.getElementById("bl-draft-info");
  if(ind)ind.textContent="💾 Brouillon enregistré à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
}
function blDraftPlanifier(){
  if(__blTimer)clearTimeout(__blTimer);
  __blTimer=setTimeout(blDraftSauver,600);
}
function blDraftRestaurer(){
  var slug=blSujet();
  var d=blDraftLire(slug);
  if(!d||!d.champs)return false;
  var n=0;
  for(var id in d.champs){
    if(!d.champs.hasOwnProperty(id))continue;
    var el=document.getElementById(id);
    if(el&&d.champs[id]!==""){el.value=d.champs[id];n++;}
  }
  if(d.sexe)state.blSexe=d.sexe;
  if(d.profil)state.blProfil=d.profil;
  return n>0;
}

  h+='<div style="font-weight:900;font-size:12px;color:var(--violet);margin:8px 0 8px">POURQUOI & CONTEXTE</div>';
  // 🧭 PROFILAGE — trois questions, puis le profil qu'on en tire.

  for(var pq=0;pq<BILAN_PROFIL_Q.length;pq++){

// ═══════════ COMPARAISON DE BILANS — RAPPORT DE PROGRESSION ═══════════
function compareBilans(A,B){
  function nf(x){var v=parseFloat(x);return isNaN(v)?null:v;}
  var C={A:A,B:B};
  C.poidsA=nf(A.poids);C.poidsB=nf(B.poids);
  C.dPoids=(C.poidsA!=null&&C.poidsB!=null)?Math.round((C.poidsB-C.poidsA)*10)/10:null;
  C.mgA=nf(A.mg);C.mgB=nf(B.mg);
  C.dMg=(C.mgA!=null&&C.mgB!=null)?Math.round((C.mgB-C.mgA)*10)/10:null;
  // kg de gras et de muscle (mm = % masse musculaire)
  C.grasA=(C.poidsA!=null&&C.mgA!=null)?C.poidsA*C.mgA/100:null;
  C.grasB=(C.poidsB!=null&&C.mgB!=null)?C.poidsB*C.mgB/100:null;
  C.dGras=(C.grasA!=null&&C.grasB!=null)?Math.round((C.grasB-C.grasA)*10)/10:null;
  var mmA=nf(A.mm),mmB=nf(B.mm);
  C.musA=(C.poidsA!=null&&mmA!=null)?C.poidsA*mmA/100:null;
  C.musB=(C.poidsB!=null&&mmB!=null)?C.poidsB*mmB/100:null;
  C.dMus=(C.musA!=null&&C.musB!=null)?Math.round((C.musB-C.musA)*10)/10:null;
  C.gvA=nf(A.gv);C.gvB=nf(B.gv);
  C.dGv=(C.gvA!=null&&C.gvB!=null)?Math.round((C.gvB-C.gvA)*10)/10:null;
  var tll=nf(B.taille)||nf(A.taille);
  C.imcA=(C.poidsA!=null&&tll)?Math.round(C.poidsA/Math.pow(tll/100,2)*10)/10:null;
  C.imcB=(C.poidsB!=null&&tll)?Math.round(C.poidsB/Math.pow(tll/100,2)*10)/10:null;
  // Jours entre les deux (dates JJ/MM/AAAA)
  function pd(s){var p=String(s||"").split("/");return p.length===3?new Date(p[2],p[1]-1,p[0]):null;}
  var da=pd(A.date),db=pd(B.date);
  C.jours=(da&&db)?Math.round((db-da)/86400000):null;
  // ─── Qualité de la perte : d'où vient chaque kilo ? ───
  C.qualite=null;
  if(C.dPoids!=null&&C.dPoids<0&&C.dGras!=null){
    var partGras=Math.min(100,Math.max(0,Math.round(C.dGras/C.dPoids*100)));
    C.qualite={partGras:partGras,
      verdict:(C.dMus!=null&&C.dMus>=0)?"recomp":partGras>=75?"excellent":partGras>=60?"bon":"alerte"};
  }else if(C.dPoids!=null&&C.dPoids>=0&&C.dGras!=null&&C.dGras<0&&C.dMus!=null&&C.dMus>0){
    C.qualite={partGras:100,verdict:"recomp"};
  }
  // ─── Mesures : où le corps a puisé ───
  C.zones=[];C.totalCm=0;
  for(var m=0;m<BILAN_MESURES.length;m++){
    var k=BILAN_MESURES[m][0],lbl=BILAN_MESURES[m][1];
    var va=nf(A.mesures&&A.mesures[k]),vb=nf(B.mesures&&B.mesures[k]);
    if(va==null||vb==null)continue;
    var dz=Math.round((vb-va)*10)/10;
    C.zones.push({k:k,label:lbl,a:va,b:vb,d:dz});
    if(dz<0)C.totalCm+=-dz;
  }
  C.totalCm=Math.round(C.totalCm*10)/10;
  var losses=C.zones.filter(function(z){return z.d<0;}).sort(function(x,y){return x.d-y.d;});
  C.topZones=losses.slice(0,3);
  C.resistantes=C.zones.filter(function(z){return z.d>=0;});
  if(!C.resistantes.length&&losses.length>3)C.resistantes=[losses[losses.length-1]];
  return C;
}
// ← RETOUR DANS LES DOCUMENTS OUVERTS EN NOUVEL ONGLET.
// La progression, le rapport et le diplôme s'ouvrent via window.open : le

    'var b=document.getElementById("doc-back"); if(b)b.addEventListener("click",retour);'+
    'var sx=0,sy=0,dx=0,dy=0,bord=false;'+
    'document.addEventListener("touchstart",function(e){if(e.touches.length!==1)return;'+
    'sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;dy=0;bord=sx<40;},{passive:true});'+

    '})();<\/script>';

function successCard(slug,iA,iB){
  var clients=lsGet("amcoach_clients",[]),cName=slug;
  for(var i=0;i<clients.length;i++){if(clients[i].slug===slug){cName=clients[i].name;break;}}
  var prenom=String(cName).split(" ")[0];

  var stats=[];
  if(C.dPoids!=null&&C.dPoids<0)stats.push({n:C.dPoids+" kg",l:"sur la balance",c:"var(--ok)"});
  if(C.dMg!=null&&C.dMg<0)stats.push({n:C.dMg+" %",l:"de masse grasse",c:"var(--ok)"});
  if(C.dMus!=null&&C.dMus>0)stats.push({n:"+"+C.dMus+" kg",l:"de muscle",c:"var(--brand2)"});
  // 📸 Sur la carte à partager, on nomme les DEUX plus belles zones plutôt
  // qu'un total de centimètres. « −38 cm de mensurations » ne parle à
  // personne et gonfle un chiffre en additionnant dix tours de mesure ;

      }

      for(var b=0;b<PIPE_DOULEURS.length;b++){

        '<div style="font-size:12px;color:'+solid("var(--mute)")+';margin-top:4px;line-height:1.45">Un prospect doit changer d\'étape ou être relancé sous 7 jours. Sinon il refroidit.</div>'+
        // Prénom et nom séparés : c'est ce qui permet de retrouver quelqu'un
        // et de personnaliser un message sans se tromper de champ.
        '<div style="display:flex;gap:8px;margin-top:14px">'+
        '<input id="pp-prenom" placeholder="Prénom" value="'+esc(p.prenom||p.nom||"")+'" style="flex:1;min-width:0;padding:13px 14px;border-radius:12px;border:2px solid '+solid("var(--line)")+';font-size:16px;font-weight:700"/>'+

    // On garde ce qui est déjà tapé quand on redessine après un clic sur une puce
    function memoriser(){

    function cablerBoutons(){
      ov.querySelector("#pp-ok").addEventListener("click",function(){
        var prenom=ov.querySelector("#pp-prenom").value.trim();
        var nom=ov.querySelector("#pp-nom").value.trim();

        // Changer d'étape remet le compteur d'immobilité à zéro : c'est un

// ═══════════ NAV BINDING (réutilisable) ═══════════
// 📱 Barre du bas toujours visible, même en zoomant.
// iOS positionne les éléments fixes par rapport à la page, pas à ce qu'on voit :
// dès qu'on pince pour zoomer, la barre part hors de l'écran. On la recale.
function ancrerNav(){
  var vv=window.visualViewport;
  if(!vv)return;
  var nav=document.querySelector(".nav");
  if(!nav)return;
  var ech=vv.scale||1;
  if(ech<=1.02){
    nav.style.transform="translateX(-50%)";
    nav.style.width="";
    return;
  }
  // Zoomé : on replace la barre dans la zone réellement visible et on la remet à l'échelle
  var dy=(vv.height+vv.offsetTop)-window.innerHeight;
  nav.style.transformOrigin="bottom center";
  nav.style.transform="translateX(-50%) translateY("+dy.toFixed(0)+"px) scale("+(1/ech).toFixed(3)+")";
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",ancrerNav);
  window.visualViewport.addEventListener("scroll",ancrerNav);
}
// Remise à l'échelle : on rejoue la balise viewport, seule méthode qui marche sur iOS
function dezoomer(){
  var m=document.querySelector('meta[name="viewport"]');
  if(!m)return false;
  var av=m.getAttribute("content");
  m.setAttribute("content","width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no");
  setTimeout(function(){m.setAttribute("content",av);ancrerNav();},320);
  return true;
}
function estZoome(){
  var vv=window.visualViewport;
  return !!(vv&&vv.scale>1.05);
}
// 👈 Glisser depuis le bord gauche = revenir en arrière, comme sur iOS.
// On ne réinvente pas la destination : on clique le bouton retour de l'écran,
// celui qui existe déjà. Si l'écran n'en a pas, le geste ne fait rien.
var SWIPE_RETOURS=["stx-back","prg-run-back","part-back","pes-back","pxf-back","prg-bib-close","prg-ass-back","p3-back","prg-back","cd-back"];
function retourEcran(){
  for(var i=0;i<SWIPE_RETOURS.length;i++){
    var b=document.getElementById(SWIPE_RETOURS[i]);
    if(b){b.click();return true;}
  }
  if(state.selDay!=null){state.selDay=null;render();return true;}
  return false;
}
function bindSwipeRetour(){
  if(window.__swipeOn)return;
  window.__swipeOn=true;
  var x0=0,y0=0,t0=0,actif=false;
  document.addEventListener("touchstart",function(e){
    if(!e.touches||e.touches.length!==1)return;
    var t=e.touches[0];
    // Uniquement depuis le bord gauche : ailleurs, le geste appartient aux
    // listes qui défilent horizontalement (cartes de séance, bibliothèque).
    actif=(t.clientX<=28);
    x0=t.clientX;y0=t.clientY;t0=Date.now();
  },{passive:true});
  document.addEventListener("touchend",function(e){
    if(!actif)return;
    actif=false;
    var t=(e.changedTouches&&e.changedTouches[0]);
    if(!t)return;
    var dx=t.clientX-x0, dy=Math.abs(t.clientY-y0), dt=Date.now()-t0;
    if(dx>70&&dy<60&&dt<700){ if(retourEcran())buzz("tap"); }
  },{passive:true});
}
// 👉 Glisser horizontalement = onglet suivant ou précédent.
function ongletVoisin(sens){
  var l=window.__tabs||[];
  var i=l.indexOf(state.view);
  if(i<0)return null;
  var j=i+sens;
  if(j<0||j>=l.length)return null;
  return l[j];
}
function bindSwipeOnglets(){
  if(window.__swipeTabs)return;
  window.__swipeTabs=true;
  var x0=0,y0=0,t0=0,depart=null;
  document.addEventListener("touchstart",function(e){
    if(!e.touches||e.touches.length!==1){depart=null;return;}
    var t=e.touches[0];
    x0=t.clientX;y0=t.clientY;t0=Date.now();depart=t.target;
  },{passive:true});
  document.addEventListener("touchend",function(e){
    if(!depart)return;
    var cible=depart; depart=null;
    // Un écran secondaire (séance, pesées, partage, didacticiel) a ses
    // propres règles : on ne change pas d'onglet sous les pieds du client.
    if(state.progRun||state.pesees||state.partage||state.statsExo||state.tuto!=null||state.selDay!=null)return;
    // Le geste appartient à une bande qui défile horizontalement ?
    for(var n=cible;n&&n!==document.body;n=n.parentNode){
      if(n.classList&&(n.classList.contains("prg-cartes")||n.classList.contains("prg-tabs")||
         n.classList.contains("sem-jours")||n.classList.contains("prg-chips")))return;
      if(n.scrollWidth&&n.clientWidth&&n.scrollWidth-n.clientWidth>12)return;
    }
    var t=(e.changedTouches&&e.changedTouches[0]);
    if(!t)return;
    var dx=t.clientX-x0, dy=Math.abs(t.clientY-y0), dt=Date.now()-t0;
    // Franc, horizontal et rapide : sinon c'est un défilement vertical.
    if(Math.abs(dx)<70||dy>55||dt>600||Math.abs(dx)<dy*2)return;
    if(x0<=28&&dx>0)return;   // le bord gauche appartient au geste de retour
    var v=ongletVoisin(dx<0?1:-1);
    if(!v)return;
    state.view=v; buzz("tap"); render();
    if(v==="sport")cloudRafraichir(false);
  },{passive:true});
}
function bindNav(){
  try{bindSwipeRetour();}catch(e){}
  try{bindSwipeOnglets();}catch(e){}
  var navs=document.querySelectorAll("[data-nav]");
  for(var i=0;i<navs.length;i++){
    navs[i].addEventListener("click",function(){
      var v=this.getAttribute("data-nav");
      // Déjà sur l'onglet : le second appui descend au calendrier,
      // le troisième ramène en haut. Comme sur iOS.
      if(state.view===v&&v==="calendar"){
        buzz("tap");
        // 1er appui zoomé : on dézoome · 2e : on remonte en haut · 3e : on descend au calendrier
        if(estZoome()){dezoomer();return;}
        var a=document.getElementById("cal-anchor");
        var haut=(window.scrollY||document.documentElement.scrollTop)<40;
        if(haut&&a){
          // Le calendrier est désormais dans un tiroir : le second appui
          // l'OUVRE en même temps qu'il y descend, sinon on atterrit sur un
          // titre replié et le geste ne sert à rien.
          var tir=document.querySelector(".cal-tiroir");
          if(tir&&!tir.open){tir.open=true;state.calOpen=true;}
          a.scrollIntoView({behavior:"smooth",block:"start"});
        }
        else{window.scrollTo({top:0,behavior:"smooth"});}
        return;
      }
      state.view=v;render();
      // L'onglet Sport est celui que le coach modifie le plus souvent :
      // on vérifie le serveur en y entrant.
      if(v==="sport")cloudRafraichir(false);
    });
  }
}

function nutSaveDay(newDay){
  var all=getAllData();

  cfg.daily=cfg.daily||{};
  var target=cfg.prot||0;
  newDay.tot=Math.round((newDay.foods||[]).reduce(function(s,f){return s+(f.prot||0);},0)*10)/10;
  newDay.ok=target>0&&newDay.tot>=target*0.8;
  cfg.daily[nutDayKey()]=newDay;
  saveDay(510,cfg); // sync Supabase via le même mécanisme (slot 510)
}
// 🕘 Historique réutilisable : chaque aliment validé revient en un tap
function nutPushRecent(name,qty,prot){
  var all=getAllData();
  var cfg=all[510]||{};
  var r=(cfg.recents||[]).slice();
  var key=nutNorm(name)+"|"+qty;
  r=r.filter(function(x){return nutNorm(x.name)+"|"+x.qty!==key;});
  r.unshift({name:name,qty:qty,prot:prot});

    return false;

var ZXING_URL="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
var _zxLoad=null;
function nutLoadZXing(){
  if(window.ZXing)return Promise.resolve(window.ZXing);
  if(_zxLoad)return _zxLoad;
  _zxLoad=new Promise(function(res,rej){
    var s=document.createElement("script");
    s.src=ZXING_URL;
    s.onload=function(){window.ZXing?res(window.ZXing):rej(new Error("lib"));};
    s.onerror=function(){rej(new Error("réseau"));};
    document.head.appendChild(s);
  });
  return _zxLoad;
}

      Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128]);

    reader.decodeFromConstraints(
      {video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}},
      "scan-vid",

      if(v&&v.srcObject)window._zxStream=v.srcObject;

function nutLookupBarcode(code){
  if(!code||code.length<6){alert("Code-barres invalide 🤔");return;}
  state.nutSearchBusy=true;render();
  fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+
        ".json?fields=product_name,brands,nutriments,serving_quantity")
  .then(function(r){return r.json();}).then(function(res){
    state.nutSearchBusy=false;
    var pr=res&&res.product;
    var p100=pr&&pr.nutriments?parseFloat(pr.nutriments.proteins_100g):NaN;
    if(!pr||!pr.product_name||isNaN(p100)){
      state.nutResults=[];render();
      alert("Produit introuvable dans la base, ou protéines non renseignées.\nSaisis-le à la main 🙂");
      return;
    }
    state.nutResults=[{name:pr.product_name.trim(),marque:(pr.brands||"").split(",")[0].trim(),
      p100:Math.round(p100*10)/10,portion:parseFloat(pr.serving_quantity)||null}];
    render();
    // Produit unique identifié : on enchaîne directement sur la quantité, sans étape inutile
    var it=state.nutResults[0];
    var def=it.portion||100;
    var q=prompt("✅ "+it.name+(it.marque?"\n"+it.marque:"")+"\n"+it.p100+" g de protéines pour 100 g\n\nQuelle quantité (en grammes) ?",def);
    if(q===null){state.nutResults=null;render();return;}
    q=parseFloat(q)||0;
    if(q<=0){state.nutResults=null;render();return;}
    nutAddDirect((it.marque?it.marque+" "+it.name:it.name),q,Math.round(q*it.p100/100*10)/10);
    state.nutResults=null;
    render();
    feedback("+"+(Math.round(q*it.p100/100*10)/10)+" g \u00b7 "+it.name,"ok");
  }).catch(function(){
    state.nutSearchBusy=false;state.nutResults=[];render();
    alert("Lecture impossible pour le moment. Saisis le produit à la main 🙂");
  });
}
function bindNutrition(){
  var addBtn=document.getElementById("nut-add");
  var nameI=document.getElementById("nut-name"),qtyI=document.getElementById("nut-qty");
  function doAdd(){
    var n=(nameI.value||"").trim(),q=parseInt(qtyI.value,10)||0;
    if(!n){feedback("Indique un aliment","err");nameI.focus();return;}
    if(q<=0){feedback("Indique la quantité","err");qtyI.focus();return;}
    var av=nutToday(nutCfg(getAllData())).tot||0;
    if(nutAddFood(n,q)){
      var ap=nutToday(nutCfg(getAllData())).tot||0;
      render();
      feedback("+"+(Math.round((ap-av)*10)/10)+" g de protéines","ok");
    }
  }
  if(addBtn)addBtn.addEventListener("click",doAdd);
  if(qtyI)qtyI.addEventListener("keypress",function(e){if(e.key==="Enter")doAdd();});
  // 🔍 Recherche de marque
  var srch=document.getElementById("nut-search");
  if(srch)srch.addEventListener("click",function(){
    var q=(nameI&&nameI.value||"").trim();
    if(!q)q=prompt("Quel produit cherches-tu ?\n(ex : skyr danone, whey myprotein, jambon herta)")||"";
    q=q.trim();
    if(!q){if(nameI)nameI.focus();return;}
    nutSearchBrand(q);
  });
  // ▮▯ Code-barres
  var scn=document.getElementById("nut-scan");
  if(scn)scn.addEventListener("click",function(){nutScanBarcode();});
  // Ajout depuis un résultat de recherche
  var res=document.querySelectorAll(".nut-res");
  for(var r0=0;r0<res.length;r0++){
    res[r0].addEventListener("click",function(){
      var ix=parseInt(this.getAttribute("data-i"),10);
      var it=(state.nutResults||[])[ix];
      if(!it)return;
      var def=it.portion||100;
      var q=prompt("Quelle quantité de « "+it.name+" » ?\n("+it.p100+" g de protéines pour 100 g)\n\nEn grammes :",def);
      if(q===null)return;
      q=parseFloat(q)||0;
      if(q<=0)return;
      var nom=(it.marque?it.marque+" "+it.name:it.name);
      nutAddDirect(nom,q,Math.round(q*it.p100/100*10)/10);
      state.nutResults=null;
      render();
    });
  }
  var clr=document.getElementById("nut-res-clear");
  if(clr)clr.addEventListener("click",function(){state.nutResults=null;render();});
  // 🕘 Réutiliser un aliment récent
  var recs=document.querySelectorAll(".nut-rec");
  for(var r1=0;r1<recs.length;r1++){
    recs[r1].addEventListener("click",function(){
      var ix=parseInt(this.getAttribute("data-i"),10);
      var it=(nutCfg(getAllData()).recents||[])[ix];
      if(!it)return;
      nutAddDirect(it.name,it.qty,it.prot);
      render();
      feedback("+"+it.prot+" g \u00b7 "+it.name,"ok");
    });
  }
  var dels=document.querySelectorAll(".nut-del");
  for(var i=0;i<dels.length;i++){
    dels[i].addEventListener("click",function(){
      var ix=parseInt(this.getAttribute("data-i"),10);
      var day=nutToday(nutCfg(getAllData()));
      var foods=(day.foods||[]).slice();
      var sup=foods[ix];
      foods.splice(ix,1);
      nutSaveDay({foods:foods});render();
      feedback((sup?"\u2212"+sup.prot+" g \u00b7 ":"")+"retiré","undo");
    });
  }
}

}
function bindFinance(){

  var depD=document.querySelectorAll(".dep-del");
  for(var dd=0;dd<depD.length;dd++)depD[dd].addEventListener("click",function(){
    depSupprimer(this.getAttribute("data-m"),this.getAttribute("data-id"));

  });

  // Abonnements : saisis une fois, comptés tous les mois

  // « Résilié » plutôt que supprimé : l'abonnement sort du total mais reste

  var aboO=document.querySelectorAll(".abo-off");
  for(var ao=0;ao<aboO.length;ao++)aboO[ao].addEventListener("click",function(){
    var L=aboLire(), i=+this.getAttribute("data-i");

    L[i].actif=(L[i].actif===false);

    feedback(L[i].actif?"Réactivé":"Marqué résilié — "+(+L[i].montant||0)*12+" CHF/an économisés",L[i].actif?"ok":"win");
  });
  var aboD=document.querySelectorAll(".abo-del");
  for(var ad=0;ad<aboD.length;ad++)aboD[ad].addEventListener("click",function(){
    var L=aboLire(), i=+this.getAttribute("data-i");
    if(!L[i]||!confirm("Retirer « "+L[i].nom+" » de la liste ?"))return;
    L.splice(i,1); aboEcrire(L); render();
  });


  // Choix du statut
  var stabs=document.querySelectorAll(".fin-statut");
  for(var s=0;s<stabs.length;s++){
    stabs[s].addEventListener("click",function(){
      var st=this.getAttribute("data-st");
      var cfg=finCfg(getAllData());
      var ancien=cfg.statut;
      cfg.statut=st;
      cfg.devise=cfg.devise||"CHF";
      // On ne régénère la liste que si la famille de charges change
      var listeAvant=ancien==="salarie"?"S":ancien?"I":null;
      var listeApres=st==="salarie"?"S":"I";
      if(!cfg.charges||!cfg.charges.length||listeAvant!==listeApres){
        var lst=st==="salarie"?FIN_CHARGES_SALARIE:FIN_CHARGES_INDEP;
        var anciennes={};
        (cfg.charges||[]).forEach(function(c){anciennes[c.n]=parseFloat(c.m)||0;});
        cfg.charges=[];
        for(var i=0;i<lst.length;i++){
          cfg.charges.push({n:lst[i].n,c:lst[i].c,m:anciennes[lst[i].n]||0});
        }
      }
      finSaveCfg(cfg);
      render();
    });
  }
  // Bouton "changer de statut"
  var chgSt=document.getElementById("fin-statut-chg");
  if(chgSt)chgSt.addEventListener("click",function(){
    var cfg=finCfg(getAllData());
    cfg.statut=null;
    finSaveCfg(cfg);
    render();
  });
  // Revenus du mois en cours (salarié / indépendant)
  function setRev(champ,val){
    var cfg=finCfg(getAllData());
    var k=finMonthKey();
    var actuel=finRevMois(cfg,k);
    cfg.revMois=cfg.revMois||{};
    cfg.revMois[k]={sal:actuel.sal,ind:actuel.ind};
    cfg.revMois[k][champ]=val;
    finSaveCfg(cfg);
    // Mise à jour du total sans reconstruire la vue (le champ garde le focus)
    var tot=document.getElementById("fin-rev-tot");

  // ⚙️ Type d'activité et taux

  if(actB)actB.addEventListener("click",function(){
    var cfg=finCfg(getAllData());
    var ks=Object.keys(FIN_ACTIVITES),menu="Ton type d'activité :\n\n";
    for(var i=0;i<ks.length;i++)menu+=(i+1)+" — "+FIN_ACTIVITES[ks[i]].lbl+" ("+FIN_ACTIVITES[ks[i]].taux+" %)\n";
    var c=prompt(menu+"\nNuméro :",String(ks.indexOf(cfg.activite||"bnc")+1));

      if(ts!==null)cfg.tauxSocSal=Math.max(0,Math.min(50,parseFloat(ts)||0));
      var tp=prompt("Taux d'impôt prélevé à la source (%) :\n0 si tu es imposé ailleurs",
        (cfg.tauxImpSal!=null&&cfg.tauxImpSal!=="")?cfg.tauxImpSal:P.imp);
      if(tp!==null)cfg.tauxImpSal=Math.max(0,Math.min(50,parseFloat(tp)||0));

  // ⚙️ Répartition du palier 2
  var repB=document.getElementById("fin-rep-chg");

    versement(v);
  });
  var tlUndo=document.getElementById("fin-tl-undo");
  if(tlUndo)tlUndo.addEventListener("click",function(){
    var cfg=finCfg(getAllData());
    if(cfg.tirelire&&cfg.tirelire.versements)delete cfg.tirelire.versements[finMonthKey()];
    finSaveCfg(cfg);render();
  });
  // Inputs charges
  var chInputs=document.querySelectorAll("[data-charge-idx]");
  for(var c=0;c<chInputs.length;c++){
    chInputs[c].addEventListener("change",function(){
      var idx=parseInt(this.getAttribute("data-charge-idx"),10);
      var cfg=finCfg(getAllData());
      if(cfg.charges&&cfg.charges[idx]){
        cfg.charges[idx].m=parseFloat(this.value)||0;
      }
      finSaveCfg(cfg);
    });
  }
  // Bouton Calculer
  var btnCalc=document.getElementById("fin-calcul");
  if(btnCalc){
    btnCalc.addEventListener("click",function(){
      var cfg=finCfg(getAllData());
      if(!cfg.statut||!cfg.charges||cfg.charges.length===0){
        alert("Choisis ton statut d'abord");
        return;
      }
      var Rv=finRevMois(cfg);
      if((Rv.sal+Rv.ind)<=0){
        alert("Renseigne tes revenus du mois");
        return;
      }
      // On fige les revenus du mois au moment du calcul
      var kM=finMonthKey();
      cfg.revMois=cfg.revMois||{};
      cfg.revMois[kM]={sal:Rv.sal,ind:Rv.ind};
      var T=finCalc(cfg);
      if(T.capa<=0){
        alert("Tes charges dépassent tes revenus — impossible de mettre de côté");
        return;
      }
      cfg.lastCalc=T;
      finSaveCfg(cfg);
      render();
      feedback("🧮 Ton plan est calculé","win");
    });
  }
}
