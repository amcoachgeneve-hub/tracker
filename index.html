// Reconnaît un aliment dans la base et renvoie ses protéines pour une quantité donnée
// Normalise pour comparer : minuscules, sans accents, sans ponctuation
function nutNorm(s){
  return (s||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9%\s]/g," ").replace(/\s+/g," ").trim();
}
// Le nom cherché doit apparaître en MOTS ENTIERS dans la saisie.
// Sans ça, « protéine de riz » matchait « riz » (2,7 g) au lieu de la poudre (~80 g).
function nutContientMots(saisie,cle){
  var re=new RegExp("(^|\\s)"+cle.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"($|\\s)");
  return re.test(saisie);
}
function nutProtFor(name,qty){
  var clean=nutNorm(name);
  if(!clean||!qty)return null;
  var best=null,bestLen=-1;
  for(var k in FOODS){
    if(!FOODS.hasOwnProperty(k))continue;
    var nk=nutNorm(k);
    var score=-1;
    if(nk===clean)score=1000;                              // match exact : priorité absolue
    else if(nutContientMots(clean,nk))score=nk.length;     // la clé est dans la saisie, en mots entiers
    if(score>bestLen){bestLen=score;best=k;}
  }
  if(!best)return null;
  var f=FOODS[best];
  return f.u===100?Math.round(qty*f.p/100*10)/10:Math.round(qty*f.p*10)/10;
}

function nutMatchInfo(name){
  var clean=nutNorm(name);

  var best=null,bestLen=-1;
  for(var k in FOODS){
    if(!FOODS.hasOwnProperty(k))continue;
    var nk=nutNorm(k),score=-1;
    if(nk===clean)score=1000;
    else if(nutContientMots(clean,nk))score=nk.length;
    if(score>bestLen){bestLen=score;best=k;}
  }
  return best?{cle:best,p:FOODS[best].p,u:FOODS[best].u,exact:bestLen===1000}:null;

function isoLocal(d){
  d=d||new Date();
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
}
function nutDayKey(){return isoLocal();}
function nutToday(cfg){var k=nutDayKey();return (cfg.daily&&cfg.daily[k])||{foods:[],tot:0,ok:false};}
// 🔥 Série de jours consécutifs au quota (même règle que la victoire : ≥ 80 %)
function nutStreak(cfg){
  var d=(cfg&&cfg.daily)||{},q=parseFloat(cfg&&cfg.prot)||0;
  if(q<=0)return {cur:0,best:0,todayOk:false};
  function ok(k){var e=d[k];return !!(e&&(parseFloat(e.tot)||0)>=q*0.8);}
  function key(dt){return isoLocal(dt);}
  var today=new Date();
  var todayOk=ok(key(today));
  // La série tient encore si aujourd'hui n'est pas fini mais qu'hier était bon
  var c=new Date(today);
  if(!todayOk)c.setDate(c.getDate()-1);
  var cur=0;
  while(ok(key(c))){cur++;c.setDate(c.getDate()-1);}
  // Record personnel
  var oks=Object.keys(d).filter(ok).sort();
  var best=0,run=0,prev=null;
  for(var i=0;i<oks.length;i++){
    run=(prev&&Math.round((new Date(oks[i])-new Date(prev))/86400000)===1)?run+1:1;
    if(run>best)best=run;
    prev=oks[i];
  }
  return {cur:cur,best:Math.max(best,cur),todayOk:todayOk};
}
// Calcule le plan (prot/kcal/durée) depuis poids départ → cible
// mMaigre : masse maigre en kg, mesurée au bilan (poids × (1 − %MG)).
// C'est la bonne référence : les protéines nourrissent le muscle, pas le gras.
// Sans bilan, on retombe sur le poids cible — moins juste, mais toujours prudent.
// Masse maigre lue dans le dernier bilan qui a poids + %MG
function nutMasseMaigre(allData){
  var b=(allData&&allData[600])||{}, list=b.list||[];
  for(var i=list.length-1;i>=0;i--){
    var a=list[i];
    if(a&&a.poids&&a.mg){
      var pd=parseFloat(a.poids), mg=parseFloat(a.mg);
      if(pd>0&&mg>0&&mg<70)return Math.round(pd*(1-mg/100)*10)/10;
    }
  }
  return null;
}
function nutPlan(sexe,pDepart,pCible,mMaigre){
  var P=NUT_PARAMS[sexe]||NUT_PARAMS.H;
  var ref, base;
  if(mMaigre&&mMaigre>0){
    // Sur masse maigre, les besoins sont plus élevés par kg : ~2,3–2,6 g/kg
    ref=mMaigre; base="maigre";
    var lo=P.protX*1.3, hi=(P.protMax||P.protX)*1.3;
    var prot=Math.round(lo*ref), protMax=Math.round(hi*ref);
  }else{
    ref=pCible; base="cible";
    var prot=Math.round(P.protX*ref), protMax=Math.round((P.protMax||P.protX)*ref);
  }
  var kcal=Math.round(P.kcalX*pCible);
  var perte=Math.round((pDepart-pCible)*10)/10;
  var duree=perte>0?Math.ceil(perte/0.8):0; // ~800 g / semaine
  return {prot:prot,protMax:protMax,kcal:kcal,perte:perte,duree:duree,
          base:base,ref:Math.round(ref*10)/10,
          protX:P.protX,protMax_x:P.protMax||P.protX,kcalX:P.kcalX};
}

// Revenus du mois : {sal, ind}. Si le mois n'est pas encore renseigné,
// on reporte automatiquement les derniers revenus connus.
function finRevMois(cfg,key){
  key=key||finMonthKey();
  var rm=(cfg&&cfg.revMois)||{};
  if(rm[key])return {sal:parseFloat(rm[key].sal)||0,ind:parseFloat(rm[key].ind)||0,saisi:true};
  var ks=Object.keys(rm).sort(),last=null;
  for(var i=0;i<ks.length;i++){if(ks[i]<key)last=ks[i];}
  if(last)return {sal:parseFloat(rm[last].sal)||0,ind:parseFloat(rm[last].ind)||0,saisi:false,report:last};
  // Reprise de l'ancien champ unique
  var leg=parseFloat(cfg&&cfg.revenus)||0;
  return {sal:leg,ind:0,saisi:false};
}

// taux = cotisations sociales · cfp = contribution formation pro · lib = versement libératoire IR
var FIN_ACTIVITES={
  bnc:{lbl:"Libéral BNC — régime général",taux:25.6,cfp:0.2,lib:2.2},

// URSSAF et impôt calculés automatiquement sur le CA indépendant du mois
function finAuto(cfg){

    ?((cfg.tauxImpot!=null&&cfg.tauxImpot!=="")?parseFloat(cfg.tauxImpot):10)
    :A.lib;
  return {ca:ca,act:A,tx:tx,txImp:txImp,provision:provision,
          urssaf:Math.round(ca*tx/100),impot:Math.round(ca*txImp/100)};
}

// Ordres de grandeur — variables selon l'âge (LPP), la situation familiale et le canton.
var FIN_PAYS={
  FR:{lbl:"France",soc:23,socLbl:"cotisations salariales",imp:0,
      note:"Le net français est déjà prélevé à la source : saisis ton net à payer."},
  CH:{lbl:"Suisse",soc:15,socLbl:"AVS/AI/APG + AC + LPP + LAA",imp:0,

      note:"Genève impose les frontaliers à la source. Le taux dépend de ta situation familiale."}
};
function finSalaire(cfg){
  var R=finRevMois(cfg);
  var P=FIN_PAYS[cfg.pays||"FRONT"]||FIN_PAYS.FRONT;
  // Par défaut le client saisit un NET : rien à retenir
  if(cfg.salType!=="brut")return {brut:0,net:R.sal,soc:0,imp:0,P:P,estBrut:false};
  var soc=(cfg.tauxSocSal!=null&&cfg.tauxSocSal!=="")?parseFloat(cfg.tauxSocSal):P.soc;
  var imp=(cfg.tauxImpSal!=null&&cfg.tauxImpSal!=="")?parseFloat(cfg.tauxImpSal):P.imp;
  var mSoc=Math.round(R.sal*soc/100);
  var mImp=Math.round((R.sal-mSoc)*imp/100);
  return {brut:R.sal,net:R.sal-mSoc-mImp,soc:mSoc,imp:mImp,txSoc:soc,txImp:imp,P:P,estBrut:true};
}
function finCalc(cfg){
  var ch=cfg.charges||[];
  var fixe=0,vari=0,pro=0;
  for(var i=0;i<ch.length;i++){
    var m=parseFloat(ch[i].m)||0;
    if(ch[i].c==="pro")pro+=m;else if(ch[i].c==="var")vari+=m;else fixe+=m;
  }
  // Cotisations et impôt : calculés, jamais saisis
  var A=finAuto(cfg);
  var S=finSalaire(cfg);
  pro+=A.urssaf+A.impot;
  var fixeSal=S.soc+S.imp;
  fixe+=fixeSal;
  var tot=fixe+vari+pro;
  var R=finRevMois(cfg);
  var rev=R.sal+R.ind;
  var reste=rev-tot;
  // Réglages du coach — ils étaient enregistrés mais ignorés jusqu'ici
  var pctMarge=(cfg.margeImprevu!=null&&cfg.margeImprevu!=="")?parseFloat(cfg.margeImprevu):10;
  var nbMois=(cfg.moisCible!=null&&cfg.moisCible!=="")?parseFloat(cfg.moisCible):3;
  var marge=Math.round(rev*pctMarge/100);
  var capa=Math.max(0,reste-marge);
  var matelos=Math.round(tot*nbMois);
  var moisMatelas=capa>0?Math.ceil(matelos/capa):0;
  var pctCapa=rev>0?Math.round(capa/rev*100):0;
  return {fixe:fixe,vari:vari,pro:pro,tot:tot,rev:rev,revSal:R.sal,revInd:R.ind,reste:reste,
          urssaf:A.urssaf,impot:A.impot,txUrssaf:A.tx,txImpot:A.txImp,
          socSal:S.soc,impSal:S.imp,estBrut:S.estBrut,
          pctMarge:pctMarge,nbMois:nbMois,
          marge:marge,capa:capa,matelos:matelos,moisMatelas:moisMatelas,pctCapa:pctCapa};
}
// 🐷 TIRELIRE — versements réels, écart vs objectif, compte à rebours
function finTirelire(cfg){
  var T=finCalc(cfg);
  var v=(cfg.tirelire&&cfg.tirelire.versements)||{};
  var solde=0,ecartCum=0,nb=0;
  for(var k in v){
    if(!v.hasOwnProperty(k))continue;
    solde+=parseFloat(v[k].m)||0;
    ecartCum+=(parseFloat(v[k].m)||0)-(parseFloat(v[k].obj)||0);
    nb++;
  }
  var manque=Math.max(0,T.matelos-solde);
  var moisRestants=T.capa>0?Math.ceil(manque/T.capa):0;
  var pct=T.matelos>0?Math.min(100,Math.round(solde/T.matelos*100)):0;
  var moisSansBonus=T.capa>0?Math.ceil(T.matelos/T.capa):0;
  var moisGagnes=Math.max(0,moisSansBonus-nb-moisRestants);
  return {solde:solde,ecartCum:ecartCum,nb:nb,manque:manque,moisRestants:moisRestants,
          pct:pct,objMois:T.capa,matelas:T.matelos,moisGagnes:moisGagnes,plein:manque<=0};
}

}

// ═══ RYTHME D'ÉPARGNE : jour / semaine / mois ═══
// Le client choisit sa cadence, puis valide à chaque période.
// checks:{ "<clé période>": {m:montant, d:"YYYY-MM-DD"} }
var FIN_RYTHMES={
  jour:{lbl:"jour",adj:"quotidien",art:"aujourd'hui",perMois:30,hist:14,histLbl:"14 derniers jours"},
  semaine:{lbl:"semaine",adj:"hebdo",art:"cette semaine",perMois:4.345,hist:8,histLbl:"8 dernières semaines"},
  mois:{lbl:"mois",adj:"mensuel",art:"ce mois-ci",perMois:1,hist:6,histLbl:"6 derniers mois"}
};
function finRythme(cfg){return FIN_RYTHMES[cfg&&cfg.rythme]||FIN_RYTHMES.mois;}
function finWeekKey(d){
  var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var day=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-day);
  var y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  var w=Math.ceil(((t-y0)/86400000+1)/7);
  return t.getUTCFullYear()+"-W"+("0"+w).slice(-2);
}
// Clé de la période contenant la date d, selon le rythme choisi
function finPeriodKey(r,d){
  d=d||new Date();
  if(r==="jour")return isoLocal(d);
  if(r==="semaine")return finWeekKey(d);
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2);
}
// Recule de n périodes depuis aujourd'hui
function finPeriodShift(r,n){
  var d=new Date();
  if(r==="jour")d.setDate(d.getDate()-n);
  else if(r==="semaine")d.setDate(d.getDate()-n*7);
  else d.setMonth(d.getMonth()-n);
  return d;
}
function finPeriodShortLabel(r,d){
  if(r==="jour")return ["D","L","M","M","J","V","S"][d.getDay()];
  if(r==="semaine")return "S"+finWeekKey(d).split("-W")[1];
  return finMonthLabel(d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)).split(" ")[0];
}
// Somme des validations tombant dans un mois donné — quel que soit le rythme,
// on s'appuie sur la date réelle stockée dans chaque validation.
function finChecksMonth(cfg,ym){
  var c=cfg.checks||{},s=0;
  for(var k in c){
    if(!c.hasOwnProperty(k))continue;
    if(c[k]&&c[k].d&&c[k].d.slice(0,7)===ym)s+=parseFloat(c[k].m)||0;
  }
  return Math.round(s);
}
// Montant suggéré par période = capacité mensuelle / nb de périodes dans le mois
function finMontantSuggere(cfg,capacite){
  var R=finRythme(cfg);
  return Math.max(0,Math.round(capacite/R.perMois));
}

function sbFetch(path,opts){

  var headers={
    "apikey":SB_KEY,
    "Authorization":"Bearer "+SB_KEY,
    "Content-Type":"application/json"
  };

function syncDayToCloud(idx,data){
  if(!CLIENT)return;
  state.syncStatus="sync";
  updateSyncBadge();
  function pushTracking(){
    return sbFetch("tracking?on_conflict=client_slug,day_index",{
      method:"POST",
      prefer:"resolution=merge-duplicates",
      body:{client_slug:CLIENT,day_index:idx,data:data,updated_at:new Date().toISOString()}
    });
  }
  pushTracking().then(function(r){
    if(r.ok){
      state.syncStatus="ok";updateSyncBadge();
      setTimeout(function(){state.syncStatus="";updateSyncBadge();},2000);
      return null;
    }
    // Probablement client absent du cloud (FK) : on le crée puis on réessaie
    var name=lsGetStr("amcoach_name_"+CLIENT)||CLIENT;
    var start=lsGetStr("amcoach_start_"+CLIENT)||isoLocal();
    return sbFetch("clients?on_conflict=slug",{
      method:"POST",
      prefer:"resolution=merge-duplicates",
      body:{slug:CLIENT,name:name,start_date:start}
    }).then(function(){return pushTracking();}).then(function(r2){
      state.syncStatus=r2.ok?"ok":"err";
      updateSyncBadge();
      if(r2.ok)setTimeout(function(){state.syncStatus="";updateSyncBadge();},2000);
    });
  }).catch(function(){
    state.syncStatus="err";
    updateSyncBadge();
  });
}

function updateSyncBadge(){
  var el=document.getElementById("sync-badge");
  if(!el)return;
  if(state.syncStatus==="sync"){el.textContent="☁️ ...";el.style.color="var(--warn)";}
  else if(state.syncStatus==="ok"){el.textContent="☁️ ✓";el.style.color="var(--ok)";}
  else if(state.syncStatus==="err"){el.textContent="☁️ hors-ligne";el.style.color="var(--brand)";}
  else{el.textContent="";}
}

function getToday90(startDate){
  if(!startDate)return 0;
  // #12 : jour calculé sur la DATE CALENDAIRE locale (pas les millisecondes) —
  // un client qui voyage ne saute ni ne double jamais un jour
  // Les deux dates sont comparées en jours calendaires, sans mélanger UTC et local.
  var ds=String(startDate).slice(0,10).split("-");
  var a=Date.UTC(+ds[0],(+ds[1]||1)-1,+ds[2]||1);
  var n=new Date();
  var b=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());
  var diff=Math.round((b-a)/86400000);
  return Math.max(0,Math.min(diff,89));
}

function computeAlert(allData,today90){
  // Analyse les 7 derniers jours remplis (min 4 pour être fiable)
  var days=[];
  for(var i=today90;i>=0&&days.length<7;i--){
    if(allData[i]&&allData[i].habits)days.push(allData[i].habits);
  }
  if(days.length<4)return null;
  var worst=null,worstRate=1;
  for(var h=0;h<HABITS.length;h++){
    var id=HABITS[h].id,done=0;
    for(var d=0;d<days.length;d++){if(days[d][id])done++;}
    var rate=done/days.length;
    if(rate<0.5&&rate<worstRate){worstRate=rate;worst=id;}
  }
  var span=Math.min(7,today90+1);
  if(span>=4&&allData[502]){
    var bDone=0;for(var b3=today90-span+1;b3<=today90;b3++){if(hasBrique(allData,b3))bDone++;}
    var bRate=bDone/span;
    if(bRate<0.5&&bRate<worstRate){worstRate=bRate;worst="identite";}
  }
  if(span>=4){
    var mWon=0;for(var m3=today90-span+1;m3<=today90;m3++){if(missionWon(allData,m3))mWon++;}
    var mRate=mWon/span;
    if(mRate<0.5&&mRate<worstRate){worstRate=mRate;worst="onething";}
  }
  return worst?{habit:worst,msg:HABIT_ALERTS[worst]}:null;
}

function slugHash(s){var h=0;s=s||"";for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h;}

function penseeVue(allData){return (allData&&allData[513])||{};}
// Choisit dans un pool en écartant tout ce qui a déjà été montré les jours précédents
function penseeChoisir(allData,today90,pool){
  var vues=penseeVue(allData);
  // Déjà attribuée pour ce jour : on la resserre, elle ne doit pas changer
  if(vues[today90]!=null&&PENSEES[vues[today90]])return PENSEES[vues[today90]];
  var deja={};
  for(var d in vues){if(vues.hasOwnProperty(d)&&parseInt(d,10)!==today90)deja[vues[d]]=1;}
  var libres=pool.filter(function(i){return !deja[i];});
  if(!libres.length)libres=pool;              // tout le pool a été vu : on autorise à nouveau
  var off=slugHash(CLIENT||"");
  var idx=libres[(today90+off)%libres.length];
  // On mémorise, sans écraser un autre jour
  var cp={};for(var k in vues){if(vues.hasOwnProperty(k))cp[k]=vues[k];}
  cp[today90]=idx;
  saveDay(513,cp);
  return PENSEES[idx];
}
function pickPensee(allData,today90){
  var qgc=allData[502];

  if(qgc&&qgc.identity&&today90%7===2){
    return "🧱 Chaque action d'aujourd'hui pose une brique de plus vers celui que tu deviens : « "+qgc.identity+" ». La forteresse se souvient de tout ce que tu fais dans l'ombre.";
  }
  // Index de toutes les pensées, puis pools thématiques
  var tous=[];for(var i=0;i<PENSEES.length;i++)tous.push(i);
  // Mission perdue hier → résilience
  var y=allData[200+(today90-1)];
  if(y&&y.status==="lost"){
    var pool=tous.filter(function(i){return /relève|Tombe|cendres|recule|tailleur|chenille|échou|tempête/.test(PENSEES[i]);});
    if(pool.length)return penseeChoisir(allData,today90,pool);
  }
  // Combo 7+ → guerrier/constance
  var st=computeStreak(allData,today90);
  if(st>=7){
    var pool2=tous.filter(function(i){return /guerrier|discipline|constance|champion|habitude/i.test(PENSEES[i]);});
    if(pool2.length)return penseeChoisir(allData,today90,pool2);
  }
  return penseeChoisir(allData,today90,tous);
}

// ═══════════ BOUCLES VERTUEUSES / BOUCLES D'ÉCHEC ═══════════
function computeLoops(allData,period,offset){
  offset=offset||0;
  var rates=[],daysFilled=0;
  for(var hb=0;hb<HABITS.length;hb++){
    var hab=HABITS[hb],on=0,off=0,sOn=0,sOff=0,cnt=0;
    for(var i=offset;i<offset+period;i++){
      var d=allData[i];
      if(!d||!d.habits)continue;
      cnt++;
      var sc=dayScore(d)||0;
      if(d.habits[hab.id]){on++;sOn+=sc;}else{off++;sOff+=sc;}
    }
    if(hb===0)daysFilled=cnt;
    rates.push({hab:hab,rate:cnt?on/cnt:0,on:on,off:off,cnt:cnt,
      delta:(on&&off)?Math.round(sOn/on-sOff/off):null});
  }
  // Les habitudes facultatives sortent de TOUTE l'analyse de boucles :
  // ni socle, ni moteur, ni faiblesse. Sinon le rapport attribue une force ou
  // une faiblesse à quelque chose qui n'engage pas la discipline du client.
  var ratesA=rates.filter(function(r){return !HABITS_FACULT[r.hab.id];});
  // Socle : habitudes tenues ≥ 70% du temps
  var socle=ratesA.filter(function(r){return r.cnt>=3&&r.rate>=0.7;})
    .sort(function(a,b){
      if(b.rate!==a.rate)return b.rate-a.rate;
      return (b.delta==null?-99:b.delta)-(a.delta==null?-99:a.delta);
    });
  // Moteur : l'habitude qui, quand elle est cochée, tire le plus la journée vers le haut
  // Moteur : delta = score moyen quand cochée − score moyen quand pas cochée (le levier, pas la corrélation)
  var moteur=null,mb=9;
  for(var m=0;m<ratesA.length;m++){
    var r=ratesA[m];
    if(r.delta!=null&&r.on>=2&&r.off>=1&&r.delta>mb){mb=r.delta;moteur=r;}
  }
  // Faiblesses : habitudes qui sautent le plus souvent.
  // Les compléments sont facultatifs — les compter masquerait la vraie boucle d'échec.
  var faibles=ratesA.filter(function(r){return r.cnt>=3&&r.rate<=0.45;})
    .sort(function(a,b){return a.rate-b.rate;});
  // Enchaînements de jours manqués (un jour saute → le suivant aussi)
  var lastFilled=-1;
  for(var li=offset;li<offset+period;li++){if(allData[li]&&allData[li].habits)lastFilled=li;}
  var chains=0,run=0;
  for(var ci=offset;ci<=lastFilled;ci++){
    var dd=allData[ci];
    if(!dd||!dd.habits)run++;else{if(run>=2)chains++;run=0;}
  }
  // 🛡️ Résilience : après un jour manqué, repart-il dès le lendemain (≥4 habitudes cochées) ?
  var rec=0,missCnt=0;
  for(var ri=offset;ri<lastFilled;ri++){
    var tdD=allData[ri];
    if(!tdD||!tdD.habits){
      missCnt++;
      var ndD=allData[ri+1];
      if(ndD&&ndD.habits){
        var nOk=0;for(var hk in ndD.habits){if(ndD.habits[hk])nOk++;}
        if(nOk>=4)rec++;
      }
    }
  }
  var resilience={rec:rec,miss:missCnt,score:missCnt?Math.round(rec/missCnt*100):null};
  // Phrases qui reviennent dans les soirées (regroupées par mots significatifs partagés)
  var LOOP_STOP={"avec":1,"pour":1,"trop":1,"plus":1,"dans":1,"fait":1,"faire":1,"suis":1,"bien":1,"tout":1,"toute":1,"rien":1,"cette":1,"comme":1,"mais":1,"encore":1,"assez":1,"aujourd":1,"hier":1,"journ\u00e9e":1,"jour":1,"jours":1,"pass\u00e9":1,"vraiment":1,"\u00e9t\u00e9":1,"\u00eatre":1,"avoir":1,"quand":1,"parce":1,"chose":1,"choses":1};
  function sigWords(s){
    var words=String(s).toLowerCase().replace(/[^a-z\u00e0-\u00ff\s-]/g," ").split(/\s+/);
    var out={},arr=[];
    for(var w=0;w<words.length;w++){
      var wd=words[w];
      if(wd.length<4||LOOP_STOP[wd]||out[wd])continue;
      out[wd]=1;arr.push(wd);
    }
    return arr;
  }
  function groupPhrases(texts){
    // texts: [{t:"...", d:jour}] → groupes de phrases proches (≥2 mots significatifs en commun, ou 1 seul si la phrase n'en a qu'un)
    var groups=[];
    for(var ti=0;ti<texts.length;ti++){
      var tx=texts[ti], ws=sigWords(tx.t);
      if(!ws.length)continue;
      var placed=false;
      for(var gi=0;gi<groups.length;gi++){
        var g=groups[gi], shared=[];
        for(var si=0;si<ws.length;si++){if(g.wset[ws[si]])shared.push(ws[si]);}
        var need=Math.min(2,ws.length,g.minLen);
        if(shared.length>=need){
          g.n++;g.days.push(tx.d);
          if(tx.t.length>g.t.length)g.t=tx.t; // garder la phrase la plus parlante
          // resserrer le thème sur les mots communs
          if(shared.length>=1){var nw={};for(var sh=0;sh<shared.length;sh++)nw[shared[sh]]=1;g.wset=nw;g.kw=shared;}
          g.minLen=Math.min(g.minLen,ws.length);
          placed=true;break;
        }
      }
      if(!placed){
        var wset={};for(var wi=0;wi<ws.length;wi++)wset[ws[wi]]=1;
        groups.push({t:tx.t,n:1,days:[tx.d],wset:wset,kw:ws.slice(0,4),minLen:ws.length});
      }
    }
    var out=groups.filter(function(g){return g.n>=2;});
    out.sort(function(a,b){return b.n-a.n;});
    return out.slice(0,3);
  }
  var negTexts=[],posTexts=[];
  for(var ni=offset;ni<offset+period;ni++){
    var dn=allData[ni];
    if(dn&&dn.mindset){
      if(dn.mindset.negatif)negTexts.push({t:dn.mindset.negatif,d:ni+1});
      if(dn.mindset.fier)posTexts.push({t:dn.mindset.fier,d:ni+1});
      if(dn.mindset.positif)posTexts.push({t:dn.mindset.positif,d:ni+1});
    }
  }
  var phrasesNeg=groupPhrases(negTexts);
  var phrasesPos=groupPhrases(posTexts);
  return {socle:socle,moteur:moteur,faibles:faibles,chains:chains,resilience:resilience,phrasesNeg:phrasesNeg,phrasesPos:phrasesPos,daysFilled:daysFilled,period:period};
}

// ═══════════ SVG CHART ═══════════
// 📊 Plusieurs courbes superposées. Les unités diffèrent (kg, %, heures) :
// chaque série est ramenée sur une échelle commune pour que les croisements se voient.
// ═══════════ 📈 MOTEURS D'ANALYSE DE PROGRESSION ═══════════
// Régression linéaire sur les points renseignés : renvoie la pente par jour
function statTendance(values){
  var xs=[],ys=[];
  for(var i=0;i<values.length;i++){if(values[i]!=null){xs.push(i);ys.push(values[i]);}}
  if(xs.length<3)return null;
  var n=xs.length,sx=0,sy=0,sxy=0,sxx=0;
  for(var j=0;j<n;j++){sx+=xs[j];sy+=ys[j];sxy+=xs[j]*ys[j];sxx+=xs[j]*xs[j];}
  var den=n*sxx-sx*sx;
  if(den===0)return null;
  var pente=(n*sxy-sx*sy)/den;
  var ord=(sy-pente*sx)/n;
  return {pente:pente,ord:ord,n:n,premier:xs[0],dernier:xs[xs.length-1],
          yDebut:ys[0],yFin:ys[ys.length-1]};
}
// Moyenne des N derniers jours renseignés
function statMoyDerniers(values,n,finIdx){
  var v=[],c=0;
  for(var i=finIdx;i>=0&&c<n;i--){if(values[i]!=null){v.push(values[i]);c++;}}
  if(!v.length)return null;
  var s=0;for(var j=0;j<v.length;j++)s+=v[j];
  return {moy:Math.round(s/v.length*10)/10,n:v.length};
}
// Compare les 7 derniers jours renseignés aux 7 précédents
function statSemaine(values,finIdx){
  var idx=[];
  for(var i=0;i<=finIdx;i++){if(values[i]!=null)idx.push(i);}
  if(idx.length<4)return null;
  var rec=idx.slice(-7),prec=idx.slice(-14,-7);
  function moy(list){var s=0;for(var k=0;k<list.length;k++)s+=values[list[k]];return list.length?s/list.length:null;}
  var a=moy(rec),b=prec.length>=3?moy(prec):null;
  return {actuel:Math.round(a*10)/10,
          precedent:b!=null?Math.round(b*10)/10:null,
          delta:b!=null?Math.round((a-b)*10)/10:null,
          nRec:rec.length};
}
// Projection vers le poids cible à partir de la tendance réelle
function statProjection(poidsVals,cible,finIdx){
  var T=statTendance(poidsVals);
  var act=null;
  for(var i=finIdx;i>=0;i--){if(poidsVals[i]!=null){act=poidsVals[i];break;}}
  if(act==null)return null;
  if(cible==null||!cible)return {act:act,tendance:T,assez:T&&T.n>=8,cible:null};
  var reste=Math.round((act-cible)*10)/10;
  if(reste<=0)return {act:act,cible:cible,atteint:true,tendance:T,assez:true};
  var assez=!!(T&&T.n>=8);
  var jours=null,dateCible=null,parSem=null;
  if(assez&&T.pente<-0.005){
    parSem=Math.round(-T.pente*7*100)/100;
    jours=Math.ceil(reste/(-T.pente));
    if(jours>0&&jours<3650){
      var d=new Date();d.setDate(d.getDate()+jours);
      dateCible=d.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
    }
  }
  return {act:act,cible:cible,reste:reste,tendance:T,assez:assez,
          jours:jours,sem:jours?Math.ceil(jours/7):null,dateCible:dateCible,parSem:parSem,
          stagne:!!(assez&&T&&T.pente>=-0.005&&T.pente<=0.005),
          monte:!!(assez&&T&&T.pente>0.005)};
}
// 📉 Courbe de poids avec droite de tendance et ligne d'objectif
function svgPoidsChart(values,cible,opts){
  opts=opts||{};
  var W=opts.width||340,H=opts.height||160,pad={t:12,r:10,b:22,l:38};
  var valid=values.filter(function(v){return v!=null;});
  if(valid.length<2)return '<div class="chart-empty">Pèse-toi quelques jours pour voir ta courbe</div>';
  var mn=Math.min.apply(null,valid),mx=Math.max.apply(null,valid);
  if(cible!=null&&cible)mn=Math.min(mn,cible);
  var marge=Math.max(0.5,(mx-mn)*0.12);
  mn-=marge;mx+=marge;
  var rg=mx-mn||1,iw=W-pad.l-pad.r,ih=H-pad.t-pad.b,n=values.length;
  function px(i){return pad.l+(i/(n-1))*iw;}
  function py(v){return pad.t+ih-((v-mn)/rg)*ih;}
  var g="";
  for(var k=0;k<=3;k++){
    var gy=pad.t+ih*(k/3),gv=mx-(rg*(k/3));
    g+='<line x1="'+pad.l+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+gy.toFixed(1)+'" stroke='+JSON.stringify(solid("var(--soft2)"))+'/>'+
      '<text x="'+(pad.l-6)+'" y="'+(gy+3).toFixed(1)+'" font-size="9" fill="#BBB" text-anchor="end">'+(Math.round(gv*10)/10)+'</text>';
  }
  // Ligne d'objectif
  var obj="";
  if(cible!=null&&cible&&cible>=mn&&cible<=mx){
    var oy=py(cible);
    obj='<line x1="'+pad.l+'" y1="'+oy.toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+oy.toFixed(1)+'" stroke='+JSON.stringify(solid("var(--ok)"))+' stroke-width="1.5" stroke-dasharray="5 4"/>'+
      '<text x="'+(W-pad.r)+'" y="'+(oy-5).toFixed(1)+'" font-size="9" font-weight="700" fill='+JSON.stringify(solid("var(--ok)"))+' text-anchor="end">objectif '+cible+' kg</text>';
  }
  // Droite de tendance
  var trend="";
  var T=statTendance(values);
  if(T&&T.n>=4){
    var y1=T.ord+T.pente*T.premier,y2=T.ord+T.pente*T.dernier;
    y1=Math.max(mn,Math.min(mx,y1));y2=Math.max(mn,Math.min(mx,y2));
    trend='<line x1="'+px(T.premier).toFixed(1)+'" y1="'+py(y1).toFixed(1)+'" x2="'+px(T.dernier).toFixed(1)+'" y2="'+py(y2).toFixed(1)+'" stroke='+JSON.stringify(solid("var(--gold-d)"))+' stroke-width="1.5" stroke-dasharray="3 3" opacity=".8"/>';
  }
  var d="",started=false,dots="";
  for(var i=0;i<n;i++){
    if(values[i]==null)continue;
    var X=px(i),Y=py(values[i]);
    d+=(started?" L":"M")+X.toFixed(1)+" "+Y.toFixed(1);
    started=true;
  }
  var last=-1;for(var z=n-1;z>=0;z--){if(values[z]!=null){last=z;break;}}
  if(last>=0)dots='<circle cx="'+px(last).toFixed(1)+'" cy="'+py(values[last]).toFixed(1)+'" r="4" fill='+JSON.stringify(solid("var(--ink)"))+'/>';
  var step=Math.max(1,Math.ceil(n/5)),xl="";
  for(var x=0;x<n;x+=step)xl+='<text x="'+px(x).toFixed(1)+'" y="'+(H-6)+'" font-size="9" fill="#BBB" text-anchor="middle">J'+(x+1)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+g+obj+trend+xl+
    '<path d="'+d+'" fill="none" stroke='+JSON.stringify(solid("var(--ink)"))+' stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg>';
}
function svgMultiChart(sets,opts){
  opts=opts||{};
  var W=opts.width||340,H=opts.height||190,pad={t:10,r:10,b:22,l:12};
  var actives=sets.filter(function(s){
    return s.values.filter(function(v){return v!=null;}).length>=2;
  });
  if(!actives.length)return '<div class="chart-empty">Pas encore assez de données</div>';
  var n=actives[0].values.length;
  var iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  function px(i){return pad.l+(i/(n-1))*iw;}

  var grid="";
  for(var g=0;g<=3;g++){
    var gy=pad.t+ih*(g/3);
    grid+='<line x1="'+pad.l+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+gy.toFixed(1)+'" stroke='+JSON.stringify(solid("var(--soft2)"))+' stroke-width="1"/>';
  }
  var step=Math.max(1,Math.ceil(n/6)),xlab="";
  for(var x=0;x<n;x+=step){
    xlab+='<text x="'+px(x).toFixed(1)+'" y="'+(H-6)+'" font-size="9" fill="#BBB" text-anchor="middle">J'+(x+1)+'</text>';
  }

  var paths="",legend="";
  for(var s=0;s<actives.length;s++){
    var S=actives[s];
    var val=S.values.filter(function(v){return v!=null;});
    var mn=S.min!=null?S.min:Math.min.apply(null,val);
    var mx=S.max!=null?S.max:Math.max.apply(null,val);
    if(mn===mx){mn-=1;mx+=1;}
    var rg=mx-mn;
    // Le poids descend quand ça va bien : on l'inverse pour comparer des tendances comparables
    var inv=!!S.invert;
    var d="",started=false;
    for(var i=0;i<n;i++){
      var v=S.values[i];
      if(v==null)continue;
      var frac=(v-mn)/rg;
      if(inv)frac=1-frac;
      var y=pad.t+ih-frac*ih;
      d+=(started?" L":"M")+px(i).toFixed(1)+" "+y.toFixed(1);
      started=true;
    }
    paths+='<path d="'+d+'" fill="none" stroke="'+S.color+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="'+(S.dim?0.55:0.95)+'"/>';
    legend+='<span style="display:inline-flex;align-items:center;gap:4px;margin-right:11px;margin-bottom:3px">'+
      '<span style="width:9px;height:9px;border-radius:3px;background:'+S.color+';display:inline-block"></span>'+
      '<span style="font-size:10.5px;font-weight:800;color:#666">'+S.label+
      '<span style="color:#BBB;font-weight:700"> '+(Math.round(mn*10)/10)+'→'+(Math.round(mx*10)/10)+(S.unit||"")+
      (inv?' ↓':'')+'</span></span></span>';
  }
  return '<div style="margin-bottom:6px;line-height:1.7">'+legend+'</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+grid+xlab+paths+'</svg>';
}
function svgLineChart(values,color,opts){
  color=solid(color);
  opts=opts||{};
  var W=opts.width||340, H=opts.height||140, pad={t:8,r:8,b:22,l:34};
  var valid=values.filter(function(v){return v!=null;});
  if(valid.length<2)return '<div class="chart-empty">Aucune donnée encore</div>';
  var min=opts.min!=null?opts.min:Math.min.apply(null,valid);
  var max=opts.max!=null?opts.max:Math.max.apply(null,valid);
  if(min===max){min-=1;max+=1;}
  var range=max-min;
  var iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  var n=values.length;

  function px(i){return pad.l+(i/(n-1))*iw;}
  function py(v){return pad.t+ih-((v-min)/range)*ih;}

  var grid="";
  for(var g=0;g<=3;g++){
    var gy=pad.t+ih*(g/3);
    var gv=max-(range*(g/3));
    grid+='<line x1="'+pad.l+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+gy.toFixed(1)+'" stroke='+JSON.stringify(solid("var(--soft2)"))+' stroke-width="1"/>';
    grid+='<text x="'+(pad.l-6)+'" y="'+(gy+3).toFixed(1)+'" font-size="9" fill="#BBB" text-anchor="end">'+(Math.round(gv*10)/10)+'</text>';
  }
  var step=Math.max(1,Math.ceil(n/6));
  var xlabels="";
  for(var x=0;x<n;x+=step){
    xlabels+='<text x="'+px(x).toFixed(1)+'" y="'+(H-6)+'" font-size="9" fill="#BBB" text-anchor="middle">J'+(x+1)+'</text>';
  }
  var path="", started=false;
  for(var i2=0;i2<n;i2++){
    var v2=values[i2];
    if(v2==null)continue; // jour non rempli : on saute, la courbe se relie au point suivant
    var X=px(i2).toFixed(1), Y=py(v2).toFixed(1);
    path+=(started?"L":"M")+X+","+Y;
    started=true;
  }
  var lastIdx=-1;
  for(var i3=n-1;i3>=0;i3--){if(values[i3]!=null){lastIdx=i3;break;}}
  var dot=lastIdx>=0?'<circle cx="'+px(lastIdx).toFixed(1)+'" cy="'+py(values[lastIdx]).toFixed(1)+'" r="4" fill="'+color+'" stroke="#fff" stroke-width="2"/>':"";

  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">'+grid+xlabels+
    '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+dot+'</svg>';
}

// Un attribut SVG (stroke, fill) n'accepte PAS var(--x) : il faut la valeur littérale.
// On la lit une fois sur la racine du document et on la met en cache.
var __cvarCache={};
function solid(c){
  if(typeof c!=="string")return c;
  var m=c.match(/^var\((--[a-zA-Z0-9-]+)\)$/);
  if(!m)return c;
  var k=m[1];
  if(__cvarCache[k])return __cvarCache[k];
  var v="";
  try{v=getComputedStyle(document.documentElement).getPropertyValue(k).trim();}catch(e){}
  if(!v)v="#888888";
  __cvarCache[k]=v;
  return v;
}
function svgRing(pct,color,size,w){
  size=size||64; w=w||6; color=solid(color);
  var r=(size-w-2)/2, c=2*Math.PI*r, p=Math.min(Math.max(pct||0,0),1);
  return '<svg width="'+size+'" height="'+size+'" style="transform:rotate(-90deg);display:block">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke='+JSON.stringify(solid("var(--soft2)"))+' stroke-width="'+w+'"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+w+'" stroke-dasharray="'+(c*p).toFixed(1)+' '+c.toFixed(1)+'" stroke-linecap="round" style="transition:stroke-dasharray .7s cubic-bezier(.2,.75,.25,1),stroke .5s"/></svg>';
}

  }
  
  h+='</div>';
  return h;
}

// ═══════════ CALENDAR ═══════════
function viewCalendar(name,start){
  var allData=getAllData();
  var today90=getToday90(start);
  var filled=0;
  for(var i=0;i<=today90;i++){if(allData[i])filled++;}
  var pct=Math.round(filled/Math.max(today90+1,1)*100);
  var pctColor=gaugeCol(pct);
  var streak=computeStreak(allData,today90);
  var wkOff=(new Date(start).getDay()+6)%7; // 0=lundi ... 6=dimanche
  // Durée du programme selon la date de fin d'accès (slot 504) : 14, 30 jours... sinon 90
  var acc0=allData[504]||{};
  var progDays=90;
  if(acc0.end){var pdd=Math.floor((new Date(acc0.end)-new Date(start))/86400000)+1;if(pdd>0&&pdd<90)progDays=pdd;}
  var shortProg=progDays<90;
  var daysLeft=Math.max(progDays-(today90+1),0);
  var month=shortProg?1:currentMonth(today90);
  var goal=getGoal(allData,month);
  var curW=latestWeight(allData,today90);

  var h='<div class="hdr"><div class="hdr-brand"><div class="bar bar-r"></div>'+
    '<span class="hdr-title">DISCIPLINE 90</span><div class="bar bar-b"></div></div>'+
    '<div class="hdr-sub">'+esc(name)+' · '+progDays+' jours'+(BLOC>1?' · Bloc '+BLOC+'/4':'')+' <span id="sync-badge" style="font-size:11px"></span></div></div>'+
    '<div style="padding:16px 14px 0">';

  // ⭕ CARTE HÉROS — la jauge en premier, en grand.
  // Sa couleur suit le remplissage : rouge → orange → jaune → vert.
  var etat=pct>=85?"Tu tiens le rythme":pct>=65?"Bien engagé":pct>=45?"À consolider":pct>=25?"Ça décroche":"À relancer";
  h+='<div class="card" style="padding:24px 18px 20px;margin-bottom:16px;text-align:center">'+
    '<div style="font-size:20px;font-weight:900;color:var(--ink);letter-spacing:-.3px;margin-bottom:16px">Ma progression</div>'+
    '<div class="ring-wrap" style="margin:0 auto">'+svgRing(pct/100,pctColor,196,16)+
    '<div class="ring-txt" style="flex-direction:column;gap:2px">'+
    '<span style="font-size:54px;font-weight:900;letter-spacing:-2px;line-height:1;color:var(--ink)">'+pct+
    '<span style="font-size:22px;letter-spacing:0">%</span></span>'+
    '<span style="font-size:11.5px;font-weight:700;color:var(--mute)">de tes jours remplis</span></div></div>'+
    '<div style="font-size:13.5px;font-weight:800;color:'+pctColor+';margin-top:14px">'+etat+'</div>'+
    '<div style="display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:14px">'+
      '<span style="background:var(--soft2);border-radius:100px;padding:9px 15px;font-size:12.5px;font-weight:700;color:var(--ink2)">'+
        '<span style="font-size:30px;line-height:1;vertical-align:-8px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.18))">'+streakBadge(streak).e+'</span> <b style="font-size:16px;color:'+(streak>=1?streakBadge(streak).c:"var(--mute)")+'">'+streak+'</b> jour'+(streak>1?'s':'')+' de série</span>'+
      '<span style="background:var(--soft2);border-radius:100px;padding:9px 15px;font-size:12.5px;font-weight:700;color:var(--ink2)"><b>'+filled+'</b> remplis</span>'+
      '<span style="background:var(--soft2);border-radius:100px;padding:9px 15px;font-size:12.5px;font-weight:700;color:var(--ink2)"><b>'+daysLeft+'</b> restants</span>'+
    '</div>'+
    '<div style="font-size:11.5px;color:var(--mute);font-weight:700;margin-top:13px">Jour '+Math.min(today90+1,progDays)+' sur '+progDays+'</div>'+
    '<div class="legend" style="justify-content:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">'+
    '<span><i style="background:var(--ok)"></i>Complet</span>'+
    '<span><i style="background:#FFD0B0"></i>Partiel</span>'+
    '<span><i style="background:var(--bad)"></i>Manqué</span>'+
    '<span><i style="background:var(--soft2)"></i>À venir</span></div></div>';

  // 🔔 Bannière rappel du soir — affichée UNE fois, disparaît après activation (slot 509)
  if(!(allData[509]&&allData[509].rappel)){
    h+='<div class="card" style="padding:14px 15px;margin-bottom:14px;border:2px solid var(--violet);background:#FBF7FE">'+
      '<div style="font-weight:900;font-size:13.5px;margin-bottom:5px">🔔 Active ton rappel du soir</div>'+
      '<div style="font-size:12px;color:#555;line-height:1.65;margin-bottom:10px">Un tap, et ton téléphone te notifie <strong>chaque soir à 20h30</strong> pour remplir ton tracker. C\'est ce qui fait la différence entre ceux qui tiennent 90 jours et les autres.</div>'+
      '<button id="add-reminder" class="big-btn" style="background:var(--violet);box-shadow:0 4px 14px var(--violet)44;margin-bottom:0;padding:13px 0;font-size:14px">Ajouter à mon calendrier →</button></div>';
  }

  // 🍗 Bannière rappel protéines — seulement si le suivi est activé et pas encore configuré (slot 511)
  if(nutCfg(allData).on&&!(allData[511]&&allData[511].rappel)){
    h+='<div class="card" style="padding:14px 15px;margin-bottom:14px;border:2px solid var(--ok-d);background:#F1F8E9">'+
      '<div style="font-weight:900;font-size:13.5px;margin-bottom:5px">🍗 Ta quête protéines t\'attend</div>'+
      '<div style="font-size:12px;color:#555;line-height:1.65;margin-bottom:10px">Active un rappel <strong>chaque soir à 20h30</strong> pour ne jamais oublier de peser tes protéines. C\'est ta quête secondaire — atteins ton quota, valide ta journée.</div>'+
      '<button id="add-prot-reminder" class="big-btn" style="background:var(--ok-d);box-shadow:0 4px 14px var(--ok-d)44;margin-bottom:0;padding:13px 0;font-size:14px">Activer mon rappel protéines →</button></div>';
  }

  // GOAL CARD
  if(goal){
    var diff=curW!=null?Math.round((curW-goal.target)*10)/10:null;

    var phrase=GOAL_PHRASES[today90%GOAL_PHRASES.length];

    if(reached){
      h+='<div style="font-weight:900;font-size:16px;color:var(--ok)">🏆 OBJECTIF ATTEINT !</div>'+
         '<div style="font-size:13px;color:#333;margin-top:6px;line-height:1.6">Tu as mérité ta récompense :<br><strong>'+esc(goal.reward||"—")+'</strong></div>';

      if(diff!=null){
        h+='<div style="font-weight:900;font-size:17px;color:'+K+'">Plus que '+diff+' kg'+(shortProg?' <span style="font-size:13px;color:var(--warn-d);font-weight:800">· ⏳ '+daysLeft+' jour'+(daysLeft>1?'s':'')+' restant'+(daysLeft>1?'s':'')+'</span>':'')+'</div>';
      }
      // 📊 Barre de progression vers l'objectif du mois (deplacee depuis Stats)
      (function(){
        var dep=null;
        // Point de depart : le poids du 1er jour renseigne de la periode en cours
        var d0=shortProg?0:(month-1)*30;
        for(var w=d0;w<=today90;w++){
          if(allData[w]&&allData[w].poids){dep=parseFloat(allData[w].poids);break;}
        }
        if(dep==null||curW==null||!goal.target)return;
        var tot=dep-goal.target, fait=dep-curW;
        if(tot<=0)return;
        var pc=Math.max(0,Math.min(100,Math.round(fait/tot*100)));
        var col=gaugeCol(pc);
        h+='<div style="margin-top:11px">'+
          '<div style="background:var(--soft2);height:20px;border-radius:7px;overflow:hidden">'+
          '<div style="background:'+col+';height:100%;width:'+pc+'%;border-radius:7px;display:flex;align-items:center;justify-content:center;min-width:32px;transition:width .4s">'+
          '<span style="color:#fff;font-weight:900;font-size:10.5px">'+pc+'%</span></div></div>'+
          '<div style="display:flex;justify-content:space-between;font-size:10.5px;font-weight:800;color:#AAA;margin-top:4px">'+
          '<span>'+dep+' kg</span>'+
          '<span>'+goal.target+' kg</span></div></div>';
      })();
      h+='<div style="font-size:13px;color:#666;margin-top:9px">'+phrase+'</div>';
      if(goal.reward)h+='<div style="font-size:12px;color:var(--mute);margin-top:6px">🎁 Ta récompense : <strong>'+esc(goal.reward)+'</strong></div>';
    }
    h+='<button id="goal-edit" style="font-size:11px;color:#777;margin-top:8px;padding:0">✏️ modifier</button></div>';
  }else{
    h+='<button id="goal-set" class="card" style="width:calc(100% - 28px);margin-bottom:18px;border:2px dashed #DDD;text-align:center;padding:16px;font-weight:800;font-size:14px;color:var(--mute);cursor:pointer">🎯 Définir mon objectif '+(shortProg?'('+progDays+' jours)':'du mois '+month)+' →</button>';

  if(state.showGoalForm){
    var g0=goal||{};
    h+='<div class="card" style="margin-bottom:18px;padding:18px 16px">'+
      '<div style="font-weight:900;font-size:14px;margin-bottom:14px">🎯 Mon objectif — '+(shortProg?'fin des '+progDays+' jours':'fin du mois '+month)+'</div>'+
      '<div style="font-weight:800;font-size:11px;color:#666;margin-bottom:6px">POIDS CIBLE (KG)</div>'+
      '<input id="goal-target" type="number" step="0.1" class="num-input" value="'+(g0.target||"")+'" placeholder="ex: 78" style="margin-bottom:12px"/>'+
      '<div style="font-weight:800;font-size:11px;color:#666;margin-bottom:6px">🎁 MA RÉCOMPENSE SI JE RÉUSSIS</div>'+
      '<input id="goal-reward" class="num-input" value="'+esc(g0.reward||"")+'" placeholder="ex: restaurant japonais, week-end spa..." style="font-weight:400;font-size:15px;margin-bottom:14px"/>'+
      '<button id="goal-save" style="width:100%;padding:14px 0;border-radius:12px;background:'+R+';color:#fff;font-weight:900;font-size:14px">Enregistrer mon engagement ✓</button></div>';
  }

  // DIPLÔME (fin de programme)
  if(today90>=89){
    h+='<button id="diplome-btn" class="card" style="width:calc(100% - 28px);margin-bottom:18px;background:linear-gradient(135deg,var(--gold),#E8C547);border:none;text-align:center;padding:18px;cursor:pointer">'+
      '<div style="font-size:26px;margin-bottom:4px">🎓</div>'+
      '<div style="font-weight:900;font-size:15px;color:#fff;letter-spacing:1px;text-transform:uppercase">Mon Diplôme AM Transfo</div>'+
      '<div style="font-size:11px;color:rgba(255,255,255,.85);margin-top:3px;font-weight:700">90 jours accomplis — Nouvelle version de toi-même</div></button>';
    if(BLOC<4){
      h+='<button id="next-bloc" class="card" style="width:calc(100% - 28px);margin-bottom:18px;background:'+K+';border:none;text-align:center;padding:16px;cursor:pointer">'+
        '<div style="font-weight:900;font-size:14px;color:#fff">🔄 Démarrer le Bloc '+(BLOC+1)+'/4 — 90 jours de plus</div>'+
        '<div style="font-size:11px;color:#666;margin-top:3px">Nouveau départ, historique conservé</div></button>';
    }
  }

  // 🎂 ANNIVERSAIRE
  var bd=allData[503]&&allData[503].bday?allData[503].bday:null;
  var nowD=new Date();
  var todayMD=("0"+(nowD.getMonth()+1)).slice(-2)+"-"+("0"+nowD.getDate()).slice(-2);
  if(bd&&bd===todayMD){
    h+='<div class="card" style="margin-bottom:18px;background:linear-gradient(135deg,var(--brand),var(--amber));border:none;text-align:center;padding:20px">'+
      '<div style="font-size:34px">🎂</div>'+
      '<div style="color:#fff;font-weight:900;font-size:17px;margin-top:4px">JOYEUX ANNIVERSAIRE '+esc(name).toUpperCase()+' !</div>'+
      '<div style="color:rgba(255,255,255,.9);font-size:12px;font-weight:700;margin-top:5px">Le plus beau cadeau : la version de toi que tu construis. 💪</div></div>';
  }else if(bd){
    h+='<div style="text-align:right;padding:0 14px;margin:-8px 0 10px"><button id="bday-edit" style="font-size:11px;color:#777">🎂 '+bd.split("-")[1]+'/'+bd.split("-")[0]+'</button></div>';
  }else{
    h+='<div style="padding:0 14px;margin:0 0 14px"><button id="bday-edit" style="width:100%;padding:13px 0;border-radius:12px;border:2px dashed #F0B6B6;background:#FFF7F7;color:var(--brand);font-weight:800;font-size:13px">🎂 Ajouter mon anniversaire</button></div>';
  }

  // 🎯 CHALLENGE EN COURS
  (function(){
    var ch=chCfg(allData);
    if(!ch)return;
    var E=chEtat(ch);
    var cases='';
    for(var i=0;i<E.jours.length;i++){
      var ok=(ch.done||{})[E.jours[i]];
      var auj=i===E.jourIdx;
      cases+='<div style="flex:1;aspect-ratio:1;border-radius:11px;display:flex;align-items:center;justify-content:center;'+
        'font-size:15px;font-weight:900;background:'+(ok?"linear-gradient(145deg,#8BC34A,#5FBF9C)":auj?"rgba(255,255,255,.16)":"rgba(255,255,255,.07)")+';'+
        (auj&&!ok?"box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);":"")+
        'color:'+(ok?"#0F2016":"rgba(255,255,255,.45)")+'">'+(ok?"✓":(i+1))+'</div>';
    }
    var restant=ch.jours-E.valides;
    h+='<div class="card" style="background:linear-gradient(155deg,#1B2A3A,#2E4560);border:none;padding:18px;margin-bottom:16px">'+
      '<div style="display:flex;align-items:center;gap:11px;margin-bottom:4px">'+
      '<span style="font-size:26px;line-height:1">'+ch.e+'</span>'+
      '<div style="flex:1"><div style="color:#fff;font-weight:900;font-size:16px">'+esc(ch.n)+'</div>'+
      '<div style="color:rgba(255,255,255,.6);font-size:11.5px;font-weight:700">Challenge '+ch.jours+' jours · '+E.valides+'/'+ch.jours+' validés</div></div>'+
      '<span style="font-size:19px;font-weight:900;color:'+gaugeCol(E.pct)+'">'+E.pct+'%</span></div>'+
      (ch.d?'<div style="color:rgba(255,255,255,.62);font-size:12px;line-height:1.45;margin:8px 0 12px">'+esc(ch.d)+'</div>':'<div style="height:10px"></div>')+
      '<div style="display:flex;gap:5px;margin-bottom:13px">'+cases+'</div>';
    if(E.reussi){
      h+='<div style="text-align:center;background:rgba(139,195,74,.16);border-radius:12px;padding:13px"><div style="font-size:24px">🏅</div>'+
        '<div style="color:#A5DE6E;font-weight:900;font-size:14px;margin-top:3px">Challenge réussi !</div>'+
        '<div style="color:rgba(255,255,255,.55);font-size:11.5px;margin-top:2px">Badge débloqué — bravo</div></div>';
    }else if(E.fini){
      h+='<div style="text-align:center;color:rgba(255,255,255,.6);font-size:12.5px;font-weight:700;padding:8px 0">Challenge terminé — '+E.valides+' jours sur '+ch.jours+'</div>';
    }else if(E.jourIdx<0){
      // Pas encore commencé : compte à rebours, et un message spécial la veille
      var av=chJoursAvant(ch.debut);
      var dl=new Date(ch.debut+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
      if(av===1){
        h+='<div style="text-align:center;background:rgba(255,193,7,.15);border:1.5px solid rgba(255,193,7,.4);border-radius:14px;padding:16px">'+
          '<div style="font-size:26px;line-height:1">⏰</div>'+
          '<div style="color:#FFD86B;font-weight:900;font-size:15px;margin-top:6px">C\'est demain !</div>'+
          '<div style="color:rgba(255,255,255,.7);font-size:12.5px;line-height:1.5;margin-top:5px">Prépare-toi pour tes '+ch.jours+' jours de challenge 💪<br>'+
          (ch.d?esc(ch.d):'')+'</div></div>';
      }else if(av>1){
        h+='<div style="text-align:center;background:rgba(255,255,255,.07);border-radius:14px;padding:14px">'+
          '<div style="color:#fff;font-weight:900;font-size:15px">Départ dans '+av+' jours</div>'+
          '<div style="color:rgba(255,255,255,.5);font-size:12px;font-weight:700;margin-top:3px;text-transform:capitalize">'+dl+'</div></div>';
      }else{
        h+='<div style="text-align:center;color:rgba(255,255,255,.6);font-size:12.5px;font-weight:700;padding:8px 0">Démarre le '+dl+'</div>';
      }
    }else{
      h+='<button id="ch-valider" style="width:100%;padding:15px 0;border-radius:12px;border:0;font-weight:900;font-size:14px;'+
        (E.fait?'background:rgba(255,255,255,.14);color:rgba(255,255,255,.75)':'background:#8BC34A;color:#0F2016')+'">'+
        (E.fait?"✓ Validé aujourd'hui — annuler":"Valider ma journée")+'</button>'+
        '<div style="text-align:center;color:rgba(255,255,255,.5);font-size:11px;font-weight:700;margin-top:9px">'+
        (restant>0?'Encore '+restant+' jour'+(restant>1?'s':'')+' pour décrocher le badge':'')+'</div>';
    }
    h+='</div>';
  })();

  // 🌙 Pensée du soir → déplacée dans la vue jour (épuration accueil)

  // ⚔️ BILAN DE BATAILLE (le dimanche)
  if((today90+1)%7===0&&today90>0){
    var wStart=today90-6;
    var wXP=0,wDone=0,wHalf=0,wLost=0,wFilled=0;
    var habCount={};
    for(var hb2=0;hb2<HABITS.length;hb2++)habCount[HABITS[hb2].id]=0;
    for(var wd=wStart;wd<=today90;wd++){
      var mm=allData[200+wd];
      if(mm){if(mm.xp)wXP+=mm.xp;if(mm.status==="done")wDone++;else if(mm.status==="half")wHalf++;else if(mm.status==="lost")wLost++;}
      var dd2=allData[wd];
      if(dd2&&dd2.habits){wFilled++;for(var hb3=0;hb3<HABITS.length;hb3++){if(dd2.habits[HABITS[hb3].id])habCount[HABITS[hb3].id]++;}}
    }
    var wPv=[];
    for(var wp=wStart;wp<=today90;wp++){if(allData[wp]&&allData[wp].poids)wPv.push(parseFloat(allData[wp].poids));}
    var wDp=wPv.length>=2?Math.round((wPv[wPv.length-1]-wPv[0])*10)/10:null;
    h+='<div class="card" style="margin-bottom:18px;border:2px solid '+K+';padding:16px 18px">'+
      '<div style="font-weight:900;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px"><div class="bar bar-r"></div>⚔️ BILAN DE BATAILLE — Semaine '+Math.floor(today90/7+1)+'</div>'+
      '<div style="display:flex;gap:8px;margin-bottom:12px;text-align:center">'+
      '<div style="flex:1"><div style="font-weight:900;font-size:20px;color:var(--gold)">'+wXP+'</div><div style="font-size:11px;color:#666;font-weight:700;text-transform:uppercase">XP</div></div>'+
      '<div style="flex:1"><div style="font-weight:900;font-size:20px;color:var(--ok)">'+wDone+'</div><div style="font-size:11px;color:#666;font-weight:700;text-transform:uppercase">🟢 Sécurisées</div></div>'+
      '<div style="flex:1"><div style="font-weight:900;font-size:20px;color:var(--amber)">'+wHalf+'</div><div style="font-size:11px;color:#666;font-weight:700;text-transform:uppercase">🟡 Contestées</div></div>'+
      '<div style="flex:1"><div style="font-weight:900;font-size:20px;color:'+(wDp!=null&&wDp<=0?"var(--ok)":K)+'">'+(wDp!=null?(wDp>0?"+"+wDp:wDp):"—")+'</div><div style="font-size:11px;color:#666;font-weight:700;text-transform:uppercase">kg</div></div></div>';
    // ⚠️ améliorations semaine prochaine
    var warns=[];
    if(wFilled>=3){
      for(var hb4=0;hb4<HABITS.length;hb4++){
        var hid=HABITS[hb4];
        if(habCount[hid.id]/wFilled<0.5)warns.push(hid.icon+" "+hid.label+" "+habCount[hid.id]+"/"+wFilled);
      }
    }
    if(warns.length){
      h+='<div style="background:#FFF8F0;border:1.5px solid #FFE0B2;border-radius:10px;padding:10px 12px">'+
        '<div style="font-weight:800;font-size:11px;color:var(--warn-d);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">⚠️ Priorités semaine prochaine</div>'+
        '<div style="font-size:12px;color:#7A4A00;font-weight:700;line-height:1.8">'+warns.join("<br>")+'</div></div>';
    }else if(wFilled>=3){
      h+='<div style="font-size:12px;color:var(--ok);font-weight:800">✅ Toutes les lignes tenues. Semaine de guerrier.</div>';
    }
    var wF=[],wP=[],wN=[];
    for(var mw=wStart;mw<=today90;mw++){
      var dmw=allData[mw];
      if(dmw&&dmw.mindset){
        if(dmw.mindset.fier)wF.push(dmw.mindset.fier);
        if(dmw.mindset.positif)wP.push(dmw.mindset.positif);
        if(dmw.mindset.negatif)wN.push(dmw.mindset.negatif);
      }
    }
    if(wF.length||wP.length||wN.length){
      h+='<div style="margin-top:12px;padding-top:12px;border-top:1.5px solid #EEE">'+
        '<div style="font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">🧠 Ta semaine dans ta tête</div>';
      if(wF.length)h+='<div style="font-size:12px;line-height:1.7;margin-bottom:6px"><strong style="color:#B45309">🥇 Tes fiertés :</strong> '+wF.map(esc).join(" · ")+'</div>';
      if(wP.length)h+='<div style="font-size:12px;line-height:1.7;margin-bottom:6px"><strong style="color:var(--ok-d)">🌟 Tes gratitudes :</strong> '+wP.map(esc).join(" · ")+'</div>';
      if(wN.length)h+='<div style="font-size:12px;line-height:1.7;margin-bottom:8px"><strong style="color:var(--brand)">🌧️ Ce qui a pesé :</strong> '+wN.map(esc).join(" · ")+'</div>';
      h+='<div style="background:#F4FAF2;border-radius:10px;padding:10px 12px;font-size:11px;color:#4A7A3A;line-height:1.7;font-weight:600">💡 Relis la ligne rouge : ce qui revient 2 fois ou plus est un pattern, pas un hasard. Choisis-en UN et fais-en ta mission One Thing de la semaine prochaine. On ne corrige pas tout — on corrige le levier.</div></div>';
    }
    // 🔁 Boucles de la semaine (vertueuse = socle · échec = ce qui revient)
    var wLoops=loopsHTML(computeLoops(allData,7,wStart),true);
    if(wLoops)h+='<div style="margin-top:12px">'+wLoops+'</div>';
    h+='</div>';
  }

  // ⚠️ Message du coach → déplacé dans la vue jour (épuration accueil)

  // 3 months (mois 2 et 3 verrouillés tant que le précédent n'est pas terminé)
  // Ancre : le second appui sur Agenda amène ici
  h+='<div id="cal-anchor" style="scroll-margin-top:8px"></div>';
  // Programme court (Reset 14 j...) : les 14 jours visibles, le reste cadenassé
  var nbMonths=3;
  for(var mi=0;mi<nbMonths;mi++){
    var beyondProg=shortProg&&mi*28>=progDays;
    var locked=beyondProg||mi*28>today90;
    if(locked){
      h+='<div style="margin-bottom:10px"><div class="month-hdr" style="opacity:.55;cursor:default">'+
        '<div class="mh-left"><div class="bar" style="background:#DDD"></div>'+
        '<span class="mh-name" style="color:var(--mute)">🔒 Mois '+(mi+1)+'</span></div>'+
        '<span style="font-size:11px;color:#777;font-weight:700">'+(beyondProg?'Programme 90 jours':'Se débloque au jour '+(mi*28+1))+'</span></div></div>';
      continue;
    }
    var pastDays=[],fd=0;
    for(var x=mi*28;x<Math.min((mi+1)*28,progDays);x++){
      if(x<=today90){pastDays.push(x);if(allData[x])fd++;}
    }
    var mPct=pastDays.length?Math.round(fd/pastDays.length*100):0;
    var isOpen=state.openMonth===mi;
    var isCurrent=mi===Math.floor(Math.min(today90,89)/28);
    var mColor=gaugeCol(mPct);

    h+='<div style="margin-bottom:10px">'+
      '<button class="month-hdr'+(isOpen?" open":"")+'" data-month="'+mi+'">'+
      '<div class="mh-left"><div class="bar" style="background:'+(isOpen?R:"#DDD")+'"></div>'+
      '<span class="mh-name">'+(shortProg?'Mes '+progDays+' jours':'Mois '+(mi+1))+'</span>'+
      (isCurrent?'<span class="mh-badge">EN COURS</span>':"")+'</div>'+
      '<div class="mh-right"><div class="mh-track"><div class="mh-fill" style="width:'+mPct+'%;background:'+mColor+'"></div></div>'+
      '<span class="mh-pct">'+mPct+'%</span></div></button>';

    if(isOpen){
      h+='<div class="cal-grid"><div class="cal-days">';
      for(var dn=0;dn<7;dn++)h+='<div class="cal-dayname">'+DAY_SHORT[dn]+'</div>';
      h+='</div>';
      var nRows=Math.ceil((28+wkOff)/7);
      for(var w=0;w<nRows;w++){
        h+='<div class="cal-week">';
        for(var dd=0;dd<7;dd++){
          var slot=w*7+dd-wkOff;
          if(slot<0||slot>=28){h+='<div style="aspect-ratio:1;border-radius:8px;background:var(--soft)"></div>';continue;}
          var idx=mi*28+slot;
          if(idx>=progDays){h+='<div style="aspect-ratio:1;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:11px;opacity:.55">🔒</div>';continue;}
          if(idx>=90){h+='<div></div>';continue;}
          var cellBg="#EEF4FF", cls="";
          if(idx<=today90){
            var dObj=allData[idx];
            if(!dObj||!dObj.habits)cellBg="var(--bad)";
            else{
              var sc=dayScore(dObj);
              cellBg=sc===100?"var(--ok)":sc>=50?"var(--ok-l)":sc>0?"#FFD0B0":"var(--bad)";
            }
          }else cls=" future";
          if(idx===today90)cls+=" today";
          var hasBilan=allData[idx]&&allData[idx].bilan;
          var msn=allData[200+idx];
          var msnDot="";
          if(msn&&msn.status&&msn.status!=="pending"){
            var mc2=msn.status==="done"?"var(--ok)":msn.status==="half"?"var(--amber)":"#BBB";
            msnDot='<span style="position:absolute;top:2px;left:3px;font-size:7px;color:'+mc2+'">⚡</span>';
          }
          h+='<button class="cal-cell'+cls+'" data-day="'+idx+'" style="background:'+cellBg+'">'+(idx+1)+
            (hasBilan?'<span class="bilan-dot">📋</span>':"")+msnDot+'</button>';
        }
        h+='</div>';
      }
      h+='</div>';
    }
    h+='</div>';
  }
  return h+'</div>';
}
</script>
<script>
"use strict";

// ═══════════ DAY VIEW ═══════════
function viewDay(name,start){
  var idx=state.selDay;
  var allData=getAllData();
  var d=allData[idx]||{};
  var habits=d.habits||{};
  var today90=getToday90(start);
  var isSunday=(idx+1)%7===0;
  var weekNum=Math.floor(idx/7)+1;
  var dow=idx%7;
  var done=0;
  for(var i=0;i<HABITS.length;i++){if(habits[HABITS[i].id])done++;}

  var h='<div class="app"><div class="hdr"><div style="display:flex;align-items:center;gap:12px">'+
    '<button id="day-back" class="day-back">←</button>'+
    '<div style="flex:1"><div style="color:#fff;font-weight:900;font-size:15px">Jour '+(idx+1)+' · '+DAY_FULL[dow]+'</div>'+
    '<div style="color:#666;font-size:12px">Semaine '+weekNum+' · '+esc(name)+'</div></div>'+
    '<span id="sync-badge" style="font-size:11px"></span><span id="saved-badge" class="saved-badge" style="display:none">✓ Sauvé</span>'+
    '<div class="ring-wrap" id="day-ring">'+svgRing(done/HABITS.length,done===HABITS.length?"var(--ok)":R,48)+
    '<div class="ring-txt" style="font-size:11px;color:#fff" id="day-ring-txt">'+done+'/'+HABITS.length+'</div></div>'+
    '</div></div><div style="padding:16px 14px 0">';

  if(idx>today90)h+='<div class="info-banner"><span style="font-size:16px">📅</span><span>Jour futur — tu peux anticiper</span></div>';

  // 🌙 Pensée du jour + message du coach (déplacés ici pour épurer l'accueil)
  var penseeJ=pickPensee(allData,idx);
  h+='<div class="card" style="background:linear-gradient(135deg,#1a1a2e,#16213e);padding:16px;border:none">'+
    '<div style="color:var(--gold);font-weight:800;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">🌙 La pensée du jour '+(idx+1)+'</div>'+
    '<div style="color:var(--line);font-size:13.5px;line-height:1.75;font-style:italic">'+esc(penseeJ)+'</div>'+
    '<button id="pensee-share" style="margin-top:10px;font-size:11px;font-weight:800;color:var(--gold);padding:6px 12px;border:1.5px solid var(--gold);border-radius:16px;background:transparent">📤 Partager</button></div>';
  if(idx===today90){
    var alertD=computeAlert(allData,today90);
    if(alertD){
      h+='<div class="card" style="background:#FFF8F0;border:2px solid #FFE0B2;padding:13px 15px">'+
        '<div style="font-weight:900;font-size:11px;color:var(--warn-d);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">⚠️ Message de ton coach</div>'+
        '<div style="font-size:13px;color:#7A4A00;line-height:1.7;font-weight:600">'+alertD.msg+'</div></div>';
    }
  }

  // poids
  h+='<div class="card" style="display:flex;align-items:center;gap:14px"><span style="font-size:24px">⚖️</span>'+
    '<div style="flex:1"><div class="card-label">POIDS (KG)</div>'+
    '<input id="in-poids" class="num-input" type="number" step="0.1" placeholder="ex: 78.5" value="'+esc(d.poids||"")+'"/></div></div>';

  // sommeil h
  h+='<div class="card"><div style="display:flex;align-items:center;gap:14px"><span style="font-size:24px">⏱️</span>'+
    '<div style="flex:1"><div class="card-label">HEURES DE SOMMEIL</div>'+
    '<input id="in-sommeil" class="num-input" type="number" step="0.5" min="0" max="24" placeholder="ex: 7.5" value="'+esc(d.sommeilH||"")+'"/></div></div>'+
    '<div id="cycle-viz">'+cycleVizHTML(d.sommeilH)+'</div></div>';

  // 🌙 Cycles de sommeil — semaine (déplacé de l'accueil vers le calendrier)
  h+='<div id="sleep-week">'+sleepWeekHTML(allData,idx,today90)+'</div>';

  // mental

  });
  var idx=state.selDay;
  function cur(){return getAllData()[idx]||{};}
  function persist(patch){
    var d=cur();
    for(var k in patch)d[k]=patch[k];
    if(!d.habits)d.habits={};
    saveDay(idx,d);
    var badge=document.getElementById("saved-badge");
    if(badge){badge.style.display="inline";setTimeout(function(){if(badge)badge.style.display="none";},1500);}

  document.getElementById("day-back").addEventListener("click",function(){state.selDay=null;state.showBilan=false;render();});

    var cv=document.getElementById("cycle-viz");

  var mbtns=document.querySelectorAll("[data-mental]");

    });

  var ebtns=document.querySelectorAll("[data-energie]");

    ebtns[j].addEventListener("click",function(){
      var v=parseInt(this.getAttribute("data-energie"));

      persist({energie:d.energie===v?null:v});

      var id=this.getAttribute("data-habit");

      var habits=d.habits||{};
      habits[id]=!habits[id];
      persist({habits:habits});
      // #11 Retour haptique : micro-vibration au check, triple si toutes les habitudes cochées
      if(habits[id]){
        var allChecked=true;
        for(var hc=0;hc<HABITS.length;hc++){if(!habits[HABITS[hc].id]){allChecked=false;break;}}

  // ⭐ Habitude perso : ajout / modification

    e.stopPropagation();

  function saveMindset(){

    m.positif=document.getElementById("ms-positif").value;
    m.negatif=document.getElementById("ms-negatif").value;
    persist({mindset:m});
  }
  ["ms-fier","ms-positif","ms-negatif"].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.addEventListener("input",saveMindset);
  });
  var bt=document.getElementById("bilan-toggle");
  if(bt)bt.addEventListener("click",function(){state.showBilan=!state.showBilan;render();});

  var sbtns=document.querySelectorAll("[data-scale]");
  for(var s=0;s<sbtns.length;s++){
    sbtns[s].addEventListener("click",function(){
      var key=this.getAttribute("data-scale"), val=parseInt(this.getAttribute("data-val"));
      var d=cur();

      b[key]=b[key]===val?null:val;

      (b.sportDiff?"🏋️ Sport "+b.sportDiff+"/10 · ":"")+(b.nutritionDiff?"🥗 Nutrition "+b.nutritionDiff+"/10 · ":"")+(b.sommeilDiff?"😴 Sommeil "+b.sommeilDiff+"/10 · ":"")+(b.stress?"🧠 Stress "+b.stress+"/10":"")+"\n"+
      (b.victoire?"🏆 Victoire : "+b.victoire+"\n":"")+
      (b.blocage?"🤛 Difficulté : "+b.blocage+"\n":"")+
      (b.ressenti?"💬 Ressenti : "+b.ressenti+"\n":"")+
      ((m.fier||m.positif||m.negatif)?"\n🌙 Ce soir :\n"+(m.fier?"🥇 "+m.fier+"\n":"")+(m.positif?"🌟 "+m.positif+"\n":"")+(m.negatif?"🌧️ "+m.negatif+"\n":""):"")+
      (b.question?"\n❓ Ma question : "+b.question:"");
    waSend(t.trim());
  });
  // 📊 Résumé nutrition semaine en WhatsApp (D)
  var nutRec=document.getElementById("nut-recap");
  if(nutRec)nutRec.addEventListener("click",function(){
    var allData=getAllData();
    var cfg=nutCfg(allData);
    if(!cfg.on)return;
    var wStart=Math.max(0,idx-6),totW=0,okW=0,items={};
    for(var nwd=0;nwd<7;nwd++){
      var nwdt=new Date();nwdt.setDate(nwdt.getDate()-nwd);
      var nwk=isoLocal(nwdt);
      var nwe=(cfg.daily&&cfg.daily[nwk])||null;
      if(nwe){
        totW+=nwe.tot;
        if(nwe.tot>=cfg.prot*0.8)okW++;
        for(var nfi=0;nfi<(nwe.foods||[]).length;nfi++){
          var nf=nwe.foods[nfi];
          items[nf.name]=(items[nf.name]||0)+1;
        }
      }
    }
    var avgW=Math.round(totW/7);
    var top2=Object.keys(items).sort(function(a,b){return items[b]-items[a];}).slice(0,2);
    var t="🍗 Résumé nutrition — Semaine "+Math.floor(idx/7)+1+"\n\n"+
      "💪 Protéines moyennes : "+avgW+" g/jour\n"+
      "Quota cible : "+cfg.prot+" g/jour\n"+
      "✅ Jours réussis : "+okW+"/7 (≥80%)\n\n"+
      "🥘 Aliments favoris :\n"+
      (top2[0]?"#1 "+top2[0]+" ("+items[top2[0]]+"×)\n":"")+
      (top2[1]?"#2 "+top2[1]+" ("+items[top2[1]]+"×)\n":"")+
      "\n→ Continue comme ça ! 💪";
    waSend(t.trim());
  });
}

<script>

function viewStats(name){
  var allData=getAllData();
  var start=lsGetStr("amcoach_start_"+CLIENT);
  var today90=start?getToday90(start):89;
  var series=computeSeries(allData,90);
  var lastIdx=-1;
  for(var i=89;i>=0;i--){if(series[i].score!=null){lastIdx=i;break;}}
  if(lastIdx<0)lastIdx=Math.max(0,Math.min(89,today90));

  function vals(key){return series.map(function(d){return d[key];});}
  var poidsV=vals("poids");

  var PJ=statProjection(poidsV,cible,lastIdx);

  var h='<div class="hdr"><div class="hdr-brand"><div class="bar bar-r"></div>'+
    '<span class="hdr-title">Ma progression</span><div class="bar bar-b"></div></div>'+
    '<div class="hdr-sub">'+esc(name)+' · jour '+(Math.min(90,today90+1))+' sur 90</div></div>'+
    '<div style="padding:16px 14px 0">';

  // ═══ 1. LE VERDICT ═══

      ico="🌱";titre="Ta courbe se construit";
      sous="Remplis encore "+(4-rempli)+" jour"+((4-rempli)>1?"s":"")+" et je pourrai te dire où tu vas.";

    }else if(!PJ){
      ico="⚖️";titre="Pèse-toi pour voir ta tendance";
      sous="Une pesée régulière, même approximative, suffit à faire apparaître la direction.";
      bg="linear-gradient(135deg,#455A64,#607D8B)";
    }else if(PJ.atteint){
      ico="🎉";titre="Objectif atteint";
      sous="Tu es à "+PJ.act+" kg. Place au maintien : c'est là que la transformation devient définitive.";
      bg="linear-gradient(135deg,#1B5E20,var(--ok))";
    }else if(!PJ.assez){
      ico="⏳";titre="Encore un peu de patience";
      sous="Il me faut environ 8 pesées pour distinguer une vraie tendance du bruit quotidien. Tu en as "+((PJ.tendance&&PJ.tendance.n)||0)+".";
      bg="linear-gradient(135deg,#455A64,#607D8B)";

      '<div style="font-size:26px;line-height:1">'+ico+'</div>'+

      '<div style="color:rgba(255,255,255,.85);font-size:12.5px;font-weight:600;line-height:1.55;margin-top:5px">'+sous+'</div></div>';
  })();

  // ═══ 2. LA COURBE DE POIDS ═══
  h+='<div class="chart-card">'+
    '<div class="chart-hdr"><div class="chart-dot" style="background:var(--ink)"></div>'+
    '<span class="chart-title">Mon poids</span>'+
    (PJ&&PJ.act?'<span class="chart-avg">'+PJ.act+' kg</span>':'')+'</div>'+
    svgPoidsChart(poidsV,cible)+
    '<div style="display:flex;gap:14px;margin-top:9px;font-size:10.5px;color:#999;font-weight:700">'+
    '<span><span style="display:inline-block;width:14px;height:2px;background:var(--ink);vertical-align:middle"></span> tes pesées</span>'+
    '<span><span style="display:inline-block;width:14px;height:2px;background:var(--gold-d);vertical-align:middle"></span> ta tendance</span>'+
    (cible?'<span><span style="display:inline-block;width:14px;height:2px;background:var(--ok);vertical-align:middle"></span> objectif</span>':'')+
    '</div>';
  h+='</div>';

  // ═══ 3. CETTE SEMAINE VS LA PRÉCÉDENTE ═══
  (function(){
    var defs=[
      {k:"poids",lbl:"Poids",u:" kg",ico:"⚖️",mieux:"bas"},

        txt="stable vs semaine dernière";

        txt="1re semaine";
      }
      cards+='<div style="background:#fff;border-radius:11px;padding:12px;box-shadow:0 1px 4px #0000000d">'+
        '<div style="font-size:11px;font-weight:800;color:#888">'+D.ico+' '+D.lbl+'</div>'+
        '<div style="font-size:19px;font-weight:900;color:var(--ink);margin-top:2px">'+S.actuel+'<span style="font-size:11px;color:#AAA">'+D.u+'</span></div>'+

    }
    if(aucun)return;
    h+='<div style="display:flex;align-items:center;gap:8px;margin:18px 0 10px"><div style="width:3px;height:18px;background:var(--brand2);border-radius:2px"></div>'+
      '<span style="font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:1px">Ma semaine</span></div>'+
      '<div style="font-size:11.5px;color:#999;margin-bottom:10px;line-height:1.5">Moyenne des 7 derniers jours remplis, comparée aux 7 précédents.</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:6px">'+cards+'</div>';
  })();

  // ═══ 4. CE QUE DISENT TES DONNÉES ═══
  (function(){
    if(rempli<10)return;
    var msgs=[];
    function moyQuand(cleFiltre,seuil,cleMesure,haut){
      var a=[],b=[];
      for(var i=0;i<=lastIdx;i++){
        var vf=series[i][cleFiltre],vm=series[i][cleMesure];
        if(vf==null||vm==null)continue;
        if(haut?(vf>=seuil):(vf<seuil))a.push(vm);else b.push(vm);
      }
      if(a.length<3||b.length<3)return null;
      function m(l){var s=0;for(var k=0;k<l.length;k++)s+=l[k];return s/l.length;}
      return {avec:Math.round(m(a)),sans:Math.round(m(b)),nA:a.length,nB:b.length};
    }
    var som=moyQuand("sommeilH",7,"mental",true);
    if(som&&som.avec-som.sans>=8){
      msgs.push({ico:"😴",txt:"Les jours où tu dors 7 h ou plus, ton mental est à <strong>"+som.avec+" %</strong> — contre "+som.sans+" % les autres jours. Ton sommeil est ton levier le plus rentable."});
    }
    var en=moyQuand("sommeilH",7,"energie",true);
    if(en&&en.avec-en.sans>=8){
      msgs.push({ico:"⚡",txt:"Ton énergie physique passe de "+en.sans+" % à <strong>"+en.avec+" %</strong> quand tu as bien dormi."});
    }
    var sc=moyQuand("mental",60,"score",true);
    if(sc&&sc.avec-sc.sans>=10){
      msgs.push({ico:"🧠",txt:"Quand ton mental tient, ton score de la journée monte à <strong>"+sc.avec+" %</strong> au lieu de "+sc.sans+" %. Le moral tire le reste."});
    }
    var TP=statTendance(poidsV);
    if(TP&&TP.n>=8&&TP.pente<-0.005){
      msgs.push({ico:"📉",txt:"Tu perds en moyenne <strong>"+(Math.round(-TP.pente*7*100)/100)+" kg par semaine</strong> depuis le début du suivi."});
    }
    if(!msgs.length)return;
    h+='<div style="display:flex;align-items:center;gap:8px;margin:18px 0 10px"><div style="width:3px;height:18px;background:var(--violet);border-radius:2px"></div>'+
      '<span style="font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:1px">Ce que disent tes données</span></div>';
    for(var m2=0;m2<msgs.length&&m2<3;m2++){
      h+='<div style="display:flex;gap:10px;background:#fff;border-radius:11px;padding:12px 13px;margin-bottom:8px;box-shadow:0 1px 4px #0000000d">'+
        '<span style="font-size:18px;line-height:1.3">'+msgs[m2].ico+'</span>'+
        '<div style="flex:1;font-size:12px;color:#444;line-height:1.6">'+msgs[m2].txt+'</div></div>';
    }
  })();

  // ═══ 5. RÉGULARITÉ ═══
  (function(){
    var avgScore=avgOf(series,"score");
    var bs=bestStreak(allData,Math.min(89,lastIdx));
    h+='<div style="display:flex;align-items:center;gap:8px;margin:18px 0 10px"><div style="width:3px;height:18px;background:'+R+';border-radius:2px"></div>'+
      '<span style="font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:1px">Ma régularité</span></div>'+
      '<div class="kpi-row" style="margin-bottom:12px">'+
      '<div class="kpi-card"><div class="kpi-val" style="color:'+R+'">'+rempli+'</div><div class="kpi-lbl">Jours remplis</div></div>'+
      '<div class="kpi-card"><div class="kpi-val" style="color:var(--warn-d)">'+bs+'</div><div class="kpi-lbl">Meilleure série</div></div></div>'+
      '<div class="chart-card"><div class="chart-hdr"><div class="chart-dot" style="background:'+R+'"></div>'+
      '<span class="chart-title">Score global</span>'+
      (avgScore!=null?'<span class="chart-avg">moy. '+avgScore+'%</span>':'')+'</div>'+
      svgLineChart(vals("score"),R,{min:0,max:100})+
      '<div style="font-size:10.5px;color:#AAA;margin-top:7px;line-height:1.5">Ce score résume ta journée : habitudes cochées, ressenti, sommeil.</div></div>';
  })();

  // ═══ 6. TROPHÉES ═══
  (function(){
    var bs=bestStreak(allData,89);
    var res=qgRes(allData,89);
    var wins=0;for(var w2=0;w2<90;w2++){var m2=allData[200+w2];if(m2&&m2.status==="done")wins++;}
    var TROPHIES=[
      {icon:"🔥",name:"Semaine de Fer",cond:bs>=7,desc:"7 jours d'affilée"},
      {icon:"⚔️",name:"Régularité d'Acier",cond:bs>=21,desc:"21 jours d'affilée"},
      {icon:"🦾",name:"Machine de Guerre",cond:bs>=45,desc:"45 jours d'affilée"},
      {icon:"🧱",name:"Premier Mur",cond:res.total>=8,desc:"8 briques posées"},
      {icon:"🏗️",name:"Bâtisseur",cond:res.total>=40,desc:"40 briques posées"},
      {icon:"👑",name:"Citadelle",cond:res.total>=120,desc:"120 briques posées"},
      {icon:"🟢",name:"Conquérant",cond:wins>=10,desc:"10 zones sécurisées"},
      {icon:"🏴",name:"Seigneur de Guerre",cond:wins>=30,desc:"30 zones sécurisées"},
      {icon:"📅",name:"Premier Mois",cond:rempli>=28,desc:"28 jours remplis"},
      {icon:"🎓",name:"Transformation",cond:rempli>=84,desc:"84 jours remplis"}
    ];
    // 🏅 Badges de challenges décrochés
    (function(){
      var bd=chBadges(allData);
      if(!bd.length)return;
      var chips='';
      for(var q=0;q<bd.length&&q<9;q++){
        chips+='<div style="background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:11px 8px;text-align:center;box-shadow:var(--shadow)">'+
          '<div style="font-size:22px">'+bd[q].e+'</div>'+
          '<div style="font-size:10px;font-weight:900;margin-top:4px;line-height:1.25">'+esc(bd[q].n)+'</div>'+
          '<div style="font-size:9.5px;color:var(--mute);font-weight:700;margin-top:2px">'+bd[q].jours+' j ✓</div></div>';
      }
      h+='<div style="display:flex;align-items:center;gap:8px;margin:18px 0 10px"><div style="width:3px;height:18px;background:var(--gold);border-radius:2px"></div>'+
        '<span style="font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:1px">🏅 Challenges réussis</span></div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">'+chips+'</div>';
    })();
    h+='<div style="display:flex;align-items:center;gap:8px;margin:18px 0 10px"><div style="width:3px;height:18px;background:var(--gold);border-radius:2px"></div>'+
      '<span style="font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:1px">🏆 Trophées</span></div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px">';
    for(var tr=0;tr<TROPHIES.length;tr++){
      var T=TROPHIES[tr];
      h+='<div style="background:'+(T.cond?"#fff":"var(--soft2)")+';border-radius:12px;padding:12px;text-align:center;box-shadow:0 1px 4px #0001;'+(T.cond?"border:2px solid var(--gold)":"opacity:.5")+'">'+

        '<div style="font-size:11px;color:#777;margin-top:2px">'+(T.cond?"✓ DÉBLOQUÉ":T.desc)+'</div></div>';
    }
    h+='</div>';
  })();

  return h+'</div>';
}

function viewRapport(name,start){

    '<span class="hdr-title">Rapport PDF</span><div class="bar bar-b"></div></div>'+
    '<div class="hdr-sub">'+esc(name)+' · TransfoPhysique</div></div>'+

    '<div style="font-size:13px;color:#666;line-height:1.6;margin-bottom:20px">Un rapport complet s\'ouvre dans un nouvel onglet.<br/>Appuie sur <strong>Partager ↑</strong> → <strong>Imprimer</strong> → <strong>Enregistrer en PDF</strong>.</div>';
  var periods=[7,30,60,90];

      '<div style="font-size:11px;color:#666;text-align:center;margin-top:5px">'+n+'/'+pDays+' jours remplis ('+pct+'%)</div></div>';

  return h;
}

function openRapport(name,start,period,dataOverride){
  var allData=dataOverride||getAllData();
  var series=computeSeries(allData,period);

i{margin-bottom:5px}.bk{font-size:11px;color:#666;font-weight:700;text-transform:uppercase;margin-bottom:2px}.bt{font-size:12px;color:#333;line-height:1.5}.ftr{background:var(--ink);padding:20px;text-align:center;margin-top:14px}.fm{color:#666;font-size:11px;line-height:1.8}.fs{color:#fff;font-weight:900;font-size:13px;margin-top:8px}@media print{body{background:#fff}}";

  var html="<!DOCTYPE html><html lang='fr'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Rapport J"+period+" — "+esc(name)+"</title><style>"+themeCSS()+css+"</style></head><body><div id='rapbar' style='position:sticky;top:0;z-index:999;background:var(--ink);padding:9px 10px;display:flex;gap:7px'><button onclick='rapShare()' style='flex:1;background:var(--brand2);color:#fff;border:0;border-radius:9px;padding:11px 6px;font-weight:800;font-size:13px'>📤 Partager</button><button onclick='rapPdf()' style='flex:1;background:var(--gold);color:#fff;border:0;border-radius:9px;padding:11px 6px;font-weight:800;font-size:13px'>🖨️ PDF</button><button onclick='window.close();setTimeout(function(){if(history.length>1)history.back();},250)' style='background:#333;color:#fff;border:0;border-radius:9px;padding:11px 13px;font-weight:800;font-size:13px'>✕</button></div><div class='pg'>";
  html+="<div class='hdr'><div class='brand'><div class='b' style='background:var(--brand)'></div>AM Coach Genève<div class='b' style='background:var(--brand2)'></div></div><div class='sub'>TransfoPhysique · Rapport J"+period+"</div></div>";
  html+="<div class='hero'><div class='hn'>"+esc(name)+"</div><div class='hs'>"+period+" jours de transformation</div><div class='hd'>"+fmt(d0)+" → "+fmt(d1)+"</div></div>";

  html+="<div class='kpi'><div class='kv' style='color:var(--brand)'>"+filled.length+"<span style='font-size:13px'>/"+period+"</span></div><div class='kl'>Jours remplis</div></div></div>";
  html+="<div class='sec'><div class='st'><div class='sb' style='background:var(--brand)'></div><span class='sl'>Courbes de progression</span></div>";
  html+="<div class='ch'><div class='ct'>Score global</div>"+spark("score","var(--brand)")+"</div>";
  html+="<div class='ch'><div class='ct'>Ressenti mental</div>"+spark("mental","var(--brand2)")+"</div>";
  if(pv.length>=2)html+="<div class='ch'><div class='ct'>Poids (kg)</div>"+spark("poids","#555")+"</div>";
  html+="</div><div class='sec'><div class='st'><div class='sb' style='background:var(--brand2)'></div><span class='sl'>Habitudes sur "+period+" jours</span></div><div class='hg'>";

  // MINDSET RÉCAP

  // Barre d'actions du rapport : partage natif (feuille iOS) + impression/PDF
  var resume="Rapport "+name+" — J"+period+"\n"+
    (avgScore?"Score moyen : "+avgScore+" %\n":"")+

  html+="<script>"+
