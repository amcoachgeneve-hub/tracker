<script>
/* ═══════════ THÈME AVANT LE PREMIER AFFICHAGE ═══════════
   La palette par défaut du CSS est le corail. Le bleu n'arrivait qu'une fois
   les données chargées : d'où l'éclair orange à l'ouverture. On mémorise donc
   le thème du dernier passage et on le pose ici, avant tout rendu. */
(function(){try{
  if(localStorage.getItem("d90-theme")==="h")
    document.documentElement.className+=" th-h";
}catch(e){}})();
</script>
<style>
/* ═══════════ THÈMES ═══════════
   Deux palettes choisies selon la fiche du client (femme / homme).
   Toutes les couleurs de l'app passent par ces variables. */
:root,.app,.dark-screen{
  --card:#FFFFFF;
  --ink:#101828; --ink2:#26304A;
  --brand:#0EA5C6; --brand-d:#0A7FA0; --brand2:#8A3FFF;
  --ok:#12C98A; --ok-d:#0E9C6B; --ok-l:#5FE0B4;
  --warn:#E9A23B; --warn-d:#C07E17; --amber:#F5C46A;
  --bad:#E5484D; --violet:#8A3FFF;
  --gold:#E9A23B; --gold-d:#C07E17;
  --mute:#4A5568; --line:#E1E6F0;
  --soft:#F5F7FC; --soft2:#EDF1F9; --bg:#F5F7FC;
  --sky:linear-gradient(180deg,#E9F1FB 0%,#F1F5FC 34%,#F6F8FD 70%);
  --shadow:0 4px 14px rgba(16,24,40,.07);
  --shadow-l:0 10px 26px rgba(16,24,40,.11);
}
.th-h,.app.th-h,.dark-screen.th-h{
  --ink:#101828; --ink2:#26304A;
  --brand:#0EA5C6; --brand-d:#0A7FA0; --brand2:#8A3FFF;
  --ok:#12C98A; --ok-d:#0E9C6B; --ok-l:#5FE0B4;
  --warn:#E9A23B; --warn-d:#C07E17; --amber:#F5C46A;
  --bad:#E5484D; --violet:#8A3FFF;
  --gold:#E9A23B; --gold-d:#C07E17;
  --mute:#4A5568; --line:#E1E6F0;
  --soft:#F5F7FC; --soft2:#EDF1F9; --bg:#F5F7FC;
  --sky:linear-gradient(180deg,#E4EEFA 0%,#EFF4FC 34%,#F5F8FD 70%);
  --shadow:0 4px 14px rgba(16,24,40,.07);
  --shadow-l:0 10px 26px rgba(16,24,40,.11);
}

/* ═══════════ 🏋️ ONGLET SPORT — clair, contours colorés ═══════════
   Akli : « fond blanc c'est plus joli ». On garde ce qui faisait l'identité
   de l'écran — l'anneau lumineux, les dégradés cyan→violet des gros boutons,
   les couleurs par phase — mais posés sur le blanc du reste de l'appli. */
.spt-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 15px;margin-bottom:13px;
  box-shadow:0 3px 14px rgba(16,24,40,.06);transition:border-color .4s,box-shadow .4s}
.spt-lab{font-weight:900;font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:12px;color:var(--ink)}
.spt-lab.cy{color:var(--ink)}
.spt-cy{color:#0EA5C6}
.spt-txt{font-size:12.5px;color:var(--mute);line-height:1.7}
.spt-flab{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.spt-inp{width:100%;padding:12px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);
  color:var(--ink);font-size:21px;font-weight:900;text-align:center;-moz-appearance:textfield}
.spt-inp::-webkit-outer-spin-button,.spt-inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.spt-pill{flex:1;min-width:56px;padding:11px 4px;border-radius:13px;font-weight:900;font-size:12.5px;
  background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.spt-pill.big{font-size:14px;padding:13px 4px}
.spt-pill.on{border-color:#12B5EA;color:#0B7FA8;box-shadow:0 0 0 3px rgba(18,181,234,.14)}
.spt-pill.gold{border-color:#E9A23B;color:#9A6511;box-shadow:0 0 0 3px rgba(233,162,59,.16)}
.spt-go{flex:1;width:100%;padding:16px 0;border-radius:16px;color:#fff;font-weight:900;font-size:16px;letter-spacing:1.4px;
  background:linear-gradient(90deg,#12B5EA 0%,#8A3FFF 100%);box-shadow:0 8px 20px rgba(96,120,255,.28)}
.spt-go.pause{background:linear-gradient(90deg,#8C93A8 0%,#6B7280 100%);box-shadow:0 8px 18px rgba(16,24,40,.16)}
.spt-go.ok{background:linear-gradient(90deg,#12C98A 0%,#12B5EA 100%);box-shadow:0 8px 20px rgba(18,201,138,.3)}
.spt-sq{flex:0 0 70px;padding:16px 0;border-radius:16px;background:var(--soft);border:1.5px solid var(--line);
  color:#12B5EA;font-size:17px}
.spt-plan{background:none;border:none;box-shadow:none;padding:0;margin-bottom:0}

/* ═══════════ 📊 ONGLET STATS — clair ═══════════ */
.app.stats-mode{--st-cy:#0EA5C6;--st-vi:#7C4DEF;--st-ok:#12A66B;--st-bad:#E24C4C;
  --st-dim:var(--mute);--st-card:#fff;--st-line:var(--line)}
.stats-mode .chart-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;
  box-shadow:0 3px 14px rgba(16,24,40,.06)}
/* Le verdict du superviseur : une échelle de couleur, de l'orange quand ça
   coince au vert fluo quand tout est aligné. La couleur porte l'info avant
   même la lecture. */
.st-verdict{border-radius:18px;padding:17px 16px;margin-bottom:16px;box-shadow:0 6px 18px rgba(16,24,40,.1)}
.st-verdict-sig{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:900;margin-bottom:9px;opacity:.85}
.st-verdict-ico{margin-left:auto;font-size:20px;line-height:1}
.st-verdict-t{font-weight:900;font-size:19px;line-height:1.25}
.st-verdict-s{font-size:13px;font-weight:600;line-height:1.6;margin-top:6px;opacity:.92}
.st-echelle{display:flex;gap:4px;margin-top:12px}
.st-echelle i{flex:1;height:5px;border-radius:3px;background:rgba(0,0,0,.14)}
.st-echelle i.on{background:rgba(255,255,255,.95)}
.st-h3{display:flex;align-items:center;gap:9px;margin:20px 0 10px}
.st-h3-bar{width:3px;height:17px;border-radius:2px}
.st-h3 span{font-weight:900;font-size:13.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--ink)}
.st-note{font-size:12px;color:var(--mute);line-height:1.55;margin:-3px 0 11px}
.st-grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:6px}
.st-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:6px}
.st-w{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 14px;box-shadow:0 3px 12px rgba(16,24,40,.05)}
.st-w.cy{border-color:rgba(14,165,198,.4)}
.st-w.vi{border-color:rgba(124,77,239,.35)}
.st-w.vide{opacity:.6}
.st-w-lbl{font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:5px}
.st-w-val{font-size:27px;font-weight:900;letter-spacing:-.5px;color:var(--ink);line-height:1.05}
.st-w-val span{font-size:14px;font-weight:600;color:var(--mute);margin-left:2px}
.st-w.cy .st-w-val{color:var(--st-cy)}
.st-w.vi .st-w-val{color:var(--st-vi)}
.st-w-sub{font-size:11.5px;font-weight:700;line-height:1.4;margin-top:5px;color:var(--mute)}
.st-ins{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 15px;
  margin-bottom:9px;font-size:13px;line-height:1.6;color:var(--mute);box-shadow:0 3px 12px rgba(16,24,40,.05)}
.st-ins-i{font-size:18px;line-height:1.3;flex-shrink:0}
.st-ins strong{color:var(--ink);font-weight:800}
.st-kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 14px;text-align:center;box-shadow:0 3px 12px rgba(16,24,40,.05)}
.st-kpi-n{font-size:36px;font-weight:900;letter-spacing:-1px;line-height:1}
.st-kpi-l{font-size:12.5px;color:var(--mute);margin-top:5px}
.st-badge{background:#fff;border:2px solid var(--gold);border-radius:14px;padding:11px 8px;text-align:center}
.st-badge-n{font-size:10px;font-weight:900;margin-top:4px;line-height:1.25;color:var(--ink)}
.st-badge-j{font-size:9.5px;color:var(--mute);font-weight:700;margin-top:2px}
.st-tro{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 10px;text-align:center}
.st-tro.on{border:2px solid var(--gold)}
.st-tro:not(.on){opacity:.5}
.st-tro:not(.on) .st-tro-i{filter:grayscale(1)}
.st-tro-i{font-size:24px}
.st-tro-n{font-weight:900;font-size:11.5px;margin-top:5px;color:var(--ink)}
.st-tro-d{font-size:11px;color:var(--mute);margin-top:3px}
.st-det{margin-top:4px}
.st-det summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:800;color:var(--st-cy);padding:11px 0;
  text-align:center;border:1px solid var(--line);border-radius:13px;background:#fff}
.st-det summary::-webkit-details-marker{display:none}
.st-leg{display:flex;gap:15px;margin-top:10px;font-size:11px;color:var(--mute);font-weight:700;flex-wrap:wrap}
.st-leg i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:4px}
/* Progression par exercice */
.st-exo{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:9px;box-shadow:0 3px 12px rgba(16,24,40,.05)}
.st-exo-hd{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.st-exo-n{font-weight:900;font-size:13.5px;color:var(--ink);flex:1;min-width:0}
.st-exo-d{font-size:12px;font-weight:900;white-space:nowrap}
.st-exo-l{font-size:11.5px;color:var(--mute);font-weight:700;margin-top:6px}

/* ═══════════ 🏋️ SÉANCES — constructeur (coach) et exécution (client) ═══════════ */
.prg-top{display:flex;align-items:center;gap:11px;padding:14px 13px 10px;position:sticky;top:0;z-index:5;background:var(--sky)}
.prg-back{flex:0 0 38px;height:38px;border-radius:12px;background:var(--soft2);font-size:22px;font-weight:900;line-height:1;color:var(--ink)}
.prg-titre{font-weight:900;font-size:18px;line-height:1.2;color:var(--ink)}
.prg-sous{font-size:11.5px;font-weight:700;color:var(--mute);margin-top:2px}
.prg-exo{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:15px;
  margin-bottom:10px;overflow:hidden;box-shadow:0 3px 12px rgba(16,24,40,.05)}
.prg-exo.lie{margin-top:-4px;border-top-left-radius:4px;border-top-right-radius:4px}
.prg-supbadge{font-size:10.5px;font-weight:900;letter-spacing:.5px;color:#7C4DEF;padding:6px 13px 0}
.prg-exo-hd{display:flex;align-items:center;gap:10px;padding:13px;cursor:pointer}
.prg-vig{flex:0 0 46px;height:46px;border-radius:11px;object-fit:cover;background:var(--soft2)}
.prg-exo-n{font-weight:900;font-size:14.5px;color:var(--ink)}
.prg-exo-m{font-size:11.5px;font-weight:700;color:var(--mute);margin-top:2px}
.prg-exo-r{font-size:11.5px;font-weight:800;color:#0EA5C6;text-align:right;white-space:nowrap}
.prg-chev{font-size:15px;color:var(--mute);flex:0 0 12px}
.prg-exo-bd{padding:0 13px 14px}
.prg-serie,.prg-run-serie{display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:nowrap}
.prg-sn{font-size:11.5px;font-weight:900;color:var(--mute);flex:0 0 22px}
.prg-in{flex:1 1 52px;min-width:0;padding:9px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--soft);
  font-size:15px;font-weight:900;text-align:center;color:var(--ink);-moz-appearance:textfield}
.prg-in.court{flex:1 1 46px}
.prg-in::-webkit-outer-spin-button,.prg-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.prg-sel{flex:1 1 86px;min-width:0;padding:9px 4px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:11.5px;font-weight:800}
.prg-sel.court{flex:0 0 62px}
.prg-at{font-size:12px;color:var(--mute);font-weight:800}
.prg-un{font-size:11px;font-weight:800;color:var(--mute);flex:0 0 26px}
.prg-x{flex:0 0 26px;height:32px;border-radius:9px;background:var(--soft2);color:var(--mute);font-weight:900;font-size:12px}
.prg-mini{padding:10px 12px;border-radius:11px;background:var(--soft2);font-weight:900;font-size:12px;color:var(--ink)}
.prg-mini.on{background:var(--violet);color:#fff}
.prg-mini.bad{color:var(--bad)}
.prg-flab{font-size:10.5px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:var(--mute);margin:10px 0 6px}
.prg-chips{display:flex;gap:6px;flex-wrap:wrap}
.prg-chip{padding:8px 11px;border-radius:10px;background:var(--soft2);font-weight:900;font-size:11.5px;color:var(--mute)}
.prg-chip.on{background:var(--ink);color:#fff}
.prg-note{width:100%;padding:10px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-family:inherit;resize:vertical}
.prg-tabs{display:flex;gap:7px;margin-bottom:11px}
.prg-tab{flex:1;padding:11px 4px;border-radius:12px;background:var(--soft2);font-weight:900;font-size:12px;color:var(--mute)}
.prg-tab.on{background:var(--ink);color:#fff}
.prg-search{width:100%;padding:12px 14px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font-size:14px;margin-bottom:12px}
.prg-bx{display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.prg-bx.on{border-color:var(--ok);background:#F1FBF5}
.prg-bx-p{flex:0 0 10px;height:34px;border-radius:6px}
.prg-bx-n{font-weight:900;font-size:13.5px;color:var(--ink)}
.prg-bx-m{font-size:11.5px;color:var(--mute);font-weight:700;margin-top:2px}
.prg-star{flex:0 0 30px;font-size:17px;color:var(--line);background:none}
.prg-star.on{color:var(--gold)}
.prg-plus{flex:0 0 22px;text-align:center;font-size:17px;font-weight:900;color:var(--mute)}
.prg-bx.on .prg-plus{color:var(--ok)}
.prg-barre{position:fixed;left:0;right:0;bottom:0;padding:12px 13px calc(12px + env(safe-area-inset-bottom));background:var(--sky);border-top:1px solid var(--line);z-index:20}
.prg-cartes{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.prg-carte{flex:0 0 60%;min-height:92px;border-radius:16px;border:1.5px solid;padding:13px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end}
.prg-carte-n{font-weight:900;font-size:16px;line-height:1.2;color:var(--ink)}
.prg-carte-s{font-size:11.5px;font-weight:700;margin-top:3px;color:var(--mute)}
.prg-jauge{height:5px;background:var(--soft2);margin:0 13px;border-radius:3px;overflow:hidden}
.prg-jauge div{height:100%;background:linear-gradient(90deg,#12B5EA,#12C98A);transition:width .3s}
.prg-note-lue{font-size:12px;color:#5B4B8A;background:rgba(124,77,239,.09);border-radius:10px;padding:9px 11px;margin-bottom:9px;line-height:1.5}
.prg-dern{font-size:11.5px;font-weight:700;color:#0EA5C6;margin-bottom:9px}
.prg-run-serie{padding:5px 0}
.prg-run-serie.ok{opacity:.6}
.prg-check{flex:0 0 30px;height:30px;border-radius:9px;border:2px solid var(--line);background:#fff;color:#fff;font-weight:900;font-size:15px}
.prg-check.on{background:#12C98A;border-color:#12C98A}
.prg-cible{flex:0 0 88px;font-size:11px;font-weight:800;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prg-video{flex:0 0 34px;height:34px;border-radius:10px;background:var(--soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:15px}
.prg-rest{position:fixed;left:10px;right:10px;bottom:78px;display:none;align-items:center;gap:10px;padding:12px 14px;
  border-radius:16px;background:#fff;border:1.5px solid #12B5EA;box-shadow:0 8px 24px rgba(16,24,40,.16);z-index:30}
.prg-rest.on{display:flex}
.prg-rest-l{font-size:11.5px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#0EA5C6}
.prg-rest-t{flex:1;text-align:right;font-size:24px;font-weight:900;color:var(--ink)}
.prg-rest-b{flex:0 0 40px;height:38px;border-radius:11px;background:var(--soft);border:1px solid var(--line);color:#0EA5C6;font-weight:900;font-size:13px}
/* Attribution d'une séance à des clients */
.prg-cli{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:12px;margin-bottom:8px;cursor:pointer}
.prg-cli.on{border-color:var(--ok);background:#F1FBF5}
.prg-cli-n{flex:1;font-weight:800;font-size:13.5px;color:var(--ink)}
.prg-cli-e{font-size:11.5px;color:var(--mute);font-weight:700}

/* ═══════════ ⚖️ HISTORIQUE DES PESÉES ═══════════ */
.pes-share{flex:0 0 42px;height:42px;border-radius:12px;background:var(--soft2);font-size:18px}
.pes-tete{display:flex;justify-content:space-between;align-items:flex-end;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 3px 12px rgba(16,24,40,.05)}
.pes-tete-l{font-size:11.5px;font-weight:700;color:var(--mute)}
.pes-tete-v{font-size:26px;font-weight:900;letter-spacing:-.5px;color:var(--ink);line-height:1.1}
.pes-l{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.pes-kg{font-size:23px;font-weight:900;letter-spacing:-.5px;color:var(--ink);line-height:1}
.pes-kg span{font-size:12px;font-weight:700;color:var(--mute);margin-left:3px}
.pes-d{font-size:12px;font-weight:800;margin-top:3px}
.pes-carres{flex:1;display:flex;gap:3px;justify-content:center}
.pes-carres i{width:11px;height:11px;border-radius:3px;background:var(--soft2)}
.pes-carres i.on{background:#8BE229}
.pes-carres i.mid{background:#F5B742}
.pes-date{flex:0 0 54px;text-align:center;line-height:1.15}
.pes-mois{font-size:11.5px;color:var(--mute);font-weight:700}
.pes-num{font-size:19px;font-weight:900;color:var(--ink)}
.pes-an{font-size:10px;color:var(--mute);font-weight:700}
.pes-jour{flex:0 0 62px;text-align:right;font-size:11.5px;color:var(--mute);font-weight:700}
.part-prev{border-radius:16px;overflow:hidden;line-height:0}

/* Dream Board : la vision du client s'écrit en blanc sur le dégradé de marque
   — c'est SON texte qui porte la couleur, pas la carte autour. */
.txt-area.db-vision{background:linear-gradient(135deg,#12B5EA 0%,#8A3FFF 100%);border:none;color:#fff;
  font-weight:700;font-size:14.5px;line-height:1.65;margin-bottom:0;
  box-shadow:0 8px 20px rgba(96,120,255,.28);caret-color:#fff}
.txt-area.db-vision::placeholder{color:rgba(255,255,255,.75)}

/* Le tiroir des séances types du tableau de bord : replié par défaut dès
   qu'il y en a, pour ne pas noyer le reste quand la bibliothèque grossit. */
.sea-tiroir{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-bottom:14px;box-shadow:0 3px 14px rgba(16,24,40,.06);overflow:hidden}
.sea-tiroir summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:16px 17px}
.sea-tiroir summary::-webkit-details-marker{display:none}
.sea-sum-t{font-weight:900;font-size:13.5px;color:var(--ink);flex:1}
.sea-sum-n{font-size:11.5px;font-weight:800;color:var(--mute)}
.sea-sum-c{font-size:15px;color:var(--mute);transition:transform .2s}
.sea-tiroir[open] .sea-sum-c{transform:rotate(180deg)}
.sea-corps{padding:0 17px 16px}

/* 🎓 Le didacticiel d'arrivée : moitié haute colorée avec l'icône, moitié
   basse blanche avec le texte et le bouton — le format que les gens
   reconnaissent au premier coup d'œil. */
.tuto{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;z-index:900}
.tuto-haut{flex:1 1 46%;position:relative;display:flex;align-items:center;justify-content:center;border-radius:0 0 36px 36px}
.tuto-skip{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;padding:9px 18px;border-radius:100px;
  background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5);color:#fff;font-weight:800;font-size:13px}
.tuto-ico{font-size:86px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.22))}
.tuto-bas{flex:1 1 54%;padding:26px 24px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.tuto-tag{align-self:flex-start;padding:6px 14px;border-radius:100px;font-size:11.5px;font-weight:900;letter-spacing:1.2px}
.tuto-t{font-size:27px;font-weight:900;line-height:1.15;color:var(--ink);margin-top:14px;letter-spacing:-.5px}
.tuto-d{font-size:14.5px;line-height:1.7;color:var(--mute);font-weight:500;margin-top:12px}
.tuto-pts{display:flex;gap:7px;justify-content:center;margin:auto 0 18px}
.tuto-pts i{width:8px;height:8px;border-radius:100px;background:var(--line);transition:all .25s}
.tuto-pts i.on{width:26px;background:var(--ink)}
.tuto-prev{margin-top:10px;padding:11px 0;font-size:13px;font-weight:800;color:var(--mute);background:none}

/* ⚡ Le raccourci vers la journée du jour, tout en haut de l'accueil :
   la première chose que le client doit pouvoir faire en ouvrant l'appli. */
.jour-raccourci{width:100%;display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:18px;margin-bottom:13px;
  background:linear-gradient(90deg,#12B5EA 0%,#8A3FFF 100%);box-shadow:0 8px 20px rgba(96,120,255,.28);text-align:left}
.jour-raccourci.fini{background:linear-gradient(90deg,#12C98A 0%,#0EA5C6 100%);box-shadow:0 8px 20px rgba(18,201,138,.26)}
.jr-ico{flex:0 0 42px;height:42px;border-radius:13px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:21px}
.jr-txt{flex:1;min-width:0}
.jr-t{color:#fff;font-weight:900;font-size:16px;line-height:1.2}
.jr-s{color:rgba(255,255,255,.92);font-size:12px;font-weight:700;margin-top:3px}
.jr-fl{color:rgba(255,255,255,.9);font-size:26px;font-weight:900;line-height:1}

/* 📅 Le tiroir du calendrier et celui des réglages, en bas de l'accueil. */
.cal-tiroir{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-bottom:12px;
  box-shadow:0 3px 14px rgba(16,24,40,.06);overflow:hidden}
.cal-tiroir summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:16px 17px}
.cal-tiroir summary::-webkit-details-marker{display:none}
.cal-sum-t{font-weight:900;font-size:13.5px;color:var(--ink);flex:1}

var NUT_PARAMS={
  H:{protX:1.8,protMax:2.0,kcalX:32,imcMin:20.0},
  F:{protX:1.6,protMax:1.8,kcalX:28,imcMin:19.0}

// Reconnaît un aliment dans la base et renvoie ses protéines pour une quantité donnée
// Normalise pour comparer : minuscules, sans accents, sans ponctuation
function nutNorm(s){
  return (s||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9%\s]/g," ").replace(/\s+/g," ").trim();
}
// Le nom cherché doit apparaître en MOTS ENTIERS dans la saisie.
// Sans ça, « protéine de riz » matchait « riz » (2,7 g) au lieu de la poudre (~80 g).
function nutContientMots(saisie,cle){
  var re=new RegExp("(^|\\s)"+cle.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"($|\\s)");
  return re.test(saisie);
}
function nutProtFor(name,qty){
  var clean=nutNorm(name);
  if(!clean||!qty)return null;
  var best=null,bestLen=-1;
  for(var k in FOODS){
    if(!FOODS.hasOwnProperty(k))continue;
    var nk=nutNorm(k);
    var score=-1;
    if(nk===clean)score=1000;                              // match exact : priorité absolue
    else if(nutContientMots(clean,nk))score=nk.length;     // la clé est dans la saisie, en mots entiers
    if(score>bestLen){bestLen=score;best=k;}
  }
  if(!best)return null;
  var f=FOODS[best];
  return f.u===100?Math.round(qty*f.p/100*10)/10:Math.round(qty*f.p*10)/10;
}
// Renvoie aussi ce qui a été reconnu, pour l'afficher au client
function nutMatchInfo(name){
  var clean=nutNorm(name);
  if(!clean)return null;
  var best=null,bestLen=-1;
  for(var k in FOODS){
    if(!FOODS.hasOwnProperty(k))continue;
    var nk=nutNorm(k),score=-1;
    if(nk===clean)score=1000;
    else if(nutContientMots(clean,nk))score=nk.length;
    if(score>bestLen){bestLen=score;best=k;}
  }
  return best?{cle:best,p:FOODS[best].p,u:FOODS[best].u,exact:bestLen===1000}:null;
}
// Config nutrition (slot 510) : {on, sexe, pDepart, pCible, prot, kcal, duree, daily:{iso:{foods:[],tot,ok}}}
function nutCfg(data){return (data&&data[510])||{};}
// 📅 Date du jour en heure LOCALE. toISOString() renvoie de l'UTC :
// en France/Suisse (UTC+1/+2), entre minuit et 2 h du matin il renvoyait encore la veille,
// donc la journée ne repartait pas à zéro et affichait les aliments de la veille.
function isoLocal(d){
  d=d||new Date();
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
}
function nutDayKey(){return isoLocal();}
function nutToday(cfg){var k=nutDayKey();return (cfg.daily&&cfg.daily[k])||{foods:[],tot:0,ok:false};}
// 🔥 Série de jours consécutifs au quota (même règle que la victoire : ≥ 80 %)
function nutStreak(cfg){
  var d=(cfg&&cfg.daily)||{},q=parseFloat(cfg&&cfg.prot)||0;
  if(q<=0)return {cur:0,best:0,todayOk:false};
  function ok(k){var e=d[k];return !!(e&&(parseFloat(e.tot)||0)>=q*0.8);}
  function key(dt){return isoLocal(dt);}
  var today=new Date();
  var todayOk=ok(key(today));
  // La série tient encore si aujourd'hui n'est pas fini mais qu'hier était bon
  var c=new Date(today);
  if(!todayOk)c.setDate(c.getDate()-1);
  var cur=0;
  while(ok(key(c))){cur++;c.setDate(c.getDate()-1);}
  // Record personnel
  var oks=Object.keys(d).filter(ok).sort();
  var best=0,run=0,prev=null;
  for(var i=0;i<oks.length;i++){
    run=(prev&&Math.round((new Date(oks[i])-new Date(prev))/86400000)===1)?run+1:1;
    if(run>best)best=run;
    prev=oks[i];
  }
  return {cur:cur,best:Math.max(best,cur),todayOk:todayOk};
}
// Calcule le plan (prot/kcal/durée) depuis poids départ → cible
// Les protéines suivent la règle du coach : femme 1,6–1,8 g/kg,
// homme 1,8–2,0 g/kg, appliquée au POIDS DE DÉPART.
// Masse maigre lue dans le dernier bilan qui a poids + %MG
function nutMasseMaigre(allData){
  var b=(allData&&allData[600])||{}, list=b.list||[];
  for(var i=list.length-1;i>=0;i--){
    var a=list[i];
    if(a&&a.poids&&a.mg){
      var pd=parseFloat(a.poids), mg=parseFloat(a.mg);
      if(pd>0&&mg>0&&mg<70)return Math.round(pd*(1-mg/100)*10)/10;
    }
  }
  return null;
}
function nutPlan(sexe,pDepart,pCible,mMaigre){
  var P=NUT_PARAMS[sexe]||NUT_PARAMS.H;
  // Règle du coach : femme 1,6–1,8 g/kg · homme 1,8–2,0 g/kg,
  // toujours appliquée au POIDS DE DÉPART.
  var ref=pDepart||pCible;
  var prot=Math.round(P.protX*ref);
  var protMax=Math.round((P.protMax||P.protX)*ref);
  var kcal=Math.round(P.kcalX*pCible);
  var perte=Math.round((pDepart-pCible)*10)/10;
  var duree=perte>0?Math.ceil(perte/0.8):0;
  return {prot:prot,protMax:protMax,kcal:kcal,perte:perte,duree:duree,
          base:"depart",ref:Math.round(ref*10)/10,
          protX:P.protX,protMax_x:P.protMax||P.protX,kcalX:P.kcalX};
}

  var A=Date.UTC(+a[0],(+a[1]||1)-1,+a[2]||1);
  var n=new Date(), B=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());

// Phase courante : soit forcée par le coach, soit déduite des jours écoulés
function menuPhase(data){
  var m=menuCfg(data);
  if(m.reset)return {p:MENU_RESET,idx:0,jour:Math.min(menuJour(data),MENU_RESET.jours-1),total:MENU_RESET.jours,liste:[MENU_RESET]};
  if(m.phaseForcee){
    for(var f=0;f<MENU_PHASES.length;f++){
      if(MENU_PHASES[f].cle===m.phaseForcee)
        return {p:MENU_PHASES[f],idx:f,jour:menuJour(data)%28,total:28,liste:MENU_PHASES,forcee:true};
    }
  }
  var j=menuJour(data), cum=0;
  for(var i=0;i<MENU_PHASES.length;i++){
    if(j<cum+MENU_PHASES[i].jours)
      return {p:MENU_PHASES[i],idx:i,jour:j-cum,total:MENU_PHASES[i].jours,liste:MENU_PHASES};
    cum+=MENU_PHASES[i].jours;
  }
  var last=MENU_PHASES[MENU_PHASES.length-1];
  return {p:last,idx:MENU_PHASES.length-1,jour:last.jours-1,total:last.jours,liste:MENU_PHASES,fini:true};
}

  return menuJour(data)>=(MENU_UNLOCK[i]||0);

// Revenus du mois : {sal, ind}. Si le mois n'est pas encore renseigné,
// on reporte automatiquement les derniers revenus connus.
function finRevMois(cfg,key){
  key=key||finMonthKey();
  var rm=(cfg&&cfg.revMois)||{};
  if(rm[key])return {sal:parseFloat(rm[key].sal)||0,ind:parseFloat(rm[key].ind)||0,saisi:true};
  var ks=Object.keys(rm).sort(),last=null;
  for(var i=0;i<ks.length;i++){if(ks[i]<key)last=ks[i];}
  if(last)return {sal:parseFloat(rm[last].sal)||0,ind:parseFloat(rm[last].ind)||0,saisi:false,report:last};
  // Reprise de l'ancien champ unique
  var leg=parseFloat(cfg&&cfg.revenus)||0;
  return {sal:leg,ind:0,saisi:false};
}
// Taux officiels au 1er janvier 2026 (source URSSAF)
// taux = cotisations sociales · cfp = contribution formation pro · lib = versement libératoire IR
var FIN_ACTIVITES={
  bnc:{lbl:"Libéral BNC — régime général",taux:25.6,cfp:0.2,lib:2.2},
  cipav:{lbl:"Libéral BNC — CIPAV",taux:23.2,cfp:0.2,lib:2.2},
  bicserv:{lbl:"Services BIC — commercial / artisanal",taux:21.2,cfp:0.1,lib:1.7},
  bicvente:{lbl:"Vente de marchandises BIC",taux:12.3,cfp:0.1,lib:1.0}
};
// URSSAF et impôt calculés automatiquement sur le CA indépendant du mois
function finAuto(cfg){
  var R=finRevMois(cfg);
  var ca=(cfg.statut==="salarie")?0:R.ind;
  var A=FIN_ACTIVITES[cfg.activite||"bnc"]||FIN_ACTIVITES.bnc;
  var tx=(cfg.tauxUrssaf!=null&&cfg.tauxUrssaf!=="")?parseFloat(cfg.tauxUrssaf):(A.taux+A.cfp);
  var provision=cfg.impotMode==="provision";
  var txImp=provision
    ?((cfg.tauxImpot!=null&&cfg.tauxImpot!=="")?parseFloat(cfg.tauxImpot):10)
    :A.lib;
  return {ca:ca,act:A,tx:tx,txImp:txImp,provision:provision,
          urssaf:Math.round(ca*tx/100),impot:Math.round(ca*txImp/100)};
}
// Retenues salariales estimées si le salaire saisi est un BRUT.
// Ordres de grandeur — variables selon l'âge (LPP), la situation familiale et le canton.
var FIN_PAYS={
  FR:{lbl:"France",soc:23,socLbl:"cotisations salariales",imp:0,
      note:"Le net français est déjà prélevé à la source : saisis ton net à payer."},
  CH:{lbl:"Suisse",soc:15,socLbl:"AVS/AI/APG + AC + LPP + LAA",imp:0,
      note:"La LPP varie fortement selon l'âge (3,5 % à 9 %) — ajuste si tu connais ton taux."},
  FRONT:{lbl:"Frontalier Genève",soc:15,socLbl:"AVS/AI/APG + AC + LPP + LAA",imp:12,
      note:"Genève impose les frontaliers à la source. Le taux dépend de ta situation familiale."}
};
function finSalaire(cfg){
  var R=finRevMois(cfg);
  var P=FIN_PAYS[cfg.pays||"FRONT"]||FIN_PAYS.FRONT;
  // Par défaut le client saisit un NET : rien à retenir
  if(cfg.salType!=="brut")return {brut:0,net:R.sal,soc:0,imp:0,P:P,estBrut:false};
  var soc=(cfg.tauxSocSal!=null&&cfg.tauxSocSal!=="")?parseFloat(cfg.tauxSocSal):P.soc;
  var imp=(cfg.tauxImpSal!=null&&cfg.tauxImpSal!=="")?parseFloat(cfg.tauxImpSal):P.imp;
  var mSoc=Math.round(R.sal*soc/100);
  var mImp=Math.round((R.sal-mSoc)*imp/100);
  return {brut:R.sal,net:R.sal-mSoc-mImp,soc:mSoc,imp:mImp,txSoc:soc,txImp:imp,P:P,estBrut:true};
}
function finCalc(cfg){
  var ch=cfg.charges||[];
  var fixe=0,vari=0,pro=0;
  for(var i=0;i<ch.length;i++){
    var m=parseFloat(ch[i].m)||0;
    if(ch[i].c==="pro")pro+=m;else if(ch[i].c==="var")vari+=m;else fixe+=m;
  }
  // Cotisations et impôt : calculés, jamais saisis
  var A=finAuto(cfg);
  var S=finSalaire(cfg);
  pro+=A.urssaf+A.impot;
  var fixeSal=S.soc+S.imp;
  fixe+=fixeSal;
  var tot=fixe+vari+pro;
  var R=finRevMois(cfg);
  var rev=R.sal+R.ind;
  var reste=rev-tot;
  // Réglages du coach — ils étaient enregistrés mais ignorés jusqu'ici
  var pctMarge=(cfg.margeImprevu!=null&&cfg.margeImprevu!=="")?parseFloat(cfg.margeImprevu):10;
  var nbMois=(cfg.moisCible!=null&&cfg.moisCible!=="")?parseFloat(cfg.moisCible):3;
  var marge=Math.round(rev*pctMarge/100);
  var capa=Math.max(0,reste-marge);
  var matelos=Math.round(tot*nbMois);
  var moisMatelas=capa>0?Math.ceil(matelos/capa):0;
  var pctCapa=rev>0?Math.round(capa/rev*100):0;
  return {fixe:fixe,vari:vari,pro:pro,tot:tot,rev:rev,revSal:R.sal,revInd:R.ind,reste:reste,
          urssaf:A.urssaf,impot:A.impot,txUrssaf:A.tx,txImpot:A.txImp,
          socSal:S.soc,impSal:S.imp,estBrut:S.estBrut,
          pctMarge:pctMarge,nbMois:nbMois,
          marge:marge,capa:capa,matelos:matelos,moisMatelas:moisMatelas,pctCapa:pctCapa};
}
// 🐷 TIRELIRE — versements réels, écart vs objectif, compte à rebours
function finTirelire(cfg){
  var T=finCalc(cfg);
  var v=(cfg.tirelire&&cfg.tirelire.versements)||{};
  var solde=0,ecartCum=0,nb=0;
  for(var k in v){
    if(!v.hasOwnProperty(k))continue;
    solde+=parseFloat(v[k].m)||0;
    ecartCum+=(parseFloat(v[k].m)||0)-(parseFloat(v[k].obj)||0);
    nb++;
  }
  var manque=Math.max(0,T.matelos-solde);
  var moisRestants=T.capa>0?Math.ceil(manque/T.capa):0;
  var pct=T.matelos>0?Math.min(100,Math.round(solde/T.matelos*100)):0;
  var moisSansBonus=T.capa>0?Math.ceil(T.matelos/T.capa):0;
  var moisGagnes=Math.max(0,moisSansBonus-nb-moisRestants);
  return {solde:solde,ecartCum:ecartCum,nb:nb,manque:manque,moisRestants:moisRestants,
          pct:pct,objMois:T.capa,matelas:T.matelos,moisGagnes:moisGagnes,plein:manque<=0};
}
// Alias pour compatibilité
function finTotals(cfg){return finCalc(cfg);}
function finPlan(cfg){
  var T=finCalc(cfg);
  return {capacite:T.capa,matelas:T.matelos,moisRestants:T.moisMatelas,
          T:T,palier:T.capa>0?1:2,versTreso:T.capa,versEp:0,versInv:0};
}

// {on, devise, revenus, charges:[{n,m,t}], objEpargne, moisCible, solde, soldeInvest,
//  repInvest (% vers invest. au palier 2), margeImprevu (% du revenu gardé en marge),

// t = "fixe" (loyer, assurances) | "var" (courses, loisirs) | "pro" (activité)
function finMonthKey(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2);}
function finMonthLabel(k){
  var M=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  var p=k.split("-");return M[parseInt(p[1],10)-1]+" "+p[0].slice(2);
}
function finMonth(cfg){var k=finMonthKey();return (cfg.monthly&&cfg.monthly[k])||{ep:0,note:""};}

// ═══ RYTHME D'ÉPARGNE : jour / semaine / mois ═══
// Le client choisit sa cadence, puis valide à chaque période.
// checks:{ "<clé période>": {m:montant, d:"YYYY-MM-DD"} }
var FIN_RYTHMES={
  jour:{lbl:"jour",adj:"quotidien",art:"aujourd'hui",perMois:30,hist:14,histLbl:"14 derniers jours"},
  semaine:{lbl:"semaine",adj:"hebdo",art:"cette semaine",perMois:4.345,hist:8,histLbl:"8 dernières semaines"},
  mois:{lbl:"mois",adj:"mensuel",art:"ce mois-ci",perMois:1,hist:6,histLbl:"6 derniers mois"}
};
function finRythme(cfg){return FIN_RYTHMES[cfg&&cfg.rythme]||FIN_RYTHMES.mois;}
function finWeekKey(d){
  var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var day=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-day);
  var y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  var w=Math.ceil(((t-y0)/86400000+1)/7);
  return t.getUTCFullYear()+"-W"+("0"+w).slice(-2);
}
// Clé de la période contenant la date d, selon le rythme choisi
function finPeriodKey(r,d){
  d=d||new Date();
  if(r==="jour")return isoLocal(d);
  if(r==="semaine")return finWeekKey(d);
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2);
}
// Recule de n périodes depuis aujourd'hui
function finPeriodShift(r,n){
  var d=new Date();
  if(r==="jour")d.setDate(d.getDate()-n);
  else if(r==="semaine")d.setDate(d.getDate()-n*7);
  else d.setMonth(d.getMonth()-n);
  return d;
}
function finPeriodShortLabel(r,d){
  if(r==="jour")return ["D","L","M","M","J","V","S"][d.getDay()];
  if(r==="semaine")return "S"+finWeekKey(d).split("-W")[1];
  return finMonthLabel(d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)).split(" ")[0];
}
// Somme des validations tombant dans un mois donné — quel que soit le rythme,
// on s'appuie sur la date réelle stockée dans chaque validation.
function finChecksMonth(cfg,ym){
  var c=cfg.checks||{},s=0;
  for(var k in c){
    if(!c.hasOwnProperty(k))continue;
    if(c[k]&&c[k].d&&c[k].d.slice(0,7)===ym)s+=parseFloat(c[k].m)||0;
  }
  return Math.round(s);
}
// Montant suggéré par période = capacité mensuelle / nb de périodes dans le mois
function finMontantSuggere(cfg,capacite){
  var R=finRythme(cfg);
  return Math.max(0,Math.round(capacite/R.perMois));
}

function syncDayToCloud(idx,data){
  if(!CLIENT)return;
  state.syncStatus="sync";
  updateSyncBadge();
  function pushTracking(){
    return sbFetch("tracking?on_conflict=client_slug,day_index",{
      method:"POST",

// ═══════════ SYNCHRO CÔTÉ COACH ═══════════
// loadFromCloud() s'arrête si !CLIENT : en mode coach, aucune donnée client
// n'était jamais téléchargée. Le dashboard ne montrait que le cache local.
// Ce garde-fou existe pour empêcher une boucle : charger appelle render(),
// qui réaffiche la fiche, qui redemande un chargement. Mais il était DÉFINITIF :
// une fois un client chargé, sa fiche ne se rafraîchissait plus JAMAIS de toute
// la session. Un client qui remplissait sa journée restait invisible chez le
// coach. Il devient temporel : au-delà de FRAICHEUR, on redemande au nuage.
var __coachLoaded={},__coachBusy=false;
var COACH_FRAICHEUR=45000;   // 45 s : assez pour couper la boucle de rendu,
                             // assez court pour voir arriver une journée remplie
function coachFrais(slug){
  var t=__coachLoaded[slug];
  return !!t&&(Date.now()-t)<COACH_FRAICHEUR;
}
function coachLoadClient(slug,force,cb){
  if(!slug){if(cb)cb();return;}
  if(coachFrais(slug)&&!force){if(cb)cb();return;}
  __coachLoaded[slug]=Date.now();
  sbFetch("tracking?client_slug=eq."+encodeURIComponent(slug)+"&select=day_index,data")
    .then(function(r){return r.json();})
    .then(function(rows){
      if(rows&&rows.length){
        var all=lsGet("amcoach_"+slug,{});
        for(var i=0;i<rows.length;i++)all[rows[i].day_index]=rows[i].data;
        lsSet("amcoach_"+slug,all);
      }
      if(cb)cb(); else render();
    })
    .catch(function(){if(cb)cb();});
}
function coachLoadAll(force){
  if(__coachBusy)return;
  var cl=lsGet("amcoach_clients",[]);
  if(!cl.length)return;
  var reste=0;
  for(var i=0;i<cl.length;i++){if(force||!coachFrais(cl[i].slug))reste++;}
  if(!reste)return;
  __coachBusy=true;
  var fait=0;
  for(var j=0;j<cl.length;j++){
    coachLoadClient(cl[j].slug,force,function(){
      fait++;
      if(fait>=cl.length){__coachBusy=false;render();}
    });
  }
}
// Dernier rapatriement : évite d'interroger le serveur à chaque aller-retour.
var __cloudLe=0;
// Le client va rechercher ses données quand il REVIENT dans l'appli. C'est le
// seul moment où une modification faite par le coach peut le rattraper sans
// qu'il ait à tout fermer et rouvrir.
function cloudRafraichir(force){
  if(!CLIENT)return;
  if(!force&&Date.now()-__cloudLe<20000)return;
  loadFromCloud(function(){ try{render();}catch(e){} });
}
function brancherRetourAppli(){
  if(window.__cloudVis)return;
  window.__cloudVis=true;
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible")cloudRafraichir(false);
  });
  window.addEventListener("focus",function(){cloudRafraichir(false);});
}
function loadFromCloud(cb){
  if(!CLIENT){cb();return;}
  __cloudLe=Date.now();
  // Load client info + tracking data from Supabase
  Promise.all([
    sbFetch("clients?slug=eq."+encodeURIComponent(CLIENT)+"&select=*").then(function(r){return r.json();}),
    sbFetch("tracking?client_slug=eq."+encodeURIComponent(CLIENT)+"&select=day_index,data").then(function(r){return r.json();})
  ]).then(function(results){
    var clients=results[0]||[], rows=results[1]||[];
    if(clients.length>0){
      lsSetStr("amcoach_name_"+CLIENT,clients[0].name);
      lsSetStr("amcoach_start_"+CLIENT,clients[0].start_date);
    }
    if(rows.length>0){
      var all=getAllData();
      for(var i=0;i<rows.length;i++){
        all[rows[i].day_index]=rows[i].data;
      }
      lsSet("amcoach_"+CLIENT,all);
    }
    cb();

function getToday90(startDate){
  if(!startDate)return 0;
  // #12 : jour calculé sur la DATE CALENDAIRE locale (pas les millisecondes) —
  // un client qui voyage ne saute ni ne double jamais un jour
  // Les deux dates sont comparées en jours calendaires, sans mélanger UTC et local.
  var ds=String(startDate).slice(0,10).split("-");
  var a=Date.UTC(+ds[0],(+ds[1]||1)-1,+ds[2]||1);
  var n=new Date();
  var b=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());
  var diff=Math.round((b-a)/86400000);
  return Math.max(0,Math.min(diff,89));
}

function computeAlert(allData,today90,voix){
  // Analyse les 7 derniers jours remplis (min 4 pour être fiable)
  var days=[];
  for(var i=today90;i>=0&&days.length<7;i--){
    if(allData[i]&&allData[i].habits)days.push(allData[i].habits);
  }
  if(days.length<4)return null;
  var worst=null,worstRate=1;
  for(var h=0;h<HABITS.length;h++){
    var id=HABITS[h].id,done=0;
    for(var d=0;d<days.length;d++){if(days[d][id])done++;}
    var rate=done/days.length;
    if(rate<0.5&&rate<worstRate){worstRate=rate;worst=id;}
  }
  var span=Math.min(7,today90+1);
  if(span>=4&&allData[502]){
    var bDone=0;for(var b3=today90-span+1;b3<=today90;b3++){if(hasBrique(allData,b3))bDone++;}
    var bRate=bDone/span;
    if(bRate<0.5&&bRate<worstRate){worstRate=bRate;worst="identite";}
  }
  if(span>=4){
    var mWon=0;for(var m3=today90-span+1;m3<=today90;m3++){if(missionWon(allData,m3))mWon++;}
    var mRate=mWon/span;
    if(mRate<0.5&&mRate<worstRate){worstRate=mRate;worst="onething";}
  }
  var src=voix?supAlertes(allData):HABIT_ALERTS;
  return worst?{habit:worst,msg:src[worst]||HABIT_ALERTS[worst]}:null;
}

function slugHash(s){var h=0;s=s||"";for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h;}

function penseeVue(allData){return (allData&&allData[513])||{};}
// Choisit dans un pool en écartant tout ce qui a déjà été montré les jours précédents
function penseeChoisir(allData,today90,pool){
  var vues=penseeVue(allData);
  // Déjà attribuée pour ce jour : on la resserre, elle ne doit pas changer
  if(vues[today90]!=null&&PENSEES[vues[today90]])return PENSEES[vues[today90]];
  var deja={};
  for(var d in vues){if(vues.hasOwnProperty(d)&&parseInt(d,10)!==today90)deja[vues[d]]=1;}
  var libres=pool.filter(function(i){return !deja[i];});
  if(!libres.length)libres=pool;              // tout le pool a été vu : on autorise à nouveau
  var off=slugHash(CLIENT||"");
  var idx=libres[(today90+off)%libres.length];
  // On mémorise, sans écraser un autre jour
  var cp={};for(var k in vues){if(vues.hasOwnProperty(k))cp[k]=vues[k];}
  cp[today90]=idx;
  saveDay(513,cp);
  return PENSEES[idx];
}
function pickPensee(allData,today90){

  }
  // Index de toutes les pensées, puis pools thématiques
  var tous=[];for(var i=0;i<PENSEES.length;i++)tous.push(i);
  // Mission perdue hier → résilience
  var y=allData[200+(today90-1)];
  if(y&&y.status==="lost"){
    var pool=tous.filter(function(i){return /relève|Tombe|cendres|recule|tailleur|chenille|échou|tempête/.test(PENSEES[i]);});
    if(pool.length)return penseeChoisir(allData,today90,pool);
  }
  // Combo 7+ → guerrier/constance
  var st=computeStreak(allData,today90);

    if(pool2.length)return penseeChoisir(allData,today90,pool2);
  }
  return penseeChoisir(allData,today90,tous);
}

// 🔻 Score VIVANT : le niveau se tient, il ne se décroche pas.
// Chaque journée entièrement vide de la dernière quinzaine retire une brique,
// avec deux jours tolérés — maladie, imprévu, vraie coupure.
// MAIS une série en cours rachète le passé : sans ça, quelqu'un qui repart
// depuis trois jours lisait quand même « ton niveau glisse », c'est-à-dire
// l'inverse de ce qu'il est en train de faire. Chaque jour de série au-delà
// du premier rend une brique. Le premier ne compte pas : une seule journée
// ne doit pas effacer deux semaines d'absence.
// Les briques posées (l'historique) ne bougent jamais : seul le niveau descend.
function qgVivant(allData,today90){
  var res=qgRes(allData,today90);
  var vides=0, fenetre=0;
  // On regarde les 14 jours précédant aujourd'hui : la journée en cours
  // n'est pas encore finie, on ne la compte pas comme manquée.
  for(var i=Math.max(0,today90-14);i<today90;i++){
    fenetre++;
    var q=allData[400+i]||{};
    var n=(q.p?1:0)+(q.e?1:0)+(q.s1?1:0)+(q.s2?1:0);
    if(n===0)vides++;
  }
  var tolerance=2;
  var serie=comboStreak(allData,today90,hasBrique);
  var rachat=Math.max(0,serie-1);
  var brut=Math.max(0,vides-tolerance);
  var penalite=Math.max(0,brut-rachat);
  return {total:res.total, vides:vides, fenetre:fenetre, tolerance:tolerance,
          serie:serie, rachat:Math.min(rachat,brut), brut:brut,
          remonte:serie>=2&&brut>0,
          penalite:penalite, vivant:Math.max(0,res.total-penalite)};
}
function qgRes(allData,today90){
  var p=0,e=0;

    var q=allData[400+i];
    if(q){if(q.p)p++;if(q.e)e++;if(q.s1)p++;if(q.s2)p++;}
  }

}

}

// Une journée COMPTE quand les quatre piliers sont là : nutrition, sport,
// sommeil et les trois questions du soir. C'est plus exigeant que « la
// journée est ouverte » — et c'est le but : la jauge ne récompense plus le
// fait d'avoir tapé son poids, mais celui d'avoir tenu sa journée.
var SEM_PILIERS=[["nutrition","🥗","Nutrition"],["sport","🏋️","Sport"],["sommeil","😴","Sommeil"]];
function jourValide(allData,i){
  var d=allData[i];
  if(!d||!d.habits)return false;
  for(var k=0;k<SEM_PILIERS.length;k++)if(!d.habits[SEM_PILIERS[k][0]])return false;

// La semaine EN COURS du programme : elle commence au jour 1, puis tous les
// 7 jours. On ne compte que les jours DÉJÀ ÉCOULÉS — une semaine qui commence
// n'est pas une semaine ratée.
function semaineAssiduite(allData,today90){
  var deb=Math.max(0,today90-(today90%7));
  var ecoules=today90-deb+1, valides=0, jours=[];
  for(var i=deb;i<=today90;i++){
    var ok=jourValide(allData,i);
    if(ok)valides++;
    jours.push(ok);
  }
  return {
    deb:deb, ecoules:ecoules, valides:valides, jours:jours,
    semaine:Math.floor(deb/7)+1,
    pctSemaine:Math.round(valides/7*100),          // avancement sur les 7 jours
    pctTenue:Math.round(valides/Math.max(1,ecoules)*100)  // qualité de ce qui est passé
  };

function mindsetFull(allData,i){var m=allData[i]&&allData[i].mindset;return !!(m&&m.fier&&m.positif&&m.negatif);}
function computeStreak(allData,today90){
  // Jours consécutifs remplis, en remontant depuis aujourd'hui
  // (aujourd'hui pas encore rempli ne casse pas la série)
  var start=allData[today90]?today90:today90-1;
  var streak=0;
  for(var i=start;i>=0;i--){
    if(allData[i]&&Object.keys(allData[i]).length>0)streak++;
    else break;
  }
  return streak;
}

var BUZZ={tap:12,ok:[35,25,35],win:[60,40,60,40,90],err:[90,60,90],undo:20};

var __toastT=null;
function toast(msg,kind){
  var bg=kind==="err"?"var(--brand)":kind==="win"?"#1B5E20":kind==="undo"?"#555":"var(--ok-d)";
  var el=document.getElementById("app-toast");
  if(!el){

    document.body.appendChild(el);

  // Relance l'animation même si un toast est déjà affiché
  el.style.opacity="0";el.style.transform="translateX(-50%) translateY(14px)";

    el.style.opacity="1";el.style.transform="translateX(-50%) translateY(0)";

}

// arrive au jour 41 avec 41 jours de série a franchi 7, 14, 21 et 30 avant
// que la fonctionnalité existe. Les lui sortir un par un, du plus grand au
// plus petit, donne exactement ce qu'il a vu : « super 30 jours » la veille,
// « super 14 jours » le lendemain.
function momentRetirer(cles){
  var v=momentVus(),i;
  for(i=0;i<cles.length;i++){if(!v[cles[i]])v[cles[i]]="rattrape";}

// Ordre en cas d'égalité : nutrition (70 % du résultat), puis sport, puis
// sommeil — l'ordre de priorité posé par Akli.
function pilierFaible(allData,today90){
  var jours=[],i;

    if(allData[i]&&allData[i].habits)jours.push(allData[i].habits);

  for(i=0;i<ordre.length;i++){

    for(var d=0;d<jours.length;d++){if(jours[d][ordre[i]])fait++;}
    var taux=fait/jours.length;

    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
    return true;
  }catch(e){
    // Repli : certains navigateurs mobiles bloquent le téléchargement direct
    try{window.open("data:text/calendar;charset=utf-8,"+encodeURIComponent(contenu),"_blank");return true;}
    catch(e2){return false;}
  }
}

// 🎭 ANNONCE DU SUPERVISEUR — feuille modale au lancement.
// Les clients déjà en cours n'ont jamais vu l'écran d'inscription, donc ils
// ne savent pas que la fonction existe. On la leur présente une fois, avec
// une sortie franche : « Plus tard » ne redemande rien avant sept jours,
// et l'accès reste permanent depuis la carte de progression.
function supAnnonceVue(){
  try{return localStorage.getItem("d90-sup-vu-"+CLIENT);}catch(e){return "1";}
}
function supAnnonceMarque(val){
  try{localStorage.setItem("d90-sup-vu-"+CLIENT,val);}catch(e){}
}
function supDoitAnnoncer(allData){
  if(allData[503])return false;                 // déjà choisi, rien à annoncer
  var v=supAnnonceVue();
  if(v==="fait")return false;
  if(v&&v.indexOf("plus-tard:")===0){
    var t=parseInt(v.slice(10),10)||0;
    if(Date.now()-t < 7*86400000)return false;  // reporté : on laisse sept jours
  }
  return true;
}

// Conversions entre AAAA-MM-JJ (technique) et JJ/MM/AAAA (affiché)
function isoVersFr(iso){
  var m=String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?m[3]+"/"+m[2]+"/"+m[1]:"";
}
function frVersIso(fr){
  var m=String(fr||"").match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(!m)return "";
  var an=m[3].length===2?("20"+m[3]):m[3];
  return an+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);
}
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function dayScore(d){
  if(!d||!d.habits)return null;
  var done=0;
  for(var i=0;i<HABITS.length;i++){if(d.habits[HABITS[i].id])done++;}
  return Math.round(done/HABITS.length*100);
}
function computeSeries(allData,days){
  var out=[];
  for(var i=0;i<days;i++){
    var d=allData[i]||{};
    var has=Object.keys(d).length>0;
    out.push({
      day:i+1,
      score:has?dayScore(d):null,
      poids:d.poids?parseFloat(d.poids):null,
      mental:(d.mental!=null&&d.mental!=="")?(4-d.mental)*25:null,
      energie:(d.energie!=null&&d.energie!=="")?d.energie*25:null,
      sommeilH:d.sommeilH?parseFloat(d.sommeilH):null,
      habits:d.habits||null,
      bilan:d.bilan||null
    });
  }
  return out;
}
function avgOf(series,key){
  var v=[];
  for(var i=0;i<series.length;i++){if(series[i][key]!=null)v.push(series[i][key]);}
  if(!v.length)return null;
  var s=0;for(var j=0;j<v.length;j++)s+=v[j];
  return Math.round(s/v.length*10)/10;
}
function frDate(iso){
  if(!iso)return "";
  var p=String(iso).split("-");
  return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso;
}

// ═══════════ CYCLES DE SOMMEIL (90 min) ═══════════
function sleepCycles(h){
  h=parseFloat(h);
  if(!h||h<=0)return null;
  var min=h*60,c=Math.floor(min/90),part=(min%90)>=45?0.5:0;
  return {c:c,part:part,total:c+part,critical:h<7,h:h};
}
function cycleVizHTML(hVal){
  var sc=sleepCycles(hVal);
  if(!sc)return '<div style="font-size:11px;color:var(--mute);margin-top:6px">1 cycle = 90 min · objectif 5 cycles par nuit (7 h 30)</div>';
  var dots='';
  for(var i=0;i<5;i++){
    dots+=i<sc.c?'<span style="color:var(--brand2)">●</span>':(i===sc.c&&sc.part?'<span style="color:var(--brand2)">◐</span>':'<span style="color:#DDD">●</span>');
  }
  var html='<div style="margin-top:8px"><span style="font-size:17px;letter-spacing:5px">'+dots+'</span> <span style="font-size:12px;font-weight:900;color:var(--brand2)">'+sc.total+' cycle'+(sc.total>=2?'s':'')+' / 5</span></div>';
  if(sc.critical){
    html+='<div style="margin-top:8px;background:#FFEBEE;border-radius:9px;padding:9px 11px;font-size:11.5px;color:var(--bad);line-height:1.65"><strong>🚨 Sous les 7 h — cortisol élevé.</strong> Stockage de gras ↑, faim sucrée ↑, récupération musculaire ↓.<br>💤 <strong>Conseil :</strong> micro-sieste de 20-25 min entre 13 h et 15 h. Jamais plus de 30 min — au-delà, réveil en plein sommeil profond, tu te lèves groggy.</div>';
  }else if(sc.total>=5){
    html+='<div style="margin-top:6px;font-size:11px;color:var(--ok);font-weight:700">✅ Nuit complète — récupération optimale.</div>';
  }
  return html;
}
// 🌙 Carte "Cycles de sommeil — semaine" (objectif 35 cycles)
// refIdx = jour de référence pour choisir la semaine affichée ; today90 = jour réel
function sleepWeekHTML(allData,refIdx,today90){
  var wS=Math.floor(refIdx/7)*7;
  var tot=0,cells='',hasAny=false;
  for(var di=wS;di<wS+7;di++){
    var dd=allData[di],sc2=(dd&&dd.sommeilH)?sleepCycles(dd.sommeilH):null;
    var fut=di>today90;
    if(sc2){tot+=sc2.total;hasAny=true;}
    var bg=fut?'#F6F6F6':!sc2?'#FFF6EC':sc2.critical?'#FFEBEE':sc2.total>=5?'#E8F5E9':'#E3F2FD';
    var col=fut?'#CCC':!sc2?'var(--warn-d)':sc2.critical?'var(--brand)':sc2.total>=5?'var(--ok)':'var(--brand2)';
    cells+='<div style="flex:1;text-align:center;padding:7px 2px;border-radius:8px;background:'+bg+(di===refIdx?';box-shadow:0 0 0 2px var(--ink)':'')+'">'+
      '<div style="font-size:11px;font-weight:800;color:#8A8A8A">J'+(di+1)+'</div>'+
      '<div style="font-size:14px;font-weight:900;color:'+col+'">'+(sc2?sc2.total:(fut?'·':'?'))+'</div></div>';
  }
  var pctS=Math.min(tot/35,1),barCol=pctS>=1?'var(--ok)':pctS>=0.6?'var(--brand2)':'var(--warn-d)';
  // Une nuit ne se note qu'au réveil : compter la journée en cours comme due
  // affichait un retard imaginaire dès le matin. On ne compte donc que les
  // jours révolus, plus celui d'aujourd'hui s'il est déjà renseigné.
  var dernier=Math.min(today90,wS+6);
  var doneDays=Math.max(0,dernier-wS);
  var auj=allData[dernier];
  if(auj&&auj.sommeilH)doneDays++;
  var behind=doneDays>0?Math.max(0,5*doneDays-tot):0;
  var msg;
  if(!hasAny)msg='Note tes heures de sommeil chaque jour — 1 cycle = 90 min, objectif 5 cycles par nuit.';
  else if(behind>=1){
    var dLeft=Math.max(1,wS+6-today90);
    msg='⚠️ '+(Math.round(behind*10)/10)+' cycle'+(behind>=2?'s':'')+' de retard cette semaine. Rattrape avec des nuits plus longues (+'+Math.min(120,Math.round(behind/dLeft*90))+' min/nuit) ou une micro-sieste de 20-25 min entre 13 h et 15 h.';
  }else msg='✅ Bon rythme — continue à viser 5 cycles par nuit.';
  // Rendu sans carte : ce bloc vit desormais DANS la carte du sommeil,
  // juste sous la saisie. La nuit du jour et la semaine racontent la meme
  // histoire, les separer obligeait a faire l'aller-retour entre deux cartes.
  return '<div style="margin-top:13px;padding-top:13px;border-top:1px solid var(--line)">'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">'+
    '<span style="font-weight:900;font-size:13px">🌙 Cycles de sommeil — semaine</span>'+
    '<span style="font-size:12px;font-weight:900;color:'+barCol+'">'+(Math.round(tot*10)/10)+' / 35</span></div>'+
    '<div style="height:8px;background:#EEE;border-radius:4px;overflow:hidden;margin-bottom:9px"><div style="height:100%;width:'+(pctS*100)+'%;background:'+barCol+';border-radius:4px"></div></div>'+
    '<div style="display:flex;gap:3px;margin-bottom:9px">'+cells+'</div>'+
    '<div style="font-size:11.5px;color:#555;line-height:1.6">'+msg+'</div></div>';
}

// ═══════════ BOUCLES VERTUEUSES / BOUCLES D'ÉCHEC ═══════════
function computeLoops(allData,period,offset){
  offset=offset||0;
  var rates=[],daysFilled=0;
  for(var hb=0;hb<HABITS.length;hb++){
    var hab=HABITS[hb],on=0,off=0,sOn=0,sOff=0,cnt=0;
    for(var i=offset;i<offset+period;i++){
      var d=allData[i];
      if(!d||!d.habits)continue;
      cnt++;
      var sc=dayScore(d)||0;
      if(d.habits[hab.id]){on++;sOn+=sc;}else{off++;sOff+=sc;}
    }
    if(hb===0)daysFilled=cnt;
    rates.push({hab:hab,rate:cnt?on/cnt:0,on:on,off:off,cnt:cnt,
      delta:(on&&off)?Math.round(sOn/on-sOff/off):null});
  }
  // Les habitudes facultatives sortent de TOUTE l'analyse de boucles :
  // ni socle, ni moteur, ni faiblesse. Sinon le rapport attribue une force ou
  // une faiblesse à quelque chose qui n'engage pas la discipline du client.
  var ratesA=rates.filter(function(r){return !HABITS_FACULT[r.hab.id];});
  // Socle : habitudes tenues ≥ 70% du temps
  var socle=ratesA.filter(function(r){return r.cnt>=3&&r.rate>=0.7;})
    .sort(function(a,b){
      if(b.rate!==a.rate)return b.rate-a.rate;
      return (b.delta==null?-99:b.delta)-(a.delta==null?-99:a.delta);
    });
  // Moteur : l'habitude qui, quand elle est cochée, tire le plus la journée vers le haut
  // Moteur : delta = score moyen quand cochée − score moyen quand pas cochée (le levier, pas la corrélation)
  var moteur=null,mb=9;
  for(var m=0;m<ratesA.length;m++){
    var r=ratesA[m];
    if(r.delta!=null&&r.on>=2&&r.off>=1&&r.delta>mb){mb=r.delta;moteur=r;}
  }
  // Faiblesses : habitudes qui sautent le plus souvent.
  // Les compléments sont facultatifs — les compter masquerait la vraie boucle d'échec.
  var faibles=ratesA.filter(function(r){return r.cnt>=3&&r.rate<=0.45;})
    .sort(function(a,b){return a.rate-b.rate;});
  // Enchaînements de jours manqués (un jour saute → le suivant aussi)
  var lastFilled=-1;
  for(var li=offset;li<offset+period;li++){if(allData[li]&&allData[li].habits)lastFilled=li;}
  var chains=0,run=0;
  for(var ci=offset;ci<=lastFilled;ci++){
    var dd=allData[ci];
    if(!dd||!dd.habits)run++;else{if(run>=2)chains++;run=0;}
  }
  // 🛡️ Résilience : après un jour manqué, repart-il dès le lendemain (≥4 habitudes cochées) ?
  var rec=0,missCnt=0;
  for(var ri=offset;ri<lastFilled;ri++){
    var tdD=allData[ri];
    if(!tdD||!tdD.habits){
      missCnt++;
      var ndD=allData[ri+1];
      if(ndD&&ndD.habits){
        var nOk=0;for(var hk in ndD.habits){if(ndD.habits[hk])nOk++;}
        if(nOk>=4)rec++;
      }
    }
  }
  var resilience={rec:rec,miss:missCnt,score:missCnt?Math.round(rec/missCnt*100):null};
  // Phrases qui reviennent dans les soirées (regroupées par mots significatifs partagés)
  var LOOP_STOP={"avec":1,"pour":1,"trop":1,"plus":1,"dans":1,"fait":1,"faire":1,"suis":1,"bien":1,"tout":1,"toute":1,"rien":1,"cette":1,"comme":1,"mais":1,"encore":1,"assez":1,"aujourd":1,"hier":1,"journ\u00e9e":1,"jour":1,"jours":1,"pass\u00e9":1,"vraiment":1,"\u00e9t\u00e9":1,"\u00eatre":1,"avoir":1,"quand":1,"parce":1,"chose":1,"choses":1};
  function sigWords(s){
    var words=String(s).toLowerCase().replace(/[^a-z\u00e0-\u00ff\s-]/g," ").split(/\s+/);
    var out={},arr=[];
    for(var w=0;w<words.length;w++){
      var wd=words[w];
      if(wd.length<4||LOOP_STOP[wd]||out[wd])continue;
      out[wd]=1;arr.push(wd);
    }
    return arr;
  }
  function groupPhrases(texts){
    // texts: [{t:"...", d:jour}] → groupes de phrases proches (≥2 mots significatifs en commun, ou 1 seul si la phrase n'en a qu'un)
    var groups=[];
    for(var ti=0;ti<texts.length;ti++){
      var tx=texts[ti], ws=sigWords(tx.t);
      if(!ws.length)continue;
      var placed=false;
      for(var gi=0;gi<groups.length;gi++){
        var g=groups[gi], shared=[];
        for(var si=0;si<ws.length;si++){if(g.wset[ws[si]])shared.push(ws[si]);}
        var need=Math.min(2,ws.length,g.minLen);
        if(shared.length>=need){
          g.n++;g.days.push(tx.d);
          if(tx.t.length>g.t.length)g.t=tx.t; // garder la phrase la plus parlante
          // resserrer le thème sur les mots communs
          if(shared.length>=1){var nw={};for(var sh=0;sh<shared.length;sh++)nw[shared[sh]]=1;g.wset=nw;g.kw=shared;}
          g.minLen=Math.min(g.minLen,ws.length);
          placed=true;break;
        }
      }
      if(!placed){
        var wset={};for(var wi=0;wi<ws.length;wi++)wset[ws[wi]]=1;
        groups.push({t:tx.t,n:1,days:[tx.d],wset:wset,kw:ws.slice(0,4),minLen:ws.length});
      }
    }
    var out=groups.filter(function(g){return g.n>=2;});
    out.sort(function(a,b){return b.n-a.n;});
    return out.slice(0,3);
  }
  var negTexts=[],posTexts=[];
  for(var ni=offset;ni<offset+period;ni++){
    var dn=allData[ni];
    if(dn&&dn.mindset){
      if(dn.mindset.negatif)negTexts.push({t:dn.mindset.negatif,d:ni+1});
      if(dn.mindset.fier)posTexts.push({t:dn.mindset.fier,d:ni+1});
      if(dn.mindset.positif)posTexts.push({t:dn.mindset.positif,d:ni+1});
    }
  }
  var phrasesNeg=groupPhrases(negTexts);
  var phrasesPos=groupPhrases(posTexts);
  return {socle:socle,moteur:moteur,faibles:faibles,chains:chains,resilience:resilience,phrasesNeg:phrasesNeg,phrasesPos:phrasesPos,daysFilled:daysFilled,period:period};
}

// ═══════════ SVG CHART ═══════════
// 📊 Plusieurs courbes superposées. Les unités diffèrent (kg, %, heures) :
// chaque série est ramenée sur une échelle commune pour que les croisements se voient.
// ═══════════ 📈 MOTEURS D'ANALYSE DE PROGRESSION ═══════════
// Régression linéaire sur les points renseignés : renvoie la pente par jour
// fenetre = ne garder que les N dernieres pesees. Sans fenetre, la regression
// porte sur TOUT l'historique : un bon demarrage ecrase un recul recent et la
// pente reste descendante alors que la personne est en train de reprendre.
function statTendance(values,fenetre){
  var xs=[],ys=[];
  for(var i=0;i<values.length;i++){if(values[i]!=null){xs.push(i);ys.push(values[i]);}}
  if(fenetre&&xs.length>fenetre){xs=xs.slice(-fenetre);ys=ys.slice(-fenetre);}
  if(xs.length<3)return null;
  var n=xs.length,sx=0,sy=0,sxy=0,sxx=0;
  for(var j=0;j<n;j++){sx+=xs[j];sy+=ys[j];sxy+=xs[j]*ys[j];sxx+=xs[j]*xs[j];}
  var den=n*sxx-sx*sx;
  if(den===0)return null;
  var pente=(n*sxy-sx*sy)/den;
  var ord=(sy-pente*sx)/n;
  return {pente:pente,ord:ord,n:n,premier:xs[0],dernier:xs[xs.length-1],
          yDebut:ys[0],yFin:ys[ys.length-1]};
}
// Moyenne des N derniers jours renseignés
function statMoyDerniers(values,n,finIdx){
  var v=[],c=0;
  for(var i=finIdx;i>=0&&c<n;i--){if(values[i]!=null){v.push(values[i]);c++;}}
  if(!v.length)return null;
  var s=0;for(var j=0;j<v.length;j++)s+=v[j];
  return {moy:Math.round(s/v.length*10)/10,n:v.length};
}
// Compare les 7 derniers jours renseignés aux 7 précédents
function statSemaine(values,finIdx){
  var idx=[];
  for(var i=0;i<=finIdx;i++){if(values[i]!=null)idx.push(i);}
  if(idx.length<4)return null;
  var rec=idx.slice(-7),prec=idx.slice(-14,-7);
  function moy(list){var s=0;for(var k=0;k<list.length;k++)s+=values[list[k]];return list.length?s/list.length:null;}
  var a=moy(rec),b=prec.length>=3?moy(prec):null;
  return {actuel:Math.round(a*10)/10,
          precedent:b!=null?Math.round(b*10)/10:null,
          delta:b!=null?Math.round((a-b)*10)/10:null,
          nRec:rec.length};
}
// Projection vers le poids cible à partir de la tendance réelle
// joursRestants = ce qu'il reste avant la fin du programme. Sans cette
// information, la projection annonçait une date sans jamais dire qu'elle
// tombait APRÈS l'échéance — donc « Tu progresses » alors que le rythme ne
// permet plus de tenir la promesse.
function statProjection(poidsVals,cible,finIdx,joursRestants){
  var T=statTendance(poidsVals);
  var TR=statTendance(poidsVals,10);   // les 10 dernières pesées : le rythme du moment
  var act=null;
  for(var i=finIdx;i>=0;i--){if(poidsVals[i]!=null){act=poidsVals[i];break;}}
  if(act==null)return null;
  if(cible==null||!cible)return {act:act,tendance:T,assez:T&&T.n>=8,cible:null};
  var reste=Math.round((act-cible)*10)/10;
  if(reste<=0)return {act:act,cible:cible,atteint:true,tendance:T,assez:true};
  var assez=!!(T&&T.n>=8);
  var jours=null,dateCible=null,parSem=null;
  if(assez&&T.pente<-0.005){
    parSem=Math.round(-T.pente*7*100)/100;
    jours=Math.ceil(reste/(-T.pente));
    if(jours>0&&jours<3650){
      var d=new Date();d.setDate(d.getDate()+jours);
      dateCible=d.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
    }
  }
  // Retard sur l'échéance : positif = la cible tombe APRÈS la fin du programme
  var retard=null,dateFin=null;
  if(jours!=null&&joursRestants!=null&&joursRestants>0){
    retard=jours-joursRestants;
    var df=new Date();df.setDate(df.getDate()+joursRestants);
    dateFin=df.toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
  }
  // Le rythme récent s'est-il retourné, ou nettement essoufflé ?
  // Une balance varie naturellement de 0,5 à 1 kg par jour (eau, sel, transit).
  // Le seuil précédent — une pente de 0,005 kg/jour, soit 35 g par semaine —
  // était très en dessous de ce bruit : un simple pic au milieu des dernières
  // pesées suffisait à crier « ça repart à l'envers » chez quelqu'un qui avait
  // perdu 2,5 kg. On exige maintenant un écart RÉEL : la moyenne des trois
  // dernières pesées doit dépasser celle des précédentes d'au moins 500 g.
  var recentMonte=false;
  if(TR&&TR.n>=6){
    var rv=[];
    for(var ri=0;ri<poidsVals.length;ri++){if(poidsVals[ri]!=null)rv.push(poidsVals[ri]);}
    rv=rv.slice(-10);
    var d3=rv.slice(-3), av=rv.slice(0,-3);
    if(d3.length===3&&av.length>=3){
      var m3=0,ma=0,z;
      for(z=0;z<d3.length;z++)m3+=d3[z]; m3/=d3.length;
      for(z=0;z<av.length;z++)ma+=av[z]; ma/=av.length;
      recentMonte=(m3-ma)>=0.5;
    }
  }
  var recentMou=!!(TR&&TR.n>=4&&T&&T.pente<-0.005&&TR.pente>T.pente*0.5);
  return {act:act,cible:cible,reste:reste,tendance:T,recent:TR,assez:assez,
          jours:jours,sem:jours?Math.ceil(jours/7):null,dateCible:dateCible,parSem:parSem,
          retard:retard,dateFin:dateFin,joursRestants:joursRestants,
          recentMonte:recentMonte,recentMou:recentMou,
          parSemRecent:(TR&&TR.pente<0)?Math.round(-TR.pente*7*100)/100:0,
          stagne:!!(assez&&T&&T.pente>=-0.005&&T.pente<=0.005),
          monte:!!(assez&&T&&T.pente>0.005)};
}
// 📉 Courbe de poids avec droite de tendance et ligne d'objectif
function svgPoidsChart(values,cible,opts){
  opts=opts||{};
  // Sur fond sombre, le tracé couleur « encre » disparaît et la grille claire
  // crie. Les deux se surchargent donc depuis l'appelant.
  var TRAIT=solid(opts.trait||"var(--ink)"), GRILLE=solid(opts.grille||"var(--soft2)"), TXT=opts.txt||"#BBB";
  var W=opts.width||340,H=opts.height||160,pad={t:12,r:10,b:22,l:38};
  var valid=values.filter(function(v){return v!=null;});
  if(valid.length<2)return '<div class="chart-empty">Pèse-toi quelques jours pour voir ta courbe</div>';
  var mn=Math.min.apply(null,valid),mx=Math.max.apply(null,valid);
  if(cible!=null&&cible)mn=Math.min(mn,cible);
  var marge=Math.max(0.5,(mx-mn)*0.12);
  mn-=marge;mx+=marge;
  var rg=mx-mn||1,iw=W-pad.l-pad.r,ih=H-pad.t-pad.b,n=values.length;
  function px(i){return pad.l+(i/(n-1))*iw;}
  function py(v){return pad.t+ih-((v-mn)/rg)*ih;}
  var g="";
  for(var k=0;k<=3;k++){
    var gy=pad.t+ih*(k/3),gv=mx-(rg*(k/3));
    g+='<line x1="'+pad.l+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+gy.toFixed(1)+'" stroke='+JSON.stringify(GRILLE)+'/>'+
      '<text x="'+(pad.l-6)+'" y="'+(gy+3).toFixed(1)+'" font-size="9" fill="'+TXT+'" text-anchor="end">'+(Math.round(gv*10)/10)+'</text>';
  }
  // Ligne d'objectif
  var obj="";
  if(cible!=null&&cible&&cible>=mn&&cible<=mx){
    var oy=py(cible);
    obj='<line x1="'+pad.l+'" y1="'+oy.toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+oy.toFixed(1)+'" stroke='+JSON.stringify(solid("var(--ok)"))+' stroke-width="1.5" stroke-dasharray="5 4"/>'+
      '<text x="'+(W-pad.r)+'" y="'+(oy-5).toFixed(1)+'" font-size="9" font-weight="700" fill='+JSON.stringify(solid("var(--ok)"))+' text-anchor="end">objectif '+cible+' kg</text>';
  }
  // Droite de tendance
  var trend="";
  var T=statTendance(values);
  if(T&&T.n>=4){
    var y1=T.ord+T.pente*T.premier,y2=T.ord+T.pente*T.dernier;
    y1=Math.max(mn,Math.min(mx,y1));y2=Math.max(mn,Math.min(mx,y2));
    trend='<line x1="'+px(T.premier).toFixed(1)+'" y1="'+py(y1).toFixed(1)+'" x2="'+px(T.dernier).toFixed(1)+'" y2="'+py(y2).toFixed(1)+'" stroke='+JSON.stringify(solid("var(--gold-d)"))+' stroke-width="1.5" stroke-dasharray="3 3" opacity=".8"/>';
  }
  var d="",started=false,dots="";
  for(var i=0;i<n;i++){
    if(values[i]==null)continue;
    var X=px(i),Y=py(values[i]);
    d+=(started?" L":"M")+X.toFixed(1)+" "+Y.toFixed(1);
    started=true;
  }
  var last=-1;for(var z=n-1;z>=0;z--){if(values[z]!=null){last=z;break;}}
  if(last>=0)dots='<circle cx="'+px(last).toFixed(1)+'" cy="'+py(values[last]).toFixed(1)+'" r="4" fill='+JSON.stringify(TRAIT)+'/>';
  var step=Math.max(1,Math.ceil(n/5)),xl="";
  for(var x=0;x<n;x+=step)xl+='<text x="'+px(x).toFixed(1)+'" y="'+(H-6)+'" font-size="9" fill="'+TXT+'" text-anchor="middle">J'+(x+1)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+g+obj+trend+xl+
    '<path d="'+d+'" fill="none" stroke='+JSON.stringify(TRAIT)+' stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg>';
}
function svgMultiChart(sets,opts){
  opts=opts||{};
  var W=opts.width||340,H=opts.height||190,pad={t:10,r:10,b:22,l:12};
  var actives=sets.filter(function(s){
    return s.values.filter(function(v){return v!=null;}).length>=2;
  });
  if(!actives.length)return '<div class="chart-empty">Pas encore assez de données</div>';
  var n=actives[0].values.length;
  var iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  function px(i){return pad.l+(i/(n-1))*iw;}

  var grid="";
  for(var g=0;g<=3;g++){
    var gy=pad.t+ih*(g/3);
    grid+='<line x1="'+pad.l+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+gy.toFixed(1)+'" stroke='+JSON.stringify(solid("var(--soft2)"))+' stroke-width="1"/>';
  }
  var step=Math.max(1,Math.ceil(n/6)),xlab="";
  for(var x=0;x<n;x+=step){
    xlab+='<text x="'+px(x).toFixed(1)+'" y="'+(H-6)+'" font-size="9" fill="#BBB" text-anchor="middle">J'+(x+1)+'</text>';
  }

  var paths="",legend="";
  for(var s=0;s<actives.length;s++){
    var S=actives[s];
    var val=S.values.filter(function(v){return v!=null;});
    var mn=S.min!=null?S.min:Math.min.apply(null,val);
    var mx=S.max!=null?S.max:Math.max.apply(null,val);
    if(mn===mx){mn-=1;mx+=1;}
    var rg=mx-mn;
    // Le poids descend quand ça va bien : on l'inverse pour comparer des tendances comparables
    var inv=!!S.invert;
    var d="",started=false;
    for(var i=0;i<n;i++){
      var v=S.values[i];
      if(v==null)continue;
      var frac=(v-mn)/rg;
      if(inv)frac=1-frac;
      var y=pad.t+ih-frac*ih;
      d+=(started?" L":"M")+px(i).toFixed(1)+" "+y.toFixed(1);
      started=true;
    }
    paths+='<path d="'+d+'" fill="none" stroke="'+S.color+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="'+(S.dim?0.55:0.95)+'"/>';
    legend+='<span style="display:inline-flex;align-items:center;gap:4px;margin-right:11px;margin-bottom:3px">'+
      '<span style="width:9px;height:9px;border-radius:3px;background:'+S.color+';display:inline-block"></span>'+
      '<span style="font-size:10.5px;font-weight:800;color:var(--mute)">'+S.label+
      '<span style="color:var(--mute);font-weight:700"> '+(Math.round(mn*10)/10)+'→'+(Math.round(mx*10)/10)+(S.unit||"")+
      (inv?' ↓':'')+'</span></span></span>';
  }
  return '<div style="margin-bottom:6px;line-height:1.7">'+legend+'</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+grid+xlab+paths+'</svg>';
}
function svgLineChart(values,color,opts){
  color=solid(color);
  opts=opts||{};
  var W=opts.width||340, H=opts.height||140, pad={t:8,r:8,b:22,l:34};
  var GRILLE=solid(opts.grille||"var(--soft2)"), TXT=opts.txt||"#BBB";
  var valid=values.filter(function(v){return v!=null;});
  if(valid.length<2)return '<div class="chart-empty">Aucune donnée encore</div>';
  var min=opts.min!=null?opts.min:Math.min.apply(null,valid);
  var max=opts.max!=null?opts.max:Math.max.apply(null,valid);
  if(min===max){min-=1;max+=1;}
  var range=max-min;
  var iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  var n=values.length;

  function px(i){return pad.l+(i/(n-1))*iw;}
  function py(v){return pad.t+ih-((v-min)/range)*ih;}

  var grid="";
  for(var g=0;g<=3;g++){
    var gy=pad.t+ih*(g/3);
    var gv=max-(range*(g/3));
    grid+='<line x1="'+pad.l+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+gy.toFixed(1)+'" stroke='+JSON.stringify(GRILLE)+' stroke-width="1"/>';
    grid+='<text x="'+(pad.l-6)+'" y="'+(gy+3).toFixed(1)+'" font-size="9" fill="'+TXT+'" text-anchor="end">'+(Math.round(gv*10)/10)+'</text>';
  }
  var step=Math.max(1,Math.ceil(n/6));
  var xlabels="";
  for(var x=0;x<n;x+=step){
    xlabels+='<text x="'+px(x).toFixed(1)+'" y="'+(H-6)+'" font-size="9" fill="'+TXT+'" text-anchor="middle">J'+(x+1)+'</text>';
  }
  var path="", started=false;
  for(var i2=0;i2<n;i2++){
    var v2=values[i2];
    if(v2==null)continue; // jour non rempli : on saute, la courbe se relie au point suivant
    var X=px(i2).toFixed(1), Y=py(v2).toFixed(1);
    path+=(started?"L":"M")+X+","+Y;
    started=true;
  }
  var lastIdx=-1;
  for(var i3=n-1;i3>=0;i3--){if(values[i3]!=null){lastIdx=i3;break;}}
  var dot=lastIdx>=0?'<circle cx="'+px(lastIdx).toFixed(1)+'" cy="'+py(values[lastIdx]).toFixed(1)+'" r="4" fill="'+color+'" stroke="#fff" stroke-width="2"/>':"";

  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">'+grid+xlabels+
    '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+dot+'</svg>';
}

// Un attribut SVG (stroke, fill) n'accepte PAS var(--x) : il faut la valeur littérale.
// On la lit une fois sur la racine du document et on la met en cache.
var __cvarCache={};
function solid(c){
  if(typeof c!=="string")return c;
  var m=c.match(/^var\((--[a-zA-Z0-9-]+)\)$/);
  if(!m)return c;
  var k=m[1];
  if(__cvarCache[k])return __cvarCache[k];
  var v="";
  try{v=getComputedStyle(document.documentElement).getPropertyValue(k).trim();}catch(e){}
  if(!v)v="#888888";
  __cvarCache[k]=v;
  return v;
}
// 🏔️ Jauge montagne — trois couleurs, trois rôles :
//   massif  = blanc translucide (décor, il ne doit pas concurrencer)
//   sentier = vert vif (la progression, c'est lui qu'on doit voir)
//   drapeau = ROUGE tant que le sommet n'est pas atteint, VERT à 100 %
// On n'utilise PAS pathLength (mal supporté selon les moteurs) : la longueur
// réelle du tracé est calculée une fois pour toutes (SENTIER_LEN), donc le
// remplissage est exact partout. Géométrie vérifiée : le sentier ne sort
// jamais du triangle du massif.
var SENTIER_D="M42 132 Q56 126 78 118 Q88 112 52 104 Q46 97 95 88 Q104 81 66 72 Q62 65 94 56 Q98 49 78 42 Q79 34 85 26";
var SENTIER_LEN=236.01;

function svgMontagne(pct,accent,w,hh){
  accent=accent||"#5DF2A0";
  var p=Math.max(0,Math.min(100,pct||0));

  var fait=(SENTIER_LEN*p/100).toFixed(2);          // longueur parcourue, en unités réelles
  var reste=(SENTIER_LEN+2).toFixed(2);             // le reste du motif : jamais redessiné
  var TR="transition:stroke-dasharray .7s cubic-bezier(.2,.8,.3,1),stroke-dashoffset .7s cubic-bezier(.2,.8,.3,1)";
  // Largeur fluide : le SVG remplit sa colonne et garde ses proportions, donc
  // il ne déborde jamais, même sur un petit écran.
  var dim=(w&&hh)?(' width="'+w+'" height="'+hh+'"'):'';
  var sty=(w&&hh)?'display:block;overflow:visible':'display:block;width:100%;height:auto;overflow:visible';

    '<defs>'+

    '<linearGradient id="s'+id+'" x1="0" y1="1" x2="0" y2="0">'+
    '<stop offset="0%" stop-color="'+accent+'" stop-opacity=".9"/>'+
    '<stop offset="100%" stop-color="'+accent+'"/></linearGradient>'+
    '<filter id="g'+id+'" x="-70%" y="-70%" width="240%" height="240%">'+
    '<feGaussianBlur stdDeviation="2.8" result="b"/>'+
    '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+
    '</defs>'+
    // Reliefs arrière — profondeur
    '<path d="M0 140 L38 62 L76 140 Z" fill="#FFFFFF" opacity=".12"/>'+
    '<path d="M94 140 L132 55 L170 140 Z" fill="#FFFFFF" opacity=".12"/>'+
    // Massif principal
    '<path d="M18 140 L85 22 L152 140 Z" fill="url(#r'+id+')"/>'+
    // Face droite éclairée — volume
    '<path d="M85 22 L152 140 L85 140 Z" fill="#FFFFFF" opacity=".10"/>'+
    // Neige du sommet
    '<path d="M85 22 L99 50 L94 45 L89 53 L85 43 L80 53 L75 45 L71 50 Z" fill="#FFFFFF" opacity=".92"/>'+
    // Sentier restant — creux blanc discret
    '<path d="'+SENTIER_D+'" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="5.5" stroke-linecap="round"/>';
  // Sentier PARCOURU — vert vif. Rien n'est dessiné à 0 % (sinon le bout rond laisse un point).
  if(p>0){
    s+='<path d="'+SENTIER_D+'" fill="none" stroke="url(#s'+id+')" stroke-width="6" stroke-linecap="round" filter="url(#g'+id+')" stroke-dasharray="'+fait+' '+reste+'" style="'+TR+'"/>';
  }
  // Marcheur : point blanc cerclé de vert, posé exactement au bout du parcouru
  if(p>0&&p<100){
    s+='<path d="'+SENTIER_D+'" fill="none" stroke="'+accent+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="0.01 '+reste+'" stroke-dashoffset="'+(-fait)+'" style="'+TR+'"/>'+
       '<path d="'+SENTIER_D+'" fill="none" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" stroke-dasharray="0.01 '+reste+'" stroke-dashoffset="'+(-fait)+'" style="'+TR+'"/>';
  }
  // Mât blanc, drapeau ROUGE tant que ce n'est pas gagné, VERT et illuminé au sommet
  s+='<line x1="85" y1="24" x2="85" y2="2" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="2.6" stroke-linecap="round"/>'+
     '<path d="M85 3 L106 9 L85 15 Z" fill="'+dc+'"'+(sommet?' filter="url(#g'+id+')"':'')+' style="transition:fill .5s"/>'+
     (sommet?'<circle cx="85" cy="24" r="10" fill="none" stroke="'+accent+'" stroke-width="2.4" opacity=".55"/>':'')+
     '<line x1="4" y1="140.5" x2="166" y2="140.5" stroke="#FFFFFF" stroke-opacity=".32" stroke-width="2.6" stroke-linecap="round"/>'+
     '</svg>';
  return s;
}
// 🎁 Univers visuel de la récompense, déduit de ce que le coach a écrit.
function rewardTheme(txt){

  if(has("vêtement","vetement","jean","robe","shopping","chaussure","basket","sneak"))

  if(has("montre","bijou","parfum","sac","cadeau"))

  if(has("concert","spectacle","cinéma","cinema","match","festival"))

function svgRing(pct,color,size,w){
  size=size||64; w=w||6; color=solid(color);

}
