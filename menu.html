<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',sans-serif;background:#F4F4F4;-webkit-font-smoothing:antialiased;color:#1A1A1A}
button,input,textarea,select{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea,select{outline:none}
.app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:40px}

.hdr{background:linear-gradient(120deg,#0EA5C6 0%,#8A3FFF 100%);padding:20px 18px 16px;position:sticky;top:0;z-index:50}
.hdr-brand{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.bar{width:3px;height:18px;border-radius:2px}
.bar-r{background:#D52B1E}.bar-b{background:#0057A8}
.hdr-title{color:#fff;font-weight:900;font-size:16px;letter-spacing:2px;text-transform:uppercase}
.hdr-sub{color:#888;font-size:13px;padding-left:11px;font-weight:700}

.banner{background:linear-gradient(150deg,#12B5EA 0%,#8A3FFF 100%);box-shadow:0 8px 22px rgba(96,120,255,.26);margin:16px 14px;border-radius:16px;padding:20px 18px;text-align:center}
.banner-line{color:#fff;font-weight:900;font-size:15px;margin-bottom:4px}
.banner-line.s2{font-size:13px;opacity:.85}
.banner-line.s3{font-size:12px;opacity:.7}
.banner-keys{background:#D52B1E;color:#fff;font-weight:900;font-size:11px;padding:10px 12px;border-radius:10px;margin-top:14px;letter-spacing:.5px;line-height:1.6}

.dark-screen{min-height:100vh;background:linear-gradient(160deg,#0B3A56 0%,#3B1E7A 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}

.dark-brand .bar{height:26px;width:4px}
.dark-brand span{color:#fff;font-weight:900;font-size:22px;letter-spacing:3px;text-transform:uppercase}
.dark-sub{color:#555;font-size:13px;margin-bottom:44px}
.dark-input{width:100%;max-width:340px;padding:16px 18px;border-radius:12px;border:2px solid #2A2A2A;background:#111;color:#fff;font-size:17px;font-weight:700;text-align:center;margin-bottom:20px;display:block;margin-left:auto;margin-right:auto}
.btn-primary{width:100%;max-width:340px;padding:18px 0;border-radius:12px;background:#D52B1E;color:#fff;font-weight:900;font-size:16px;letter-spacing:1.5px;display:block;margin:0 auto}
.menu-pick{width:100%;max-width:340px;padding:20px 18px;border-radius:14px;background:#111;border:2px solid #2A2A2A;color:#fff;margin-bottom:14px;text-align:left;display:block;margin-left:auto;margin-right:auto}

.menu-pick .mp-name{font-size:18px;font-weight:900}
.menu-pick .mp-desc{font-size:12px;color:#888;margin-top:4px;line-height:1.5}

.tabs{display:flex;gap:6px;padding:0 14px;margin-bottom:14px}
.tab{flex:1;padding:11px 0;border-radius:10px;background:#EBEBEB;color:#888;font-weight:800;font-size:12px;text-align:center}
.tab.active{background:linear-gradient(120deg,#12B5EA,#8A3FFF);color:#fff}

.card{background:#fff;border-radius:14px;padding:16px;margin:0 14px 10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}

.day-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:0 14px;margin-bottom:16px}
.day-cell{aspect-ratio:1;border-radius:10px;background:#fff;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);position:relative}
.day-cell.sel{border-color:#D52B1E}
.day-cell .dc-tag{font-size:7px;font-weight:900;margin-top:2px;letter-spacing:.5px}
.day-cell.sg{background:#E8F5E9}
.day-cell.gb{background:#FFF8E1}
.day-cell .dc-dot{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:#4CAF50}

.meal-card{background:#fff;border-radius:16px;margin:0 14px 12px;box-shadow:0 1px 6px rgba(0,0,0,.06);overflow:hidden}
.meal-hdr{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #F5F5F5}
.meal-ico{font-size:22px}
.meal-name{font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:1px;flex:1}
.meal-rule{font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px;color:#fff}
.meal-body{padding:16px}
.meal-title{font-weight:900;font-size:17px;margin-bottom:6px}
.meal-time{font-size:12px;color:#999;margin-bottom:12px}

.meal-sec{font-weight:800;font-size:11px;color:#AAA;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;margin-top:12px}
.meal-txt{font-size:14px;color:#333;line-height:1.7;white-space:pre-line}
.meal-empty{padding:24px 16px;text-align:center;color:#BBB;font-size:13px}

.food-col{margin-bottom:16px}
.food-col-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.food-col-name{font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:1px}
.food-tag{font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;color:#fff}
.food-list{font-size:13px;color:#444;line-height:1.9}
.food-note{background:#FFF8F0;border:2px solid #FFE0B2;border-radius:12px;padding:12px 14px;font-size:12px;color:#B45309;font-weight:700;line-height:1.6;margin:0 14px 16px}

.plate{display:flex;gap:6px;margin-bottom:14px}
.plate-part{flex:1;border-radius:10px;padding:10px 6px;text-align:center;color:#fff;font-weight:900;font-size:10px;letter-spacing:.5px}

.admin-field{margin-bottom:14px}
.admin-label{font-weight:800;font-size:11px;color:#AAA;letter-spacing:1px;margin-bottom:6px;text-transform:uppercase}
.admin-input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #E0E0E0;font-size:15px;background:#fff}
.admin-ta{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #E0E0E0;font-size:14px;background:#fff;min-height:80px;resize:vertical;line-height:1.5}

.fr-temps{font-size:12px;color:#888;font-weight:700;margin-top:4px}

.fr-sec{font-weight:900;font-size:11px;color:#AAA;letter-spacing:1px;text-transform:uppercase;margin:16px 0 7px}
.fr-ul,.fr-ol{margin:0;padding-left:20px;font-size:13.5px;color:#333;line-height:1.9}

  color:#555;font-weight:800;font-size:13px}

/* 🔌 Interrupteurs de l'écran admin */
.cfg-box{background:#F6F7F9;border-radius:14px;padding:14px 15px;margin-bottom:18px}
.cfg-l{display:flex;align-items:center;gap:12px}
.cfg-t{font-weight:900;font-size:14px;color:#1A1A1A}
.cfg-s{font-size:11.5px;color:#777;line-height:1.6;margin-top:3px}

.cfg-sw.on{background:#2E7D32}

.cfg-msg{font-size:11.5px;color:#666;font-weight:700;margin-top:10px;min-height:14px}
.sync-note{text-align:center;font-size:12px;font-weight:700;margin-top:10px;min-height:16px}

/* 🧭 Le protocole de la journée : trois lignes, lisibles d'un coup d'œil. */
.proto-card{border-left:5px solid #7B1FA2}
.proto-t{font-weight:900;font-size:15px;color:#1A1A1A;margin-bottom:13px;display:flex;align-items:center;gap:9px}
.proto-ph{font-size:11px;font-weight:800;color:#7B1FA2;background:#F3E6F8;border-radius:100px;padding:3px 9px}
.proto-l{display:flex;gap:11px;padding:10px 0;border-top:1px solid #EFEFEF}
.proto-l:first-of-type{border-top:none;padding-top:0}
.proto-e{flex:0 0 30px;font-size:21px;line-height:1.2}
.proto-c{flex:1;min-width:0}
.proto-h{font-size:11px;font-weight:800;color:#8A8A8A;text-transform:uppercase;letter-spacing:1px}
.proto-r{font-size:15px;font-weight:900;color:#1A1A1A;margin-top:2px;line-height:1.3}
.proto-d{font-size:12.5px;color:#6B6B6B;margin-top:3px;line-height:1.5}
.proto-note{margin-top:12px;font-size:11.5px;color:#8A8A8A;line-height:1.5}

/* 🍽️ Les assiettes de référence, en tête de l'onglet Aliments. */

.ass{margin:0}
.ass img{width:100%;border-radius:14px;display:block;background:#fff}
.ass figcaption{display:flex;flex-direction:column;gap:2px;margin-top:7px;text-align:center}
.ass figcaption b{font-size:13.5px;color:#111}

/* 📂 Catégories repliables */
.food-col summary{list-style:none;cursor:pointer}

.food-col-hdr{display:flex;align-items:center;gap:9px;padding:4px 0}
.food-col-n{margin-left:auto;font-size:11.5px;font-weight:800;color:#8A93A0}
.food-col-c{font-size:14px;color:#8A93A0;transition:transform .2s}
.food-col[open] .food-col-c{transform:rotate(180deg)}
</style>

// Règle affichée par repas, selon le menu (et le jour pour cyclage)
function mealRule(menu,mealId,dayTag){
  if(menu==="equilibre"){
    if(mealId==="pdej") return {txt:"PROTÉINE",color:"#7B1FA2"};
    if(mealId==="dej")  return {txt:"G + P + F",color:"#2E7D32"};
    return {txt:"GB + P + F",color:"#F59E0B"};
  }

    if(mealId==="pdej") return {txt:"PROTÉINE",color:"#7B1FA2"};
    if(mealId==="dej")  return {txt:"G + P + F",color:"#2E7D32"};
    return {txt:"P + F",color:B};
  }
  if(menu==="acceleration"){
    if(mealId==="pdej") return {txt:"PROTÉINE",color:"#7B1FA2"};
    if(mealId==="dej")  return {txt:"G + P + F",color:"#2E7D32"};
    return {txt:"P + F",color:B};
  }
  // cyclage : SG = P + F uniquement / GB = GB + P + F
  if(mealId==="pdej") return {txt:"PROTÉINE",color:"#7B1FA2"};
  if(dayTag==="SG")   return {txt:"P + F",color:"#2E7D32"};
  return {txt:"GB + P + F",color:"#F59E0B"};
}

  ["GB","SG","SG","GB","SG","SG","GB"],

];

}

// ═══════════ ÉTAT ═══════════

// ═══════════ SUPABASE ═══════════
function sbFetch(path,opts){
  opts=opts||{};
  var headers={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};
  if(opts.prefer)headers["Prefer"]=opts.prefer;
  return fetch(SB_URL+"/rest/v1/"+path,{
    method:opts.method||"GET",
    headers:headers,
    body:opts.body?JSON.stringify(opts.body):undefined
  });
}
function keyOf(menu,day,meal){return menu+"|"+day+"|"+meal;}

function lsGetStr(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}}
function lsSetStr(k,v){try{localStorage.setItem(k,v);}catch(e){}}

function checkAccess(cb){
  sbFetch("tracking?client_slug=eq."+encodeURIComponent(CLIENT)+"&day_index=eq.504&select=data").then(function(r){return r.json();}).then(function(rows){
    if(rows&&rows.length){
      var a=rows[0].data||{};
      var today=new Date().toISOString().split("T")[0];
      if(a.off||(a.end&&today>a.end)){state.accessDenied=true;}
    }
    cb();
  }).catch(function(){cb();});
}
function loadClient(cb){
  // 1. localStorage (partagé avec le tracker, même domaine)
  var n=lsGetStr("amcoach_name_"+CLIENT), s=lsGetStr("amcoach_start_"+CLIENT);
  if(n&&s){state.clientName=n;state.clientStart=s;state.clientLoaded=true;cb();return;}
  // 2. Supabase clients (table partagée avec le tracker)
  sbFetch("clients?slug=eq."+encodeURIComponent(CLIENT)+"&select=*").then(function(r){return r.json();}).then(function(rows){
    if(rows&&rows.length){
      state.clientName=rows[0].name;
      state.clientStart=rows[0].start_date;
      lsSetStr("amcoach_name_"+CLIENT,state.clientName);
      lsSetStr("amcoach_start_"+CLIENT,state.clientStart);
    }
    state.clientLoaded=true;
    cb();
  }).catch(function(){state.clientLoaded=true;cb();});
}

function saveClient(name,start){
  lsSetStr("amcoach_name_"+CLIENT,name);
  lsSetStr("amcoach_start_"+CLIENT,start);
  state.clientName=name;state.clientStart=start;
  sbFetch("clients?on_conflict=slug",{method:"POST",prefer:"resolution=merge-duplicates",body:{slug:CLIENT,name:name,start_date:start}}).catch(function(){});
}

function dayGlobal(){
  if(!state.clientStart)return 0;
  var diff=Math.floor((Date.now()-new Date(state.clientStart).getTime())/86400000);
  return Math.max(0,Math.min(diff,89));
}
function phaseUnlocked(pi){return dayGlobal()>=UNLOCK_AT[pi];}
function currentPhaseIdx(){return Math.min(Math.floor(dayGlobal()/28),2);}

function loadRecipes(menu,cb){
  sbFetch("recipes?menu=eq."+encodeURIComponent(menu)+"&select=*").then(function(r){
    if(!r.ok)throw 0;
    return r.json();
  }).then(function(rows){
    for(var i=0;i<rows.length;i++){
      var rw=rows[i];
      state.recipes[keyOf(rw.menu,rw.day,rw.meal)]=rw;
    }
    state.loaded=true;
    cb();
  }).catch(function(){state.loaded=true;cb();});
}

function saveRecipe(rec,cb){
  sbFetch("recipes?on_conflict=menu,day,meal",{
    method:"POST",
    prefer:"resolution=merge-duplicates",
    body:rec
  }).then(function(r){cb(r.ok);}).catch(function(){cb(false);});
}

// ═══════════ HELPERS ═══════════
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function ytEmbed(url){
  if(!url)return null;
  var m=url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  return m?("https://www.youtube.com/watch?v="+m[1]):url;
}

<script>
"use strict";

// ═══════════════════════════════════════════════════════════════
// ⚙️ RÉGLAGE — les recettes sont-elles visibles ?
// ───────────────────────────────────────────────────────────────
// Tant qu'Akli n'a pas écrit ses recettes, afficher « Recette à
// venir 🔜 » sur les 90 repas donne l'impression d'un menu vide.
// L'interrupteur vit dans la table tracking, sur un faux client
// « _reglages » : aucune table à créer, et le réglage voyage
// jusqu'au téléphone de chaque cliente.
// ═══════════════════════════════════════════════════════════════
var CFG_SLUG = "_reglages", CFG_SLOT = 900;
var cfgMenu = { recettes: false, frigo: true, charge: false };

function cfgCharger(cb) {
  try {
    var loc = lsGetStr("amcoach_menucfg");
    if (loc) { var o = JSON.parse(loc); cfgMenu.recettes = !!o.recettes; cfgMenu.frigo = o.frigo !== false; }
  } catch (e) { }
  sbFetch("tracking?client_slug=eq." + CFG_SLUG + "&day_index=eq." + CFG_SLOT + "&select=data")
    .then(function (r) { return r.json(); })
    .then(function (rows) {
      if (rows && rows.length && rows[0].data) {
        cfgMenu.recettes = !!rows[0].data.recettes;
        cfgMenu.frigo = rows[0].data.frigo !== false;
        lsSetStr("amcoach_menucfg", JSON.stringify(cfgMenu));
      }
      cfgMenu.charge = true;
      if (cb) cb();
    })
    .catch(function () { cfgMenu.charge = true; if (cb) cb(); });
}

function cfgEnregistrer(cb) {
  lsSetStr("amcoach_menucfg", JSON.stringify(cfgMenu));
  sbFetch("tracking?on_conflict=client_slug,day_index", {
    method: "POST", prefer: "resolution=merge-duplicates",
    body: { client_slug: CFG_SLUG, day_index: CFG_SLOT, data: { recettes: cfgMenu.recettes, frigo: cfgMenu.frigo }, updated_at: new Date().toISOString() }
  }).then(function (r) { if (cb) cb(r.ok); }).catch(function () { if (cb) cb(false); });
}

// ═══════════════════════════════════════════════════════════════
// 🧊 MON FRIGO — une recette avec ce qu'il reste
// ───────────────────────────────────────────────────────────────
// Pas d'intelligence artificielle et pas de connexion : la recette
// est construite ici, à partir des listes d'aliments déjà validées
// par Akli. On classe ce que la cliente tape dans les trois cases
// de l'assiette (protéines, glucides, fibres), on vérifie que ça
// respecte la règle du repas du jour, puis on assemble une méthode
// de cuisson adaptée à la famille de l'aliment. Le résultat est
// toujours cohérent avec la Méthode Balance-360.
// ═══════════════════════════════════════════════════════════════

function frNorm(s) {
  return String(s || "").toLowerCase()
    .replace(/\u0153/g, "oe").replace(/\u00e6/g, "ae")   // œuf → oeuf, sinon le mot disparaît
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
}
// Deux mots se correspondent si l'un contient l'autre, au pluriel près.
function frMotEgal(a, b) {
  if (!a || !b || a.length < 3 || b.length < 3) return false;
  a = a.replace(/s$/, ""); b = b.replace(/s$/, "");
  if (a === b) return true;
  // LE PRÉFIXE SEUL NE SUFFIT PAS. « pois » est un préfixe de « poivre » ET
  // de « poisson » : les pois chiches finissaient donc dans les aromates, et
  // l'appli réclamait un glucide qui était déjà dans le frigo. On n'accepte
  // un préfixe que si le mot le plus court fait au moins 5 lettres et que
  // les deux se ressemblent à une lettre près.
  var court = a.length < b.length ? a : b, long = a.length < b.length ? b : a;
  if (court.length < 5 || long.length - court.length > 1) return false;
  return long.indexOf(court) === 0;
}
// Deux passes volontaires. STRICT : le mot tapé correspond au PREMIER mot
// de l'entrée — « riz » trouve « Riz », pas « Protéine de pois / riz (poudre) ».
// LARGE : n'importe quel mot de l'entrée, utilisé seulement si la passe
// stricte n'a rien donné dans aucune liste.
function frDansListe(saisie, liste, strict) {
  var mots = frNorm(saisie).split(" ");
  for (var i = 0; i < liste.length; i++) {
    var ref = frNorm(liste[i]).split(" ").filter(function (w) { return w.length >= 3; });
    if (!ref.length) continue;
    var cibles = strict ? [ref[0]] : ref;
    for (var j = 0; j < cibles.length; j++)
      for (var k = 0; k < mots.length; k++) if (frMotEgal(mots[k], cibles[j])) return liste[i];
  }
  return null;
}

var FR_AROMATES = ["ail", "oignon", "échalote", "citron", "citron vert", "persil", "coriandre", "basilic",
  "thym", "romarin", "laurier", "curry", "curcuma", "paprika", "cumin", "piment", "gingembre",
  "moutarde", "vinaigre", "huile d'olive", "huile de coco", "sel", "poivre", "herbes de Provence",
  "sauce soja", "bouillon", "crème de coco", "olives", "câpres"];

// Familles de cuisson : c'est ce qui rend la recette réaliste.
var FR_CUISSON = [
  { k: "poisson", mots: ["cabillaud", "saumon", "truite", "thon", "maquereau", "haddock", "sardine", "morue", "poisson", "seiche", "poulpe", "calamar"], v: "poisson" },
  { k: "fruitsmer", mots: ["crevette", "moule", "saint jacques", "st jacques", "petoncle", "langoustine", "crabe", "homard", "langouste", "crustace"], v: "fruits de mer" },
  { k: "oeuf", mots: ["oeuf", "blanc d oeuf"], v: "œufs" },
  { k: "hache", mots: ["hache", "boulette", "steak hache"], v: "viande hachée" },
  { k: "vegetal", mots: ["tofu", "tempeh", "soja", "edamame", "proteine de pois", "filet vegetarien"], v: "protéine végétale" },
  { k: "volaille", mots: ["poulet", "dinde", "pintade", "lapin", "canard", "magret", "pigeon", "faisan", "perdreau"], v: "volaille" },
  { k: "viande", mots: ["boeuf", "veau", "porc", "agneau", "cheval", "rumsteak", "tournedos", "roastbeef", "filet mignon", "hampe", "rouelle", "foie", "marcassin", "chevreuil"], v: "viande" }
];
function frFamille(nom) {
  var n = frNorm(nom);
  for (var i = 0; i < FR_CUISSON.length; i++)
    for (var j = 0; j < FR_CUISSON[i].mots.length; j++)
      if (n.indexOf(FR_CUISSON[i].mots[j]) >= 0) return FR_CUISSON[i];
  return { k: "viande", v: "protéine" };
}

var FR_FEUILLES = ["epinard", "salade", "roquette", "mache", "laitue", "cresson", "kale", "blette", "pousse", "endive", "chicorée", "chou chinois", "pak choi"];
function frFeuille(nom) {
  var n = frNorm(nom);
  for (var i = 0; i < FR_FEUILLES.length; i++) if (n.indexOf(frNorm(FR_FEUILLES[i])) >= 0) return true;
  return false;
}
var FR_CRUS = ["concombre", "tomate", "radis", "avocat", "poivron", "cornichon", "capre", "olive"];
function frCru(nom) {
  var n = frNorm(nom);
  for (var i = 0; i < FR_CRUS.length; i++) if (n.indexOf(FR_CRUS[i]) >= 0) return true;
  return false;
}

// ─── Le tri de ce que la cliente a tapé ───
// À QUELLE LISTE APPARTIENT CET ALIMENT ?
// Un seul mot ne suffit pas à décider : « pois » se trouve dans les pois
// chiches (glucide), les pois mange-tout (fibre) ET la protéine de pois.
// On compare donc l'entrée à CHAQUE aliment des listes et on garde celui qui
// partage le plus de mots avec elle ; à égalité, celui dont le nom est le
// mieux couvert. « pois chiche » colle à 2 mots sur 2 de « Pois chiches »,
// à 1 sur 3 de « Pois mange-tout » : le glucide gagne.
function frMots(t) {
  return frNorm(t).split(" ").filter(function (w) { return w.length >= 3; });
}
function frMeilleur(saisie) {
  var mots = frMots(saisie);
  if (!mots.length) return null;
  var listes = [
    ["A", FR_AROMATES], ["P", PROTEINES], ["P", PROTEINES_RETOUR], ["F", FIBRES],
    ["G", GLUCIDES_RA], ["G", GLUCIDES_GB_OK], ["G", GLUCIDES_RETOUR]
  ];
  var best = null;
  for (var l = 0; l < listes.length; l++) {
    var cat = listes[l][0], liste = listes[l][1] || [];
    for (var i = 0; i < liste.length; i++) {
      // Ce qui est entre parenthèses reste CHERCHABLE (« laitue » trouve la
      // salade) mais ne compte pas dans la longueur du nom : sans ça, « Noix
      // (1 poignée) » paraissait aussi vague que « Noix de St-Jacques ».
      var ref = frMots(liste[i]);
      var base = frMots(String(liste[i]).replace(/\(.*?\)/g, " "));
      if (!ref.length) continue;
      var n = 0;
      for (var j = 0; j < ref.length; j++)
        for (var k = 0; k < mots.length; k++)
          if (frMotEgal(mots[k], ref[j])) { n++; break; }
      if (!n) continue;
      var lon = base.length || ref.length;
      // Une entrée COURTE qui colle entièrement bat une entrée longue dont on
      // n'a qu'un mot : « noix » désigne la noix (fibre), pas la noix de
      // Saint-Jacques. On départage sur la part du nom couverte, puis sur le
      // nombre de mots du nom — le plus court est le plus précis.
      var cand = { cat: cat, nom: liste[i], score: n, part: Math.min(1, n / lon), taille: lon, rang: l };
      if (!best || cand.score > best.score ||
        (cand.score === best.score && cand.part > best.part) ||
        (cand.score === best.score && cand.part === best.part && cand.taille < best.taille) ||
        (cand.score === best.score && cand.part === best.part && cand.taille === best.taille && cand.rang < best.rang)) best = cand;
    }
  }
  return best;
}
function frTrier(txt) {
  var brut = String(txt || "").split(/[\n,;]+/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 1; });
  var res = { P: [], G: [], F: [], A: [], inconnus: [], interdits: [] };
  var vus = {};
  for (var i = 0; i < brut.length; i++) {
    var m = brut[i];
    var cle = frNorm(m);
    if (!cle || vus[cle]) continue;
    vus[cle] = 1;
    var B = frMeilleur(m);
    if (B) res[B.cat].push(m); else res.inconnus.push(m);
  }
  return res;
}

// La règle du repas, telle qu'elle s'affiche déjà dans le menu du jour.
function frRegle(mealId) {
  var dayTag = MENU === "cyclage" ? cyclageTag(state.selDay) : null;
  var r = mealRule(MENU, mealId, dayTag);
  var parts = r.txt.split("+").map(function (s) { return s.trim(); });
  return { txt: r.txt, color: r.color, glucides: parts.indexOf("G") >= 0 || parts.indexOf("GB") >= 0, bas: parts.indexOf("GB") >= 0, tag: dayTag };
}

// ─── La recette ───
function frRecette(tri, mealId, variante) {
  var R = frRegle(mealId);
  var P = tri.P[0] || null, F = tri.F.slice(0, 3), G = R.glucides ? (tri.G[0] || null) : null;
  var manque = [];
  if (!P) manque.push("une protéine");
  if (!F.length) manque.push("des fibres (un légume)");
  if (R.glucides && !G) manque.push(R.bas ? "un glucide bas" : "un glucide");

  var fam = P ? frFamille(P) : null;
  var styles = ["poêlée", "papillote", "salade tiède"];
  if (fam && (fam.k === "oeuf")) styles = ["omelette", "brouillés", "œufs plat & poêlée"];
  var style = styles[(variante || 0) % styles.length];

  // Titre
  var titre;
  var legTxt = F.length ? F.slice(0, 2).join(" et ").toLowerCase() : "légumes";
  if (!P) titre = "Poêlée de " + legTxt;
  else if (style === "papillote") titre = "Papillote de " + P.toLowerCase() + ", " + legTxt;
  else if (style === "salade tiède") titre = "Salade tiède de " + P.toLowerCase() + " et " + legTxt;
  else if (style === "omelette") titre = "Omelette " + legTxt;
  else if (style === "brouillés") titre = "Œufs brouillés, " + legTxt;
  else titre = "Poêlée de " + P.toLowerCase() + ", " + legTxt;
  if (G) titre += " et " + G.toLowerCase();

  // Ingrédients avec des portions qui tiennent debout
  var ing = [];
  if (P) ing.push(P + " — " + (fam.k === "oeuf" ? "3 œufs" : "150 à 180 g"));
  for (var i = 0; i < F.length; i++) ing.push(F[i] + " — " + (frFeuille(F[i]) ? "2 belles poignées" : "150 g"));
  if (G) ing.push(G + " — " + (R.bas ? "80 g cuits" : "120 g cuits"));
  for (var a = 0; a < tri.A.length && a < 5; a++) ing.push(tri.A[a]);
  if (!tri.A.length) ing.push("Ail, sel, poivre, 1 c. à s. d'huile d'olive");

  // Étapes, dans l'ordre réel de la cuisine
  var et = [];
  if (G) et.push("Mets " + G.toLowerCase() + " à cuire en premier : c'est ce qui prend le plus de temps. Compte 10 à 15 min selon l'aliment, et sale l'eau.");

  var durs = F.filter(function (x) { return !frFeuille(x) && !frCru(x); });
  var feuilles = F.filter(function (x) { return frFeuille(x); });
  var crus = F.filter(function (x) { return frCru(x); });
  if (durs.length) et.push("Coupe " + durs.join(" et ").toLowerCase() + " en morceaux réguliers. Fais revenir 8 à 10 min à feu moyen dans un filet d'huile, à couvert, en remuant de temps en temps.");

  if (P) {
    if (style === "papillote") {
      et.push("Préchauffe le four à 200 °C. Pose " + P.toLowerCase() + " sur une feuille de papier cuisson, ajoute les aromates et un filet d'huile, referme hermétiquement.");
      et.push("Enfourne 15 à 18 min. La chair doit se détacher toute seule.");
    } else if (fam.k === "poisson") {
      et.push("Poêle bien chaude, un filet d'huile : saisis " + P.toLowerCase() + " 3 à 4 min de chaque côté. Ne le retourne qu'une fois.");
    } else if (fam.k === "fruitsmer") {
      et.push("Feu vif, 2 à 3 min pour " + P.toLowerCase() + " — dès que la chair devient opaque, c'est prêt. Au-delà, ça devient caoutchouteux.");
    } else if (fam.k === "oeuf") {
      et.push(style === "brouillés"
        ? "Bats les œufs, verse-les à feu doux et remue sans arrêt jusqu'à la texture crémeuse — 3 à 4 min."
        : "Bats les œufs, verse-les sur les légumes chauds, couvre et laisse prendre 5 à 6 min à feu doux.");
    } else if (fam.k === "hache") {
      et.push("Émiette " + P.toLowerCase() + " dans la poêle chaude et laisse colorer 5 à 6 min sans remuer tout le temps : c'est la coloration qui donne le goût.");
    } else if (fam.k === "vegetal") {
      et.push("Coupe " + P.toLowerCase() + " en cubes et fais-le dorer 5 à 6 min sur toutes les faces. Sale en fin de cuisson.");
    } else if (fam.k === "volaille") {
      et.push("Coupe " + P.toLowerCase() + " en morceaux et fais-le saisir 6 à 8 min à feu moyen-vif, jusqu'à ce qu'il soit doré et cuit à cœur.");
    } else {
      et.push("Saisis " + P.toLowerCase() + " 2 à 3 min par face à feu vif, puis laisse reposer 3 min avant de trancher : la viande reste tendre.");
    }
  }
  if (feuilles.length) et.push("Ajoute " + feuilles.join(" et ").toLowerCase() + " à la toute fin, hors du feu : le temps de fondre, sans cuire.");
  if (crus.length) et.push("Ajoute " + crus.join(" et ").toLowerCase() + " cru" + (crus.length > 1 ? "s" : "") + " au moment de servir.");
  if (tri.A.length) et.push("Assaisonne avec " + tri.A.join(", ").toLowerCase() + ". Goûte avant de resaler.");

  et.push(R.glucides
    ? "Dans l'assiette : " + (R.bas ? "1/3 glucides bas" : "1/3 glucides") + " · 1/3 protéines · 1/3 fibres."
    : "Dans l'assiette : 1/2 protéines · 1/2 fibres. Pas de glucides à ce repas.");

  var temps = 10 + (G ? 12 : 0) + (durs.length ? 8 : 0) + (style === "papillote" ? 8 : 4);
  return { titre: titre, ing: ing, etapes: et, temps: temps, regle: R, manque: manque, style: style };
}

// ─── L'écran ───
var FR_SUGG = ["Poulet (blanc)", "Œufs", "Cabillaud", "Steak haché 5%", "Tofu", "Crevettes",
  "Courgette", "Brocoli", "Épinards", "Champignons", "Haricots verts", "Poivrons",
  "Salade", "Tomates", "Avocat", "Riz", "Quinoa", "Patate douce", "Lentilles", "Pois chiches"];

function viewFrigo() {
  var meal = state.frMeal || "dej";
  var R = frRegle(meal);
  var h = '<div style="padding:0 14px 26px">' +
    '<div class="fr-intro"><b>🧊 Mon frigo</b><br>Écris ce qu\'il te reste — un aliment par ligne ou séparés par des virgules. ' +
    'Je te compose une recette avec ça, en respectant ton assiette du moment.</div>' +

    '<div class="fr-lab">Ce repas</div>' +
    '<div class="fr-chips">' +
    '<button class="fr-meal' + (meal === "dej" ? " on" : "") + '" data-fr-meal="dej">☀️ Déjeuner</button>' +
    '<button class="fr-meal' + (meal === "diner" ? " on" : "") + '" data-fr-meal="diner">🌙 Dîner</button>' +
    '</div>' +
    '<div class="fr-regle" style="background:' + R.color + '">Règle du jour : ' + R.txt + (R.tag ? ' · jour ' + R.tag : '') + '</div>' +

    '<div class="fr-lab">Dans mon frigo</div>' +
    '<textarea id="fr-txt" class="fr-txt" rows="5" placeholder="poulet&#10;courgette&#10;ail, citron">' + esc(state.frTxt || "") + '</textarea>' +
    '<div class="fr-chips">';
  for (var i = 0; i < FR_SUGG.length; i++) h += '<button class="fr-chip" data-fr-add="' + esc(FR_SUGG[i]) + '">+ ' + esc(FR_SUGG[i]) + '</button>';
  h += '</div>' +
    '<button id="fr-go" class="fr-go">🍳 Générer ma recette</button>';

  if (state.frRes) {
    var Rc = state.frRes;
    h += '<div class="fr-card">' +
      '<div class="fr-titre">' + esc(Rc.titre) + '</div>' +
      '<div class="fr-temps">⏱️ environ ' + Rc.temps + ' min · ' + esc(Rc.style) + '</div>';
    if (Rc.manque.length)
      h += '<div class="fr-manque">Il te manque ' + Rc.manque.join(" et ") + ' pour une assiette complète. La recette tient debout sans, elle est juste incomplète.</div>';
    if (state.frTri && state.frTri.inconnus.length)
      h += '<div class="fr-note">Pas reconnu : ' + esc(state.frTri.inconnus.join(", ")) + '. Soit c\'est écrit autrement dans mes listes, soit ce n\'est pas dans la méthode — vérifie l\'onglet Méthode nutrition.</div>';
    if (!Rc.regle.glucides && state.frTri && state.frTri.G.length)
      h += '<div class="fr-note">Tu as ' + esc(state.frTri.G.join(", ")) + ' — c\'est un glucide, on le garde pour un repas qui en autorise. Il n\'est pas dans la recette.</div>';
    h += '<div class="fr-sec">🛒 Ingrédients</div><ul class="fr-ul">';
    for (var g = 0; g < Rc.ing.length; g++) h += '<li>' + esc(Rc.ing[g]) + '</li>';
    h += '</ul><div class="fr-sec">👨‍🍳 Préparation</div><ol class="fr-ol">';
    for (var s = 0; s < Rc.etapes.length; s++) h += '<li>' + esc(Rc.etapes[s]) + '</li>';
    h += '</ol><button id="fr-autre" class="fr-autre">🔄 Une autre idée avec les mêmes ingrédients</button></div>';
  }
  return h + '</div>';
}

function bindFrigo() {
  // TANT QU'UNE RECETTE EST À L'ÉCRAN, ELLE SUIT LE FRIGO. Sinon on corrige
  // un oubli, on ajoute l'ingrédient, et le message « il te manque un
  // glucide » reste affiché sous une recette qui n'est plus la bonne.
  function suivre() { if (state.frRes) frGenerer(state.frVar || 0); }

  var ta = document.getElementById("fr-txt");
  if (ta) {
    ta.addEventListener("input", function () { state.frTxt = this.value; });
    // À la sortie du champ, pas à chaque frappe : recomposer la recette
    // lettre par lettre ferait danser le titre sous les doigts.
    ta.addEventListener("change", function () {
      state.frTxt = this.value;
      if (state.frRes) { frGenerer(state.frVar || 0); render(); }
    });
  }

  var meals = document.querySelectorAll("[data-fr-meal]");
  for (var m = 0; m < meals.length; m++) meals[m].addEventListener("click", function () {
    state.frMeal = this.getAttribute("data-fr-meal");
    if (state.frRes) frGenerer(0);
    render();
  });

  var chips = document.querySelectorAll("[data-fr-add]");
  for (var c = 0; c < chips.length; c++) chips[c].addEventListener("click", function () {
    var v = this.getAttribute("data-fr-add");
    var t = state.frTxt || "";
    if (frNorm(t).indexOf(frNorm(v)) < 0) state.frTxt = (t ? t.replace(/\s*$/, "") + "\n" : "") + v;
    suivre();
    render();
  });

  var go = document.getElementById("fr-go");
  if (go) go.addEventListener("click", function () {
    if (!(state.frTxt || "").trim()) { alert("Écris d'abord ce qu'il te reste dans le frigo."); return; }
    frGenerer(0); render();
  });
  var autre = document.getElementById("fr-autre");
  if (autre) autre.addEventListener("click", function () { frGenerer((state.frVar || 0) + 1); render(); });
}

function frGenerer(variante) {
  state.frVar = variante || 0;
  if (!(state.frTxt || "").trim()) { state.frTri = null; state.frRes = null; return; }
  state.frTri = frTrier(state.frTxt || "");
  state.frRes = frRecette(state.frTri, state.frMeal || "dej", state.frVar);
}

// ═══════════ RENDER ═══════════
function render(){
  var root=document.getElementById("root");
  if(CLIENT&&!IS_ADMIN){
    if(!state.clientLoaded){root.innerHTML='<div class="dark-screen"><div class="dark-sub">Chargement...</div></div>';return;}
    if(state.accessDenied){
      root.innerHTML='<div class="dark-screen">'+
        '<div class="dark-brand"><div class="bar bar-r"></div><span>AM Coach</span><div class="bar bar-b"></div></div>'+
        '<div style="font-size:44px;margin:20px 0 8px">⏸️</div>'+
        '<div style="color:#fff;font-weight:900;font-size:19px;margin-bottom:10px">Ton accès est terminé</div>'+
        '<div style="color:#AAA;font-size:13px;line-height:1.8;max-width:300px;text-align:center">Contacte ton coach pour continuer<br>ta transformation 💪</div></div>';
      return;
    }
    if(!state.clientName||!state.clientStart){root.innerHTML=viewClientOnboard();bindClientOnboard();return;}
    if(!MENU){
      // Menu auto = phase courante si non choisi
      MENU=PHASE_ORDER[currentPhaseIdx()];
      loadRecipes(MENU,function(){render();});
    }
    var hh='<div class="app">'+viewClientHeader()+viewBanner()+viewPhaseNav()+viewTabs();
    if(state.tab==="menu")hh+=viewCalendar()+viewDayMeals();
    else if(state.tab==="frigo")hh+=viewFrigo();
    else hh+=viewAliments();
    hh+='</div>';
    root.innerHTML=hh;
    bindMain();bindPhaseNav();
    return;
  }
  if(!MENU){root.innerHTML=viewPicker();bindPicker();return;}
  if(IS_ADMIN&&!state.adminAuthed){root.innerHTML=viewAdminLogin();bindAdminLogin();return;}
  var h='<div class="app">'+viewHeader();
  if(IS_ADMIN)h+=viewAdmin();
  else{
    h+=viewBanner()+viewTabs();
    if(state.tab==="menu")h+=viewCalendar()+viewDayMeals();
    else if(state.tab==="frigo")h+=viewFrigo();
    else h+=viewAliments();
  }
  h+='</div>';
  root.innerHTML=h;
  if(IS_ADMIN)bindAdmin();else bindMain();
}

// ═══════════ CALENDRIER 30 JOURS ═══════════
function viewCalendar(){
  var DAYN=["L","M","M","J","V","S","D"];
  var h='<div style="padding:0 14px;margin-bottom:16px">';
  for(var w=0;w<4;w++){
    h+='<div style="display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px">'+
      '<span style="font-weight:900;font-size:11px;color:#AAA;letter-spacing:1px;text-transform:uppercase">Semaine '+(w+1)+'</span>'+
      (cfgMenu.recettes?'<button class="week-courses" data-week="'+w+'" style="font-size:11px;font-weight:800;color:'+R+';padding:4px 10px;border:1.5px solid '+R+';border-radius:20px;background:#fff">🛒 Liste de courses</button>':'')+'</div>';
    h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:2px">';
    for(var dn=0;dn<7;dn++)h+='<div style="text-align:center;font-size:9px;font-weight:700;color:#CCC">'+DAYN[dn]+'</div>';
    h+='</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">';
    for(var d=0;d<7;d++){
      var i=w*7+d;
      var cls="day-cell"+(state.selDay===i?" sel":"");
      var tag="";
      if(MENU==="cyclage"){
        var t=cyclageTag(i);
        cls+=t==="SG"?" sg":" gb";
        tag='<span class="dc-tag" style="color:'+(t==="SG"?"#2E7D32":"#B45309")+'">'+t+'</span>';
      }
      var hasRecipe=cfgMenu.recettes&&(state.recipes[keyOf(MENU,i,"dej")]||state.recipes[keyOf(MENU,i,"pdej")]||state.recipes[keyOf(MENU,i,"diner")]);
      var phIdx=PHASE_ORDER.indexOf(MENU);
      var isToday=CLIENT&&state.clientStart&&(FORCED?(dayGlobal()%MENU_DAYS(MENU))===i:(Math.floor(dayGlobal()/28)===phIdx&&(dayGlobal()%28)===i));
      var todayStyle=isToday?'border-color:#D52B1E;border-width:2.5px;font-weight:900':'';
      h+='<button class="'+cls+'" data-day="'+i+'" style="'+todayStyle+'">'+(i+1)+tag+(hasRecipe?'<span class="dc-dot"></span>':'')+'</button>';
    }
    h+='</div>';
  }
  return h+'</div>';
}

// ═══════════ REPAS DU JOUR ═══════════
function viewDayMeals(){
  var day=state.selDay;
  var dayTag=MENU==="cyclage"?cyclageTag(day):null;
  var h='<div style="padding:0 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px">'+
    '<div class="bar bar-r"></div><span style="font-weight:900;font-size:16px">Jour '+(day+1)+'</span>'+
    (dayTag?'<span class="meal-rule" style="background:'+(dayTag==="SG"?"#2E7D32":"#F59E0B")+'">'+
      (dayTag==="SG"?"JOUR SANS GLUCIDES":"JOUR GLUCIDES BAS")+'</span>':'')+'</div>';

  if(!state.loaded)h+='<div class="meal-empty">Chargement…</div>';

  for(var i=0;i<MEALS.length;i++){
    var meal=MEALS[i];
    var rule=mealRule(MENU,meal.id,dayTag);
    var rec=cfgMenu.recettes?state.recipes[keyOf(MENU,day,meal.id)]:null;
    h+='<div class="meal-card"><div class="meal-hdr">'+
      '<span class="meal-ico">'+meal.icon+'</span>'+
      '<span class="meal-name">'+meal.name+'</span>'+
      '<span class="meal-rule" style="background:'+rule.color+'">'+rule.txt+'</span></div>';
    if(rec&&rec.title){
      h+='<div class="meal-body"><div class="meal-title">'+esc(rec.title)+'</div>';
      if(rec.prep)h+='<div class="meal-time">⏱️ '+esc(rec.prep)+'</div>';
      if(meal.id!=="pdej"&&MENU!=="cyclage"){
        // assiette visuelle pour dej/diner
        var parts=rule.txt.split(" + ");
        if(parts.length>=2){
          h+='<div class="plate">';
          var cols={G:"#2E7D32",GB:"#F59E0B",P:"#7B1FA2",F:"#0097A7"};
          for(var p=0;p<parts.length;p++){
            var lab=parts[p].trim();
            var full=lab==="G"?"GLUCIDES":lab==="GB"?"GLUCIDES BAS":lab==="P"?"PROTÉINES":"FIBRES";
            h+='<div class="plate-part" style="background:'+(cols[lab]||"#555")+'">1/'+parts.length+'<br>'+full+'</div>';
          }
          h+='</div>';
        }
      }
      if(rec.video)h+='<a class="video-btn" href="'+esc(ytEmbed(rec.video))+'" target="_blank">▶️ VOIR LA VIDÉO</a>';
      if(rec.ingredients)h+='<div class="meal-sec">🛒 Ingrédients</div><div class="meal-txt">'+esc(rec.ingredients)+'</div>';
      if(rec.steps)h+='<div class="meal-sec">👨‍🍳 Préparation</div><div class="meal-txt">'+esc(rec.steps)+'</div>';
      h+='</div>';
    }else if(cfgMenu.recettes){
      h+='<div class="meal-empty">Recette à venir 🔜</div>';
    }else{
      // Recettes désactivées : la règle de l'assiette EST le menu. On montre
      // l'assiette de référence plutôt qu'une promesse de recette vide.
      h+='<div class="meal-body">'+
        (meal.id==="pdej"
          ? '<div class="meal-txt">Une protéine au réveil. Choisis dans l\'onglet Méthode nutrition.</div>'
          : assietteHTML(MENU==="cyclage"?(dayTag==="SG"?"sg":"soir"):(meal.id==="dej"?"midi":(MENU==="equilibre"?"soir":"sg"))))+
        (cfgMenu.frigo?'<button class="meal-frigo" data-tab="frigo">🧊 Composer avec mon frigo</button>':'')+
        '</div>';
    }
    h+='</div>';
  }
  return h;
}

      '<div class="proto-d">'+esc(L[i][3])+'</div></div></div>';
  }
  return h+'<div class="proto-note">Ce protocole change à chaque phase. Les assiettes ci-dessous montrent à quoi il ressemble dans le plat.</div></div>';
}
// Les MÊMES photos servent à plusieurs phases, mais elles ne veulent pas dire
// la même chose partout. En phase 2, l'assiette sans glucides est celle du
// SOIR uniquement — sa légende d'origine, « midi et soir », venait de la
// phase 3 et n'avait aucun sens ici. La légende se donne donc au cas par cas.
function assietteHTML(k,titre,desc){
  var A=ASSIETTES[k]; if(!A)return "";
  var t=titre||A.t, d=desc||A.d;
  return '<figure class="ass"><img src="'+A.img+'" alt="'+esc(t)+'"/>'+
    '<figcaption><b>'+esc(t)+'</b><span>'+esc(d)+'</span></figcaption></figure>';
}
// L'ordre suit la journée : le midi d'abord, le soir ensuite.
function assiettesDeLaPhase(){
  if(MENU==="acceleration")
    return assietteHTML("midi","Assiette du midi — rééquilibrage")+
           assietteHTML("sg","Assiette du soir — sans glucides","1/2 protéines · 1/2 fibres");
  if(MENU==="cyclage")
    return assietteHTML("soir","Jours GB — glucides bas","1/3 glucides bas · 1/3 protéines · 1/3 fibres")+
           assietteHTML("sg","Jours SG — sans glucides","1/2 protéines · 1/2 fibres");
  if(MENU==="retour")
    return assietteHTML("midi","Assiette du midi","1/3 glucides · 1/3 protéines · 1/3 fibres")+
           assietteHTML("midi","Assiette du soir","1/3 glucides · 1/3 protéines · 1/3 fibres");
  if(MENU==="14jours")
    return assietteHTML("soir","Assiette du midi — glucides bas","1/3 glucides bas · 1/3 protéines · 1/3 fibres")+
           assietteHTML("sg","Assiette du soir — sans glucides","1/2 protéines · 1/2 fibres");
  return assietteHTML("midi","Assiette du midi — rééquilibrage")+
         assietteHTML("soir","Assiette du soir — glucides bas");
}
function viewAliments(){
  // 📂 Chaque catégorie est repliée : la liste complète faisait défiler
  // pendant dix secondes avant d'arriver aux fibres.
  function col(name,tagTxt,tagColor,items,ouvert){
    return '<details class="food-col"'+(ouvert?' open':'')+'><summary class="food-col-hdr">'+
      '<span class="food-tag" style="background:'+tagColor+'">'+tagTxt+'</span>'+
      '<span class="food-col-name">'+name+'</span>'+
      '<span class="food-col-n">'+items.length+'</span><span class="food-col-c">⌄</span></summary>'+
      '<div class="food-list">'+items.map(esc).join("<br>")+'</div></details>';
  }
  var h=(MENU==="retour"
    ? '<div class="food-note" style="border-color:#2E7D32;background:#F0FAF2">🎉 Phase de retour : le blé et les produits laitiers reviennent. Tu remanges de tout, en gardant les proportions de l\'assiette.</div>'
    : '')+'<div class="food-note"'+(MENU==="retour"?' style="display:none"':'')+'>⚠️ Diète TransfoPhysique : SANS BLÉ · SANS PRODUITS LAITIERS pendant 90 jours.<br>Noix / cajou / pistaches / cacahuètes / noisettes / amandes : 1 poignée, 1× par semaine maximum.</div>';
  // Les assiettes de la phase en cours, avant toute liste.
  h=protocoleHTML()+'<div class="card ass-card">'+assiettesDeLaPhase()+'</div>'+h;
  var prot=(MENU==="retour")?PROTEINES.concat(PROTEINES_RETOUR).sort(function(a,b){return a.localeCompare(b,"fr");}):PROTEINES;
  h+='<div class="card">'+col("Protéines","P","#7B1FA2",prot,true)+'</div>';
  if(MENU!=="cyclage"){
    h+='<div class="card"><div style="font-weight:900;font-size:15px;margin-bottom:14px;color:#2E7D32">🍚 RÉÉQUILIBRAGE ALIMENTAIRE (RA) — le midi</div>'+
      col("Glucides autorisés","G","#2E7D32",GLUCIDES_RA)+'</div>';
  }
  if(MENU!=="acceleration"){
    var gbTitle=MENU==="cyclage"?"🔥 GLUCIDES BAS (GB) — jours GB":"🔥 GLUCIDES BAS (GB) — le soir";
    h+='<div class="card"><div style="font-weight:900;font-size:15px;margin-bottom:14px;color:#B45309">'+gbTitle+'</div>'+
      col("Autorisés","GB","#F59E0B",GLUCIDES_GB_OK)+
      col("Acceptés","≈","#999",GLUCIDES_GB_ACCEPT)+
      col("Interdits","✕","#D52B1E",GLUCIDES_GB_NON)+'</div>';
  }
  if(MENU==="retour"){
    h+='<div class="card"><div style="font-weight:900;font-size:15px;margin-bottom:12px;color:#2E7D32">🌾 GLUCIDES — tout revient</div>'+
      col("Glucides autorisés","G","#2E7D32",GLUCIDES_RA.concat(GLUCIDES_RETOUR).sort(function(a,b){return a.localeCompare(b,"fr");}))+'</div>';
  }
  h+='<div class="card">'+col("Fibres","F","#0097A7",FIBRES)+'</div>';
  return h;
}

function bindAdmin(){
  function bascule(cle,el){
    cfgMenu[cle]=!cfgMenu[cle];

    if(msg)msg.textContent="Enregistrement…";
    cfgEnregistrer(function(ok){

      document.getElementById("ad-ing").value="";

  document.getElementById("ad-load").addEventListener("click",fill);

  document.getElementById("ad-save").addEventListener("click",function(){

    msg.textContent="☁️ Enregistrement...";msg.style.color="#FF9800";

      if(ok){

        msg.style.color="#D52B1E";
      }
    });
  });
}

// ═══════════ LISTE DE COURSES ═══════════
function generateCourses(week){
  // Collecte tous les ingrédients des 7 jours × 3 repas de la semaine
  var lines=[];
  var recipesFound=0;
  for(var d=0;d<7;d++){
    var dayIdx=week*7+d;
    for(var m=0;m<MEALS.length;m++){
      var rec=state.recipes[keyOf(MENU,dayIdx,MEALS[m].id)];
      if(rec&&rec.ingredients){
        recipesFound++;
        var ing=rec.ingredients.split("\n");
        for(var i=0;i<ing.length;i++){
          var l=ing[i].trim();
          if(l)lines.push(l);
        }
      }
    }
  }
  if(!recipesFound){
    alert("Aucune recette avec ingrédients pour la semaine "+(week+1)+" pour l'instant.");
    return;
  }
  // Regroupement : même ingrédient (insensible casse) → compté ×N
  var grouped={},order=[];
  for(var j=0;j<lines.length;j++){
    var key=lines[j].toLowerCase();
    if(grouped[key]){grouped[key].count++;}
    else{grouped[key]={txt:lines[j],count:1};order.push(key);}
  }
  order.sort(function(a,b){return grouped[a].txt.localeCompare(grouped[b].txt,"fr");});

  var m0=MENUS[MENU];
  var items="";
  for(var k=0;k<order.length;k++){
    var g=grouped[order[k]];
    items+='<label class="it"><input type="checkbox"/><span>'+esc(g.txt)+(g.count>1?' <em>×'+g.count+'</em>':'')+'</span></label>';
  }

  var html='<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>'+
  '<title>Courses S'+(week+1)+' — '+esc(m0.name)+'</title><style>'+
  '*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,"Helvetica Neue",sans-serif;background:#F4F4F4;color:#1A1A1A}'+
  '.pg{max-width:560px;margin:0 auto;background:#fff;min-height:100vh}'+
  '.hd{background:#1A1A1A;padding:24px 20px}'+
  '.br{color:#fff;font-weight:900;font-size:16px;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px}'+
  '.b{width:4px;height:20px;border-radius:2px;display:inline-block}'+
  '.sb{color:#888;font-size:12px;margin-top:5px;font-weight:700}'+
  '.tt{padding:20px 20px 8px;font-weight:900;font-size:20px}'+
  '.ss{padding:0 20px 16px;font-size:12px;color:#999}'+
  '.list{padding:0 20px 30px}'+
  '.it{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #F2F2F2;font-size:15px;cursor:pointer}'+
  '.it input{width:22px;height:22px;accent-color:#D52B1E;flex-shrink:0}'+
  '.it input:checked+span{text-decoration:line-through;color:#BBB}'+
  '.it em{color:#D52B1E;font-style:normal;font-weight:800;font-size:12px}'+
  '.ft{background:#1A1A1A;padding:18px;text-align:center;color:#666;font-size:11px;line-height:1.7}'+
  '.ft b{color:#fff}'+
  '@media print{body{background:#fff}.it input{accent-color:#000}}'+
  '</style></head><body><button onclick=\'window.close();setTimeout(function(){if(history.length>1)history.back();},250)\' style=\'position:fixed;top:12px;right:12px;z-index:999;background:#1A1A1A;color:#fff;border:0;border-radius:20px;padding:9px 16px;font-weight:800;font-size:13px\'>✕ Fermer</button><div class="pg">'+
  '<div class="hd"><div class="br"><span class="b" style="background:#D52B1E"></span>AM COACH<span class="b" style="background:#0057A8"></span></div>'+
  '<div class="sb">'+esc(m0.name)+' · Semaine '+(week+1)+'</div></div>'+
  '<div class="tt">🛒 Liste de courses</div>'+
  '<div class="ss">'+order.length+' ingrédients · '+recipesFound+' recettes · coche au fur et à mesure</div>'+
  '<div class="list">'+items+'</div>'+
  '<div class="ft">Diète TransfoPhysique · <b>sans blé · sans laitages</b><br>AM Coach Genève</div>'+
  '</div></body></html>';

  var win=window.open("","_blank");
  if(win){win.document.write(html);win.document.close();}
}

// ═══════════ BINDINGS CLIENT ═══════════
function bindMain(){
  var home=document.getElementById("go-home");
  if(home)home.addEventListener("click",function(){window.location.search="";});
  var tabs=document.querySelectorAll("[data-tab]");
  for(var i=0;i<tabs.length;i++){
    tabs[i].addEventListener("click",function(){state.tab=this.getAttribute("data-tab");render();});
  }
  var mf=document.querySelectorAll(".meal-frigo");
  for(var f2=0;f2<mf.length;f2++)mf[f2].addEventListener("click",function(){state.tab="frigo";render();});
  var days=document.querySelectorAll("[data-day]");
  for(var d=0;d<days.length;d++){
    days[d].addEventListener("click",function(){state.selDay=parseInt(this.getAttribute("data-day"));render();});
  }
  try{if(state.tab==="frigo")bindFrigo();}catch(e){}
  var wc=document.querySelectorAll(".week-courses");
  for(var w2=0;w2<wc.length;w2++){
    wc[w2].addEventListener("click",function(e){
      e.stopPropagation();
      generateCourses(parseInt(this.getAttribute("data-week")));
    });
  }
}
